schema_version: 1
recipe:
  name: libcvc
  upstream_version: "3.2.4"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/transfix/libcvc
  # Combined work: the volume I/O core is GPL-2.0-or-later; some modules are
  # LGPL-2.1. GPL dominates the linked library, so publish it as GPL.
  license: GPL-2.0-or-later
  tags: [cvc, volume, geometry, io]
  description: >-
    Center for Computational Visualization core C++ library — volumes,
    geometry, and the app/state runtime.

source:
  # libcvc carries its own recipe, so the source IS this tree. `vendored`
  # with path '.' lets a developer build the checked-out working tree
  # (`cvcpkg build libcvc --recipes-dir recipes`) and lets a publish snapshot
  # the tree at the recipe's revision.
  type: vendored
  path: .

patches: []

depends:
  build:
    - cmake
    - ninja
  runtime:
    # Core third-party closure. These are the libraries libcvc links in its
    # default configuration (CGAL mesher + SDF, ImageMagick image I/O, HDF5
    # .cvc support). The ImageMagick delegates (jpeg/png/webp/freetype) and
    # libxml2 are listed explicitly because the imagemagick recipe
    # under-declares them, which would otherwise leave the closure incomplete
    # on platforms without a matching system library (e.g. macOS).
    - name: boost
    - name: zlib
    - name: hdf5
    - name: fftw3
    - name: gsl
    - name: cgal
    - name: gmp
    - name: mpfr
    - name: log4cplus
    - name: openblas
    - name: levmar
    - name: yaml
    - name: libiimod
    - name: tiff
    - name: imagemagick
    - name: libjpeg-turbo
    - name: libpng
    - name: libwebp
    - name: freetype
    - name: libxml2
    - name: pthreads4w
      platforms: [windows]
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1

package:
  # What the install step ships. libcvc installs the shared library, its
  # CMake package (find_package(cvc CONFIG) -> cvc::cvc), and the public
  # headers (cvc/ plus the vendored xmlrpc/ tree).
  files:
    - lib/libcvc.*
    - lib/cmake/cvc/
    - include/cvc/
    - include/xmlrpc/
  cmake_packages:
    - { name: cvc, targets: ["cvc::cvc"] }

abi:
  cxx_std: 20
