syntax = "proto3";

package cvc.transport.v1;

enum MutationOp {
  MUTATION_OP_UNSPECIFIED = 0;
  MUTATION_OP_SET_VALUE = 1;
  MUTATION_OP_SET_DATA = 2;
  MUTATION_OP_SET_COMMENT = 3;
  MUTATION_OP_SET_HIDDEN = 4;
  MUTATION_OP_SET_READ_ONLY = 5;
  MUTATION_OP_TOUCH = 6;
  MUTATION_OP_RESET_NODE = 7;
  MUTATION_OP_DELETE_SUBTREE = 8;
  MUTATION_OP_DELEGATE_SUBTREE = 9;
  MUTATION_OP_REVOKE_DELEGATION = 10;
  MUTATION_OP_SET_PROPERTY = 11; // Mutation.type_name is the key, string_value the value
}

message BlobRef {
  string digest = 1;
  uint64 size_bytes = 2;
  string codec = 3;
}

message Payload {
  oneof kind {
    bool none = 1; // sentinel for state_payload_kind::none
    bytes inline_bytes = 2;
    BlobRef blob = 3;
  }
}

message Mutation {
  string cluster_id = 1;
  string tree_id = 2;
  string origin_node_id = 3;
  uint64 sequence = 4;
  string mutation_id = 5;
  string path = 6;
  MutationOp op = 7;
  string type_name = 8;
  string string_value = 9;
  Payload payload = 10;
  bool latest_value_only = 11;
  uint64 hlc_time = 12; // packed hybrid logical clock (0 = not set)
}

message Hello {
  string node_id = 1;
  string cluster_id = 2;
}

// Out-of-band message that does NOT modify state. Carried alongside
// mutations on the same bidi stream; receiving peers admit via
// state_message_bus dedup, never touch journals or vector clocks.
message Message {
  string cluster_id = 1;
  string origin_node_id = 2;
  string message_id = 3;
  string path = 4;
  uint32 ttl_hops = 5;
  string content_type = 6;
  string string_value = 7;
  bytes bytes_payload = 8;
}

// Chunk fetch request: ask a peer for a blob chunk by digest.
message ChunkRequest {
  string digest = 1;     // SHA-256 hex digest
  uint64 request_id = 2; // caller-assigned; echoed in response
}

// Chunk fetch response: carries the blob chunk bytes.
message ChunkResponse {
  string digest = 1;     // echoed from request
  uint64 request_id = 2; // echoed from request
  bool found = 3;        // false if the peer does not have the chunk
  bytes data = 4;        // raw chunk bytes (empty if !found)
}

// Snapshot request: ask a peer for the current state tree.
message SnapshotRequest {
  string cluster_id = 1;
  string path_prefix = 2; // "" = entire tree
  uint64 request_id = 3;
}

// Snapshot chunk: one node's state within a snapshot.
message SnapshotEntry {
  string path = 1;
  string string_value = 2;
  string comment = 3;
  bool hidden = 4;
  bool read_only = 5;
  string type_name = 6;
  string origin_node_id = 7;
  uint64 sequence = 8;
  // data() payload (Phase 10 follow-up): the node's data() encoded via the codec
  // registry, so a gRPC late-joiner reconstructs data() + metadata, not just
  // value(). Empty data_type_name = the node has no replicable data(). Mirrors
  // the in-process snapshot_entry the shard already produces (PR4).
  string data_type_name = 9;
  Payload data_payload = 10;
  map<string, string> properties = 11; // state::properties()
}

// Snapshot response: sent in response to SnapshotRequest.
message SnapshotResponse {
  uint64 request_id = 1;
  bool final = 2; // true on the last chunk
  repeated SnapshotEntry entries = 3;
}

// Heartbeat for cluster membership. Sent periodically; receiving
// peers call note_seen() on their peer registry.
message Heartbeat {
  string node_id = 1;
  string cluster_id = 2;
  uint64 timestamp_ns = 3; // sender's wall-clock ns (observability)
}

// Media frame carried over the SAME WebSocket control channel (bring-up media
// plane, roadmap §"media-over-WebSocket"). Unlike StreamFrame (the dedicated
// gRPC data plane), this rides the state transport so a BROWSER — which has only
// the one WebSocket to the relay, no gRPC — can push its camera/mic and receive
// peers'. It is NOT replicated into any shard and never crosses the WS<->gRPC
// bridge: a relay simply fans each received MediaFrame to its OTHER connections
// (SFU full fan-out), and a leaf delivers it to its on_media sink. Self-contained
// (origin + codec + size) so a consumer can open a decode proxy with no prior
// descriptor. Payload is one whole frame (JPEG for mjpeg, PCM for f32 audio).
message MediaFrame {
  string origin_node_id = 1; // the publishing participant's pid (route per-peer; skip self)
  string stream_id = 2;      // the stream KIND on that peer: "camera" | "mic"
  string codec = 3;          // "mjpeg" (video) | "f32" (audio)
  uint32 width = 4;          // video: frame width  (0 for audio)
  uint32 height = 5;         // video: frame height (0 for audio)
  int64 seq = 6;             // monotonic per (origin, stream_id)
  double pts_seconds = 7;    // producer presentation timestamp
  bytes payload = 8;         // one whole frame's bytes
  uint32 sample_rate = 9;    // audio: samples/sec (0 for video)
  uint32 channels = 10;      // audio: channel count (0 for video)
}

// Link-quality probe. Each end of a connection sends a Ping on a timer; the other end answers at
// once with a Pong echoing seq + sent_ns, and the sender measures the round trip on its OWN
// monotonic clock (no clock sync). A Ping/Pong is link-level: never replicated, never relayed or
// bridged. Answering also proves liveness, so a relay's idle reaper keeps a client that is quiet
// but still connected (a backgrounded browser tab answers from its WebSocket event, which is not
// timer-throttled) while a ghost that cannot answer is still reaped.
message Ping {
  uint64 seq = 1;
  int64 sent_ns = 2; // sender's steady-clock ns
}
message Pong {
  uint64 seq = 1;
  int64 sent_ns = 2; // the Ping's sent_ns, echoed
}

// Single bidirectional frame envelope. Both client and server write
// frames; same-cluster routing happens above this layer.
message Frame {
  oneof kind {
    Hello hello = 1;
    Mutation mutation = 2;
    Message message = 3;
    ChunkRequest chunk_request = 4;
    ChunkResponse chunk_response = 5;
    SnapshotRequest snapshot_request = 6;
    SnapshotResponse snapshot_response = 7;
    Heartbeat heartbeat = 8;
    MediaFrame media = 9;
    Ping ping = 10;
    Pong pong = 11;
  }
}

// Symmetric bidirectional channel. Each peer pair establishes one
// long-lived stream; mutation traffic flows both ways. The first
// frame each side sends is a Hello so the remote can record the
// peer's node_id / cluster_id for diagnostics.
service StateTransport { rpc Channel(stream Frame) returns (stream Frame); }

// ───────────────────────── Data plane (Phase 10, PR7) ─────────────────────────
// The control plane above replicates the /streams/<id> DESCRIPTOR so peers can
// discover a stream. The actual frame bytes travel here, on a DEDICATED service
// served from its own port/listener (not a second service on the StateTransport
// server) so high-bandwidth frame traffic cannot head-of-line-block control
// traffic. Frame semantics (cvc::ariadne::stream::frame) live a layer above;
// this envelope is transport-level bytes + routing/timing.
message StreamFrame {
  string stream_id = 1;   // the /streams/<id> token this channel/frame serves
  int64 seq = 2;          // monotonic per stream (producer-assigned)
  double pts_seconds = 3; // producer presentation timestamp
  uint32 flags = 4;       // bit0 = keyframe, bit1 = open handshake (names the stream)
  bytes payload = 5;      // this message's bytes: a whole frame, or one chunk of one (PR8)
  // PR8 chunking: a frame larger than the stream-tuned chunk size is split into
  // chunk_count StreamFrames, chunk_index 0..chunk_count-1, all sharing the same
  // (stream_id, seq, pts_seconds, flags). The receiver reassembles by
  // (stream_id, seq) in index order; a gap or a new seq drops the incomplete
  // frame. chunk_count 0 or 1 is an unchunked whole frame.
  uint32 chunk_index = 6;
  uint32 chunk_count = 7;
}

// One bidirectional stream-channel per consumer↔producer pair. Both sides may
// write (e.g. the consumer sends backpressure/keyframe-request frames); PR7
// ships the skeleton that round-trips frames.
service StreamTransport { rpc StreamChannel(stream StreamFrame) returns (stream StreamFrame); }
