<!doctype html>
<!--
  ari.html — run an Ariadne (.ari) document in the browser: the ari runner built for wasm behind
  an xterm.js terminal. The build writes this page next to each browser build of ari
  (src/ari/CMakeLists.txt, ari_wasm_page, which fills in the module, label, document name and
  default): ari.html for FTXUI's Emscripten screen, ari_tvision.html for the tvision desktop
  (tvision's browser console, from cvcpkg's wasm tvision). Beside it: ari-web.js (the loader,
  which documents the wiring), ari-web.css, and xterm/ (xterm.js and its fit and WebGL addons,
  the pinned npm packages, with their licenses). Serve that directory over http.

  The document: with ?src=<url> (resolved against this page), or a page config naming one, ari
  runs that document: it fetches it and the files it imports before the load, from this page's
  origin unless the config allows another (cvc/ariadne/web_document.h). The config is arigl-web's:
  ariadne.config.json beside this page (optional); docs/CVCGL_WASM.md ("arigl-web") lists its
  keys. Otherwise ari runs the page's default, or the document baked into the build. Everything ari
  prints to stderr is shown in the terminal when it exits with an error.

  Nothing is inline and nothing loads from another origin, so the page runs under a
  Content-Security-Policy of script-src 'self' 'wasm-unsafe-eval'; style-src 'self' (in a browser
  without WebGL2, xterm.js's DOM renderer also needs style-src 'unsafe-inline').
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@ARI_WASM_LABEL@ terminal</title>
<link rel="stylesheet" href="xterm/xterm.css">
<link rel="stylesheet" href="ari-web.css">
</head>
<body data-module="@ARI_WASM_MODULE@" data-label="@ARI_WASM_LABEL@"
      data-default-src="@ARI_WASM_DEFAULT_SRC@">
<header>
  <span><b>@ARI_WASM_LABEL@</b> <span id="doc">@ARI_WASM_DOC_NAME@</span></span>
  <span class="hint">@ARI_WASM_HINT@</span>
  <a id="gallery" href="../" hidden>all examples</a>
  <span id="status">loading…</span>
</header>
<div id="term"></div>
<script src="xterm/xterm.js"></script>
<script src="xterm/addon-fit.js"></script>
<script src="xterm/addon-webgl.js"></script>
<script src="ari-web.js"></script>
</body>
</html>
