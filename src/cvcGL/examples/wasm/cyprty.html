<!DOCTYPE html>
<!-- cyprty — the Ariadne browser conference client (arigl → wasm). Hand-authored host page (NOT
     generated by build-pages.py): it looks like the cvcGL gallery demo page, but adds the two things
     a conference client needs — Module.arguments so arigl runs conference_roster.ari, and a preRun
     that sets CVC_ARIADNE_RELAY from the PAGE ORIGIN (wss://<host>/cyprty-ws), so the deployed client
     auto-connects to its own server. Served at cyberpcangel.com/cyprty next to cyprty.js/.wasm. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cyprty — Ariadne conference (WebAssembly)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #10141a; color: #cdd6e0;
               font: 13px/1.5 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 8px 14px; display: flex; gap: 14px; align-items: baseline;
           border-bottom: 1px solid #232a33; flex: none; }
  header h1 { font-size: 14px; margin: 0; color: #e8eef4; font-weight: 600; }
  header a { color: #5aa9e6; text-decoration: none; }
  header button { margin-left: auto; background: #1d2530; color: #cdd6e0;
                  border: 1px solid #2c3542; border-radius: 6px; padding: 4px 12px;
                  font: inherit; cursor: pointer; }
  header button:hover { background: #26303d; }
  header .keys { color: #8b98a5; }
  header .keys b { color: #cdd6e0; font-weight: 600; }
  #stage { flex: 1; position: relative; min-height: 0; }
  #canvas-wrap { position: relative; height: 100%; }
  canvas#canvas { position: absolute; inset: 0; width: 100%; height: 100%;
                  display: block; outline: none; background: #000; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
             align-items: center; justify-content: center; gap: 12px;
             background: #10141a; transition: opacity .4s; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 28px; height: 28px; border: 3px solid #232a33;
             border-top-color: #5aa9e6; border-radius: 50%;
             animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { color: #8b98a5; }
  footer { flex: none; padding: 4px 14px; border-top: 1px solid #232a33;
           display: flex; justify-content: space-between; color: #8b98a5;
           font-variant-numeric: tabular-nums; white-space: pre; }
</style>
</head>
<body>
<header>
  <h1>cyberpcangel &middot; cyprty</h1>
  <span class="keys">Ariadne conference — the browser joins the room and shows who is present,
    live with native clients &middot; <b>Tab</b> orbit/fly &middot; <b>drag</b> to look &middot;
    <a href="https://github.com/transfix/libcvc">libcvc</a></span>
  <button id="fs" title="Fullscreen (best on a phone)">⛶ Fullscreen</button>
</header>
<div id="stage">
  <div id="canvas-wrap"><canvas id="canvas" tabindex="0"></canvas></div>
  <div id="overlay">
    <div class="spinner"></div>
    <div id="status">Loading cyprty.wasm&hellip;</div>
  </div>
</div>
<footer><span id="stdout"></span><span id="stderr"></span></footer>
<script>
  const DEMO = 'cyprty';
  const WASM_MB = 60; // rough, for the download progress bar only

  document.getElementById('fs').addEventListener('click', () => {
    const el = document.getElementById('canvas-wrap');
    if (!document.fullscreenElement)
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    else
      document.exitFullscreen();
  });
  document.addEventListener('fullscreenchange',
                            () => setTimeout(() => window.dispatchEvent(new Event('resize')), 60));

  const statusEl = document.getElementById('status');
  const stdoutEl = document.getElementById('stdout');
  const stderrEl = document.getElementById('stderr');
  const canvas = document.getElementById('canvas');
  canvas.addEventListener('click', () => canvas.focus());

  // The relay URL is derived from the PAGE ORIGIN — a wss:// upgrade of this https page's host, at
  // /cyprty-ws (Apache reverse-proxies that to the relay). So the deployed client connects to its
  // own server automatically; a future build could let the user pick a different one.
  const RELAY = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/cyprty-ws';
  const NAME = 'guest-' + Math.random().toString(36).slice(2, 7);
  // ?synthetic=1 drives the self-cam from a hardware-free MJPEG test pattern instead of the real
  // camera, so the conference (peer video included) can be tried in a browser with no camera.
  const SYNTH = new URLSearchParams(location.search).get('synthetic');

  // Browsers suspend an AudioContext created without a user gesture (autoplay policy). SDL's audio
  // output (how we play each peer's mic) is one such context, so without this a peer's audio never
  // plays — AND its buffered-but-unplayed frames would stall the A/V-sync video clock, so you would
  // not see that peer either until you interacted. Wrap AudioContext BEFORE the wasm creates one,
  // track every context, and resume them on the first click/key/touch. Harmless if SDL self-resumes.
  (function () {
    const Orig = window.AudioContext || window.webkitAudioContext;
    if (!Orig) return;
    const live = [];
    function Tracked() { const c = new Orig(...arguments); live.push(c); return c; }
    Tracked.prototype = Orig.prototype;
    try { window.AudioContext = Tracked; } catch (e) {}
    try { if (window.webkitAudioContext) window.webkitAudioContext = Tracked; } catch (e) {}
    const resume = () => { live.forEach(c => { try { if (c.state === 'suspended') c.resume(); } catch (e) {} }); };
    ['pointerdown', 'keydown', 'touchend'].forEach(ev =>
      window.addEventListener(ev, resume, { capture: true, passive: true }));
  })();

  var Module = {
    canvas,
    // arigl's command line: run the baked conference scene. (No document args needed; the relay
    // comes from the environment, set in preRun below.)
    arguments: ['run', '/conference_roster.ari'],
    // Populate the C getenv() environment BEFORE main: arigl's conference mode reads
    // CVC_ARIADNE_RELAY (and optional CVC_ARIADNE_ROOM / CVC_ARIADNE_NAME) from it.
    preRun: [function () {
      try {
        ENV.CVC_ARIADNE_RELAY = RELAY;
        ENV.CVC_ARIADNE_NAME = NAME;
        if (SYNTH && SYNTH !== '0') ENV.CVC_ARIADNE_SYNTHETIC_CAM = '1';
      } catch (e) { console.warn('cyprty: could not set ENV (no conference):', e); }
    }],
    print: t => { stdoutEl.textContent = t.split('\r').pop(); },
    printErr: t => {
      stderrEl.textContent = t;
      if (/ERROR:|error|failed|Aborted/i.test(t)) console.error(t);
    },
    setStatus: t => { if (t) statusEl.textContent = t; },
    onRuntimeInitialized() {
      console.info('cyprty: runtime initialized; relay =', RELAY);
      document.getElementById('overlay').classList.add('hidden');
      canvas.focus();
    },
    onAbort: what => {
      const o = document.getElementById('overlay');
      o.classList.remove('hidden');
      o.querySelector('.spinner').style.display = 'none';
      statusEl.textContent = 'Aborted: ' + what;
    },
  };

  const V = 'cyprty-ui7'; // bump on every redeploy so caches can't serve a stale wasm/js
  async function boot() {
    try {
      const resp = await fetch(DEMO + '.wasm?v=' + V, {cache: 'no-cache'});
      if (!resp.ok) throw new Error('HTTP ' + resp.status + ' fetching ' + DEMO + '.wasm');
      const reader = resp.body.getReader();
      const chunks = [];
      let got = 0;
      for (;;) {
        const {done, value} = await reader.read();
        if (done) break;
        chunks.push(value);
        got += value.length;
        const mb = got / 1048576;
        statusEl.textContent = 'Downloading ' + DEMO + '.wasm — ' +
          Math.min(99, Math.round(100 * mb / WASM_MB)) + '% (' + mb.toFixed(1) + ' MB)';
      }
      const buf = new Uint8Array(got);
      let off = 0;
      for (const c of chunks) { buf.set(c, off); off += c.length; }
      Module.wasmBinary = buf;
      statusEl.textContent = 'Compiling…';
      const s = document.createElement('script');
      s.src = DEMO + '.js?v=' + V;
      s.onerror = () => { throw new Error('failed to load ' + DEMO + '.js'); };
      document.body.appendChild(s);
    } catch (e) {
      const o = document.getElementById('overlay');
      o.querySelector('.spinner').style.display = 'none';
      statusEl.textContent = 'Load failed: ' + (e && e.message || e) +
        ' — try a hard reload (Ctrl+Shift+R)';
    }
  }
  boot();
</script>
</body>
</html>
