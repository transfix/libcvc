<!DOCTYPE html>
<!-- nav_city_swarm — cvcGL WebAssembly demo host page (the GRL-SNAM reactive swarm).

     Served next to nav_city_swarm.js/.wasm. Single-threaded build (no
     SharedArrayBuffer), so no COOP/COEP headers are needed:

         python3 -m http.server -d <build>/src/cvcGL/examples 8811

     VTK's wasm interactor binds events to the canvas with CSS selector
     "#canvas" (its default) — keep the id if you restyle. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cvcGL — nav_city_swarm (WebAssembly)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #10141a; color: #cdd6e0;
               font: 13px/1.5 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 8px 14px; display: flex; gap: 14px; align-items: baseline;
           border-bottom: 1px solid #232a33; flex: none; }
  header h1 { font-size: 14px; margin: 0; color: #e8eef4; font-weight: 600; }
  header a { color: #5aa9e6; text-decoration: none; }
  header .keys { color: #8b98a5; }
  header .keys b { color: #cdd6e0; font-weight: 600; }
  #stage { flex: 1; position: relative; min-height: 0; }
  #canvas-wrap { position: relative; height: 100%; }
  canvas#canvas { position: absolute; inset: 0; width: 100%; height: 100%;
                  display: block; outline: none; background: #000; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
             align-items: center; justify-content: center; gap: 12px;
             background: #10141a; transition: opacity .4s; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 28px; height: 28px; border: 3px solid #232a33;
             border-top-color: #5aa9e6; border-radius: 50%;
             animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { color: #8b98a5; }
  footer { flex: none; padding: 4px 14px; border-top: 1px solid #232a33;
           display: flex; justify-content: space-between; color: #8b98a5;
           font-variant-numeric: tabular-nums; white-space: pre; }
  /* --- touch / fullscreen affordances --- */
  header .spacer { flex: 1; }
  button.fsbtn { font: inherit; color: #cdd6e0; background: #1a2029;
                 border: 1px solid #2c3540; border-radius: 6px;
                 padding: 4px 11px; cursor: pointer; flex: none; }
  button.fsbtn:hover { background: #222b36; border-color: #3a4653; }
  /* Touch devices: the mouse/keyboard legend is noise, the gestures are not. */
  .touch-only { display: none; }
  @media (hover: none), (pointer: coarse) {
    .touch-only { display: inline; }
    .mouse-only { display: none; }
    header { padding: 6px 10px; gap: 8px; flex-wrap: wrap; }
    header h1 { font-size: 13px; }
  }
  /* The canvas fills the screen in fullscreen; the wrapper is what we promote. */
  #canvas-wrap:fullscreen { background: #000; }
  #canvas-wrap:fullscreen canvas#canvas { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<header>
  <h1>cvcGL &middot; nav_city_swarm</h1>
  <span class="keys">reactive swarm on a procedural city &middot;
    <b class="mouse-only">click</b><span class="mouse-only"> to focus &middot; </span><b class="mouse-only">Tab</b><span class="mouse-only"> orbit/fly &middot; </span><b class="mouse-only">WASD</b><span class="mouse-only"> + mouse fly &middot; </span><b class="mouse-only">Esc</b><span class="mouse-only"> release pointer</span><b class="touch-only">pinch</b><span class="touch-only"> zoom &middot; </span><b class="touch-only">two fingers</b><span class="touch-only"> pan &middot; </span><b class="touch-only">tap</b><span class="touch-only"> the menu to change anything</span> &middot;
    <a href="../">all examples</a></span>
  <span class="spacer"></span>
  <button class="fsbtn" id="fsbtn" type="button">&#x26F6; Fullscreen</button>
</header>
<div id="stage">
  <div id="canvas-wrap"><canvas id="canvas" tabindex="0"></canvas></div>
  <div id="overlay">
    <div class="spinner"></div>
    <div id="status">Loading nav_city_swarm.wasm&hellip;</div>
  </div>
</div>
<footer><span id="stdout"></span><span id="stderr"></span></footer>
<script>
  const DEMO = 'nav_city_swarm';
  const WASM_MB = 24; // decompressed size shown against a gzip transfer
  const statusEl = document.getElementById('status');
  const stdoutEl = document.getElementById('stdout');
  const stderrEl = document.getElementById('stderr');
  const canvas = document.getElementById('canvas');
  canvas.addEventListener('click', () => canvas.focus());

  var Module = {
    canvas,
    print: t => { stdoutEl.textContent = t.split('\r').pop(); },
    printErr: t => {
      stderrEl.textContent = t;
      if (/ERROR:|error|failed|vtkShaderProgram|vtkOpenGL|Aborted/i.test(t)) {
        (window.__errlog = window.__errlog || []).push(t);
        if (window.__errlog.length > 300) window.__errlog.shift();
      }
      console.error(t);
    },
    setStatus: t => { if (t) statusEl.textContent = t; },
    onRuntimeInitialized() {
      console.info('cvcGL demo: runtime initialized');
      document.getElementById('overlay').classList.add('hidden');
      canvas.focus();
    },
    onAbort: what => {
      const o = document.getElementById('overlay');
      o.classList.remove('hidden');
      o.querySelector('.spinner').style.display = 'none';
      statusEl.textContent = 'Aborted: ' + what;
    },
  };
  const V = Date.parse(document.lastModified) || 0;
  async function boot() {
    try {
      const resp = await fetch(DEMO + '.wasm?v=' + V, {cache: 'no-cache'});
      if (!resp.ok) throw new Error('HTTP ' + resp.status + ' fetching ' + DEMO + '.wasm');
      const reader = resp.body.getReader();
      const chunks = [];
      let got = 0;
      for (;;) {
        const {done, value} = await reader.read();
        if (done) break;
        chunks.push(value);
        got += value.length;
        const mb = got / 1048576;
        statusEl.textContent = 'Downloading ' + DEMO + '.wasm — ' +
          Math.min(99, Math.round(100 * mb / WASM_MB)) + '% (' + mb.toFixed(1) + ' MB)';
      }
      const buf = new Uint8Array(got);
      let off = 0;
      for (const c of chunks) { buf.set(c, off); off += c.length; }
      Module.wasmBinary = buf;
      statusEl.textContent = 'Compiling…';
      const s = document.createElement('script');
      s.src = DEMO + '.js?v=' + V;
      s.onerror = () => { throw new Error('failed to load ' + DEMO + '.js'); };
      document.body.appendChild(s);
    } catch (e) {
      const o = document.getElementById('overlay');
      o.querySelector('.spinner').style.display = 'none';
      statusEl.textContent = 'Load failed: ' + (e && e.message || e) +
        ' — try a hard reload (Ctrl+Shift+R)';
    }
  }

  // ---- Fullscreen -----------------------------------------------------------
  // Must originate from this DOM click handler: the wasm side runs inside
  // requestAnimationFrame, where transient activation has already lapsed and
  // requestFullscreen() is rejected. Promote the WRAPPER so anything else we
  // overlay on the canvas comes along.
  (function () {
    const btn = document.getElementById('fsbtn');
    const wrap = document.getElementById('canvas-wrap');
    if (!btn || !wrap) return;
    const full = () => document.fullscreenElement || document.webkitFullscreenElement;
    btn.addEventListener('click', () => {
      if (full()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        const req = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
        // iOS Safari has no Element.requestFullscreen; the video-only
        // webkitEnterFullscreen does not apply to a canvas. Say so rather than
        // failing silently.
        if (!req) { btn.textContent = 'Fullscreen n/a'; return; }
        Promise.resolve(req.call(wrap)).catch(e => console.warn('fullscreen:', e));
      }
    });
    const sync = () => {
      btn.innerHTML = full() ? '&#x26F6; Exit fullscreen' : '&#x26F6; Fullscreen';
      // VTK reads the canvas size on resize; entering fullscreen changes the
      // CSS box without firing one on every browser.
      setTimeout(() => window.dispatchEvent(new Event('resize')), 60);
    };
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);
  })();

  boot();
</script>
</body>
</html>
