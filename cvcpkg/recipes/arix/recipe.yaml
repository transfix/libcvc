schema_version: 1
recipe:
  name: arix
  upstream_version: "3.7.13"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "arix — ari with an embedded Python (CPython 3.12, with pycvc and numpy): the scripting host for Ariadne (.ari) documents in the terminal. A document's python: block runs at load and the functions it exports are the document's to call; `arix run app.py` runs a Python program in place of the document, its pycvc_gl.ariadne.Host() adopting this host; `arix python` is the embedded interpreter as a plain python3. A document's wasm: block runs WebAssembly guests on wasmtime: its exports are the document's functions, and its hooks take the document's events. Every ari command and flag works the same, plus --python-path DIR."
  homepage: https://github.com/transfix/libcvc
  license: LGPL-2.1-only
  tags: [ui, terminal, tui, cli, tools, python, scripting]

# `arix` is ari built with src/ariadne_python's engine (docs/roadmap/ARIADNE_SCRIPTING_HOSTS.md),
# its OWN package so that ari stays Python-free: it builds src/ari standalone with
# -DARI_WITH_PYTHON=ON against the installed libcvc SDK and this prefix's python312, and installs
# just bin/arix. ari's own recipe is unchanged.
#
# At run time it finds its Python beside it: <prefix>/lib/python3.12 (the python312 runtime dep),
# with what that interpreter's site-packages holds, pycvc (the exports cross through it) and numpy
# among it. pycvc_gl.ariadne.Host, which a Python program uses to adopt arix, is pycvc-gl-cp312's:
# install it too for programs (a document's python: block needs only pycvc).
#
# Its wasm: blocks run on wasmtime's C API (src/ariadne_wasm), linked shared: libwasmtime.so is the
# wasmtime runtime dep's, found in ../lib as libcvc is. build.sh configures with -DARI_WITH_WASM=ON,
# so a build that can't find wasmtime fails rather than packaging an arix without guests. On
# Windows the wasmtime bundle keeps wasmtime.dll in lib\, where bin\arix.exe would not find it, so
# the arix install component copies it into bin\ (ariadne_wasm.cmake) and this package ships that
# copy. ariglx ships the same path, and cvcpkg does not make the overlap safe. Extraction is
# last-writer-wins, so with both hosts installed bin\wasmtime.dll is the copy of whichever was
# extracted last, built against its own wasmtime; reinstalling either host while the other runs
# fails on the loaded DLL; and `cvcpkg uninstall` of one keeps the path only while the other's
# archive is in the local download cache (a source-built entry, an evicted archive or another
# CVCPKG_CACHE leaves it no file list), else it deletes the DLL and the other host dies at launch
# with 0xC0000135. The fix is required, not cosmetic: a wasmtime bundle with wasmtime.dll in bin\
# (cy-pca/cvcpkg), after which this entry, ariglx's and that install copy go.
#
# Built against the libcvc of its own tree (AppRuntime's load and frame hooks are newer than the
# last release), so publish it with that libcvc and that tree's pycvc-cp312, as ari is.
#
# Platforms: linux and windows, where pycvc-cp312 builds. On Windows bin\arix.exe loads
# python312.dll from bin\, and python312 must be 3.12.10+cvc.22 or later: bundles carry the DLL
# there since cvc.21 (cy-pca/cvcpkg#542), but cvc.21's python3.dll forwards to python313.dll, which
# cvc.22 fixed (cy-pca/cvcpkg#551). build.ps1 refuses a python312 without bin\python312.dll, or
# whose bin\python3.dll forwards anywhere else. macOS waits on a macOS pycvc-cp312.

source:
  # Co-located with the libcvc source tree; build.sh points cmake at src/ari.
  # `path` is counted from cvcpkg/recipes/_vendored/, where `cvcpkg build`
  # looks first, so `../../..` is the libcvc repo root (CVC_SOURCE_DIR).
  type: vendored
  path: ../../..

patches: []

depends:
  build:
    - name: libcvc
    # libpython3.12 and its headers, the interpreter arix embeds.
    - name: python312
    # wasmtime's C API, which runs a document's wasm: guests.
    - name: wasmtime
  runtime:
    - name: libcvc
    - name: python312
    - name: wasmtime
    - name: pycvc-cp312
    - name: numpy-cp312
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  # Just the `arix` executable (bin/arix, bin/arix.exe on Windows, with the bin/wasmtime.dll it
  # loads). No cmake package config: arix is an application.
  files:
    - bin/arix*
    - bin/wasmtime.dll

abi:
  cxx_std: 20
