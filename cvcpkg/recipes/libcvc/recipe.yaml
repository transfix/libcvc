schema_version: 1
recipe:
  name: libcvc
  upstream_version: "3.2.4"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "Center for Computational Visualization core C++ library — volumetric data structures, distributed state, geometry & image processing, DSL runtime."
  homepage: https://github.com/transfix/libcvc
  license: GPL-2.0-or-later
  tags: [scientific, volumetric, state, dsl, geometry]

# Declares the `libcvc` provider slot so the CUDA peer libcvc-cuda (which also
# `provides: [libcvc]`) is a mutually-exclusive alternative, and a future
# hardware-aware resolver (cvcpkg Roadmap Phase 10) can tie-break CPU vs GPU for
# a dependency on the virtual name `libcvc`. The selection that acts on this is
# not implemented yet (see the libcvc-cuda recipe).
provides: ["libcvc"]

source:
  # The recipe is co-located with the libcvc source tree. `pack-from-prefix`
  # (see cvcpkg roadmap) does not consume this field, but the schema
  # requires it; `../../..` points at the libcvc repo root for tools that walk
  # the source tree.
  type: vendored
  path: ../../..

patches: []

depends:
  # libcvc is a pure C++ SDK — no Python. The pycvc bindings (SWIG, Python,
  # numpy) are a separate `pycvc` recipe that depends on libcvc.
  runtime:
    - name: zlib
    - name: boost
    - name: fftw3
    - name: gsl
    - name: cgal
    - name: hdf5
    - name: log4cplus
    - name: tiff
    - name: imagemagick
    # ImageMagick delegates + libtiff codecs. The imagemagick and tiff recipes
    # under-declare these, so without listing them here the installed prefix is
    # missing libjpeg/libpng/libwebp/freetype/libxml2 and only loads where a
    # matching system library happens to exist — which is why macOS could not
    # resolve @rpath/libjpeg.62.dylib / libxml2. (gmp/mpfr arrive via cgal.)
    - name: libjpeg-turbo
    - name: libpng
    - name: libwebp
    - name: freetype
    - name: libxml2
    - name: yaml
    - name: levmar
    - name: libiimod
    - name: openblas
    - name: openssl
    - name: c-ares
    - name: re2
    - name: abseil
    - name: protobuf
    - name: grpc
    - name: pthreads4w
      platforms: [windows]
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/cvc*
    - lib/libcvc*
    - lib/cvc*
    - lib/cmake/cvc/
    - include/cvc/
    - include/xmlrpc/
  cmake_packages:
    - name: cvc
      targets:
        - cvc::cvc

abi:
  cxx_std: 17
