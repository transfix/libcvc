schema_version: 1
recipe:
  name: libcvc
  upstream_version: "3.3.0"
  # Bumped 1 -> 2: the host-only libcvc ABI changed (voxels::_cuda_unified_ptr is
  # now always std::shared_ptr<void>, +8 bytes, to match the CUDA build and make
  # cvc::volume's layout variant-invariant). The new CPU bundle is not ABI-
  # compatible with the published 3.2.4+cvc.1, so it must publish as +cvc.2.
  # (libcvc-cuda already had the wide member, so it did not need the ABI bump —
  # but it does bump to +cvc.2 for the CLI-packaging change below.)
  #
  # This same +cvc.2 bundle ALSO drops the bundled `cvc` CLI: it now ships as its
  # own package (the cvc-cli / cvc-cli-cuda recipes) so it lands deliberately in
  # a user's PATH.
  #
  # And it enables the XMLRPC module (build.{sh,ps1} now pass
  # -DCVC_USING_XMLRPC=ON) so the bundle exports the cvc::xmlrpc target and ships
  # libxmlrpc — the published +cvc.1 was built with the default OFF and so was
  # missing cvc::xmlrpc, which downstream consumers (VolumeRover 2.x) require.
  #
  # The +cvc.2 republish carries all three changes.
  # Bumped 2 -> 3: coordinated FAMILY republish for post-#152 master. libcvc core
  # moved forward since +cvc.2 (e.g. geometry views pin their container, COW-safe
  # across append/clear, #127), and the downstream cvcgl/pycvc-gl changed (cvcGL
  # shared build + faithful colors + expanded GraphicsNode API; pycvc-gl
  # direct-wraps the scene graph). Per cvcpkg policy a new UPSTREAM revision can
  # break downstream, so every downstream rebuilds + republishes against it — the
  # whole family (libcvc/cvcgl/pycvc/pycvc-gl) bumps together to a consistent,
  # tested-together set.
  # Reset to 1 for the 3.3.0 upstream version: cvc_revision counts revisions OF
  # an upstream version, so a version bump restarts it. This supersedes the
  # 3.2.4 +cvc.4 coordinated FAMILY republish for the material-aware navigation
  # work (GRL-SNAM #31/#34-37, libcvc #230-247) — those new cvc::nav symbols (the
  # material force field / witness gate / material-coupled drive, the torch-free
  # CoefEnergyNetMaterial forward+backward, and the self-supervised material
  # trainer) ship as part of 3.3.0 rather than as a 3.2.4 revision. The whole
  # family (libcvc/cvcgl/pycvc/pycvc-gl) rebuilds + republishes together.
  # Bumped 1 -> 2: the +cvc.1 bundle STILL shipped without cvc::xmlrpc. The
  # build.sh fix recorded above never reached the artifact, because the publish
  # workflow does not run build.sh -- it inlines its own configure, which left
  # CVC_USING_XMLRPC at its OFF default. The workflow now passes it on all four
  # lanes, and lib/xmlrpc* is packed alongside lib/libxmlrpc* for the MSVC
  # spelling. Verified against the published bundle: 0 occurrences of
  # cvc::xmlrpc in cvcTargets.cmake and no archive, while include/xmlrpc/
  # headers shipped.
  # Bumped 2 -> 4 (not 3: the catalog already has 3.3.0+cvc.3, and a revision
  # at or below the published max is a silent no-op / 409). The +cvc.3 bundle
  # STILL ships include/xmlrpc/ headers with no lib/libxmlrpc* archive and no
  # cvc::xmlrpc in cvcTargets.cmake -- verified by installing it:
  #     cvcpkg install libcvc --prefix p --config release --link shared
  #     grep -c cvc::xmlrpc p/lib/cmake/cvc/cvcTargets.cmake   ->  0
  #     ls p/lib | grep -i xmlrpc                              ->  (nothing)
  # publish-cvcpkg.yml now passes -DCVC_USING_XMLRPC=ON on every lane AND hard-
  # fails when the archive or the exported target is missing, but +cvc.3 was
  # published before those guards landed, so the artifact never picked them up.
  # This bump is what actually carries the fix to consumers.
  #
  # It is load-bearing downstream: transfix/F2Dock hard-requires cvc::xmlrpc
  # (src/CMakeLists.txt FATAL_ERRORs without it, and its _libcvc_check_usable
  # rejects any libcvc package lacking it). That rejection is why F2Dock has
  # always fallen through to building libcvc FROM SOURCE -- which is the only
  # reason CGAL and the platform toolchains enter its build at all, and hence
  # why CGAL 6.2 (macOS/Windows) and the VS18 v180 CL.exe crash (Windows) break
  # it. A bundle that actually exports cvc::xmlrpc removes the source build,
  # and those failures with it.
  cvc_revision: 4
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "Center for Computational Visualization core C++ library — volumetric data structures, distributed state, geometry & image processing, DSL runtime."
  homepage: https://github.com/transfix/libcvc
  license: LGPL-2.1-only
  tags: [scientific, volumetric, state, dsl, geometry]

# Declares the `libcvc` provider slot so the CUDA peer libcvc-cuda (which also
# `provides: [libcvc]`) is a mutually-exclusive alternative, and a future
# hardware-aware resolver (cvcpkg Roadmap Phase 10) can tie-break CPU vs GPU for
# a dependency on the virtual name `libcvc`. The selection that acts on this is
# not implemented yet (see the libcvc-cuda recipe).
provides: ["libcvc"]

source:
  # The recipe is co-located with the libcvc source tree. `pack-from-prefix`
  # (see cvcpkg roadmap) does not consume this field, but the schema
  # requires it; `../../..` points at the libcvc repo root for tools that walk
  # the source tree.
  type: vendored
  path: ../../..

patches: []

depends:
  # libcvc is a pure C++ SDK — no Python. The pycvc bindings (SWIG, Python,
  # numpy) are a separate `pycvc` recipe that depends on libcvc.
  runtime:
    - name: zlib
    - name: boost
    - name: fftw3
    - name: gsl
    - name: cgal
    # CGAL is header-only and does NOT vendor its math backends: it declares
    # gmp/mpfr as its own runtime deps, which the FLAT `cvcpkg install` does not
    # auto-pull. So they must be listed HERE or the prefix has no gmp/mpfr and
    # `find_package(CGAL CONFIG)` (src/cvc/CMakeLists.txt) fails inside CGAL's
    # FindGMP with `Could NOT find GMP (missing GMP_LIBRARIES GMP_INCLUDE_DIR)`.
    # Linux/macOS masked the gap via a system GMP; Windows (MSVC find_library
    # matches only .lib, so Strawberry Perl's MinGW libgmp.a is invisible) had
    # none, so only windows-release hit it. Verified on the phm-win11 builder:
    # a cgal-only prefix fails FindGMP; adding gmp+mpfr lands gmp.lib/mpfr.lib +
    # gmp.h/mpfr.h in the prefix and FindGMP resolves them.
    - name: gmp
    - name: mpfr
    - name: hdf5
    - name: log4cplus
    - name: tiff
    - name: imagemagick
    # ImageMagick delegates + libtiff codecs. `cvcpkg install` installs each
    # named bundle FLAT — a bundle's own required_deps are NOT auto-pulled — so
    # every transitive codec libtiff / MagickCore link must be listed HERE or the
    # installed prefix is missing it and the dylib only loads where a matching
    # SYSTEM library happens to exist (macOS: dyld `Library not loaded:
    # @rpath/<lib> ... no such file`). libtiff links the FULL codec set —
    # jpeg + zlib(base) + xz(lzma) + zstd + webp + lerc — so all of those must be
    # present. (gmp/mpfr are declared above with cgal; libsharpyuv ships inside
    # the libwebp bundle so it needs no separate entry.)
    - name: libjpeg-turbo
    - name: libpng
    - name: libwebp
    # libtiff codecs beyond jpeg/webp — separate bundles, so declare them or
    # macOS libtiff.dylib fails to load (@rpath/libLerc.4.dylib / libzstd /
    # liblzma not found).
    - name: lerc
    - name: zstd
    - name: xz
    - name: freetype
    # Two more MagickCore links, found by scanning the installed macOS prefix
    # for @rpath deps nothing in it provides (rather than one CI round-trip per
    # missing dylib):
    #   libMagickCore-7.Q16HDRI.dylib -> @rpath/libfontconfig.1.dylib
    #   animate/compare/composite     -> @rpath/libbz2.1.0.8.dylib
    # The fontconfig one is what actually broke package-macos: it surfaced as a
    # gtest `discover_tests` failure, because discovery RUNS the test binary and
    # dyld resolves MagickCore's whole chain at that point — so an undeclared
    # delegate looks like a broken test harness, not a missing package.
    #
    # fontconfig is scoped: it has linux/macos bundles only, and libcvc also
    # builds windows, where an unconditional dep would fail the deps-install
    # outright (same trap as assimp/openblas above). bzip2 is unscoped — it is
    # published for every platform libcvc builds.
    - name: fontconfig
      platforms: [linux, macos]
    # fontconfig's own link — flat install means adding a dep can reveal the
    # next layer, so the prefix was re-scanned after adding fontconfig and
    # libfontconfig.dylib -> @rpath/libexpat.1.10.0.dylib turned up. Unscoped:
    # expat is published for every platform libcvc builds.
    - name: expat
    - name: bzip2
    - name: libxml2
    - name: yaml
    - name: levmar
    - name: libiimod
    # Native mesh/model import (Phase 3: cvc::model + read_model/read_geometry for
    # obj/ply/stl/fbx/gltf/... via Assimp). Guarded by CVC_ENABLE_ASSIMP; the
    # bundle links libassimp so it must be present in the flat prefix. (libcvc's
    # CMake rewrites assimp's exported absolute-zlib-path quirk to ZLIB::ZLIB.)
    #
    # Scoped to the platforms assimp is published for (linux/macos-arm64/freebsd/
    # netbsd/windows). `cvcpkg install-deps` reads THIS recipe's closure to set up
    # the build prefix, so an assimp dep on a platform without a bundle would fail
    # the deps-install. Where assimp is absent, find_package(assimp CONFIG) misses
    # and CVC_ENABLE_ASSIMP flips OFF, so libcvc still builds (without the model
    # loader). Windows added now that an assimp windows bundle is published
    # (assimp 6.0.5+cvc.2) — this is what lets read_model parse buildings.glb, i.e.
    # nav_finale / nav_city_swarm --bundle load a real Austin city on Windows.
    - name: assimp
      platforms: [linux, macos, freebsd, netbsd, windows]
    # Scoped for the same reason as assimp above, but the other way round:
    # openblas deliberately has NO macOS build. macOS ships BLAS/LAPACK in the
    # Accelerate framework, so libcvc-deps uses the system libraries there —
    # see the "No macOS entry" comment on openblas's own build matrix, and
    # levmar, which already scopes its openblas dep the same way.
    #
    # Unconditional, this failed EVERY macos deps-install outright:
    #     Error: requested component(s) not found in the catalog for this
    #     platform tuple: openblas
    # and because install-deps is all-or-nothing, nothing else got installed
    # either — so the visible symptom was a bogus `find_package(libiimod)`
    # failure at src/cvc/CMakeLists.txt:279, naming an innocent package. That
    # red predates 2026-07-27 and was mistaken for the Xcode 26.5 breakage.
    #
    # Nothing needs openblas by name on macOS: libcvc reaches BLAS through
    # levmar, whose config tries `find_dependency(OpenBLAS CONFIG QUIET)` and
    # falls back to `find_dependency(LAPACK)` — which resolves to Accelerate.
    - name: openblas
      platforms: [linux, freebsd, openbsd, netbsd, windows]
    - name: openssl
    - name: c-ares
    - name: re2
    - name: abseil
    - name: protobuf
    - name: grpc
    - name: pthreads4w
      platforms: [windows]
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1

package:
  files:
    # NB: no bin/cvc* — the `cvc` CLI is a separate package (cvc-cli /
    # cvc-cli-cuda). This bundle is the pure SDK: libs, cmake config, headers.
    - lib/libcvc*
    - lib/cvc*
    # The XMLRPC module (CVC_USING_XMLRPC=ON) installs its STATIC archive as
    # lib/libxmlrpc.a — it does not match lib/libcvc*/lib/cvc*, so it must be
    # listed explicitly or downstream links to cvc::xmlrpc fail with a missing
    # archive.
    - lib/libxmlrpc*
    # ...and the MSVC spelling. add_library(xmlrpc STATIC) yields libxmlrpc.a on
    # Unix but xmlrpc.lib on MSVC, which matches neither lib/libcvc* nor
    # lib/cvc* nor the glob above -- the same reason lib/cvc* sits beside
    # lib/libcvc* here. Without it the Windows bundle exports cvc::xmlrpc while
    # shipping no archive for it.
    - lib/xmlrpc*
    - lib/cmake/cvc/
    - include/cvc/
    - include/xmlrpc/
  cmake_packages:
    - name: cvc
      targets:
        - cvc::cvc
        - cvc::xmlrpc

abi:
  cxx_std: 17
