schema_version: 1
recipe:
  # Renamed from `pycvc-gl-cuda`: the pycvc family became per-interpreter
  # column recipes, and the CUDA peer follows the libcvc-deps torch-cp311-cuda
  # convention (<name>-cp311-cuda). CUDA stays cp311-only for now — no
  # cp312/cp313 CUDA columns.
  name: pycvc-gl-cp311-cuda
  upstream_version: "3.3.0"
  # Reset to 1 for the 3.3.0 upstream version: cvc_revision counts
  # revisions OF an upstream version, so a version bump restarts it.
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "pycvc-gl-cp311-cuda — the pycvc.gl scriptable scene bindings (over cvcGL + VTK) for CPython 3.11 (cp311), built against the CUDA stack (libcvc-cuda + the single cvcgl), so the volume facade it compiles exposes GPU behavior (enable_cuda / __cuda_array_interface__). Same Python API as the CPU `pycvc-gl-cp311`; depends on the core `pycvc-cp311-cuda` module."
  homepage: https://github.com/transfix/libcvc
  license: LGPL-2.1-only
  tags: [python, bindings, swig, vtk, scene, scientific, volumetric, cuda, gpu]

# The GPU build of the pycvc scene bindings — identical sources to the CPU
# `pycvc-gl-cp311` recipe, built against the CUDA libcvc. It needs a peer
# because it compiles pycvc_volume.cpp, whose CUDA methods are
# `#ifdef CVC_USING_CUDA`-gated (real device pointers vs host stubs).
#
# It links the SINGLE `cvcgl`, not a cvcgl-cuda (#174). cvcGL contains no CUDA
# code of its own, and cvc::volume's ABI is variant-INVARIANT — voxels.h
# declares `_cuda_unified_ptr` unconditionally so sizeof(voxels) is identical
# with and without CVC_USING_CUDA — so one cvcgl links correctly against
# either libcvc. Reintroduce a cvcgl-cuda peer if and when cvcGL grows its own
# `#ifdef CVC_USING_CUDA` code (the planned GL <-> CUDA 3D-texture interop).
#
# Selection mirrors the rest of the family: provides the `pycvc-gl-cp311` slot
# (mutually exclusive with the CPU pycvc-gl-cp311; same installed files) and
# requires the `cuda` capability. Hardware-aware auto-selection is cvcpkg
# Roadmap Phase 10 (not implemented); until then install pycvc-gl-cp311-cuda
# explicitly on GPU hosts. No macOS (CUDA is linux+windows).
provides: ["pycvc-gl-cp311"]
requires_capabilities: ["cuda"]

source:
  type: vendored
  path: ../../..

patches: []

# The interpreter column this recipe targets (the builder exports
# CVC_PYTHON_INTERPRETER / CVC_PYTHON_ABI from it). CUDA is cp311-only.
python:
  interpreter: python311
  abi: cp311

depends:
  build:
    # The GPU libcvc SDK + the single (variant-invariant) cvcGL + Python + numpy + VTK.
    - name: libcvc-cuda
    - name: cvcgl
    - name: python311
    - name: numpy-cp311
    - name: vtk
  runtime:
    # The core `import pycvc` module, GPU build, so the whole stack is CUDA-
    # consistent (pycvc-cp311-cuda, not the CPU pycvc-cp311).
    - name: pycvc-cp311-cuda
    - name: libcvc-cuda
    - name: cvcgl
    - name: python311
    - name: numpy-cp311
    - name: vtk
  host_tools:
    - cmake
    - ninja
    - swig
    - python311

build:
  # linux + windows only (CUDA has no macOS; cvcGL/VTK also linux+windows).
  matrix:
    - platform: linux
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    # pycvc_gl is a PACKAGE (#155): __init__.py (SWIG proxy) + _pycvc_gl*.so
    # inside it + the camera/vehicle/lab/scenes submodules. Ship the whole
    # package dir, pinned to this column's interpreter. The core _pycvc/pycvc.py
    # come from pycvc-cp311-cuda, so the two install side by side with no file
    # overlap. Same path as the CPU `pycvc-gl-cp311` package (they share the
    # `pycvc-gl-cp311` slot).
    - lib/python3.11/site-packages/pycvc_gl/

abi:
  cxx_std: 17
