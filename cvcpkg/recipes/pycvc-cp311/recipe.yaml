schema_version: 1
recipe:
  # Renamed from the bare `pycvc` (published through +cvc.5): the libcvc-deps
  # python matrix made every python package an explicit per-interpreter column
  # recipe (<name>-cp311/-cp312/-cp313), and the pycvc family follows.
  # pycvc-cp311 SUPERSEDES the published bare `pycvc`; it is a NEW catalog
  # name, so its revision restarts at 1.
  name: pycvc-cp311
  upstream_version: "3.3.0"
  # Reset to 1 for the 3.3.0 upstream version: cvc_revision counts
  # revisions OF an upstream version, so a version bump restarts it.
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "pycvc-cp311 — SWIG Python bindings for libcvc, the CPython 3.11 (cp311) column: cvc::geometry / cvc::volume facades with zero-copy numpy views (and CUDA unified-memory when built against libcvc-cuda). The core, VTK-free bindings; the scriptable-scene bindings are the separate pycvc-gl-cp311 recipe."
  homepage: https://github.com/transfix/libcvc
  license: GPL-2.0-or-later
  tags: [python, bindings, swig, numpy, scientific, volumetric]

# pycvc is deliberately its OWN package, separate from libcvc: a plain libcvc
# bundle is a pure C++ SDK with no Python/numpy/swig dependency. Install a
# pycvc-cp31X column only when you want `import pycvc` on that interpreter.
# It builds bindings/pycvc standalone against the installed libcvc SDK
# (find_package(cvc CONFIG)) with CVC_BUILD_PYCVC_GL=OFF (no cvcGL/VTK).

# Declares the `pycvc-cp311` provider slot so the CUDA peer pycvc-cp311-cuda
# (which also `provides: [pycvc-cp311]`) is a mutually-exclusive alternative,
# and a future hardware-aware resolver (cvcpkg Roadmap Phase 10) can tie-break
# CPU vs GPU for a dependency on the virtual name `pycvc-cp311`. Not
# implemented yet — see pycvc-cp311-cuda.
provides: ["pycvc-cp311"]

source:
  # Co-located with the libcvc source tree; build.sh points cmake at
  # bindings/pycvc. `../../..` is the libcvc repo root.
  type: vendored
  path: ../../..

patches: []

# The interpreter column this recipe targets. The cvcpkg builder exports
# CVC_PYTHON_INTERPRETER / CVC_PYTHON_ABI from this block, and build.sh
# derives the python3.X paths from it — so the build scripts are identical
# across the cp311/cp312/cp313 columns.
python:
  interpreter: python311
  abi: cp311

depends:
  build:
    # libcvc SDK (find_package(cvc CONFIG)); Python dev interpreter + numpy C API.
    - name: libcvc
    - name: python311
    - name: numpy-cp311
  runtime:
    # pycvc imports against this interpreter + numpy and loads libcvc at runtime.
    - name: libcvc
    - name: python311
    - name: numpy-cp311
  host_tools:
    - cmake
    - ninja
    - swig
    - python311

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1

package:
  files:
    # The SWIG module: _pycvc<ext> + the pycvc.py shim, pinned to THIS
    # column's interpreter dir (each cp31X column ships only its own
    # site-packages — no cross-interpreter globs).
    - lib/python3.11/site-packages/pycvc.py
    - lib/python3.11/site-packages/_pycvc*

abi:
  cxx_std: 17
