schema_version: 1
recipe:
  name: pycvc-gl
  upstream_version: "3.2.4"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "pycvc-gl — the pycvc.gl scriptable scene bindings (over cvcGL + VTK): a headless-scriptable VTK scene (Scene.add_geometry/add_volume/show/render_png) used by the grl-snam lab. Ships only the scene module and DEPENDS on the core `pycvc` package; the two install side by side."
  homepage: https://github.com/transfix/libcvc
  license: GPL-2.0-or-later
  tags: [python, bindings, swig, vtk, scene, scientific, volumetric]

# pycvc-gl builds ONLY the scene module (CVC_BUILD_PYCVC_CORE=OFF,
# CVC_BUILD_PYCVC_GL=ON): it installs just _pycvc_gl + pycvc_gl.py and depends
# on the `pycvc` package for the core `import pycvc` module. So pycvc and
# pycvc-gl are installable together, side by side (no file overlap). Both pick
# up CUDA when their libcvc dependency resolves to libcvc-cuda (cvc::cvc carries
# CVC_USING_CUDA), so they work against either libcvc variant.

# Declares the `pycvc-gl` provider slot so a future CUDA peer (pycvc-gl-cuda,
# built against libcvc-cuda) is a mutually-exclusive alternative and a
# hardware-aware resolver (cvcpkg Roadmap Phase 10) can tie-break CPU vs GPU for
# a dependency on the virtual name `pycvc-gl`. pycvc-gl-cuda is NOT published yet
# — it is blocked on the cvc::volume ABI being made variant-invariant (so the
# single `cvcgl` package is ABI-safe against libcvc-cuda); see the roadmap.
provides: ["pycvc-gl"]

source:
  type: vendored
  path: ../../..

patches: []

depends:
  build:
    # libcvc (find_package(cvc CONFIG)); resolves to libcvc-cuda on a CUDA host.
    - name: libcvc
    # cvcGL is now the separate `cvcgl` package (find_package(cvcGL CONFIG) +
    # link cvc::cvcGL) instead of being compiled inline here.
    - name: cvcgl
    - name: python311
    - name: numpy-cp311
    - name: vtk
  runtime:
    # pycvc supplies the core `import pycvc` module this scene module bridges to.
    - name: pycvc
    - name: libcvc
    # the installed cvcGL this module links against.
    - name: cvcgl
    - name: python311
    - name: numpy-cp311
    - name: vtk
  host_tools:
    - cmake
    - ninja
    - swig
    - python311

build:
  # cvcGL + VTK are available on linux + windows (no macOS VTK bundle yet).
  matrix:
    - platform: linux
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    # ONLY the scene module — the core _pycvc/pycvc.py come from the pycvc
    # package, so the two install side by side with no file overlap.
    - lib/python*/site-packages/_pycvc_gl*
    - lib/python*/site-packages/pycvc_gl.py

abi:
  cxx_std: 17
