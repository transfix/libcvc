schema_version: 1
recipe:
  name: pycvc-gl
  upstream_version: "3.2.4"
  # Bumped 1 -> 2: republish from post-#136 master. The scriptable-scene bindings
  # follow the pycvc #136 rearch (injected cvc::app) and link the +cvc.2 cvcgl +
  # pycvc + libcvc. The published +cvc.1 predates the rearch, so supersede as
  # +cvc.2.
  # Bumped 2 -> 3: in lockstep with pycvc +cvc.3 — rebuilt with the current cvcpkg
  # swig (4.4.1 -> swig_runtime_data5). pycvc-gl %imports pycvc.i, so it MUST share
  # pycvc's SWIG runtime version; the +cvc.2 pair was SWIG 4.2.0 (data4). This is a
  # toolchain rebuild only (same source, still links the +cvc.2 cvcgl/pycvc/libcvc
  # and the published vtk-python-cp311 for the vtkProp bridge).
  # Bumped 3 -> 4: hermetic republish. Rebuilt against the hermetic cvcgl +cvc.3
  # and vtk 9.5.0+cvc.2 (cvcpkg X11/OpenGL, libcvc-deps #368); the build no longer
  # needs the apt-get X11/GL step (removed from publish-cvcpkg.yml). Keeps pycvc's
  # SWIG 4.4.1 (data5) runtime. Source unchanged.
  # Bumped 4 -> 5: post-#152 republish. pycvc-gl now DIRECT-WRAPS the cvcGL scene
  # graph (SceneGraph + GraphicsNode/GeometryNode/VolumeNode, %feature directors,
  # in-place transform/color updates) instead of the old add-only facade, and
  # adopts a host's live scene (scene_from_capsule) for volrover3. Rebuilt against
  # the new cvcgl +cvc.4 + pycvc +cvc.5 + libcvc +cvc.3.
  cvc_revision: 5
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "pycvc-gl — the pycvc.gl scriptable scene bindings (over cvcGL + VTK): a headless-scriptable VTK scene (Scene.add_geometry/add_volume/show/render_png) used by the grl-snam lab. Ships only the scene module and DEPENDS on the core `pycvc` package; the two install side by side."
  homepage: https://github.com/transfix/libcvc
  license: GPL-2.0-or-later
  tags: [python, bindings, swig, vtk, scene, scientific, volumetric]

# pycvc-gl builds ONLY the scene module (CVC_BUILD_PYCVC_CORE=OFF,
# CVC_BUILD_PYCVC_GL=ON): it installs just _pycvc_gl + pycvc_gl.py and depends
# on the `pycvc` package for the core `import pycvc` module. So pycvc and
# pycvc-gl are installable together, side by side (no file overlap). Both pick
# up CUDA when their libcvc dependency resolves to libcvc-cuda (cvc::cvc carries
# CVC_USING_CUDA), so they work against either libcvc variant.

# Declares the `pycvc-gl` provider slot so the CUDA peer pycvc-gl-cuda (which
# also `provides: [pycvc-gl]`, and links the GPU cvcgl-cuda + libcvc-cuda) is a
# mutually-exclusive alternative and a hardware-aware resolver (cvcpkg Roadmap
# Phase 10) can tie-break CPU vs GPU for a dependency on the virtual name
# `pycvc-gl`. Selection is not implemented yet — see pycvc-gl-cuda.
provides: ["pycvc-gl"]

source:
  type: vendored
  path: ../../..

patches: []

depends:
  build:
    # libcvc (find_package(cvc CONFIG)); resolves to libcvc-cuda on a CUDA host.
    - name: libcvc
    # cvcGL is now the separate `cvcgl` package (find_package(cvcGL CONFIG) +
    # link cvc::cvcGL) instead of being compiled inline here.
    - name: cvcgl
    - name: python311
    - name: numpy-cp311
    - name: vtk
    # vtkPythonUtil.h + libvtkWrappingPythonCore for the vtkProp* bridge (F3):
    # a Python vtkActor crosses into the C++ scene as a real vtkProp*.
    - name: vtk-python-cp311
  runtime:
    # pycvc supplies the core `import pycvc` module this scene module bridges to.
    - name: pycvc
    - name: libcvc
    # the installed cvcGL this module links against.
    - name: cvcgl
    - name: python311
    - name: numpy-cp311
    - name: vtk
    # vtkmodules import + the wrapping-core .so at load for the vtkProp* bridge.
    - name: vtk-python-cp311
  host_tools:
    - cmake
    - ninja
    - swig
    - python311

build:
  # cvcGL + VTK are available on linux + windows (no macOS VTK bundle yet).
  matrix:
    - platform: linux
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    # ONLY the scene module — the core _pycvc/pycvc.py come from the pycvc
    # package, so the two install side by side with no file overlap.
    - lib/python*/site-packages/_pycvc_gl*
    - lib/python*/site-packages/pycvc_gl.py

abi:
  cxx_std: 17
