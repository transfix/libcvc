schema_version: 1
recipe:
  name: pycvc-gl
  upstream_version: "3.2.4"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "pycvc-gl — the full pycvc Python bindings including the scriptable scene graph (pycvc.gl over cvcGL + VTK). A superset of the core `pycvc` package: numpy facades PLUS a headless-scriptable VTK scene (Scene.add_geometry/add_volume/show/render_png), as used by the grl-snam lab."
  homepage: https://github.com/transfix/libcvc
  license: GPL-2.0-or-later
  tags: [python, bindings, swig, numpy, vtk, scene, scientific, volumetric]

# pycvc-gl builds bindings/pycvc with CVC_BUILD_PYCVC_GL=ON: both the core
# `pycvc` module AND the `pycvc_gl` scene module (cvcGL + VTK). It therefore
# `provides: [pycvc]` — install pycvc-gl when you want the scriptable scene
# (the lab), or the lean `pycvc` recipe for numpy bindings with no VTK.
provides: ["pycvc"]

source:
  type: vendored
  path: ../../..

patches: []

depends:
  build:
    - name: libcvc
    - name: python311
    - name: numpy-cp311
    - name: vtk
  runtime:
    - name: libcvc
    - name: python311
    - name: numpy-cp311
    - name: vtk
  host_tools:
    - cmake
    - ninja
    - swig
    - python311

build:
  # cvcGL + VTK are available on linux + windows (no macOS VTK bundle yet).
  matrix:
    - platform: linux
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    # Core pycvc + the pycvc_gl scene module, in the interpreter's site-packages.
    - lib/python*/site-packages/pycvc.py
    - lib/python*/site-packages/_pycvc*
    - lib/python*/site-packages/pycvc_gl.py

abi:
  cxx_std: 17
