schema_version: 1
recipe:
  name: pycvc-gl-cuda
  upstream_version: "3.2.4"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "pycvc-gl-cuda — the pycvc.gl scriptable scene bindings (over cvcGL + VTK) built against the CUDA stack (libcvc-cuda + cvcgl-cuda), so the volume facade it compiles exposes GPU behavior (enable_cuda / __cuda_array_interface__) and it links the GPU cvcGL. Same Python API as the CPU `pycvc-gl`; depends on the core `pycvc-cuda` module."
  homepage: https://github.com/transfix/libcvc
  license: GPL-2.0-or-later
  tags: [python, bindings, swig, vtk, scene, scientific, volumetric, cuda, gpu]

# The GPU build of the pycvc scene bindings — identical sources to the CPU
# `pycvc-gl` recipe, built against the CUDA variants. It needs a peer for TWO
# reasons: (1) it compiles pycvc_volume.cpp, whose CUDA methods are
# `#ifdef CVC_USING_CUDA`-gated (real device pointers vs host stubs); (2) it
# links cvcGL, and it must link the ABI/CUDA-matched cvcgl-cuda (not the CPU
# cvcgl) so cvcGL's GL <-> CUDA interop is available and the volume ABI matches.
#
# Selection mirrors the rest of the family: provides the `pycvc-gl` slot
# (mutually exclusive with the CPU pycvc-gl; same installed files) and requires
# the `cuda` capability. Hardware-aware auto-selection is cvcpkg Roadmap Phase 10
# (not implemented); until then install pycvc-gl-cuda explicitly on GPU hosts.
# No macOS (CUDA is linux+windows).
provides: ["pycvc-gl"]
requires_capabilities: ["cuda"]

source:
  type: vendored
  path: ../../..

patches: []

depends:
  build:
    # The GPU libcvc SDK + the GPU cvcGL (ABI/CUDA-matched) + Python + numpy + VTK.
    - name: libcvc-cuda
    - name: cvcgl-cuda
    - name: python311
    - name: numpy-cp311
    - name: vtk
  runtime:
    # The core `import pycvc` module, GPU build, so the whole stack is CUDA-
    # consistent (pycvc-cuda, not the CPU pycvc).
    - name: pycvc-cuda
    - name: libcvc-cuda
    - name: cvcgl-cuda
    - name: python311
    - name: numpy-cp311
    - name: vtk
  host_tools:
    - cmake
    - ninja
    - swig
    - python311

build:
  # linux + windows only (CUDA has no macOS; cvcGL/VTK also linux+windows).
  matrix:
    - platform: linux
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    # pycvc_gl is now a PACKAGE (#155): __init__.py (SWIG proxy) + _pycvc_gl*.so
    # inside it + the camera/vehicle/lab/scenes submodules. Ship the whole package
    # dir. The core _pycvc/pycvc.py come from pycvc-cuda, so the two install side
    # by side with no file overlap. Same path as the CPU `pycvc-gl` package (they
    # share the `pycvc-gl` slot).
    - lib/python*/site-packages/pycvc_gl/

abi:
  cxx_std: 17
