schema_version: 1
recipe:
  name: cvcgl-examples
  upstream_version: "3.4.0"
  # Bumped 1 -> 2: the GRL-SNAM nav demos (nav_city_swarm / nav_fog_ghost /
  # nav_finale) are now built and packaged alongside lsystem_forest (libcvc #203).
  # Reset to 1 for the 3.3.0 upstream version: cvc_revision counts
  # revisions OF an upstream version, so a version bump restarts it.
  # Bumped 1 -> 2: added the imgui dependency, so the published demos ship with
  # their control panels instead of silently compiled-out no-op overlays.
  # Bumped 1 -> 2 (3.4.0): the wasm build now ships the full nav gallery, not
  # just lsystem_forest — build-wasm.sh builds terrain_lab + nav_city_swarm +
  # nav_city_drive + nav_fog_ghost (threaded/wasm-mt) and assembles it with
  # build-pages.py into share/cvcgl-examples/web/, so cvcgl-examples-web serves
  # the same gallery that deploys to gh-pages. lsystem_forest dropped from the
  # wasm gallery (irrelevant to navigation).
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "cvcGL example programs as ready-to-run commands: the GRL-SNAM navigation demos (nav_city_swarm / nav_city_drive / nav_fog_ghost / nav_finale — the torch-free cvc::nav reactive swarm rendered natively) plus terrain_lab, as native binaries in bin/, AND the full navigation gallery as a threaded (wasm-mt) WebAssembly browser build (share/cvcgl-examples/web/) with a cvcgl-examples-web launcher that serves it cross-origin-isolated (COOP/COEP) and opens a browser."
  homepage: https://github.com/transfix/libcvc
  license: LGPL-2.1-only
  tags: [scientific, graphics, examples, vtk, wasm]

# The examples are demos of cvcGL-as-a-toolkit, packaged separately from the
# cvcgl SDK bundle the same way cvc-cli is packaged separately from libcvc: an
# SDK consumer should not drag demo binaries in, and a demo user should not
# need headers. Two kinds of matrix entry:
#   * native (linux): builds src/cvcGL standalone against the installed libcvc
#     SDK + VTK with CVC_BUILD_EXAMPLES=ON and installs bin/lsystem_forest,
#     plus the bin/cvcgl-examples-web launcher.
#   * wasm: cross-compiles the whole closure from the repo root with the
#     Emscripten toolchain (there is no wasm libcvc bundle — the demo statically
#     embeds the trimmed cvc core) and packages the browser build under
#     share/cvcgl-examples/web/.
# Install BOTH into one prefix to use the launcher:
#   cvcpkg install cvcgl-examples --prefix ./deps
#   cvcpkg install cvcgl-examples --platform wasm --arch wasm32 --link static --prefix ./deps
#   ./deps/bin/cvcgl-examples-web

source:
  # Co-located with the libcvc source tree (`../../..` is the repo root).
  type: vendored
  path: ../../..

patches: []

depends:
  build:
    # Native entries build examples/cvcGL against the installed SDK.
    - name: libcvc
      platforms: [linux, windows]
    - name: vtk
      platforms: [linux, windows]
    - name: boost
      platforms: [linux, windows]
    # The demos' control panels. cvcGL compiles ImGuiOverlay to inert stubs when
    # imgui is absent, so WITHOUT this the published binaries have no UI at all
    # -- they run, and every menu the demos define is silently compiled out.
    # linux only: the windows column has no imgui bundle yet, and the wasm
    # column links its own static closure below.
    - name: imgui
      platforms: [linux]
    # Wasm column — static deps for the Emscripten cross-build (env-wasm.sh
    # forces static; emsdk itself is auto-discovered from its cross_toolchain
    # declaration, never listed here). NOTE: needs the rendering-enabled vtk
    # wasm bundle (vtk 9.5.0+cvc.3, libcvc-deps feat/vtk-wasm-rendering) — the
    # older compute-only wasm vtk does not link this demo.
    - name: vtk
      platforms: [wasm-mt]
    - name: boost
      platforms: [wasm-mt]
    - name: zstd
      platforms: [wasm-mt]
    - name: zlib
      platforms: [wasm-mt]
    # cgal is intentionally NOT a dependency: build-wasm.sh passes
    # -DDISABLE_CGAL=ON so it is never linked, and there is no wasm-mt cgal
    # bundle on the catalog anyway.
    # Austin scene + trained policy, preloaded into the nav_city demos' MEMFS so
    # the browser gallery shows real downtown Austin (matches the gh-pages build).
    # Data-only (platform any); staged only for the wasm-mt build. build-wasm.sh
    # preloads them when present and falls back to a synthetic city otherwise.
    - name: scene-austin-south-small
      platforms: [wasm-mt]
    - name: grl-snam-weights
      platforms: [wasm-mt]
    - name: vehicle-humvee
      platforms: [wasm-mt]
  runtime:
    # The native binary links the installed libcvc + VTK + Boost shared libs
    # (cvcGL itself is built static into the binary — no soname coupling to the
    # cvcgl SDK bundle). The wasm bundle is a self-contained static .wasm with
    # no runtime deps.
    - name: libcvc
      platforms: [linux, windows]
    - name: vtk
      platforms: [linux, windows]
    - name: boost
      platforms: [linux, windows]
    # imgui is published shared-only, so libimgui.so is a load-time dependency
    # of the demo binaries even though cvcGL itself is linked static into them.
    - name: imgui
      platforms: [linux]
  host_tools:
    - cmake
    - ninja
    # build-wasm.sh runs build-pages.py to assemble the browser gallery.
    - python311

build:
  # linux + windows (VTK bundles exist for both); macOS waits on a macOS VTK
  # bundle (the same constraint that keeps the cvcgl SDK recipe off macOS). The
  # wasm column is threaded (wasm-mt) so the in-browser gallery gets
  # SharedArrayBuffer; the cvcgl-examples-web launcher serves it with the
  # COOP/COEP headers that requires.
  matrix:
    - platform: linux
      script: build.sh
    - platform: windows
      script: build.ps1
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh

package:
  files:
    - bin/lsystem_forest
    - bin/nav_city_swarm
    - bin/nav_city_drive
    - bin/nav_fog_ghost
    - bin/nav_finale
    - bin/cvcgl-examples-web
    - share/cvcgl-examples/

abi:
  cxx_std: 17
