schema_version: 1
recipe:
  name: libcvc-examples
  upstream_version: "3.7.1"
  # Replaces cvcgl-examples (last published 3.7.0+cvc.2), with the examples moved to the repo's
  # top-level examples/. The browser gallery is its own package now, libcvc-examples-web.
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "libcvc's example programs as ready-to-run commands: the cvcGL scene demos (lsystem_forest, lsystem_coast, terrain_lab, bunny_shadow, volren_bunny, volslice_bunny), the GRL-SNAM navigation demos (nav_city_swarm / nav_city_drive / nav_fog_ghost / nav_finale, the torch-free cvc::nav reactive swarm rendered natively), the headless nav CLIs (nav_swarm_demo / nav_train_demo / nav_material_demo), and the example .ari documents for arigl and ari (share/libcvc-examples/ariadne/). Linux also gets libcvc-examples-web, a launcher that serves the browser gallery from the libcvc-examples-web package cross-origin-isolated (COOP/COEP) and opens a browser."
  homepage: https://github.com/transfix/libcvc
  # BSD-3-Clause: the demos link cvcGL statically, which carries code derived
  # from VTK 9.5.0. MIT: lsystem_coast's OceanFFT is a port of ABYSSAL. Both
  # notices are in THIRD_PARTY_NOTICES.md, shipped in share/libcvc-examples/.
  license: "LGPL-2.1-only AND BSD-3-Clause AND MIT"
  tags: [scientific, graphics, examples, vtk]

# The examples are packaged separately from the SDK bundles (libcvc, cvcgl) the
# same way cvc-cli and ari are: an SDK consumer should not drag demo binaries in,
# and a demo user should not need headers. build.sh / build.ps1 configure
# src/cvcGL standalone against the installed libcvc SDK + VTK with
# CVC_BUILD_EXAMPLES=ON, which adds the repo's examples/ (examples/CMakeLists.txt),
# and install its libcvc-examples component. The browser build of the same
# programs is libcvc-examples-web; install both into one prefix for the launcher:
#   cvcpkg install libcvc-examples --prefix ./deps
#   cvcpkg install libcvc-examples-web --platform wasm-mt --arch wasm32 --link static --prefix ./deps
#   ./deps/bin/libcvc-examples-web

source:
  # Co-located with the libcvc source tree (`../../..` is the repo root).
  type: vendored
  path: ../../..

patches: []

depends:
  build:
    - name: libcvc
    - name: vtk
    - name: boost
    # The demos' control panels. cvcGL compiles ImGuiOverlay to inert stubs when
    # imgui is absent, so WITHOUT this the published binaries have no UI at all
    # -- they run, and every menu the demos define is silently compiled out.
    # linux only: the windows column has no imgui bundle yet.
    - name: imgui
      platforms: [linux]
  runtime:
    # The binaries link the installed libcvc + VTK + Boost shared libs (cvcGL
    # itself is built static into them: no soname coupling to the cvcgl SDK).
    - name: libcvc
    - name: vtk
    - name: boost
    # imgui is published shared-only, so libimgui.so is a load-time dependency
    # of the demo binaries even though cvcGL itself is linked static into them.
    - name: imgui
      platforms: [linux]
  host_tools:
    - cmake
    - ninja

build:
  # linux + windows (VTK bundles exist for both); macOS waits on a macOS VTK
  # bundle (the same constraint that keeps the cvcgl SDK recipe off macOS).
  matrix:
    - platform: linux
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    # Every installed example binary (bin/<name>, bin/<name>.exe on Windows), as
    # listed in _cvcgl_example_bins in examples/CMakeLists.txt.
    - bin/lsystem_forest*
    - bin/lsystem_coast*
    - bin/terrain_lab*
    - bin/bunny_shadow*
    - bin/volren_bunny*
    - bin/volslice_bunny*
    - bin/nav_city_swarm*
    - bin/nav_city_drive*
    - bin/nav_fog_ghost*
    - bin/nav_finale*
    - bin/nav_swarm_demo*
    - bin/nav_train_demo*
    - bin/nav_material_demo*
    # The browser gallery's launcher (build.sh writes it; build.ps1 does not).
    - glob: bin/libcvc-examples-web
      platforms: [linux]
    # The .ari documents, serve.py + devtools, THIRD_PARTY_NOTICES.md and LICENSE.
    - share/libcvc-examples/

abi:
  cxx_std: 17
