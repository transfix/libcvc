schema_version: 1
recipe:
  name: pycvc
  upstream_version: "3.2.4"
  # Bumped 1 -> 2: republish from post-#136 master. pycvc was rearchitected (#136)
  # to direct SWIG wrapping + an injected cvc::app — make_app()/geometry(app)/
  # state_set(app, ...) replace the old class-Geometry/class-Volume facade — and it
  # links the +cvc.2 libcvc (#134). The published +cvc.1 shim predates the rearch,
  # so the new bundle supersedes it as +cvc.2.
  # Bumped 2 -> 3: SAME source, rebuilt with the current cvcpkg swig (4.4.1). The
  # +cvc.2 bundle was generated with SWIG 4.2.0 (swig_runtime_data4); any SWIG
  # module that %imports pycvc.i (pycvc-gl, volrover3's vrhost) must share pycvc's
  # runtime type table, whose capsule name is SWIG-version-specific (4.2.x -> data4,
  # >=4.3 -> data5). Building a consumer with the 4.4.1 toolchain against a data4
  # pycvc silently breaks cross-module type sharing (state_set(host.app()) rejects
  # the handle). +cvc.3 is the data5 rebuild; pycvc-gl is bumped in lockstep so the
  # family stays on one SWIG runtime.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "pycvc — SWIG Python bindings for libcvc: cvc::geometry / cvc::volume facades with zero-copy numpy views (and CUDA unified-memory when built against libcvc-cuda). The core, VTK-free bindings; the scriptable-scene bindings are the separate pycvc-gl recipe."
  homepage: https://github.com/transfix/libcvc
  license: GPL-2.0-or-later
  tags: [python, bindings, swig, numpy, scientific, volumetric]

# pycvc is deliberately its OWN package, separate from libcvc: a plain libcvc
# bundle is a pure C++ SDK with no Python/numpy/swig dependency. Install pycvc
# only when you want `import pycvc`. It builds bindings/pycvc standalone against
# the installed libcvc SDK (find_package(cvc CONFIG)) with CVC_BUILD_PYCVC_GL=OFF
# (no cvcGL/VTK).

# Declares the `pycvc` provider slot so the CUDA peer pycvc-cuda (which also
# `provides: [pycvc]`) is a mutually-exclusive alternative, and a future
# hardware-aware resolver (cvcpkg Roadmap Phase 10) can tie-break CPU vs GPU for
# a dependency on the virtual name `pycvc`. Not implemented yet — see pycvc-cuda.
provides: ["pycvc"]

source:
  # Co-located with the libcvc source tree; build.sh points cmake at
  # bindings/pycvc. `../../..` is the libcvc repo root.
  type: vendored
  path: ../../..

patches: []

depends:
  build:
    # libcvc SDK (find_package(cvc CONFIG)); Python dev interpreter + numpy C API.
    - name: libcvc
    - name: python311
    - name: numpy-cp311
  runtime:
    # pycvc imports against this interpreter + numpy and loads libcvc at runtime.
    - name: libcvc
    - name: python311
    - name: numpy-cp311
  host_tools:
    - cmake
    - ninja
    - swig
    - python311

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1

package:
  files:
    # The SWIG module: _pycvc<ext> + the pycvc.py shim, in the interpreter's
    # site-packages.
    - lib/python*/site-packages/pycvc.py
    - lib/python*/site-packages/_pycvc*

abi:
  cxx_std: 17
