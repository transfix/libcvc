schema_version: 1
recipe:
  name: ari
  upstream_version: "3.6.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "ari — run an Ariadne (.ari) UI document in the terminal. `ari run doc.ari` takes over the terminal through libcvc's FTXUI backend (keyboard, mouse, floating windows, menus, text entry, half-block images); `ari snapshot` prints a frame as text for CI and docs; `ari check` loads a document and reports its warnings. GL-free: no window, VTK or ImGui."
  homepage: https://github.com/transfix/libcvc
  license: LGPL-2.1-only
  tags: [ui, terminal, tui, cli, tools]

# `ari` is its OWN package, separate from libcvc (like cvc-cli), so the tool lands
# deliberately in a user's PATH (`cvcpkg install ari`) rather than riding along in
# the libcvc SDK bundle. It builds src/ari standalone against the installed libcvc
# SDK (find_package(cvc CONFIG)) and installs just bin/ari; libcvc is never rebuilt.
#
# The terminal backend and the .ari loader live in libcvc itself (cvc::ariadne,
# with FTXUI and yaml-cpp as libcvc's own optional deps), so ari needs nothing but
# libcvc. Linux only for now: the libcvc recipe declares ftxui for linux only
# (cy-pca/cvcpkg #111). A macOS / Windows ari would build, but only print that its
# libcvc has no terminal backend; add those platforms when libcvc's ftxui does.

source:
  # Co-located with the libcvc source tree; build.sh points cmake at src/ari.
  # `../../..` is the libcvc repo root.
  type: vendored
  path: ../../..

patches: []

depends:
  build:
    - name: libcvc
  runtime:
    - name: libcvc
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh

package:
  # Just the `ari` executable. No cmake package config — ari is an application.
  files:
    - bin/ari

abi:
  cxx_std: 20
