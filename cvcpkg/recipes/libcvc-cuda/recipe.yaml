schema_version: 1
recipe:
  name: libcvc-cuda
  upstream_version: "4.0.0"
  # Bumped 1 -> 2: this bundle no longer ships the `cvc` CLI (it moved to its own
  # cvc-cli / cvc-cli-cuda packages so it lands deliberately in a user's PATH).
  # Dropping the binary changes bundle contents, and +cvc.1 was already published
  # (linux), so the CLI-less SDK must publish as +cvc.2.
  # Reset to 1 for the 3.3.0 upstream version: cvc_revision counts
  # revisions OF an upstream version, so a version bump restarts it.
  # Bumped 1 -> 2: declare assimp (plus the fontconfig/expat/bzip2 delegate
  # closure) so the published GPU bundle's libcvc.so can actually load.
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "Center for Computational Visualization core C++ library (CUDA / GPU build) — volume voxels in CUDA unified memory for on-device zero-copy, same API as the CPU `libcvc` package."
  homepage: https://github.com/transfix/libcvc
  license: LGPL-2.1-only
  tags: [scientific, volumetric, state, dsl, geometry, cuda, gpu]

# Virtual-package selection (cvcpkg capability-provider resolution):
#   * `provides: [libcvc]` — this package satisfies a dependency on the virtual
#     name `libcvc`, exactly like the CPU `libcvc` recipe does.
#   * `requires_capabilities: [cuda]` — the resolver only selects this variant
#     on a host whose `cvcpkg` capability probe reports CUDA. On a CUDA host a
#     `libcvc` dependency prefers this GPU build; on a host without CUDA it is
#     filtered out and the plain `libcvc` (CPU) package is chosen. That is the
#     "install the best variant for this machine" behaviour — no separate
#     meta-package recipe is needed; `libcvc` is the virtual name both provide.
#
# Building this recipe requires a CUDA toolkit (nvcc + cudart) on the build
# runner; unlike the CPU build it cannot run on the GitHub-hosted images, so
# publishing it is wired to a self-hosted CUDA runner (see the publish workflow).
provides: ["libcvc"]
requires_capabilities: ["cuda"]

source:
  # Co-located with the libcvc source tree.
  # `path` is counted from cvcpkg/recipes/_vendored/, where `cvcpkg build`
  # looks first, so `../../..` is the libcvc repo root (CVC_SOURCE_DIR).
  # `cvcpkg recipe push` does not bundle it: counted from cvcpkg/, its
  # fallback base, the same path points outside the repo.
  # The publish workflow's `cvcpkg pack --from-prefix` does not read it.
  type: vendored
  path: ../../..

patches: []

depends:
  # libcvc's dependencies, entry for entry. libcvc-cuda's build.sh and build.ps1 run libcvc's
  # scripts with CVC_ENABLE_CUDA=ON, and the publish workflow's CUDA jobs install libcvc's
  # closure, so the GPU build links exactly what the CPU build links. This list is what
  # `cvcpkg pack` bakes into the bundle's required_deps and what `cvcpkg build libcvc-cuda`
  # installs. `cvcpkg install` is flat, so a library libcvc.so links but this list leaves out is
  # missing from a consumer's prefix, and libcvc.so does not load: assimp did that until it was
  # added. The list used to be a hand copy and drifted twice. ci.yml's recipe-version job now
  # fails when it differs from libcvc's on a platform this recipe builds
  # (.github/scripts/recipe-deps-parity.py).
  #
  # The platform scopes are libcvc's, copied as they are. libcvc-cuda builds only linux and
  # windows, so only those two columns matter. Each entry's reason is in libcvc's recipe.
  #
  # The one difference is googletest, a build dep of libcvc's that only builds the test suite.
  # Nothing builds libcvc-cuda's tests (its scripts leave CVC_BUILD_TESTS OFF), so it is left out.
  build:
    - name: pegtl
    - name: tvision
      platforms: [linux, macos, windows]
    - name: clipper2
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: cdt
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: shewchuk-predicates
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
  # libcvc-cuda is a pure C++ SDK (GPU build), with no Python. The pycvc bindings are a separate
  # recipe that depends on the libcvc SDK.
  runtime:
    - name: zlib
    - name: boost
    # PocketFFT, not FFTW: libcvc dropped FFTW (GPL-2.0-or-later) for PocketFFT (BSD-3), and this
    # list kept declaring fftw3 after the build stopped linking it.
    - name: pocketfft
      platforms: [linux, macos, windows]
    - name: eigen
      platforms: [linux, macos, windows]
    - name: libigl
      platforms: [linux, macos, windows]
    - name: gsl
      platforms: [linux, macos, windows]
    # No cgal, gmp or mpfr: libcvc does not use CGAL (see the CPU recipe).
    - name: hdf5
      platforms: [linux, macos, windows]
    - name: log4cplus
      platforms: [linux, macos, windows]
    - name: libopus
      platforms: [linux, macos, windows, wasm]
    - name: tiff
    - name: imagemagick
    # ImageMagick delegates and libtiff codecs (the flat-install note is in libcvc's recipe).
    - name: libjpeg-turbo
    - name: libpng
    - name: libwebp
    - name: lerc
    - name: zstd
    - name: xz
    - name: freetype
    - name: fontconfig
      platforms: [linux, macos]
    - name: expat
      platforms: [linux, macos, windows]
    - name: bzip2
    - name: libxml2
    - name: yaml
      platforms: [linux, macos, windows]
    # The Ariadne libraries: the .ari loader (yaml-cpp), its JSON-Schema validation
    # (nlohmann-json, json-schema-validator) and the terminal backends (ftxui, and ncurses for
    # tvision on Unix).
    - name: yaml-cpp
      platforms: [linux, macos, windows, wasm-mt]
    - name: nlohmann-json
      platforms: [linux, macos, windows]
    - name: json-schema-validator
      platforms: [linux, macos, windows]
    - name: ftxui
      platforms: [linux, macos, windows, wasm-mt]
    - name: ncurses
      platforms: [linux, macos]
    - name: levmar
      platforms: [linux, macos, windows]
    - name: libiimod
      platforms: [linux, macos, windows]
    - name: assimp
      platforms: [linux, macos, freebsd, netbsd, windows, wasm-mt]
    - name: joltphysics
      platforms: [linux, macos, freebsd, netbsd, windows, wasm-mt]
    - name: qhull
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: openblas
      platforms: [linux, freebsd, openbsd, netbsd, windows]
    - name: curl
      platforms: [linux, macos, windows]
    # The gRPC/xmlrpc network state-transport stack.
    - name: openssl
      platforms: [linux, macos, windows]
    - name: c-ares
      platforms: [linux, macos, windows]
    - name: re2
      platforms: [linux, macos, windows]
    - name: abseil
      platforms: [linux, macos, windows]
    - name: protobuf
      platforms: [linux, macos, windows]
    - name: grpc
      platforms: [linux, macos, windows]
    - name: pthreads4w
      platforms: [windows]
    # Windows builds link LLVM's libomp (-openmp:llvm) instead of MSVC's libomp140.
    - name: openmp
      platforms: [macos, windows]
    - name: mingw-w64-runtime
      platforms: [windows]
  host_tools:
    - cmake
    - ninja

build:
  # No macOS entry: Apple platforms have no CUDA runtime, so the GPU variant is
  # Linux + Windows only. The CPU `libcvc` package covers macOS.
  matrix:
    - platform: linux
      script: build.sh
      env:
        CVC_ENABLE_CUDA: "ON"
    - platform: windows
      script: build.ps1
      env:
        CVC_ENABLE_CUDA: "ON"

package:
  files:
    # NB: no bin/cvc* — the `cvc` CLI is a separate package (cvc-cli /
    # cvc-cli-cuda). This bundle is the pure SDK: libs, cmake config, headers.
    - lib/libcvc*
    - lib/cvc*
    # The XMLRPC module installs its STATIC archive as lib/libxmlrpc.a, which
    # matches neither lib/libcvc* nor lib/cvc*, so it must be listed explicitly
    # or downstream links to cvc::xmlrpc fail with a missing archive -- the same
    # reason the CPU libcvc recipe lists it. This bundle already shipped
    # include/xmlrpc/ headers while packing no library and exporting no target.
    - lib/libxmlrpc*
    # ...and the MSVC spelling (xmlrpc.lib), which matches none of the globs
    # above. libcvc-cuda builds windows, so this column needs it too.
    - lib/xmlrpc*
    - lib/cmake/cvc/
    - include/cvc/
    - include/xmlrpc/
    # The Ariadne component library (cvc://components/*.ari), which cvc:// finds beside the
    # installed library -- the same entry as the CPU libcvc recipe, for the same reason.
    - share/libcvc/ariadne/
  cmake_packages:
    - name: cvc
      targets:
        - cvc::cvc
        - cvc::xmlrpc

abi:
  cxx_std: 17
