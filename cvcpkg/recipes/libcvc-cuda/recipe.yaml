schema_version: 1
recipe:
  name: libcvc-cuda
  upstream_version: "3.2.4"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "Center for Computational Visualization core C++ library (CUDA / GPU build) — volume voxels in CUDA unified memory for on-device zero-copy, same API as the CPU `libcvc` package."
  homepage: https://github.com/transfix/libcvc
  license: GPL-2.0-or-later
  tags: [scientific, volumetric, state, dsl, geometry, cuda, gpu]

# Virtual-package selection (cvcpkg capability-provider resolution):
#   * `provides: [libcvc]` — this package satisfies a dependency on the virtual
#     name `libcvc`, exactly like the CPU `libcvc` recipe does.
#   * `requires_capabilities: [cuda]` — the resolver only selects this variant
#     on a host whose `cvcpkg` capability probe reports CUDA. On a CUDA host a
#     `libcvc` dependency prefers this GPU build; on a host without CUDA it is
#     filtered out and the plain `libcvc` (CPU) package is chosen. That is the
#     "install the best variant for this machine" behaviour — no separate
#     meta-package recipe is needed; `libcvc` is the virtual name both provide.
#
# Building this recipe requires a CUDA toolkit (nvcc + cudart) on the build
# runner; unlike the CPU build it cannot run on the GitHub-hosted images, so
# publishing it is wired to a self-hosted CUDA runner (see the publish workflow).
provides: ["libcvc"]
requires_capabilities: ["cuda"]

source:
  # The recipe is co-located with the libcvc source tree. `pack-from-prefix`
  # (see cvcpkg roadmap) does not consume this field, but the schema
  # requires it; `../../..` points at the libcvc repo root for tools that walk
  # the source tree.
  type: vendored
  path: ../../..

patches: []

depends:
  build:
    # pycvc bindings (CVC_BUILD_PYCVC=ON): SWIG generates the wrapper, the
    # Python dev interpreter supplies headers, numpy supplies its C API.
    - name: python311
    - name: numpy-cp311
  runtime:
    # pycvc runs against this interpreter + numpy from the same prefix.
    - name: python311
    - name: numpy-cp311
    - name: zlib
    - name: boost
    - name: fftw3
    - name: gsl
    - name: cgal
    - name: hdf5
    - name: log4cplus
    - name: tiff
    - name: imagemagick
    # ImageMagick delegates + libtiff codecs. The imagemagick and tiff recipes
    # under-declare these, so without listing them here the installed prefix is
    # missing libjpeg/libpng/libwebp/freetype/libxml2 and only loads where a
    # matching system library happens to exist — which is why macOS could not
    # resolve @rpath/libjpeg.62.dylib / libxml2. (gmp/mpfr arrive via cgal.)
    - name: libjpeg-turbo
    - name: libpng
    - name: libwebp
    - name: freetype
    - name: libxml2
    - name: yaml
    - name: levmar
    - name: libiimod
    - name: openblas
    - name: openssl
    - name: c-ares
    - name: re2
    - name: abseil
    - name: protobuf
    - name: grpc
    - name: pthreads4w
      platforms: [windows]
  host_tools:
    - cmake
    - ninja
    - swig
    - python311

build:
  # No macOS entry: Apple platforms have no CUDA runtime, so the GPU variant is
  # Linux + Windows only. The CPU `libcvc` package covers macOS.
  matrix:
    - platform: linux
      script: build.sh
      env:
        CVC_ENABLE_CUDA: "ON"
    - platform: windows
      script: build.ps1
      env:
        CVC_ENABLE_CUDA: "ON"

package:
  files:
    - bin/cvc*
    - lib/libcvc*
    - lib/cvc*
    - lib/cmake/cvc/
    - include/cvc/
    - include/xmlrpc/
  cmake_packages:
    - name: cvc
      targets:
        - cvc::cvc

abi:
  cxx_std: 17
