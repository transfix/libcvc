schema_version: 1
recipe:
  name: libcvc-cuda
  upstream_version: "3.3.0"
  # Bumped 1 -> 2: this bundle no longer ships the `cvc` CLI (it moved to its own
  # cvc-cli / cvc-cli-cuda packages so it lands deliberately in a user's PATH).
  # Dropping the binary changes bundle contents, and +cvc.1 was already published
  # (linux), so the CLI-less SDK must publish as +cvc.2.
  # Reset to 1 for the 3.3.0 upstream version: cvc_revision counts
  # revisions OF an upstream version, so a version bump restarts it.
  # Bumped 1 -> 2: declare assimp (plus the fontconfig/expat/bzip2 delegate
  # closure) so the published GPU bundle's libcvc.so can actually load.
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "Center for Computational Visualization core C++ library (CUDA / GPU build) — volume voxels in CUDA unified memory for on-device zero-copy, same API as the CPU `libcvc` package."
  homepage: https://github.com/transfix/libcvc
  license: LGPL-2.1-only
  tags: [scientific, volumetric, state, dsl, geometry, cuda, gpu]

# Virtual-package selection (cvcpkg capability-provider resolution):
#   * `provides: [libcvc]` — this package satisfies a dependency on the virtual
#     name `libcvc`, exactly like the CPU `libcvc` recipe does.
#   * `requires_capabilities: [cuda]` — the resolver only selects this variant
#     on a host whose `cvcpkg` capability probe reports CUDA. On a CUDA host a
#     `libcvc` dependency prefers this GPU build; on a host without CUDA it is
#     filtered out and the plain `libcvc` (CPU) package is chosen. That is the
#     "install the best variant for this machine" behaviour — no separate
#     meta-package recipe is needed; `libcvc` is the virtual name both provide.
#
# Building this recipe requires a CUDA toolkit (nvcc + cudart) on the build
# runner; unlike the CPU build it cannot run on the GitHub-hosted images, so
# publishing it is wired to a self-hosted CUDA runner (see the publish workflow).
provides: ["libcvc"]
requires_capabilities: ["cuda"]

source:
  # The recipe is co-located with the libcvc source tree. `pack-from-prefix`
  # (see cvcpkg roadmap) does not consume this field, but the schema
  # requires it; `../../..` points at the libcvc repo root for tools that walk
  # the source tree.
  type: vendored
  path: ../../..

patches: []

depends:
  # libcvc-cuda is a pure C++ SDK (GPU build) — no Python. The pycvc bindings
  # are a separate recipe that depends on the libcvc SDK.
  runtime:
    - name: zlib
    - name: boost
    - name: fftw3
    - name: gsl
    - name: cgal
    # CGAL is header-only and declares gmp/mpfr as its own runtime deps rather
    # than vendoring them; the FLAT `cvcpkg install` does not auto-pull them, so
    # list them HERE or `find_package(CGAL CONFIG)` fails in FindGMP with
    # `Could NOT find GMP`. Only windows-release hit it (MSVC find_library sees
    # only .lib, so no system/MinGW GMP fallback). Kept in lockstep with the CPU
    # libcvc; see that recipe for the full note.
    - name: gmp
    - name: mpfr
    - name: hdf5
    - name: log4cplus
    - name: tiff
    - name: imagemagick
    # ImageMagick delegates + libtiff codecs. `cvcpkg install` installs each
    # named bundle FLAT (a bundle's required_deps are NOT auto-pulled), so every
    # transitive codec libtiff / MagickCore link must be listed HERE or the
    # installed prefix is missing it. libtiff links the FULL codec set —
    # jpeg + zlib + xz(lzma) + zstd + webp + lerc. (gmp/mpfr declared above with
    # cgal; libsharpyuv ships inside the libwebp bundle.) Kept in lockstep with
    # the CPU libcvc.
    - name: libjpeg-turbo
    - name: libpng
    - name: libwebp
    - name: lerc
    - name: zstd
    - name: xz
    - name: freetype
    - name: libxml2
    # Parity with the CPU libcvc recipe. libcvc-cuda's runtime list was a copy of
    # libcvc's that drifted: these four were added there and never mirrored here.
    #
    # assimp is the ACTIVE breakage -- CVC_ENABLE_ASSIMP self-clears when assimp
    # is missing, but the publish lane's prefix comes from fetch-libcvc-deps,
    # which installs the closure of cvcpkg/recipes/libcvc (the CPU recipe), so
    # the GPU build DOES find assimp and links it. Undeclared here, the published
    # bundle then ships a libcvc.so with NEEDED libassimp.so.6 that no consumer
    # prefix satisfies: `cvcpkg install libcvc-cuda` produced a libcvc.so that
    # could not load at all (verified: exactly one unresolved library, assimp).
    #
    # fontconfig/expat/bzip2 are the ImageMagick/freetype delegate closure. They
    # currently resolve transitively, so nothing is broken today -- they are
    # declared for the same reason libcvc declares them: a transitive provider
    # dropping one turns into "looks like a broken test harness, not a missing
    # package". assimp has no such transitive provider, which is exactly why it
    # was the one that broke.
    - name: assimp
      platforms: [linux, windows]
    - name: fontconfig
      platforms: [linux]
    - name: expat
    - name: bzip2
    - name: yaml
    - name: levmar
    - name: libiimod
    - name: openblas
    - name: openssl
    - name: c-ares
    - name: re2
    - name: abseil
    - name: protobuf
    - name: grpc
    - name: pthreads4w
      platforms: [windows]
  host_tools:
    - cmake
    - ninja

build:
  # No macOS entry: Apple platforms have no CUDA runtime, so the GPU variant is
  # Linux + Windows only. The CPU `libcvc` package covers macOS.
  matrix:
    - platform: linux
      script: build.sh
      env:
        CVC_ENABLE_CUDA: "ON"
    - platform: windows
      script: build.ps1
      env:
        CVC_ENABLE_CUDA: "ON"

package:
  files:
    # NB: no bin/cvc* — the `cvc` CLI is a separate package (cvc-cli /
    # cvc-cli-cuda). This bundle is the pure SDK: libs, cmake config, headers.
    - lib/libcvc*
    - lib/cvc*
    # The XMLRPC module installs its STATIC archive as lib/libxmlrpc.a, which
    # matches neither lib/libcvc* nor lib/cvc*, so it must be listed explicitly
    # or downstream links to cvc::xmlrpc fail with a missing archive -- the same
    # reason the CPU libcvc recipe lists it. This bundle already shipped
    # include/xmlrpc/ headers while packing no library and exporting no target.
    - lib/libxmlrpc*
    # ...and the MSVC spelling (xmlrpc.lib), which matches none of the globs
    # above. libcvc-cuda builds windows, so this column needs it too.
    - lib/xmlrpc*
    - lib/cmake/cvc/
    - include/cvc/
    - include/xmlrpc/
  cmake_packages:
    - name: cvc
      targets:
        - cvc::cvc
        - cvc::xmlrpc

abi:
  cxx_std: 17
