schema_version: 1
recipe:
  # Renamed from the bare `pycvc-gl` (published through +cvc.6): the libcvc-deps
  # python matrix made every python package an explicit per-interpreter column
  # recipe (<name>-cp311/-cp312/-cp313), and the pycvc family follows.
  # pycvc-gl-cp311 SUPERSEDES the published bare `pycvc-gl`; it is a NEW
  # catalog name, so its revision restarts at 1.
  name: pycvc-gl-cp311
  upstream_version: "3.3.0"
  # Reset to 1 for the 3.3.0 upstream version: cvc_revision counts
  # revisions OF an upstream version, so a version bump restarts it.
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "pycvc-gl-cp311 — the pycvc.gl scriptable scene bindings (over cvcGL + VTK) for CPython 3.11 (cp311): a headless-scriptable VTK scene (Scene.add_geometry/add_volume/show/render_png) used by the grl-snam lab. Ships only the scene module and DEPENDS on the core `pycvc-cp311` package; the two install side by side."
  homepage: https://github.com/transfix/libcvc
  license: LGPL-2.1-only
  tags: [python, bindings, swig, vtk, scene, scientific, volumetric]

# pycvc-gl builds ONLY the scene module (CVC_BUILD_PYCVC_CORE=OFF,
# CVC_BUILD_PYCVC_GL=ON): it installs just the pycvc_gl package and depends
# on the matching `pycvc-cp31X` column for the core `import pycvc` module. So
# pycvc-cp311 and pycvc-gl-cp311 are installable together, side by side (no
# file overlap). Both pick up CUDA when their libcvc dependency resolves to
# libcvc-cuda (cvc::cvc carries CVC_USING_CUDA), so they work against either
# libcvc variant.

# Declares the `pycvc-gl-cp311` provider slot so the CUDA peer
# pycvc-gl-cp311-cuda (which also `provides: [pycvc-gl-cp311]`, and links the
# GPU cvcgl-cuda + libcvc-cuda) is a mutually-exclusive alternative and a
# hardware-aware resolver (cvcpkg Roadmap Phase 10) can tie-break CPU vs GPU
# for a dependency on the virtual name `pycvc-gl-cp311`. Selection is not
# implemented yet — see pycvc-gl-cp311-cuda.
provides: ["pycvc-gl-cp311"]

source:
  type: vendored
  path: ../../..

patches: []

# The interpreter column this recipe targets. The cvcpkg builder exports
# CVC_PYTHON_INTERPRETER / CVC_PYTHON_ABI from this block, and build.sh
# derives the python3.X paths from it — so the build scripts are identical
# across the cp311/cp312/cp313 columns.
python:
  interpreter: python311
  abi: cp311

depends:
  build:
    # libcvc (find_package(cvc CONFIG)); resolves to libcvc-cuda on a CUDA host.
    - name: libcvc
    # cvcGL is now the separate `cvcgl` package (find_package(cvcGL CONFIG) +
    # link cvc::cvcGL) instead of being compiled inline here.
    - name: cvcgl
    - name: python311
    - name: numpy-cp311
    - name: vtk
    # vtkPythonUtil.h + libvtkWrappingPythonCore for the vtkProp* bridge (F3):
    # a Python vtkActor crosses into the C++ scene as a real vtkProp*.
    - name: vtk-python-cp311
  runtime:
    # pycvc-cp311 supplies the core `import pycvc` module this scene module
    # bridges to (same interpreter column).
    - name: pycvc-cp311
    - name: libcvc
    # the installed cvcGL this module links against.
    - name: cvcgl
    - name: python311
    - name: numpy-cp311
    - name: vtk
    # vtkmodules import + the wrapping-core .so at load for the vtkProp* bridge.
    - name: vtk-python-cp311
  host_tools:
    - cmake
    - ninja
    - swig
    - python311

build:
  # cvcGL + VTK are available on linux + windows (no macOS VTK bundle yet).
  matrix:
    - platform: linux
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    # pycvc_gl is a PACKAGE (#155): the SWIG proxy is __init__.py, the
    # extension module _pycvc_gl*.so lives INSIDE it, and the pure-Python scene
    # helpers ship as submodules (camera/vehicle/lab/scenes). Ship the whole
    # package dir, pinned to THIS column's interpreter (each cp31X column ships
    # only its own site-packages — no cross-interpreter globs). The core
    # _pycvc/pycvc.py still come from the pycvc-cp311 package, so the two
    # install side by side with no file overlap.
    - lib/python3.11/site-packages/pycvc_gl/

abi:
  cxx_std: 17
