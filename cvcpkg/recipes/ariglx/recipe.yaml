schema_version: 1
recipe:
  name: ariglx
  upstream_version: "3.7.13"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "ariglx — arigl with an embedded Python (CPython 3.12, with pycvc, pycvc_gl and numpy): the scripting host for Ariadne (.ari) documents with a 3D scene. A document's python: block runs at load and the functions it exports are the document's to call; `ariglx run app.py` runs a Python program in place of the document, its pycvc.ari.Host() adopting this window (snapshot renders it offscreen); `ariglx python` is the embedded interpreter as a plain python3, e.g. `ariglx python -m grl_snam.ariadne live`. A document's wasm: block runs WebAssembly guests on wasmtime: its exports are the document's functions, and its hooks take the document's events. Every arigl command and flag works the same, plus --python-path DIR."
  homepage: https://github.com/transfix/libcvc
  license: LGPL-2.1-only
  tags: [ui, graphics, gl, vtk, imgui, cli, tools, python, scripting]

# `ariglx` is arigl built with src/ariadne_python's engine (docs/roadmap/ARIADNE_SCRIPTING_HOSTS.md),
# its OWN package so that arigl stays Python-free: it builds src/arigl standalone with
# -DARIGL_WITH_PYTHON=ON against the installed libcvc and cvcGL SDKs, the VTK modules arigl draws
# its window with, and this prefix's python312, and installs just bin/ariglx. arigl's own recipe is
# unchanged.
#
# At run time it finds its Python beside it: <prefix>/lib/python3.12 (the python312 runtime dep),
# with pycvc, pycvc_gl and numpy in its site-packages. pycvc_gl's _pycvc_gl binds to the same
# libcvcGL.so as ariglx, so a program's Host() drives this window's own scene and ImGui context.
#
# Its wasm: blocks run on wasmtime's C API (src/ariadne_wasm), linked shared from the wasmtime
# runtime dep, as arix's are; build.sh configures with -DARIGL_WITH_WASM=ON, so a build that can't
# find wasmtime fails.
#
# Built against the libcvc of its own tree, so publish it with that libcvc, cvcgl, pycvc-cp312 and
# pycvc-gl-cp312, as arigl is.
#
# Platforms: linux, where pycvc-gl-cp312 is published. Windows joins when pycvc-gl-cp312 is there
# (with python312.dll placed where bin/ariglx.exe finds it: see arix's recipe); macOS when VTK and
# cvcgl have macOS bundles.

source:
  # Co-located with the libcvc source tree; build.sh points cmake at src/arigl.
  # `path` is counted from cvcpkg/recipes/_vendored/, where `cvcpkg build`
  # looks first, so `../../..` is the libcvc repo root (CVC_SOURCE_DIR).
  type: vendored
  path: ../../..

patches: []

depends:
  build:
    - name: libcvc
    - name: cvcgl
    # ariglx itself links VTK's RenderingUI and IOImage modules (its window and --png), beyond
    # what cvcGL links.
    - name: vtk
    # cvcGL's export links imgui and SDL3::SDL3 (cvcgl's runtime deps).
    - name: imgui-w32
    - name: sdl3
    # libpython3.12 and its headers, the interpreter ariglx embeds.
    - name: python312
    # wasmtime's C API, which runs a document's wasm: guests.
    - name: wasmtime
  runtime:
    - name: libcvc
    - name: cvcgl
    - name: vtk
    - name: imgui-w32
    - name: sdl3
    - name: python312
    - name: wasmtime
    - name: pycvc-cp312
    - name: pycvc-gl-cp312
    - name: numpy-cp312
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh

package:
  # Just the `ariglx` executable (bin/ariglx). No cmake package config: ariglx is an application.
  files:
    - bin/ariglx

abi:
  cxx_std: 20
