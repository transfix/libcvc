schema_version: 1
recipe:
  name: cvcgl-cuda
  upstream_version: "3.7.13"
  # Reset to 1 for the 3.3.0 upstream version: cvc_revision counts
  # revisions OF an upstream version, so a version bump restarts it.
  # Bumped 1 -> 3 (2 is #522's): ships share/cvcGL/ (the wasm state shim), as cvcgl 3.4.0+cvc.18.
  # Bumped 3 -> 4 (3 is master's wasm app contract above, and the 2 set aside for this change
  # sits below it; none published yet): carries cvcGL's fast-draw low-memory mapper and the
  # BSD-3-Clause license metadata for its VTK 9.5.0-derived code (same as cvcgl 3.4.0+cvc.19).
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "cvcGL (CUDA/GPU build) — the Qt-free VTK scene-graph library built against the CUDA libcvc-cuda SDK, so its GPU-only code paths (GL <-> CUDA interop: mapping a volume's CUDA unified/device buffer into a GL 3D texture for on-device volume rendering) compile in. Same cmake package (cvc::cvcGL) and same API as the CPU `cvcgl` package."
  homepage: https://github.com/transfix/libcvc
  # BSD-3-Clause: libcvcGL carries code derived from VTK 9.5.0
  # (LowMemoryPolyDataMapper.cpp); THIRD_PARTY_NOTICES.md ships in share/doc/cvcGL.
  license: "LGPL-2.1-only AND BSD-3-Clause"
  tags: [scientific, volumetric, scene, vtk, graphics, cuda, gpu]

# The GPU build of cvcGL — identical sources to the CPU `cvcgl` recipe, built
# against libcvc-cuda instead of the CPU libcvc.
#
# WHY a peer: cvcGL's own GL <-> CUDA interop (mapping a volume's CUDA unified
# buffer into a GL 3D texture via cudaGraphicsGLRegisterImage / cudaMemcpy3D for
# on-device volume rendering) is `#ifdef CVC_USING_CUDA`-gated, so it only
# compiles when cvcGL is built against libcvc-cuda (whose cvc::cvc carries
# CVC_USING_CUDA). That makes cvcGL's compiled output variant-dependent → its own
# bundle key, exactly like libcvc / pycvc.
#
# STATUS: that interop code has not landed. src/cvcGL has no CVC_USING_CUDA code,
# so this bundle would be `cvcgl` rebuilt against libcvc-cuda. Nothing builds or
# publishes it today, and cvcpkg.org lists no cvcgl-cuda: publish-cvcpkg.yml's
# CUDA lane installs the published `cvcgl`, and pycvc-gl-cp311-cuda links that
# single cvcgl (#174). The variant-invariant cvc::volume ABI makes that safe
# (voxels::_cuda_unified_ptr is always a shared_ptr<void>; see voxels.h). The
# recipe is kept so the peer is ready when the interop lands, and its depends:
# stays cvcgl's (below) so a build of it is cvcgl's build.
#
# Selection mirrors libcvc/libcvc-cuda: provides the `cvcgl` slot (mutually
# exclusive with the CPU cvcgl) and requires the `cuda` capability. Hardware-
# aware auto-selection is cvcpkg Roadmap Phase 10 (not implemented); until then
# install cvcgl-cuda explicitly on GPU hosts. No macOS (CUDA is linux+windows).
provides: ["cvcgl"]
requires_capabilities: ["cuda"]

source:
  # Co-located with the libcvc source tree; build.sh points cmake at src/cvcGL.
  # `path` is counted from cvcpkg/recipes/_vendored/, where `cvcpkg build`
  # looks first, so `../../..` is the libcvc repo root (CVC_SOURCE_DIR).
  # `cvcpkg recipe push` does not bundle it: counted from cvcpkg/, its
  # fallback base, the same path points outside the repo.
  type: vendored
  path: ../../..

patches: []

# cvcgl's dependencies, with libcvc swapped for libcvc-cuda. The sources and the
# CMake are cvcgl's, so the GPU build finds and links what the CPU build does.
# .github/scripts/recipe-deps-parity.py (ci.yml, recipe-version job) fails when
# the two lists differ.
#
# imgui-w32, sdl3 and ffmpeg-lgpl were missing: cvcgl gained them one at a time
# and this list never followed. src/cvcGL and src/cvcMedia look for all three
# QUIET, so a build with only this list in its deps prefix silently dropped the
# ImGui overlay, the SDL3 input seam and the FFmpeg player. CVC_ENABLE_IMGUI and
# CVC_ENABLE_SDL are PUBLIC defines, so its consumers would compile a different
# cvcGL API than cvcgl's. A prefix that held them anyway (FFmpeg is found through
# pkg-config, so even a host FFmpeg) gave a libcvcGL that links libraries its
# bundle does not declare, which a flat `cvcpkg install` prefix does not have.
depends:
  build:
    # The GPU libcvc SDK (find_package(cvc CONFIG) resolves libcvc-cuda, whose
    # cvc::cvc interface carries CVC_USING_CUDA) + VTK (the scene backend).
    - name: libcvc-cuda
    - name: vtk
    # Dear ImGui, cvcGL's overlay (cvc::gl::ImGuiOverlay), as in cvcgl.
    - name: imgui-w32
    # SDL3, the input + peripheral seam, as in cvcgl.
    - name: sdl3
    # FFmpeg's LGPL build, cvcMedia's decoders (linked shared), as in cvcgl. No
    # wasm build exists or is wanted.
    - name: ffmpeg-lgpl
      platforms: [linux, macos, windows]
  runtime:
    - name: libcvc-cuda
    - name: vtk
    # cvcGL's export links imgui-w32 and SDL3 (cvcGLConfig.cmake re-finds them),
    # so a consumer of cvc::cvcGL needs both in its prefix.
    - name: imgui-w32
    - name: sdl3
    # cvcMedia's FFmpeg libraries (private, shared): loaded at run time.
    - name: ffmpeg-lgpl
      platforms: [linux, macos, windows]
  host_tools:
    - cmake
    - ninja

build:
  # linux + windows only (CUDA has no macOS), mirroring libcvc-cuda.
  matrix:
    - platform: linux
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    # Same layout as the CPU `cvcgl` package (they share the `cvcgl` slot and are
    # never installed together).
    - lib/libcvcGL*
    - lib/cmake/cvcGL/
    - include/cvc/gl/
    - share/cvcGL/
  cmake_packages:
    - name: cvcGL
      targets:
        - cvc::cvcGL

abi:
  cxx_std: 17
