# cvc-requirements.yaml — component set for libcvc.
#
# Usage (local):
#   cvcpkg install --from cvc-requirements.yaml --prefix ./deps
#
# This file declares the components needed to build libcvc.
# The cvcpkg-install action in CI uses this file automatically.
#
# See https://github.com/transfix/libcvc-deps/blob/master/docs/roadmap/split-distribution.md

platform: auto
arch: auto
config: release
link: shared

components:
  - zlib
  - yaml
  - gsl
  - log4cplus
  - tiff
  - fftw3
  - openblas
  - levmar
  - hdf5
  - imagemagick
  - libiimod
  - openssl
  - c-ares
  - re2
  - abseil
  - protobuf
  - grpc
  - boost
  - cgal
  - qt6
  - vtk
  - pthreads4w
