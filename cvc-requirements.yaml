# cvc-requirements.yaml — component set for libcvc.
#
# Usage:
#   cvcpkg install --from cvc-requirements.yaml --prefix ./deps
#   cmake -B build -DCMAKE_PREFIX_PATH=./deps
#
# For a debug build:
#   cvcpkg install --from cvc-requirements.yaml --config debug
#
# See https://github.com/transfix/libcvc-deps/blob/master/docs/roadmap/split-distribution.md
platform: auto
arch: auto
config: release
link: shared

components:
  - zlib
  - boost
  - fftw3
  - gsl
  - cgal
  - gmp
  - mpfr
  - hdf5
  - log4cplus
  - tiff
  # ImageMagick delegate libraries. The imagemagick recipe under-declares its
  # dependencies (only zlib+tiff), so cvcpkg does not pull these into the
  # prefix — which leaves the dependency closure incomplete and breaks loading
  # on platforms without a matching system library (e.g. macOS fails to find
  # @rpath/libjpeg.62.dylib). List them explicitly so the prefix is
  # self-contained across platforms and does not fall back to system libs.
  - libjpeg-turbo
  - libpng
  - libwebp
  - freetype
  - imagemagick
  - yaml
  - levmar
  - libiimod
  - openblas
  - openssl
  - c-ares
  - re2
  - abseil
  - protobuf
  - grpc
  - pthreads4w
