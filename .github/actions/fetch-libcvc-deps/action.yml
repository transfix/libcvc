name: 'Fetch libcvc-deps'
description: |
  Installs libcvc-deps component bundles into a CMake-ready prefix.

  This action uses `cvcpkg install-deps` (via the `cvcpkg-install` action from
  transfix/libcvc-deps) to install the dependency closure declared by libcvc's
  in-tree recipe (`cvcpkg/recipes/libcvc`) — the single source of truth for
  libcvc's deps. There is no separate `cvc-requirements.yaml`.

  The output interface (`path`) is unchanged — callers that gate steps
  on `steps.<id>.outputs.path != ''` and add the path to
  CMAKE_PREFIX_PATH continue to work without modification.

  Falls back gracefully: if the catalog is unavailable (e.g. no
  release has published component bundles yet), `path` is set to
  empty so the calling workflow can fall back to building from
  source or apt/brew.

inputs:
  os:
    description: 'linux | macos | windows. Defaults to runner.os (unused by cvcpkg-install, kept for interface compat).'
    required: false
    default: ''
  arch:
    description: 'CPU arch (x86_64, arm64). Defaults to runner host arch (unused by cvcpkg-install, kept for interface compat).'
    required: false
    default: ''
  build_type:
    description: 'Debug or Release. Used to pick the matching archive flavor.'
    required: true
  link:
    description: 'shared or static. Picks the matching archive flavor.'
    required: false
    default: 'shared'
  prefix:
    description: 'Directory under which to install the bundles.'
    required: false
    default: ''

outputs:
  path:
    description: 'Absolute path to the installed libcvc-deps prefix, or empty string if no matching bundles were available.'
    value: ${{ steps.cvcpkg.outputs.path }}

runs:
  using: 'composite'
  steps:
    # PINNED, deliberately. This is the one `uses:` in this repo that points
    # at another repository, and it used to track @master — so every commit
    # to libcvc-deps was live in libcvc CI the moment it merged, with no
    # review and no way to reproduce a green run later.
    #
    # That is not hypothetical. On 2026-08-05 libcvc-deps merged an in-tree
    # PEP 517 backend (its PR #448, on master at 06:16:53Z). The action's
    # sparse checkout did not include the `pep517-backend/` directory the new
    # `backend-path` names, so `pip install ./_libcvc-deps` failed before any
    # C++ compiled:
    #
    #     BackendUnavailable: Cannot find module 'cvcpkg_build_backend'
    #       in ['.../_libcvc-deps/pep517-backend']
    #
    # Every package-linux / package-macos / package-windows job on every open
    # libcvc PR failed for the next 37 minutes, until libcvc-deps #462 added
    # the directory to the sparse checkout at 06:53:34Z. Nothing in libcvc
    # changed; nothing in libcvc could have prevented it.
    #
    # A full-length commit SHA is what GitHub recommends for third-party
    # actions, and it is what makes a libcvc CI run reproducible: re-running
    # an old commit resolves the same action it originally used.
    #
    # To bump: pick a libcvc-deps commit, put its full SHA here, and note what
    # it buys in the commit message. Tags are not usable for this yet — the
    # newest libcvc-deps tag (cvcpkg-v2.0.0) predates the fix above. Prefer a
    # tag once the tag series catches up with master.
    - name: Install libcvc-deps via cvcpkg
      id: cvcpkg
      # libcvc-deps master @ 2026-08-05T07:15:32Z
      # "fix(recipes): co-locate the PyInstaller patch with its recipe (#461)"
      # Includes #462, the sparse-checkout fix for pep517-backend.
      uses: transfix/libcvc-deps/.github/actions/cvcpkg-install@c5091347c596fcf09c697bc74c585370fce08ad9
      with:
        # "Just recipes": install libcvc's dependency closure straight from its
        # in-tree recipe (single source of truth), instead of a parallel
        # cvc-requirements.yaml. cvcpkg install-deps reads the recipe's
        # build+runtime deps (host_tools excluded — CI provides cmake/ninja).
        recipe: cvcpkg/recipes/libcvc
        build_type: ${{ inputs.build_type }}
        link: ${{ inputs.link }}
        prefix: ${{ inputs.prefix }}
