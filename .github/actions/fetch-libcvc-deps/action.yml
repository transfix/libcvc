name: 'Fetch libcvc-deps'
description: |
  Installs libcvc-deps component bundles into a CMake-ready prefix.

  This action now uses `cvcpkg-install` from transfix/libcvc-deps to
  download only the components listed in `cvc-requirements.yaml`,
  rather than a monolithic ~2 GB archive.

  The output interface (`path`) is unchanged — callers that gate steps
  on `steps.<id>.outputs.path != ''` and add the path to
  CMAKE_PREFIX_PATH continue to work without modification.

  Falls back gracefully: if the catalog is unavailable (e.g. no
  release has published component bundles yet), `path` is set to
  empty so the calling workflow can fall back to building from
  source or apt/brew.

inputs:
  os:
    description: 'linux | macos | windows. Defaults to runner.os (unused by cvcpkg-install, kept for interface compat).'
    required: false
    default: ''
  arch:
    description: 'CPU arch (x86_64, arm64). Defaults to runner host arch (unused by cvcpkg-install, kept for interface compat).'
    required: false
    default: ''
  build_type:
    description: 'Debug or Release. Used to pick the matching archive flavor.'
    required: true
  link:
    description: 'shared or static. Picks the matching archive flavor.'
    required: false
    default: 'shared'
  prefix:
    description: 'Directory under which to install the bundles.'
    required: false
    default: ''

outputs:
  path:
    description: 'Absolute path to the installed libcvc-deps prefix, or empty string if no matching bundles were available.'
    value: ${{ steps.cvcpkg.outputs.path }}

runs:
  using: 'composite'
  steps:
    - name: Install libcvc-deps via cvcpkg
      id: cvcpkg
      uses: transfix/libcvc-deps/.github/actions/cvcpkg-install@master
      with:
        requirements: cvc-requirements.yaml
        build_type: ${{ inputs.build_type }}
        link: ${{ inputs.link }}
        prefix: ${{ inputs.prefix }}

    # cvcpkg builds each dependency in an ephemeral temp prefix and bakes that
    # absolute path into every dylib's install name (LC_ID_DYLIB) and into its
    # cross-dependency load commands. Once the temp dir is gone, anything that
    # links these dylibs fails to load them — e.g. gtest_discover_tests runs a
    # freshly built test exe at build time and aborts with
    #   dyld: Library not loaded: /.../T/cvcpkg-gmp-*/install/lib/libgmpxx.4.dylib
    # which fails the whole macOS build. Rewrite each install name to the
    # dylib's real, stable location in the fetched prefix (and repoint stale
    # cross-references there) so every binary that subsequently links them
    # records a path that still exists. install_name_tool invalidates the
    # code signature on arm64, so re-sign ad-hoc afterwards.
    - name: Canonicalize macOS dep dylib install names
      if: runner.os == 'macOS' && steps.cvcpkg.outputs.path != ''
      shell: bash
      run: |
        set -euo pipefail
        libdir="${{ steps.cvcpkg.outputs.path }}/lib"
        if [ ! -d "$libdir" ]; then
          echo "no lib dir at $libdir; nothing to canonicalize"
          exit 0
        fi
        # Resolve to an absolute, symlink-free directory so recorded paths are stable.
        libdir="$(cd "$libdir" && pwd -P)"
        fixed=0
        while IFS= read -r lib; do
          leaf="$(basename "$lib")"
          # 1) Point this dylib's own id at its real absolute location.
          install_name_tool -id "$libdir/$leaf" "$lib" 2>/dev/null || true
          # 2) Repoint every load command that resolves to a library we ship in
          #    this prefix to that library's real absolute location — regardless
          #    of whether it currently reads as an ephemeral cvcpkg temp path,
          #    @rpath/…, or @loader_path/… . This makes the dependency graph
          #    fully self-resolving without relying on any consumer's RPATH.
          #    System libraries (/usr/lib, /System) are left untouched.
          while IFS= read -r dep; do
            case "$dep" in
              /usr/lib/* | /System/*) continue ;;
            esac
            dleaf="$(basename "$dep")"
            if [ "$dep" != "$libdir/$dleaf" ] && [ -e "$libdir/$dleaf" ]; then
              install_name_tool -change "$dep" "$libdir/$dleaf" "$lib" 2>/dev/null || true
            fi
          done < <(otool -L "$lib" | awk 'NR>1{print $1}')
          # 3) Re-sign ad-hoc; install_name_tool voids the signature on arm64.
          codesign --force --sign - "$lib" 2>/dev/null || true
          fixed=$((fixed + 1))
        done < <(find "$libdir" -maxdepth 1 -type f -name '*.dylib')
        echo "Canonicalized install names for $fixed dylib(s) under $libdir"
        # Warn if any shipped dylib still resolves a dependency via @rpath/
        # @loader_path whose target we actually ship here (would need consumer
        # RPATH to load). Not fatal — the build also sets CMAKE_BUILD_RPATH.
        while IFS= read -r lib; do
          otool -L "$lib" | awk 'NR>1{print $1}' | while IFS= read -r dep; do
            case "$dep" in
              @rpath/* | @loader_path/*)
                dleaf="$(basename "$dep")"
                [ -e "$libdir/$dleaf" ] && echo "::warning::$(basename "$lib") still uses $dep"
                ;;
            esac
          done
        done < <(find "$libdir" -maxdepth 1 -type f -name '*.dylib') || true
