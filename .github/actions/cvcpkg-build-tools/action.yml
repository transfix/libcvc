name: 'cvcpkg build tools'
description: |
  Installs build tools (cmake, ninja, pkg-config by default) from cvcpkg and
  puts them first on PATH for the rest of the job. libcvc builds with cvcpkg's
  tools, not the runner image's, apt's or Homebrew's.

  Needs the cvcpkg CLI. A job that already ran fetch-cvcpkg has it; in any
  other job this action installs the packaged cvcpkg the same way, through
  ../cvcpkg-cli (cvcpkg.org's installer, pinned there).

  The tools run from $RUNNER_TEMP/cvcpkg-tools, a tree that holds nothing but
  them: CMake searches its own install prefix for packages, so cmake must not
  sit beside the libraries cvcpkg installed with it. See install.sh for the
  layout and the per-platform details.

inputs:
  tools:
    description: >
      Space-separated cvcpkg components to install. Each must provide an
      executable of the same name; cmake also brings ctest and cpack.
    required: false
    default: 'cmake ninja pkg-config'

runs:
  using: 'composite'
  steps:
    - name: Check for the cvcpkg CLI
      id: probe
      shell: bash
      run: |
        if command -v cvcpkg >/dev/null 2>&1; then
          echo "have=true" >> "$GITHUB_OUTPUT"
        else
          echo "have=false" >> "$GITHUB_OUTPUT"
        fi

    # install.sh runs a Python helper on Windows (pe_imports), and jobs that
    # reach here without fetch-cvcpkg used to get Python 3.12 from this
    # step, so it stays even though the frozen cvcpkg needs no Python.
    - name: Set up Python
      if: steps.probe.outputs.have != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install the cvcpkg CLI
      if: steps.probe.outputs.have != 'true'
      uses: ./.github/actions/cvcpkg-cli

    - name: Install build tools from cvcpkg
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: bash "${{ github.action_path }}/install.sh"

    # A separate step because GITHUB_PATH only takes effect for later steps.
    - name: Check the tools resolve to cvcpkg's
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        set -euo pipefail
        want="$CVCPKG_TOOLS_PATH"
        if command -v cygpath >/dev/null 2>&1; then want=$(cygpath -u "$want"); fi
        for t in $TOOLS; do
          got=$(command -v "$t" || true)
          case "$got" in
            "$want"/*) echo "$t -> $got: $("$t" --version | head -n 1)" ;;
            *) echo "::error::$t resolves to '${got:-nothing}', not cvcpkg's ($want)"; exit 1 ;;
          esac
        done
