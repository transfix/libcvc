name: 'cvcpkg CLI'
description: |
  Installs the released, packaged cvcpkg CLI and puts it on PATH for the rest
  of the job. It uses the one-line installers cvcpkg.org serves (install.sh,
  install.ps1; cy-pca/cvcpkg docs/pypi-install.md), the way a developer
  installs it, not a pip install of a git checkout.

  The installer takes the registry's cvcpkg package for this platform and
  checks its sha256. The registry has 2.5.12 for every platform these jobs
  run on: linux (x86_64, arm64), macOS (arm64, x86_64), windows and freebsd
  x86_64. Only a version the registry lacks falls back to the
  checksum-verified standalone binary on the cvcpkg-v<version> GitHub
  release. Until 2026-11-09 macOS and linux/arm64 had only 2.5.1, so their
  jobs took that fallback. The binary is self-contained: PyInstaller freezes
  CPython 3.12, cvcpkg and its remote/builder/signing/validate extras, so it
  needs no Python.

  cvcpkg.org and GitHub Releases have both answered 502/504 for minutes at a
  time (transfix/libcvc#1054 and #1090 lost macOS jobs to GitHub's). install.sh
  retries each download three times, 2 s apart (cy-pca/cvcpkg#584), and
  install.ps1 does not retry, so neither rides out an outage that long. This
  action therefore re-runs the whole installer up to five times, waiting 20,
  40, 60 and 90 s between attempts (3.5 minutes in all).

  The pin keeps every job on the same cvcpkg. Bump `version` here to take a
  new release.
inputs:
  version:
    description: 'cvcpkg release to install (a cvcpkg-v<version> release).'
    required: false
    default: '2.5.12'
runs:
  using: 'composite'
  steps:
    - name: Install cvcpkg (POSIX)
      if: runner.os != 'Windows'
      shell: bash
      env:
        CVCPKG_VERSION: ${{ inputs.version }}
        CVCPKG_INSTALL_DIR: ${{ runner.temp }}/cvcpkg-bin
      run: |
        set -euo pipefail
        # The script goes to a file first, so a failed download is a failed
        # attempt rather than an empty script piped to sh. Re-running it is
        # safe: it downloads into its own temp dir and replaces the binary.
        script="$RUNNER_TEMP/cvcpkg-install.sh"
        attempt=1
        for delay in 20 40 60 90 done; do
          if curl -fsSL -o "$script" https://cvcpkg.org/install.sh && sh "$script"; then
            break
          fi
          if [ "$delay" = done ]; then
            echo "::error::the cvcpkg installer failed $attempt times"
            exit 1
          fi
          echo "::warning::the cvcpkg installer failed (attempt $attempt of 5); retrying in ${delay}s"
          sleep "$delay"
          attempt=$((attempt + 1))
        done
        echo "$CVCPKG_INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Install cvcpkg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CVCPKG_VERSION: ${{ inputs.version }}
        CVCPKG_INSTALL_DIR: ${{ runner.temp }}\cvcpkg-bin
      run: |
        $ErrorActionPreference = 'Stop'
        $script = Join-Path $env:RUNNER_TEMP 'cvcpkg-install.ps1'
        $delays = @(20, 40, 60, 90)
        for ($attempt = 1; ; $attempt++) {
          $ok = $false
          try {
            Invoke-WebRequest -Uri 'https://cvcpkg.org/install.ps1' -OutFile $script -UseBasicParsing
            # A child process, not `irm | iex`: install.ps1 ends a failure
            # with `exit 1`, which under iex would end this step, not just
            # this attempt.
            pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script
            $ok = ($LASTEXITCODE -eq 0)
          } catch {
            Write-Host "attempt ${attempt}: $_"
          }
          if ($ok) { break }
          if ($attempt -gt $delays.Count) {
            Write-Host "::error::the cvcpkg installer failed $attempt times"
            exit 1
          }
          $delay = $delays[$attempt - 1]
          Write-Host "::warning::the cvcpkg installer failed (attempt $attempt of $($delays.Count + 1)); retrying in ${delay}s"
          Start-Sleep -Seconds $delay
        }
        # install.ps1 adds the dir to the USER Path, which later steps do not
        # read; GITHUB_PATH does.
        Add-Content -Path $env:GITHUB_PATH -Value $env:CVCPKG_INSTALL_DIR

    # A separate step because GITHUB_PATH only takes effect for later steps.
    - name: Check the cvcpkg CLI
      shell: bash
      run: |
        set -euo pipefail
        command -v cvcpkg
        cvcpkg --version
