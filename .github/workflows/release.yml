name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Reusable: nightly.yml calls this workflow with rolling=true to ship
  # master-HEAD artifacts to the `nightly` rolling GitHub Release.
  workflow_call:
    inputs:
      rolling_tag:
        description: 'When set, recreate this tag/release with the freshly built artifacts (used by nightly.yml).'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark the GitHub Release as a pre-release.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# ───────────────────────────────────────────────────────────────────
# Release artifacts
#
# libcvc (developer SDK), shipped in both shared and static flavors:
#   - Linux:   libcvc-<ver>-linux-<arch>-<config>.tar.gz          (shared)
#              libcvc-<ver>-linux-<arch>-<config>-static.tar.gz   (static)
#   - macOS:   libcvc-<ver>-macos-<arch>-<config>.zip             (shared)
#              libcvc-<ver>-macos-<arch>-<config>-static.zip      (static)
#   - Windows: libcvc-<ver>-windows-<arch>-<config>.zip           (shared)
#              libcvc-<ver>-windows-<arch>-<config>-static.zip    (static)
#
# Shared and static archives are both fully self-contained: every
# project-level dependency (Boost, HDF5, FFTW, GSL on all platforms;
# plus ImageMagick + CGAL/GMP/MPFR on Windows via vcpkg) is bundled
# alongside libcvc, so consumers can `find_package(cvc CONFIG)` from
# the extracted archive without needing apt / Homebrew / vcpkg on the
# host. Shared archives ship .so/.dylib/.dll (with rpath fixups on
# Linux+macOS) plus their import .lib on Windows; static archives ship
# .a/.lib only. Both flavors include cvc::xmlrpc. System libraries
# (glibc, libstdc++, libm, Windows UCRT) are intentionally left to the
# host.
#
# volrover3 (end-user application, Release only):
#   - Linux:   volrover3-<ver>-linux-<arch>.tar.gz         (portable)
#              volrover3-<ver>-linux-<arch>.deb            (Debian/Ubuntu)
#              VolumeRover3-<ver>-<arch>.AppImage          (universal Linux)
#   - macOS:   VolumeRover3-<ver>-<arch>.dmg               (drag to /Applications)
#              VolumeRover3-<ver>-macos-<arch>.zip         (alt. archive)
#   - Windows: VolumeRover3-<ver>-windows-<arch>.zip       (portable)
#              VolumeRover3-<ver>-windows-<arch>-setup.exe (NSIS installer)
#
# Tag-driven release artifacts intentionally do not include the commit SHA
# in their filenames; CI build artifacts (ci.yml) do include the SHA so
# they can be uniquely identified per-PR.
# ───────────────────────────────────────────────────────────────────

jobs:
  # ──────────────────────────── Linux ────────────────────────────
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # libcvc developer SDK: every (build_type, link) combination
          - name: libcvc-debug-shared
            kind: libcvc
            build_type: Debug
            link: shared
          - name: libcvc-release-shared
            kind: libcvc
            build_type: Release
            link: shared
          - name: libcvc-debug-static
            kind: libcvc
            build_type: Debug
            link: static
          - name: libcvc-release-static
            kind: libcvc
            build_type: Release
            link: static
          # volrover3 end-user app (Release only, shared only)
          - name: volrover3
            kind: volrover3
            build_type: Release
            link: shared
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          if [ -n "${{ inputs.rolling_tag }}" ]; then
            VERSION="${VERSION}-${{ inputs.rolling_tag }}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          ARCH=$(uname -m)
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          # Static artifacts get a -static suffix; shared keeps the legacy
          # unsuffixed name for backward compatibility with consumers that
          # download by URL.
          if [ "${{ matrix.link }}" = "static" ]; then
            LINKSFX="-static"
          else
            LINKSFX=""
          fi
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH"        >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"
          echo "linksfx=$LINKSFX"  >> "$GITHUB_OUTPUT"

      - name: Install dependencies (libcvc)
        if: matrix.kind == 'libcvc'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libboost-all-dev libhdf5-dev libfftw3-dev libgsl-dev \
            libmagick++-dev

      # CUDA toolkit so the shipped artifacts can offload to NVIDIA GPUs
      # at runtime when an NVIDIA driver is present. cudart is linked
      # statically (CMAKE_CUDA_RUNTIME_LIBRARY=Static below) so users
      # only need the NVIDIA driver, not a CUDA install. CMake's
      # check_language(CUDA) auto-disables CUDA gracefully if this step
      # ever fails.
      - name: Install CUDA toolkit (Linux)
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.5.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cudart-dev"]'

      - name: Install dependencies (volrover3)
        if: matrix.kind == 'volrover3'
        run: |
          sudo apt-get update
          # Use Qt6 across the board; Ubuntu's libvtk9-qt-dev is
          # Qt5-only, so VTK is built from source against Qt6 in the
          # next step (cached).
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libboost-all-dev libhdf5-dev libfftw3-dev libgsl-dev \
            libmagick++-dev \
            qt6-base-dev qt6-base-dev-tools libqt6opengl6-dev \
            libgl1-mesa-dev libxt-dev mesa-common-dev libglew-dev \
            libxrender-dev libxcursor-dev libxinerama-dev libxi-dev \
            libcgal-dev \
            libfuse2 file desktop-file-utils

      # ── VTK 9.5 built against Qt6, cached ──
      # Cache key matches ci.yml so the build is shared across both
      # workflows and only happens once per (vtk_version, qt_major, os).
      - name: Cache VTK (Qt6) install tree
        if: matrix.kind == 'volrover3'
        id: vtk-cache
        uses: actions/cache@v4
        with:
          path: ~/vtk-qt6
          key: vtk-9.5.0-qt6-${{ runner.os }}-v2

      - name: Build VTK 9.5 from source (Qt6)
        if: matrix.kind == 'volrover3' && steps.vtk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L -o vtk.tar.gz https://github.com/Kitware/VTK/archive/refs/tags/v9.5.0.tar.gz
          tar xzf vtk.tar.gz
          cmake -S VTK-9.5.0 -B vtk-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$HOME/vtk-qt6 \
            -DBUILD_SHARED_LIBS=ON \
            -DVTK_GROUP_ENABLE_Qt=YES \
            -DVTK_QT_VERSION=6 \
            -DVTK_MODULE_ENABLE_VTK_GUISupportQtQuick=NO \
            -DVTK_MODULE_ENABLE_VTK_RenderingQtQuick=NO \
            -DVTK_BUILD_TESTING=OFF \
            -DVTK_BUILD_EXAMPLES=OFF \
            -DVTK_BUILD_DOCUMENTATION=OFF \
            -DVTK_LEGACY_REMOVE=ON
          cmake --build vtk-build --parallel --target install
          rm -rf vtk-build VTK-9.5.0 vtk.tar.gz

      - name: Configure
        run: |
          extra_prefix=""
          if [ "${{ matrix.kind }}" = "volrover3" ]; then
            extra_prefix="$HOME/vtk-qt6"
          fi
          # link=shared → BUILD_SHARED_LIBS=ON (legacy default).
          # link=static → BUILD_SHARED_LIBS=OFF plus static dep flags so
          # the .a flavor of Boost/HDF5/FFTW/GSL ships in libapt's dev
          # packages is preferred. PIC is always on so the static archive
          # remains relocatable into shared consumers.
          if [ "${{ matrix.link }}" = "static" ]; then
            shared_libs=OFF
            static_deps="-DBoost_USE_STATIC_LIBS=ON -DHDF5_USE_STATIC_LIBRARIES=ON"
          else
            shared_libs=ON
            static_deps=""
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="$extra_prefix" \
            -DBUILD_SHARED_LIBS=$shared_libs \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            $static_deps \
            -DCVC_BUILD_TESTS=OFF \
            -DCVC_USING_XMLRPC=${{ matrix.kind == 'libcvc' && 'ON' || 'OFF' }} \
            -DCVC_ENABLE_CUDA=ON \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static \
            -DDISABLE_CGAL=${{ matrix.kind == 'volrover3' && 'OFF' || 'ON' }} \
            -DCVC_BUILD_VOLROVER3=${{ matrix.kind == 'volrover3' && 'ON' || 'OFF' }} \
            -DCVC_ENABLE_MESHER=${{ matrix.kind == 'volrover3' && 'ON' || 'OFF' }} \
            -DCVC_ENABLE_SDF=${{ matrix.kind == 'volrover3' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --parallel

      # ── libcvc developer tarball (self-contained) ───────────────
      # Stage libcvc's install tree, then copy the libraries and
      # headers of every project-level dependency (Boost, HDF5, FFTW,
      # GSL) into the same tree so the archive is fully self-contained
      # — consumers should be able to find_package(cvc CONFIG) without
      # needing apt-installed dev packages on the host. System glibc /
      # libstdc++ / libm are intentionally left to the host.
      - name: Stage libcvc + bundle deps
        if: matrix.kind == 'libcvc'
        run: |
          set -euo pipefail
          STEM="libcvc-${{ steps.meta.outputs.version }}-linux-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}${{ steps.meta.outputs.linksfx }}"
          DIST="$PWD/$STEM"
          rm -rf "$DIST"
          cmake --install build --prefix "$DIST" --component libcvc
          mkdir -p "$DIST/lib" "$DIST/include"

          # Suffix pattern decides whether to grab dynamic or archive
          # flavours of each dep. Both flavours are present in apt's
          # libfoo-dev packages on Ubuntu.
          if [ "${{ matrix.link }}" = "static" ]; then
            patterns=( '*.a' )
          else
            patterns=( '*.so' '*.so.*' )
          fi

          LIBDIRS=( /usr/lib/x86_64-linux-gnu /usr/lib )
          copy_libs() {
            local prefix="$1"
            for d in "${LIBDIRS[@]}"; do
              for pat in "${patterns[@]}"; do
                # -P preserves symlinks (libfoo.so → libfoo.so.1 → libfoo.so.1.2)
                find "$d" -maxdepth 1 -name "${prefix}${pat}" -print0 2>/dev/null \
                  | xargs -0 -r cp -P -t "$DIST/lib/" 2>/dev/null || true
              done
            done
          }
          copy_libs 'libboost_'
          copy_libs 'libhdf5'
          copy_libs 'libfftw3'
          copy_libs 'libgsl'
          copy_libs 'libgslcblas'

          # Headers
          for src in /usr/include/boost /usr/include/gsl; do
            [ -d "$src" ] && cp -R "$src" "$DIST/include/"
          done
          # HDF5 headers live under /usr/include/hdf5/serial on Ubuntu.
          if [ -d /usr/include/hdf5/serial ]; then
            mkdir -p "$DIST/include/hdf5"
            cp -R /usr/include/hdf5/serial/. "$DIST/include/hdf5/"
          fi
          for f in /usr/include/fftw3.h /usr/include/fftw3.f /usr/include/fftw3l.h /usr/include/fftw3q.h; do
            [ -f "$f" ] && cp "$f" "$DIST/include/"
          done

          # For the shared flavour, rewrite libcvc.so's RUNPATH to
          # $ORIGIN so it loads bundled .so files when the archive is
          # extracted anywhere.
          if [ "${{ matrix.link }}" = "shared" ]; then
            sudo apt-get install -y --no-install-recommends patchelf
            for so in "$DIST"/lib/libcvc*.so*; do
              [ -e "$so" ] || continue
              [ -L "$so" ] && continue
              patchelf --set-rpath '$ORIGIN' "$so" || true
            done
          fi

          tar czf "$STEM.tar.gz" "$STEM"
          cp "$STEM.tar.gz" "$GITHUB_WORKSPACE/"
          du -sh "$DIST" "$STEM.tar.gz" || true

      # ── volrover3 portable tarball + .deb + AppImage ────────────
      - name: Pack volrover3 (tarball + .deb)
        if: matrix.kind == 'volrover3'
        working-directory: build
        run: |
          STEM="volrover3-${{ steps.meta.outputs.version }}-linux-${{ steps.meta.outputs.arch }}"
          # Override CPACK_COMPONENT_VOLROVER3_DEPENDS so cpack does not
          # try to package the libcvc component as well — with
          # CPACK_ARCHIVE_COMPONENT_INSTALL=ON / CPACK_DEB_COMPONENT_INSTALL=ON,
          # cpack iterates dependencies and aborts when no libcvc
          # install tree exists for this volrover3-only build.
          cpack -G TGZ -D CPACK_COMPONENTS_ALL=volrover3 \
                      -D CPACK_COMPONENT_VOLROVER3_DEPENDS= \
                      -D CPACK_PACKAGE_FILE_NAME="$STEM"
          mv "$STEM-volrover3.tar.gz" "$STEM.tar.gz"
          cp "$STEM.tar.gz" "$GITHUB_WORKSPACE/"
          cpack -G DEB -D CPACK_COMPONENTS_ALL=volrover3 \
                      -D CPACK_COMPONENT_VOLROVER3_DEPENDS= \
                      -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=OFF \
                      -D CPACK_PACKAGE_FILE_NAME="$STEM"
          # CPack DEB names follow Debian convention; rename whatever
          # .deb landed to match our naming scheme.
          for f in volrover3*.deb; do [ -f "$f" ] && cp "$f" "$GITHUB_WORKSPACE/$STEM.deb"; done

      - name: Build AppImage
        if: matrix.kind == 'volrover3'
        run: |
          set -euo pipefail
          STEM="VolumeRover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.arch }}"
          # Stage install tree
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr --component libcvc
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr --component volrover3
          # Fetch linuxdeploy + Qt plugin (pinned to known-good releases).
          curl -L -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          # linuxdeploy expects icon + .desktop at the AppDir root; mirror.
          cp AppDir/usr/share/applications/volrover3.desktop AppDir/
          cp AppDir/usr/share/icons/hicolor/256x256/apps/volrover_logo.png AppDir/volrover_logo.png
          export QML_SOURCES_PATHS=""
          export OUTPUT="${STEM}.AppImage"
          # linuxdeploy walks the volrover3 ELF NEEDED entries and
          # resolves them by name; libcvc.so.3 lives under
          # AppDir/usr/lib/x86_64-linux-gnu/ (Debian's GNUInstallDirs
          # default) which is not on the default search path. VTK 9.5
          # was built into $HOME/vtk-qt6/lib (cached, off-system).
          export LD_LIBRARY_PATH="$PWD/AppDir/usr/lib:$PWD/AppDir/usr/lib/x86_64-linux-gnu:$HOME/vtk-qt6/lib:${LD_LIBRARY_PATH:-}"
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
                        --desktop-file AppDir/volrover3.desktop \
                        --icon-file    AppDir/volrover_logo.png || \
          ./linuxdeploy --appdir AppDir --output appimage \
                        --desktop-file AppDir/volrover3.desktop \
                        --icon-file    AppDir/volrover_logo.png
          # linuxdeploy emits "VolumeRover3-x86_64.AppImage" by default if
          # Name= matches; rename to our STEM for consistency. Skip files
          # that are already named correctly (otherwise `mv` fails with
          # "are the same file" because OUTPUT was set to ${STEM}.AppImage).
          for f in *.AppImage; do
            case "$f" in
              linuxdeploy*) ;;
              "${STEM}.AppImage") ;;
              *) mv "$f" "${STEM}.AppImage" ;;
            esac
          done
          ls -la *.AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}
          path: |
            *.tar.gz
            *.deb
            *.AppImage
          if-no-files-found: error

  # ──────────────────────────── macOS ────────────────────────────
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libcvc-debug-shared
            kind: libcvc
            build_type: Debug
            link: shared
          - name: libcvc-release-shared
            kind: libcvc
            build_type: Release
            link: shared
          - name: libcvc-debug-static
            kind: libcvc
            build_type: Debug
            link: static
          - name: libcvc-release-static
            kind: libcvc
            build_type: Release
            link: static
          - name: volrover3
            kind: volrover3
            build_type: Release
            link: shared
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          if [ -n "${{ inputs.rolling_tag }}" ]; then
            VERSION="${VERSION}-${{ inputs.rolling_tag }}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          ARCH=$(uname -m)
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ matrix.link }}" = "static" ]; then
            LINKSFX="-static"
          else
            LINKSFX=""
          fi
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH"        >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"
          echo "linksfx=$LINKSFX"  >> "$GITHUB_OUTPUT"

      - name: Install dependencies (libcvc)
        if: matrix.kind == 'libcvc'
        run: |
          brew install cmake ninja boost hdf5 fftw gsl imagemagick
          echo "BOOST_ROOT=$(brew --prefix boost)" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$(brew --prefix boost):$(brew --prefix hdf5)" >> $GITHUB_ENV

      - name: Install dependencies (volrover3)
        if: matrix.kind == 'volrover3'
        run: |
          brew install cmake ninja boost hdf5 fftw gsl imagemagick qt@6 vtk cgal
          echo "BOOST_ROOT=$(brew --prefix boost)" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$(brew --prefix boost):$(brew --prefix qt@6):$(brew --prefix hdf5)" >> $GITHUB_ENV
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

      - name: Configure
        run: |
          if [ "${{ matrix.link }}" = "static" ]; then
            shared_libs=OFF
            # Homebrew's boost / hdf5 / fftw / gsl bottles ship both .a
            # and .dylib; CMake's standard flags select the .a flavor.
            static_deps="-DBoost_USE_STATIC_LIBS=ON -DHDF5_USE_STATIC_LIBRARIES=ON"
          else
            shared_libs=ON
            static_deps=""
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_SHARED_LIBS=$shared_libs \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            $static_deps \
            -DCVC_BUILD_TESTS=OFF \
            -DCVC_USING_XMLRPC=${{ matrix.kind == 'libcvc' && 'ON' || 'OFF' }} \
            -DCVC_ENABLE_CUDA=OFF \
            -DDISABLE_CGAL=${{ matrix.kind == 'volrover3' && 'OFF' || 'ON' }} \
            -DCVC_BUILD_VOLROVER3=${{ matrix.kind == 'volrover3' && 'ON' || 'OFF' }} \
            -DCVC_ENABLE_MESHER=${{ matrix.kind == 'volrover3' && 'ON' || 'OFF' }} \
            -DCVC_ENABLE_SDF=${{ matrix.kind == 'volrover3' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Stage libcvc + bundle deps
        if: matrix.kind == 'libcvc'
        run: |
          set -euo pipefail
          STEM="libcvc-${{ steps.meta.outputs.version }}-macos-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}${{ steps.meta.outputs.linksfx }}"
          DIST="$PWD/$STEM"
          rm -rf "$DIST"
          cmake --install build --prefix "$DIST" --component libcvc
          mkdir -p "$DIST/lib" "$DIST/include"

          # Headers are always needed for downstream `find_package`
          # consumers; copy them from Homebrew prefixes.
          for pkg in boost hdf5 fftw gsl; do
            P=$(brew --prefix "$pkg" 2>/dev/null || true)
            if [ -n "$P" ] && [ -d "$P/include" ]; then
              cp -R "$P/include/." "$DIST/include/" 2>/dev/null || true
            fi
          done

          if [ "${{ matrix.link }}" = "shared" ]; then
            # dylibbundler walks libcvc.dylib's transitive deps, copies
            # any missing dylibs alongside, and rewrites all install_names
            # to @rpath/<dylib> with rpath @loader_path. Far more reliable
            # than hand-rolled install_name_tool plumbing across the deep
            # Boost/HDF5 dependency graph.
            brew install dylibbundler
            for dy in "$DIST"/lib/libcvc*.dylib; do
              [ -e "$dy" ] || continue
              [ -L "$dy" ] && continue
              dylibbundler -od -b -x "$dy" -d "$DIST/lib" -p '@loader_path/' -of -cd || true
            done
          else
            # Static flavour: just copy the .a archives. No install_name
            # fixup needed — static linkage embeds object code directly.
            for pkg in boost hdf5 fftw gsl; do
              P=$(brew --prefix "$pkg" 2>/dev/null || true)
              if [ -n "$P" ] && [ -d "$P/lib" ]; then
                find "$P/lib" -maxdepth 1 -name '*.a' -print0 2>/dev/null \
                  | xargs -0 -I {} cp -RP {} "$DIST/lib/" 2>/dev/null || true
              fi
            done
          fi

          ditto -c -k --sequesterRsrc --keepParent "$DIST" "$STEM.zip"
          cp "$STEM.zip" "$GITHUB_WORKSPACE/"
          du -sh "$DIST" "$STEM.zip" || true

      - name: Pack volrover3 (.dmg + .zip)
        if: matrix.kind == 'volrover3'
        working-directory: build
        run: |
          set -euo pipefail
          STEM="VolumeRover3-${{ steps.meta.outputs.version }}-macos-${{ steps.meta.outputs.arch }}"
          # macdeployqt runs during `cmake --install volrover3`; CPack
          # will trigger that, leaving a self-contained VolumeRover3.app
          # inside the staged tree before generating .dmg.
          cpack -G DragNDrop -D CPACK_COMPONENTS_ALL=volrover3 \
                            -D CPACK_PACKAGE_FILE_NAME="$STEM"
          # Zip the deployed .app directly with ditto rather than running
          # cpack -G ZIP a second time — the second cpack pass triggers a
          # fresh install/macdeployqt cycle that hits a CPack component
          # dependency edge case (volrover3 → libcvc) and aborts during
          # compression.
          APP_DIR="_CPack_Packages/Darwin/DragNDrop/$STEM/ALL_IN_ONE"
          ditto -c -k --keepParent "$APP_DIR/VolumeRover3.app" "$STEM.zip"
          cp "$STEM.dmg" "$STEM.zip" "$GITHUB_WORKSPACE/"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}
          path: |
            *.zip
            *.dmg
          if-no-files-found: error

  # ──────────────────────────── Windows ────────────────────────────
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libcvc-debug-shared
            kind: libcvc
            build_type: Debug
            link: shared
          - name: libcvc-release-shared
            kind: libcvc
            build_type: Release
            link: shared
          - name: libcvc-debug-static
            kind: libcvc
            build_type: Debug
            link: static
          - name: libcvc-release-static
            kind: libcvc
            build_type: Release
            link: static
          - name: volrover3
            kind: volrover3
            build_type: Release
            link: shared
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          if [ -n "${{ inputs.rolling_tag }}" ]; then
            VERSION="${VERSION}-${{ inputs.rolling_tag }}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ matrix.link }}" = "static" ]; then
            LINKSFX="-static"
            TRIPLET="x64-windows-static"
          else
            LINKSFX=""
            TRIPLET="x64-windows"
          fi
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "arch=x86_64"       >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"
          echo "linksfx=$LINKSFX"  >> "$GITHUB_OUTPUT"
          echo "triplet=$TRIPLET"  >> "$GITHUB_OUTPUT"

      # Cache key intentionally excludes hashFiles(workflow) so editing
      # this file does not invalidate the warm vcpkg cache. The triplet
      # is part of the key so static (x64-windows-static) and shared
      # (x64-windows) builds do not share buildtrees.
      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_ROOT }}\installed
            ${{ env.VCPKG_INSTALLATION_ROOT }}\packages
            ~\AppData\Local\vcpkg\archives
          key: vcpkg-release-${{ matrix.kind }}-${{ matrix.build_type }}-${{ steps.meta.outputs.triplet }}-v6
          restore-keys: |
            vcpkg-release-${{ matrix.kind }}-${{ matrix.build_type }}-${{ steps.meta.outputs.triplet }}-

      # Install Qt6 from official prebuilt binaries via aqtinstall.
      # vcpkg's qt6-base port builds Qt from source (~30+ min cold) so
      # we route Qt around vcpkg entirely; VTK and CGAL still come from
      # vcpkg. install-qt-action prepends Qt's bin/ to PATH and exports
      # Qt6_DIR + QT_ROOT_DIR for CMake to find.
      - name: Install Qt6 (volrover3)
        if: matrix.kind == 'volrover3'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: 'windows'
          target: 'desktop'
          # Qt does not publish msvc2022_64 binaries for 6.7.x; the
          # msvc2019_64 build is ABI-compatible with the MSVC 2022
          # toolchain that windows-latest provides.
          arch: 'win64_msvc2019_64'
          modules: ''
          cache: true

      # windows-latest C: drive has only ~14 GB free; vcpkg + qt + vtk
      # buildtrees blow it up. Free up hosted-tool dirs we don't need
      # and route vcpkg's heavy working dirs to D: where there's ~80 GB.
      - name: 'Free disk space and route vcpkg to D: (Windows)'
        shell: pwsh
        run: |
          foreach ($dir in @(
              'C:\Android', 'C:\Program Files\dotnet',
              'C:\hostedtoolcache\windows\Ruby',
              'C:\hostedtoolcache\windows\PyPy',
              'C:\hostedtoolcache\windows\go',
              'C:\hostedtoolcache\windows\node')) {
            if (Test-Path $dir) {
              Write-Host "Removing $dir"
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $dir
            }
          }
          New-Item -ItemType Directory -Force -Path D:\vcpkg-buildtrees | Out-Null
          New-Item -ItemType Directory -Force -Path D:\vcpkg-packages   | Out-Null
          New-Item -ItemType Directory -Force -Path D:\vcpkg-downloads  | Out-Null
          "VCPKG_DOWNLOADS=D:\vcpkg-downloads"   | Out-File -Append $env:GITHUB_ENV
          "VCPKG_BUILDTREES=D:\vcpkg-buildtrees" | Out-File -Append $env:GITHUB_ENV
          "VCPKG_PACKAGES=D:\vcpkg-packages"     | Out-File -Append $env:GITHUB_ENV
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      # CUDA toolkit so the shipped Windows artifacts can offload to
      # NVIDIA GPUs at runtime when an NVIDIA driver is present. cudart
      # is linked statically (CMAKE_CUDA_RUNTIME_LIBRARY=Static below)
      # so users only need the NVIDIA driver, not a CUDA install.
      - name: Install CUDA toolkit (Windows)
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.5.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Install dependencies
        shell: pwsh
        env:
          # Pull our hand-rolled imagemagick overlay port (Q16-HDRI x64,
          # repackaged from the upstream Inno Setup installer; see
          # vcpkg-overlay/ports/imagemagick/portfile.cmake).
          VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\vcpkg-overlay\ports
        run: |
          $packages = @(
            'boost-thread','boost-date-time','boost-regex','boost-filesystem',
            'boost-system','boost-chrono','boost-program-options','boost-signals2',
            'boost-format','boost-property-tree','boost-algorithm','boost-asio',
            'boost-any','boost-array','boost-dynamic-bitset','boost-exception',
            'boost-foreach','boost-function','boost-lambda','boost-lexical-cast',
            'boost-multi-array','boost-optional','boost-smart-ptr','boost-tuple',
            'boost-utility','hdf5[cpp]','fftw3','gsl','imagemagick'
          )
          if ('${{ matrix.kind }}' -eq 'volrover3') {
            # qt6-base intentionally omitted — handled by install-qt-action above.
            # vtk[qt,opengl] also omitted: the qt feature pulled qt6-base/
            # qt5compat/qttools/qtdeclarative as transitive build deps,
            # rebuilding all of Qt6 from source on every cold-cache run.
            # We build VTK 9.5 from source against aqtinstall's prebuilt
            # Qt6 in a separate cached step below (mirrors Ubuntu).
            $packages += @('cgal')
          }
          for ($i = 1; $i -le 5; $i++) {
            Write-Host "vcpkg install attempt $i / 5"
            # --clean-after-build deletes each port's buildtree/packages
            # immediately after installation. --x-buildtrees-root /
            # --x-packages-root keep the heavy working dirs on D:.
            vcpkg install @packages --triplet ${{ steps.meta.outputs.triplet }} `
              --clean-after-build `
              --x-buildtrees-root=D:\vcpkg-buildtrees `
              --x-packages-root=D:\vcpkg-packages
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 5) { exit $LASTEXITCODE }
            $sleep = [Math]::Min(60 * $i, 180)
            Write-Host "Retrying after transient failure (sleeping $sleep s)..."
            Start-Sleep -Seconds $sleep
          }

      # ── VTK 9.5 built from source against aqt Qt6, cached ──
      # Mirrors the Ubuntu strategy. Cache key includes build_type
      # because MSVC Debug and Release VTK DLLs are not interchangeable.
      - name: Restore VTK (Qt6) cache (Windows)
        if: matrix.kind == 'volrover3'
        id: vtk-cache-windows
        uses: actions/cache/restore@v4
        with:
          path: D:\vtk-qt6
          key: vtk-9.5.0-qt6-${{ runner.os }}-${{ matrix.build_type }}-v1

      - name: Build VTK 9.5 from source against Qt6 (Windows)
        if: matrix.kind == 'volrover3' && steps.vtk-cache-windows.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Kitware/VTK/archive/refs/tags/v9.5.0.tar.gz -OutFile vtk.tar.gz
          tar xzf vtk.tar.gz
          cmake -S VTK-9.5.0 -B D:\vtk-build `
            -DCMAKE_INSTALL_PREFIX=D:\vtk-qt6 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DBUILD_SHARED_LIBS=ON `
            -DVTK_GROUP_ENABLE_Qt=YES `
            -DVTK_QT_VERSION=6 `
            -DVTK_MODULE_ENABLE_VTK_GUISupportQtQuick=NO `
            -DVTK_MODULE_ENABLE_VTK_RenderingQtQuick=NO `
            -DVTK_BUILD_TESTING=OFF `
            -DVTK_BUILD_EXAMPLES=OFF `
            -DVTK_BUILD_DOCUMENTATION=OFF `
            -DVTK_LEGACY_REMOVE=ON
          cmake --build D:\vtk-build --config ${{ matrix.build_type }} --parallel --target install
          Remove-Item -Recurse -Force D:\vtk-build
          Remove-Item -Recurse -Force VTK-9.5.0
          Remove-Item -Force vtk.tar.gz

      - name: Save VTK (Qt6) cache (Windows)
        if: matrix.kind == 'volrover3' && steps.vtk-cache-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: D:\vtk-qt6
          key: vtk-9.5.0-qt6-${{ runner.os }}-${{ matrix.build_type }}-v1

      - name: Configure
        shell: pwsh
        run: |
          $vol = if ('${{ matrix.kind }}' -eq 'volrover3') { 'ON' } else { 'OFF' }
          $cgal = if ('${{ matrix.kind }}' -eq 'volrover3') { 'OFF' } else { 'ON' }
          $xmlrpc = if ('${{ matrix.kind }}' -eq 'libcvc') { 'ON' } else { 'OFF' }
          # link=shared → BUILD_SHARED_LIBS=ON + x64-windows triplet (DLLs)
          # link=static → BUILD_SHARED_LIBS=OFF + x64-windows-static triplet
          #   (.lib for libcvc and every vcpkg dep, MSVC static runtime).
          if ('${{ matrix.link }}' -eq 'static') {
            $shared = 'OFF'
            $msvcrt = 'MultiThreaded$<$<CONFIG:Debug>:Debug>'
          } else {
            $shared = 'ON'
            $msvcrt = 'MultiThreaded$<$<CONFIG:Debug>:Debug>DLL'
          }
          # Pin Qt6 to install-qt-action's tree (QT_ROOT_DIR) and add
          # the from-source VTK install tree alongside it. CMAKE_PREFIX_PATH
          # is a semicolon-separated list on Windows.
          $prefixes = @()
          if ($env:QT_ROOT_DIR) { $prefixes += $env:QT_ROOT_DIR }
          if ('${{ matrix.kind }}' -eq 'volrover3') { $prefixes += 'D:\vtk-qt6' }
          $qtPrefix = $prefixes -join ';'
          cmake -B build `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_CONFIGURATION_TYPES=${{ matrix.build_type }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ steps.meta.outputs.triplet }} `
            -DCMAKE_PREFIX_PATH="$qtPrefix" `
            -DBUILD_SHARED_LIBS=$shared `
            -DCMAKE_MSVC_RUNTIME_LIBRARY="$msvcrt" `
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON `
            -DCVC_BUILD_TESTS=OFF `
            -DCVC_USING_XMLRPC=$xmlrpc `
            -DCVC_ENABLE_CUDA=ON `
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static `
            -DDISABLE_CGAL=$cgal `
            -DCVC_BUILD_VOLROVER3=$vol `
            -DCVC_ENABLE_MESHER=$vol `
            -DCVC_ENABLE_SDF=$vol

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Install NSIS
        if: matrix.kind == 'volrover3'
        run: choco install nsis -y

      - name: Stage libcvc + bundle deps
        if: matrix.kind == 'libcvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stem = "libcvc-${{ steps.meta.outputs.version }}-windows-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}${{ steps.meta.outputs.linksfx }}"
          $dist = Join-Path $env:GITHUB_WORKSPACE $stem
          if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
          cmake --install build --prefix $dist --config ${{ matrix.build_type }} --component libcvc

          # vcpkg's installed tree is the single source of truth for
          # every transitive dependency we pulled in (Boost, HDF5,
          # FFTW, GSL, ImageMagick, ...). For the x64-windows triplet
          # that's DLLs + import .libs; for x64-windows-static it's
          # static .libs only. We mirror the entire tree so consumers
          # can find_package(cvc CONFIG) without their own vcpkg.
          $triplet = '${{ steps.meta.outputs.triplet }}'
          $vcRoot  = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/$triplet"
          if (-not (Test-Path $vcRoot)) {
            throw "vcpkg installed tree not found at $vcRoot"
          }

          # Layout differs slightly between Debug and Release:
          #   <triplet>/{bin,lib,include}        — release
          #   <triplet>/debug/{bin,lib}          — debug (headers shared)
          $isDebug = '${{ matrix.build_type }}' -eq 'Debug'
          $libSrc  = if ($isDebug) { Join-Path $vcRoot 'debug/lib' } else { Join-Path $vcRoot 'lib' }
          $binSrc  = if ($isDebug) { Join-Path $vcRoot 'debug/bin' } else { Join-Path $vcRoot 'bin' }

          New-Item -ItemType Directory -Force -Path "$dist/lib","$dist/include" | Out-Null
          if (Test-Path "$vcRoot/include") {
            Copy-Item -Recurse -Force "$vcRoot/include/*" "$dist/include/"
          }
          if (Test-Path $libSrc) {
            Get-ChildItem -Path $libSrc -Filter '*.lib' -File `
              | Copy-Item -Destination "$dist/lib/" -Force
          }
          if ('${{ matrix.link }}' -eq 'shared') {
            New-Item -ItemType Directory -Force -Path "$dist/bin" | Out-Null
            if (Test-Path $binSrc) {
              Get-ChildItem -Path $binSrc -Filter '*.dll' -File `
                | Copy-Item -Destination "$dist/bin/" -Force
            }
          }

          Compress-Archive -Path "$dist/*" -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "$stem.zip") -Force
          "$stem staged at $dist" | Write-Host
          Get-ChildItem "$env:GITHUB_WORKSPACE/$stem.zip" | Format-List Name,Length

      - name: Pack volrover3 (zip + NSIS)
        if: matrix.kind == 'volrover3'
        shell: pwsh
        working-directory: build
        run: |
          $stem = "VolumeRover3-${{ steps.meta.outputs.version }}-windows-${{ steps.meta.outputs.arch }}"
          $nsisPath = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\NSIS' -ErrorAction SilentlyContinue).'(default)'
          if (-not $nsisPath) {
            $nsisPath = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\NSIS' -ErrorAction SilentlyContinue).'(default)'
          }
          if ($nsisPath) { $env:PATH = "$nsisPath;$env:PATH" }

          cpack -G ZIP  -C ${{ matrix.build_type }} -D CPACK_COMPONENTS_ALL=volrover3 -D CPACK_COMPONENT_VOLROVER3_DEPENDS= -D CPACK_PACKAGE_FILE_NAME="$stem"
          Move-Item "$stem-volrover3.zip" "$stem.zip"
          # NSIS installs all components selected; we want only volrover3.
          # The NSIS exe name is taken directly from CPACK_PACKAGE_FILE_NAME.
          cpack -G NSIS -C ${{ matrix.build_type }} -D CPACK_COMPONENTS_ALL=volrover3 -D CPACK_COMPONENT_VOLROVER3_DEPENDS= -D CPACK_PACKAGE_FILE_NAME="$stem-setup"

          Copy-Item "$stem.zip"        "$env:GITHUB_WORKSPACE/"
          Copy-Item "$stem-setup.exe"  "$env:GITHUB_WORKSPACE/"

      - name: Activate MSVC dev shell (for dumpbin)
        if: matrix.kind == 'volrover3'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Refuse to ship a release artifact that would fail to launch on
      # a vanilla Windows machine due to a missing DLL (cudart, fftw3,
      # libomp140.x86_64, zlib, ...). dumpbin walks the EXE's PE imports
      # transitively and the verification script asserts every non-system
      # dependency is present in the same directory.
      - name: Verify Windows DLL dependencies (volrover3)
        if: matrix.kind == 'volrover3'
        shell: pwsh
        run: |
          $stem = "VolumeRover3-${{ steps.meta.outputs.version }}-windows-${{ steps.meta.outputs.arch }}"
          $extract = "$env:GITHUB_WORKSPACE\verify-bin"
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path "$env:GITHUB_WORKSPACE\$stem.zip" -DestinationPath $extract
          $bin = Get-ChildItem -Path $extract -Recurse -Filter volrover3.exe -File | Select-Object -First 1
          if (-not $bin) { throw "volrover3.exe not found in extracted zip" }
          & "$env:GITHUB_WORKSPACE\.github\scripts\verify-windows-deps.ps1" `
              -BinDir $bin.Directory.FullName `
              -Binaries volrover3.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.name }}
          path: |
            *.zip
            *.exe
          if-no-files-found: error

  # ──────────────────────────── Release ────────────────────────────
  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Recreate rolling tag (nightly mode)
        if: ${{ inputs.rolling_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLING_TAG: ${{ inputs.rolling_tag }}
        run: |
          set -euo pipefail
          # Best-effort cleanup of any previous rolling release so the
          # asset list is exactly what this run produced.
          gh release delete "$ROLLING_TAG" --yes --cleanup-tag 2>/dev/null || true
          git tag -f "$ROLLING_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$ROLLING_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.rolling_tag != '' && inputs.rolling_tag || github.ref_name }}
          name: ${{ inputs.rolling_tag != '' && format('Nightly ({0})', github.sha) || '' }}
          prerelease: ${{ inputs.prerelease }}
          # Preserve the curated release body (set manually before tagging
          # or via `gh release edit`). With generate_release_notes: false
          # and no `body`/`body_path` input, softprops does not touch the
          # body field when updating an existing release — only assets are
          # uploaded. Re-running the workflow on the same tag (e.g. after
          # an artifact-only fix) will not clobber hand-written release
          # notes.
          generate_release_notes: false
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.AppImage
