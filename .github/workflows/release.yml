name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Manual dry run: builds the full matrix and checks the artifact set on
  # any ref, but never creates a release or moves a tag (see the
  # `release` job's PUBLISH). Use it to prove a release.yml change before
  # the next tag depends on it.
  workflow_dispatch: {}
  # Reusable: nightly.yml calls this workflow with rolling=true to ship
  # master-HEAD artifacts to the `nightly` rolling GitHub Release.
  workflow_call:
    inputs:
      rolling_tag:
        description: 'When set, recreate this tag/release with the freshly built artifacts (used by nightly.yml).'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark the GitHub Release as a pre-release.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# ───────────────────────────────────────────────────────────────────
# Release artifacts
#
# libcvc (developer SDK), shipped in both shared and static flavors:
#   - Linux:   libcvc-<ver>-linux-<arch>-<config>.tar.gz          (shared)
#              libcvc-<ver>-linux-<arch>-<config>-static.tar.gz   (static)
#   - macOS:   libcvc-<ver>-macos-<arch>-<config>.zip             (shared)
#              libcvc-<ver>-macos-<arch>-<config>-static.zip      (static)
#   - Windows: libcvc-<ver>-windows-<arch>-<config>.zip           (shared)
#              libcvc-<ver>-windows-<arch>-<config>-static.zip    (static)
#
# The archives are self-contained: a consumer puts the extracted
# archive on CMAKE_PREFIX_PATH and `find_package(cvc CONFIG)` works with
# no apt / Homebrew / vcpkg / cvcpkg on the host. Each one is
# libcvc's install tree plus every cvcpkg bundle libcvc uses, taken
# whole from the release/shared prefix it was built against: libraries,
# headers, CMake package configs, pkg-config files, and the tools some
# of those configs insist on. .github/scripts/sdk-bundle-deps.sh does
# the copy and says which bundles it leaves out and why. The static
# flavor is a static libcvc over those same shared deps (see the fetch
# step), so it ships them too. Shared libcvc gets an $ORIGIN RUNPATH
# (Linux) or @loader_path rpath (macOS) to find them; on Windows the
# DLLs sit beside cvc.dll in bin/, together with the MSVC runtime.
# Both flavors
# include cvc::xmlrpc. VTK is intentionally NOT bundled — downstream
# consumers (F2Dock, MolSurf, volrover) bring their own VTK with the
# configuration they need (e.g. Qt-enabled for volrover).
#
# That is checked, not assumed: the `sdk-smoke` job extracts each
# Release archive on a fresh runner, builds and runs a find_package(cvc)
# consumer against it alone, and fails if any package config, linked
# library or loaded library came from outside the archive. A failure
# there blocks the release.
#
# Host requirements that stay outside the archives: the system C/C++
# runtimes (glibc, libstdc++, libgomp; libSystem, libc++, libcurl on
# macOS; the UCRT on Windows) and, for the CUDA-enabled SDKs, the
# CUDA toolkit. libcvc's public headers include <cuda_runtime.h> when
# built with CUDA (cvc/utility/cuda_utils.h via cvc/volume/voxels.h),
# and the static flavor links cudart_static. Running a consumer only
# needs the NVIDIA driver. The same holds for the Windows SDK, which is
# also built with CUDA.
#
# Everything the jobs build with comes from cvcpkg: the deps (below)
# and the build tools, i.e. cmake, ninja, pkg-config and patchelf
# (.github/actions/cvcpkg-build-tools). Nothing comes from apt or
# Homebrew. Two exceptions remain: the compiler, which is the runner
# image's GCC / Xcode clang / VS 2022 until a move to cvcpkg's llvm is
# assessed, and the CUDA toolkit, from NVIDIA's network installer
# because cvcpkg has no toolkit recipe yet.
#
# Third-party deps are always cvcpkg's release/shared bundles, for
# every lane (Debug and static included). That is the one catalog tuple
# that is complete on all three platforms, and the one ci.yml (every PR)
# and publish-cvcpkg.yml (its Debug bundles too) already build against.
# Debug libcvc links the Release, ABI-stable shared deps fine on
# Linux/macOS; static libcvc links them as shared libs, as it always has
# on macOS/Windows. Windows Debug is not built: there are no
# windows-debug dep bundles, and a Debug (/MDd) libcvc over Release
# (/MD) deps is a CRT mismatch.
#
# Release-config archives are required for a release; Debug archives
# are best-effort and attached when their lane succeeds.
#
# (The volrover3 end-user application moved to the volrover repository —
# https://github.com/transfix/volrover — along with its packaging.)
#
# Tag-driven release artifacts intentionally do not include the commit SHA
# in their filenames; CI build artifacts (ci.yml) do include the SHA so
# they can be uniquely identified per-PR.
# ───────────────────────────────────────────────────────────────────

jobs:
  # ──────────────────────────── Linux ────────────────────────────
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # libcvc developer SDK: every (build_type, link) combination
          - name: libcvc-debug-shared
            kind: libcvc
            build_type: Debug
            link: shared
          - name: libcvc-release-shared
            kind: libcvc
            build_type: Release
            link: shared
          - name: libcvc-debug-static
            kind: libcvc
            build_type: Debug
            link: static
          - name: libcvc-release-static
            kind: libcvc
            build_type: Release
            link: static
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          if [ -n "${{ inputs.rolling_tag }}" ]; then
            VERSION="${VERSION}-${{ inputs.rolling_tag }}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          ARCH=$(uname -m)
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          # Static artifacts get a -static suffix; shared keeps the legacy
          # unsuffixed name for backward compatibility with consumers that
          # download by URL.
          if [ "${{ matrix.link }}" = "static" ]; then
            LINKSFX="-static"
          else
            LINKSFX=""
          fi
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH"        >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"
          echo "linksfx=$LINKSFX"  >> "$GITHUB_OUTPUT"

      # CUDA toolkit so the shipped artifacts can offload to NVIDIA GPUs
      # at runtime when an NVIDIA driver is present. cudart is linked
      # statically (CMAKE_CUDA_RUNTIME_LIBRARY=Static below) so users
      # only need the NVIDIA driver, not a CUDA install. CMake's
      # check_language(CUDA) auto-disables CUDA gracefully if this step
      # ever fails.
      - name: Install CUDA toolkit (Linux)
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.5.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cudart-dev"]'

      # ── Pull deps from cvcpkg (via libcvc-deps composite action) ──
      # Required for libiimod (no longer vendored, see PR #63), in
      # addition to providing Boost/HDF5/FFTW/GSL/CGAL/log4cplus/
      # ImageMagick prebuilt. On miss the action emits an empty `path`
      # output; Configure then fails with an explicit "Could not find
      # X" error, which is the correct signal (no in-workflow
      # source-build fallback — cvcpkg is the sole source of truth).
      #
      # Release + shared for EVERY row, matching ci.yml's package-linux
      # Debug lanes. Asking for the row's own tuple is what broke v3.3.0
      # through v3.5.0: the catalog's linux debug and static tuples lack
      # deps the recipe has since grown (yaml-cpp, ftxui, nlohmann-json,
      # json-schema-validator; static also assimp and pocketfft), so the
      # install fails, `path` comes back empty, and Configure dies at
      # find_package(libiimod).
      - name: Fetch libcvc-deps
        id: libcvc-deps
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          build_type: Release
          link: shared

      # cmake, ninja, pkg-config and patchelf from cvcpkg, like every
      # library above. Nothing comes from apt; the compiler is the
      # runner's and CUDA is NVIDIA's (above).
      - name: Install build tools (cvcpkg)
        uses: ./.github/actions/cvcpkg-build-tools
        with:
          tools: cmake ninja pkg-config patchelf

      - name: Configure
        run: |
          extra_prefix="${{ steps.libcvc-deps.outputs.path }}"
          if [ -z "$extra_prefix" ]; then
            extra_prefix="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          # link=shared → BUILD_SHARED_LIBS=ON (legacy default).
          # link=static → BUILD_SHARED_LIBS=OFF: libcvc itself is static,
          # its deps are the shared cvcpkg prefix, exactly as on macOS and
          # Windows. No -DBoost_USE_STATIC_LIBS=ON: that was for apt's .a
          # files, the prefix has only shared Boost, and libcvc links
          # shared Boost regardless (CMake/SetupBoost.cmake forces it and
          # exports BOOST_ALL_DYN_LINK). Only src/cvc-cli's own
          # find_package(Boost COMPONENTS program_options) saw the flag,
          # and it failed there. PIC is always on so the static archive
          # remains relocatable into shared consumers.
          if [ "${{ matrix.link }}" = "static" ]; then
            shared_libs=OFF
          else
            shared_libs=ON
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="$extra_prefix" \
            -DBUILD_SHARED_LIBS=$shared_libs \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCVC_BUILD_TESTS=OFF \
            -DCVC_USING_XMLRPC=ON \
            -DCVC_ENABLE_CUDA=ON \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static \
            -DDISABLE_CGAL=OFF \
            -DCVC_ENABLE_MESHER=ON \
            -DCVC_ENABLE_SDF=ON

      - name: Build
        run: cmake --build build --parallel

      # ── libcvc developer tarball (self-contained) ───────────────
      # libcvc's install tree over the cvcpkg bundles it uses, copied
      # from the same prefix it was built against (see the header and
      # .github/scripts/sdk-bundle-deps.sh).
      - name: Stage libcvc + bundle deps
        if: matrix.kind == 'libcvc'
        run: |
          set -euo pipefail
          STEM="libcvc-${{ steps.meta.outputs.version }}-linux-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}${{ steps.meta.outputs.linksfx }}"
          DIST="$PWD/$STEM"
          rm -rf "$DIST"
          DEPS="${{ steps.libcvc-deps.outputs.path }}"
          if [ -z "$DEPS" ]; then
            DEPS="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          .github/scripts/sdk-bundle-deps.sh "$DEPS" "$DIST"
          cmake --install build --prefix "$DIST" --component libcvc

          # cmake --install strips libcvc.so's build-tree RUNPATH. Give
          # it $ORIGIN so it finds the bundled deps beside it wherever
          # the archive is extracted. The cvcpkg libraries already carry
          # $ORIGIN, and RUNPATH is not inherited, so each one needs its
          # own; sdk-check-closure.sh verifies that for everything
          # libcvc loads.
          if [ "${{ matrix.link }}" = "shared" ]; then
            for so in "$DIST"/lib/libcvc*.so*; do
              [ -L "$so" ] && continue
              patchelf --set-rpath '$ORIGIN' "$so"
            done
          fi
          .github/scripts/sdk-check-closure.sh "$DIST"

          # ── Bundle VTK (no Qt) ──────────────────────────────────
          # Intentionally not bundled: libcvc's CMake config does not
          # require VTK at consumer time. Each downstream project
          # (F2Dock, MolSurf, volrover) brings its own VTK if needed.

          tar czf "$STEM.tar.gz" "$STEM"
          # Archive already lives in $GITHUB_WORKSPACE ($PWD); no copy needed.
          du -sh "$DIST" "$STEM.tar.gz" || true

      # Explicit libcvc- prefix instead of bare *.tar.gz globs. The
      # Jimver/cuda-toolkit action drops cuda_keyring.deb into
      # $GITHUB_WORKSPACE while installing the toolkit, and a permissive
      # glob sweeps stray files into the release. See v3.1.1 release
      # where cuda_keyring.deb had to be manually removed.
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}
          path: |
            libcvc-*.tar.gz
          if-no-files-found: error

  # ──────────────────────────── macOS ────────────────────────────
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libcvc-debug-shared
            kind: libcvc
            build_type: Debug
            link: shared
          - name: libcvc-release-shared
            kind: libcvc
            build_type: Release
            link: shared
          - name: libcvc-debug-static
            kind: libcvc
            build_type: Debug
            link: static
          - name: libcvc-release-static
            kind: libcvc
            build_type: Release
            link: static
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          if [ -n "${{ inputs.rolling_tag }}" ]; then
            VERSION="${VERSION}-${{ inputs.rolling_tag }}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          ARCH=$(uname -m)
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ matrix.link }}" = "static" ]; then
            LINKSFX="-static"
          else
            LINKSFX=""
          fi
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH"        >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"
          echo "linksfx=$LINKSFX"  >> "$GITHUB_OUTPUT"

      # ── Pull deps (incl. libiimod) from cvcpkg ──
      # cvcpkg is the sole third-party provider on macOS.
      # Release + shared for every row, matching ci.yml's package-macos
      # Debug lane: the catalog's macos/arm64 debug tuple lacks assimp,
      # fontconfig, freetype, libiimod, libxml2, pocketfft and yaml-cpp,
      # and its static tuple has 3 of the 33 deps. See the Linux note.
      - name: Fetch libcvc-deps
        id: libcvc-deps
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          build_type: Release
          link: shared

      # cmake, ninja and pkg-config from cvcpkg; no Homebrew. The
      # compiler is the runner's Xcode clang.
      - name: Install build tools (cvcpkg)
        uses: ./.github/actions/cvcpkg-build-tools

      - name: Configure
        run: |
          # cvcpkg is the sole third-party prefix on macOS. Do NOT set
          # -DCMAKE_PREFIX_PATH on the command line (its list is
          # semicolon-separated); use the env var so CMake reads it as
          # a native colon-separated PATH.
          deps_path="${{ steps.libcvc-deps.outputs.path }}"
          if [ -z "$deps_path" ]; then
            deps_path="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          export CMAKE_PREFIX_PATH="$deps_path"
          # link=static → libcvc itself is static over the shared cvcpkg
          # prefix (see the fetch step), so no find_package hints differ
          # between the two flavors.
          if [ "${{ matrix.link }}" = "static" ]; then
            shared_libs=OFF
          else
            shared_libs=ON
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_SHARED_LIBS=$shared_libs \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCVC_BUILD_TESTS=OFF \
            -DCVC_USING_XMLRPC=ON \
            -DCVC_ENABLE_CUDA=OFF \
            -DDISABLE_CGAL=OFF \
            -DCVC_ENABLE_MESHER=ON \
            -DCVC_ENABLE_SDF=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Stage libcvc + bundle deps
        if: matrix.kind == 'libcvc'
        run: |
          set -euo pipefail
          STEM="libcvc-${{ steps.meta.outputs.version }}-macos-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}${{ steps.meta.outputs.linksfx }}"
          DIST="$PWD/$STEM"
          rm -rf "$DIST"
          DEPS="${{ steps.libcvc-deps.outputs.path }}"
          if [ -z "$DEPS" ]; then
            DEPS="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          .github/scripts/sdk-bundle-deps.sh "$DEPS" "$DIST"
          cmake --install build --prefix "$DIST" --component libcvc

          # The cvcpkg dylibs are @rpath/<name> and carry an @loader_path
          # LC_RPATH, so a shared libcvc links them as @rpath/<name> too.
          # cmake --install strips libcvc's build-tree rpath and leaves
          # it none, so add @loader_path, then re-sign: install_name_tool
          # invalidates the ad-hoc signature arm64 will not load without.
          # No dylibbundler: the deps are already bundled with working
          # install names.
          if [ "${{ matrix.link }}" = "shared" ]; then
            for dy in "$DIST"/lib/libcvc*.dylib; do
              [ -L "$dy" ] && continue
              rpaths=$(otool -l "$dy" | awk '/cmd LC_RPATH/ { getline; getline; print $2 }')
              if ! grep -qx '@loader_path' <<<"$rpaths"; then
                install_name_tool -add_rpath @loader_path "$dy"
              fi
              codesign --force --sign - "$dy"
            done
          fi
          .github/scripts/sdk-check-closure.sh "$DIST"

          # ── Bundle VTK (no Qt) ──────────────────────────────────
          # Intentionally not bundled — see Linux section for rationale.

          ditto -c -k --sequesterRsrc --keepParent "$DIST" "$STEM.zip"
          # Archive already lives in $GITHUB_WORKSPACE ($PWD); no copy needed.
          du -sh "$DIST" "$STEM.zip" || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}
          path: |
            libcvc-*.zip
          if-no-files-found: error

  # ──────────────────────────── Windows ────────────────────────────
  windows:
    # windows-2022, not windows-latest -- matching ci.yml, which pins it and
    # passes. The label rolled to Visual Studio 18 overnight on 2026-08-19 and
    # CL.exe started crashing while compiling src/cvc/core/state_exec:
    #     error MSB6006: "CL.exe" exited with code -1073741819
    # which is 0xC0000005, an access violation -- the compiler itself, not the
    # code. Same commit built clean on VS 2022 hours earlier in ci.yml, so the
    # variable is the toolset. Nightly went 9-jobs red on the back of it.
    #
    # A release matrix should pin its toolchain anyway: unpinned, the artifacts
    # this workflow publishes change compiler whenever GitHub rolls the image.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # Release only, as in ci.yml's package-windows. The catalog's
          # windows/x86_64 debug tuple is missing 19 of libcvc's 34 deps
          # (boost, cgal, gmp, hdf5, libiimod, ...), so these rows failed
          # at Configure on every tag since v3.3.0. Fetching Release deps
          # instead, as Linux/macOS do, is not an option here: a Debug
          # (/MDd) libcvc over Release (/MD) DLLs is a CRT mismatch and a
          # broken artifact. Restore libcvc-debug-shared/-static once
          # windows-debug dep bundles exist; the fetch step already keys on
          # matrix.build_type and the stage step already ships PDBs.
          - name: libcvc-release-shared
            kind: libcvc
            build_type: Release
            link: shared
          - name: libcvc-release-static
            kind: libcvc
            build_type: Release
            link: static
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          if [ -n "${{ inputs.rolling_tag }}" ]; then
            VERSION="${VERSION}-${{ inputs.rolling_tag }}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ matrix.link }}" = "static" ]; then
            LINKSFX="-static"
          else
            LINKSFX=""
          fi
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "arch=x86_64"       >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"
          echo "linksfx=$LINKSFX"  >> "$GITHUB_OUTPUT"

      # ── Pull all third-party deps from cvcpkg ──
      # cvcpkg is the sole source of truth for third-party components.
      # On miss (network blip, catalog outage) CMake configure fails
      # with an explicit "Could not find X" error — there is no vcpkg
      # or source-build fallback.
      #
      # NOTE: the Windows cvcpkg prefix is shared-only. Static matrix
      # entries also consume the shared prefix: libcvc itself stays
      # static (BUILD_SHARED_LIBS=OFF) but third-party deps link as
      # DLLs. The Configure step below then switches the MSVC runtime
      # to /MD so libcvc objects can safely cross API boundaries with
      # the shared-CRT-built deps.
      - name: Fetch libcvc-deps (Windows)
        id: libcvc-deps-windows
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          build_type: ${{ matrix.build_type }}
          link: shared

      # cmake and pkg-config from cvcpkg rather than the runner image.
      # The VS generator needs no ninja; the compiler is the runner's
      # VS 2022 and CUDA is NVIDIA's (below).
      - name: Install build tools (cvcpkg)
        uses: ./.github/actions/cvcpkg-build-tools
        with:
          tools: cmake pkg-config

      # CUDA toolkit so the shipped Windows artifacts can offload to
      # NVIDIA GPUs at runtime when an NVIDIA driver is present. cudart
      # is linked statically (CMAKE_CUDA_RUNTIME_LIBRARY=Static below)
      # so users only need the NVIDIA driver, not a CUDA install.
      - name: Install CUDA toolkit (Windows)
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.5.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Configure
        shell: pwsh
        run: |
          $xmlrpc = 'ON'
          $depsPath = '${{ steps.libcvc-deps-windows.outputs.path }}'
          if (-not $depsPath) {
            $depsPath = if ($env:LIBCVC_DEPS_PREFIX) { $env:LIBCVC_DEPS_PREFIX } else { 'D:\libcvc-deps' }
            if (-not (Test-Path $depsPath)) { $depsPath = '' }
          }
          # The Windows cvcpkg prefix is shared-only. Static matrix
          # entries still consume the shared prefix: libcvc stays
          # static (BUILD_SHARED_LIBS=OFF) but its third-party deps
          # link as DLLs. Force /MD (DLL CRT) so libcvc objects can
          # cross API boundaries with the /MD-built deps DLLs without
          # heap mismatches.
          if ('${{ matrix.link }}' -eq 'static') {
            $shared = 'OFF'
          } else {
            $shared = 'ON'
          }
          $msvcrt = 'MultiThreaded$<$<CONFIG:Debug>:Debug>DLL'
          # cvcpkg is the sole third-party prefix. No vcpkg toolchain
          # file, no aqt Qt6, no VTK source cache.
          $qtPrefix = if ($depsPath) { $depsPath } else { '' }
          # Quote every -DNAME="$var". PowerShell does not expand a variable
          # inside an unquoted -DNAME=$var argument; cmake used to receive the
          # literal text $shared, which CMake reads as true, so the "static"
          # lane built a shared cvc.dll (configure printed
          # BUILD_SHARED_LIBS=$shared).
          cmake -B build `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_CONFIGURATION_TYPES=${{ matrix.build_type }} `
            -DCMAKE_PREFIX_PATH="$qtPrefix" `
            -DBUILD_SHARED_LIBS="$shared" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY="$msvcrt" `
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON `
            -DCVC_BUILD_TESTS=OFF `
            -DCVC_USING_XMLRPC="$xmlrpc" `
            -DCVC_ENABLE_CUDA=ON `
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static `
            -DDISABLE_CGAL=OFF `
            -DCVC_ENABLE_MESHER=ON `
            -DCVC_ENABLE_SDF=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Stage libcvc + bundle deps
        if: matrix.kind == 'libcvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stem = "libcvc-${{ steps.meta.outputs.version }}-windows-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}${{ steps.meta.outputs.linksfx }}"
          $dist = Join-Path $env:GITHUB_WORKSPACE $stem
          if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
          # The bundling scripts are bash, shared with Linux/macOS. Name Git
          # Bash by path: a bare `bash` can resolve to the WSL launcher.
          $bash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'

          $depsPath = '${{ steps.libcvc-deps-windows.outputs.path }}'
          if (-not $depsPath) {
            $depsPath = if ($env:LIBCVC_DEPS_PREFIX) { $env:LIBCVC_DEPS_PREFIX } else { 'D:\libcvc-deps' }
            if (-not (Test-Path $depsPath)) {
              throw "cvcpkg prefix not found (checked steps.libcvc-deps-windows.outputs.path and $depsPath)"
            }
          }

          # The cvcpkg bundles libcvc uses, then libcvc over them; see the
          # header. DLLs sit in bin/ beside cvc.dll, which is all Windows
          # needs to find them.
          & $bash .github/scripts/sdk-bundle-deps.sh $depsPath $dist
          if ($LASTEXITCODE) { throw "sdk-bundle-deps.sh failed ($LASTEXITCODE)" }
          cmake --install build --prefix $dist --config ${{ matrix.build_type }} --component libcvc
          if ($LASTEXITCODE) { throw "cmake --install failed ($LASTEXITCODE)" }

          $isDebug = '${{ matrix.build_type }}' -eq 'Debug'

          # ── libcvc's own PDB ─────────────────────────────────────
          # CMake's install(TARGETS) doesn't ship .pdb files by default
          # on MSVC. For Debug we always want them; copy from the build
          # tree manually so symbolicated stack traces work for
          # downstream consumers that link a libcvc Debug build.
          if ($isDebug) {
            New-Item -ItemType Directory -Force -Path "$dist/bin","$dist/lib" | Out-Null
            Get-ChildItem -Path build -Recurse -Include *.pdb -File `
              | Where-Object { $_.Name -like 'cvc*.pdb' -or $_.Name -like 'xmlrpc*.pdb' } `
              | ForEach-Object {
                  # DLL pdbs live next to the .dll (so → bin); static
                  # compile-time pdbs (vc*.pdb-ish) sit next to the
                  # .lib (so → lib). Drop them into both for simplicity;
                  # consumers don't care which dir they're in.
                  Copy-Item $_.FullName -Destination "$dist/bin/" -Force -ErrorAction SilentlyContinue
                  Copy-Item $_.FullName -Destination "$dist/lib/" -Force -ErrorAction SilentlyContinue
                }
          }

          & $bash .github/scripts/sdk-check-closure.sh $dist
          if ($LASTEXITCODE) { throw "sdk-check-closure.sh failed ($LASTEXITCODE)" }

          # ── Bundle VTK (no Qt) ──────────────────────────────────
          # Intentionally not bundled — see Linux section for rationale.

          Compress-Archive -Path "$dist/*" -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "$stem.zip") -Force
          "$stem staged at $dist" | Write-Host
          Get-ChildItem "$env:GITHUB_WORKSPACE/$stem.zip" | Format-List Name,Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.name }}
          path: |
            libcvc-*.zip
          if-no-files-found: error

  # ─────────────────────────── SDK smoke ───────────────────────────
  # Proves each Release SDK archive is self-contained instead of assuming
  # it: on a fresh runner, with nothing but the extracted archive on
  # CMAKE_PREFIX_PATH, configure, build and run a find_package(cvc)
  # consumer, then fail if any package config, linked library or loaded
  # library came from outside the archive (.github/scripts/
  # sdk-smoke-test.sh). The runner gets only what consumers are expected
  # to bring: cvcpkg's cmake/ninja/pkg-config, the image's compiler, and
  # for the CUDA-enabled Linux/Windows SDKs the CUDA toolkit (see the
  # header). No deps prefix, no apt, no Homebrew. Debug archives are the same staging over a Debug build,
  # so the Release ones stand for them.
  sdk-smoke:
    name: sdk-smoke (${{ matrix.artifact }})
    needs: [linux, macos, windows]
    # Run when some other lane failed too: these archives may still be
    # fine, and the release job reports the missing ones itself.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-libcvc-release-shared
            os: ubuntu-latest
          - artifact: linux-libcvc-release-static
            os: ubuntu-latest
          - artifact: macos-libcvc-release-shared
            os: macos-latest
          - artifact: macos-libcvc-release-static
            os: macos-latest
          - artifact: windows-libcvc-release-shared
            os: windows-2022
          - artifact: windows-libcvc-release-static
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      # Only for the scripts and the build-tools action.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Download the SDK archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: sdk-archive

      # Same toolkit as the build (see its step). Consumers of the Linux
      # SDK need it: the public headers include <cuda_runtime.h>, and the
      # static flavor links cudart_static.
      - name: Install CUDA toolkit (Linux)
        if: runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.5.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cudart-dev"]'

      - name: Install CUDA toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.5.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      - name: Install build tools (cvcpkg)
        uses: ./.github/actions/cvcpkg-build-tools

      - name: Build and run a find_package(cvc) consumer
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=( sdk-archive/libcvc-*.tar.gz sdk-archive/libcvc-*.zip )
          if [ ${#archives[@]} -ne 1 ]; then
            echo "::error::expected one SDK archive in ${{ matrix.artifact }}, found ${#archives[@]}"
            exit 1
          fi
          .github/scripts/sdk-smoke-test.sh "${archives[0]}" Release

  # ──────────────────────────── Release ────────────────────────────
  release:
    needs: [linux, macos, windows, sdk-smoke]
    # Run even when a build lane failed, so a broken Debug lane cannot
    # hold back a release whose Release-config archives all built. The
    # "Check artifact set" step below is the actual gate, and it also
    # requires every sdk-smoke leg to have passed. (With a plain
    # `needs`, every Debug lane failing at Configure skipped this job on
    # v3.3.0, v3.4.0 and v3.5.0, and nightly has not published since
    # 2026-05-25.)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      # Publish only from a version-tag push or a rolling (nightly) call.
      # Everything else, i.e. workflow_dispatch on any ref, is a dry run:
      # it builds, downloads and checks the full artifact set, then stops
      # before touching a tag or a release.
      PUBLISH: ${{ inputs.rolling_tag != '' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      # Every Release-config archive the matrix builds is required, and
      # each must have passed sdk-smoke; either failure
      # stops the job before any tag or release is touched.
      # Debug archives are best-effort: a missing one is a warning (its
      # own lane is already red) and the release goes out without it.
      # Keep these lists in step with the build matrices above.
      - name: Check artifact set
        shell: bash
        env:
          SMOKE_RESULT: ${{ needs.sdk-smoke.result }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          missing=0
          if [ "$SMOKE_RESULT" != success ]; then
            echo "::error::sdk-smoke did not pass ($SMOKE_RESULT): at least one Release SDK archive is not self-contained"
            missing=1
          fi
          check() {  # $1 = required|optional, $2 = glob under artifacts/
            local hits=( artifacts/$2 )
            if [ ${#hits[@]} -gt 0 ]; then
              echo "ok        ${hits[*]}"
            elif [ "$1" = required ]; then
              echo "::error::missing required release archive: $2"
              missing=1
            else
              echo "::warning::missing Debug archive (attaching the rest): $2"
            fi
          }
          for p in linux:tar.gz macos:zip windows:zip; do
            check required "libcvc-*-${p%%:*}-*-release.${p#*:}"
            check required "libcvc-*-${p%%:*}-*-release-static.${p#*:}"
          done
          for p in linux:tar.gz macos:zip; do
            check optional "libcvc-*-${p%%:*}-*-debug.${p#*:}"
            check optional "libcvc-*-${p%%:*}-*-debug-static.${p#*:}"
          done
          exit "$missing"

      - name: Dry run summary
        if: ${{ env.PUBLISH != 'true' }}
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "### Release dry run ($EVENT on $REF_NAME)"
            echo
            echo "No tag moved, no release created. Would attach:"
            echo
            find artifacts -type f \( -name 'libcvc-*.tar.gz' -o -name 'libcvc-*.zip' \) \
              -printf '- `%f` (%s bytes)\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recreate rolling tag (nightly mode)
        if: ${{ env.PUBLISH == 'true' && inputs.rolling_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLING_TAG: ${{ inputs.rolling_tag }}
        run: |
          set -euo pipefail
          # Best-effort cleanup of any previous rolling release so the
          # asset list is exactly what this run produced.
          gh release delete "$ROLLING_TAG" --yes --cleanup-tag 2>/dev/null || true
          git tag -f "$ROLLING_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$ROLLING_TAG"

      - name: Create GitHub Release
        if: ${{ env.PUBLISH == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.rolling_tag != '' && inputs.rolling_tag || github.ref_name }}
          name: ${{ inputs.rolling_tag != '' && format('Nightly ({0})', github.sha) || '' }}
          prerelease: ${{ inputs.prerelease }}
          # Preserve the curated release body (set manually before tagging
          # or via `gh release edit`). With generate_release_notes: false
          # and no `body`/`body_path` input, softprops does not touch the
          # body field when updating an existing release — only assets are
          # uploaded. Re-running the workflow on the same tag (e.g. after
          # an artifact-only fix) will not clobber hand-written release
          # notes.
          generate_release_notes: false
          # Explicit prefixes so stray files from third-party actions
          # (e.g. cuda_keyring.deb from Jimver/cuda-toolkit) can never
          # ride along into a release attachment list.
          files: |
            artifacts/libcvc-*.tar.gz
            artifacts/libcvc-*.zip
