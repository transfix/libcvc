name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Reusable: nightly.yml calls this workflow with rolling=true to ship
  # master-HEAD artifacts to the `nightly` rolling GitHub Release.
  workflow_call:
    inputs:
      rolling_tag:
        description: 'When set, recreate this tag/release with the freshly built artifacts (used by nightly.yml).'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark the GitHub Release as a pre-release.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# ───────────────────────────────────────────────────────────────────
# Release artifacts
#
# libcvc (developer SDK), shipped in both shared and static flavors:
#   - Linux:   libcvc-<ver>-linux-<arch>-<config>.tar.gz          (shared)
#              libcvc-<ver>-linux-<arch>-<config>-static.tar.gz   (static)
#   - macOS:   libcvc-<ver>-macos-<arch>-<config>.zip             (shared)
#              libcvc-<ver>-macos-<arch>-<config>-static.zip      (static)
#   - Windows: libcvc-<ver>-windows-<arch>-<config>.zip           (shared)
#              libcvc-<ver>-windows-<arch>-<config>-static.zip    (static)
#
# Shared and static archives are both fully self-contained: every
# project-level dependency (Boost, HDF5, FFTW, GSL on all platforms;
# plus ImageMagick + CGAL/GMP/MPFR on Windows via cvcpkg) is bundled
# alongside libcvc, so consumers can `find_package(cvc CONFIG)` from
# the extracted archive without needing apt / Homebrew / cvcpkg on
# the host. Shared archives ship .so/.dylib/.dll (with rpath fixups
# on Linux+macOS) plus their import .lib on Windows; static archives
# ship .a/.lib only. Both flavors include cvc::xmlrpc. VTK is
# intentionally NOT bundled — downstream consumers (F2Dock, MolSurf,
# volrover) bring their own VTK with the configuration they need
# (e.g. Qt-enabled for volrover).
#
# Debug archives on Windows also include MSVC .pdb files for libcvc
# itself and every cvcpkg-provided dependency, so symbolicated stack
# traces work out of the box.
#
# System libraries (glibc, libstdc++, libm, Windows UCRT) are
# intentionally left to the host.
#
# (The volrover3 end-user application moved to the volrover repository —
# https://github.com/transfix/volrover — along with its packaging.)
#
# Tag-driven release artifacts intentionally do not include the commit SHA
# in their filenames; CI build artifacts (ci.yml) do include the SHA so
# they can be uniquely identified per-PR.
# ───────────────────────────────────────────────────────────────────

jobs:
  # ──────────────────────────── Linux ────────────────────────────
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # libcvc developer SDK: every (build_type, link) combination
          - name: libcvc-debug-shared
            kind: libcvc
            build_type: Debug
            link: shared
          - name: libcvc-release-shared
            kind: libcvc
            build_type: Release
            link: shared
          - name: libcvc-debug-static
            kind: libcvc
            build_type: Debug
            link: static
          - name: libcvc-release-static
            kind: libcvc
            build_type: Release
            link: static
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          if [ -n "${{ inputs.rolling_tag }}" ]; then
            VERSION="${VERSION}-${{ inputs.rolling_tag }}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          ARCH=$(uname -m)
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          # Static artifacts get a -static suffix; shared keeps the legacy
          # unsuffixed name for backward compatibility with consumers that
          # download by URL.
          if [ "${{ matrix.link }}" = "static" ]; then
            LINKSFX="-static"
          else
            LINKSFX=""
          fi
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH"        >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"
          echo "linksfx=$LINKSFX"  >> "$GITHUB_OUTPUT"

      - name: Install dependencies (libcvc)
        if: matrix.kind == 'libcvc'
        run: |
          sudo apt-get update
          # Only build-tooling + AppImage helpers here; Boost/HDF5/FFTW/
          # GSL/ImageMagick/CGAL/log4cplus come from cvcpkg via
          # fetch-libcvc-deps below.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libzstd-dev

      # CUDA toolkit so the shipped artifacts can offload to NVIDIA GPUs
      # at runtime when an NVIDIA driver is present. cudart is linked
      # statically (CMAKE_CUDA_RUNTIME_LIBRARY=Static below) so users
      # only need the NVIDIA driver, not a CUDA install. CMake's
      # check_language(CUDA) auto-disables CUDA gracefully if this step
      # ever fails.
      - name: Install CUDA toolkit (Linux)
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.5.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cudart-dev"]'

      # ── Pull deps from cvcpkg (via libcvc-deps composite action) ──
      # Required for libiimod (no longer vendored, see PR #63), in
      # addition to providing Boost/HDF5/FFTW/GSL/CGAL/log4cplus/
      # ImageMagick prebuilt. On miss the action emits an empty `path`
      # output; Configure then fails with an explicit "Could not find
      # X" error, which is the correct signal (no in-workflow
      # source-build fallback — cvcpkg is the sole source of truth).
      - name: Fetch libcvc-deps
        id: libcvc-deps
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          build_type: ${{ matrix.build_type }}
          link: shared

      - name: Configure
        run: |
          extra_prefix="${{ steps.libcvc-deps.outputs.path }}"
          if [ -z "$extra_prefix" ]; then
            extra_prefix="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          # link=shared → BUILD_SHARED_LIBS=ON (legacy default).
          # link=static → BUILD_SHARED_LIBS=OFF plus static dep flags so
          # the .a flavor of Boost/HDF5/FFTW/GSL ships in libapt's dev
          # packages is preferred. PIC is always on so the static archive
          # remains relocatable into shared consumers.
          if [ "${{ matrix.link }}" = "static" ]; then
            shared_libs=OFF
            static_deps="-DBoost_USE_STATIC_LIBS=ON -DHDF5_USE_STATIC_LIBRARIES=ON"
          else
            shared_libs=ON
            static_deps=""
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="$extra_prefix" \
            -DBUILD_SHARED_LIBS=$shared_libs \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            $static_deps \
            -DCVC_BUILD_TESTS=OFF \
            -DCVC_USING_XMLRPC=ON \
            -DCVC_ENABLE_CUDA=ON \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static \
            -DDISABLE_CGAL=OFF \
            -DCVC_ENABLE_MESHER=ON \
            -DCVC_ENABLE_SDF=ON

      - name: Build
        run: cmake --build build --parallel

      # ── libcvc developer tarball (self-contained) ───────────────
      # Stage libcvc's install tree, then copy the libraries and
      # headers of every project-level dependency (Boost, HDF5, FFTW,
      # GSL) into the same tree so the archive is fully self-contained
      # — consumers should be able to find_package(cvc CONFIG) without
      # needing apt-installed dev packages on the host. System glibc /
      # libstdc++ / libm are intentionally left to the host.
      - name: Stage libcvc + bundle deps
        if: matrix.kind == 'libcvc'
        run: |
          set -euo pipefail
          STEM="libcvc-${{ steps.meta.outputs.version }}-linux-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}${{ steps.meta.outputs.linksfx }}"
          DIST="$PWD/$STEM"
          rm -rf "$DIST"
          cmake --install build --prefix "$DIST" --component libcvc
          mkdir -p "$DIST/lib" "$DIST/include"

          # Suffix pattern decides whether to grab dynamic or archive
          # flavours of each dep. Both flavours are present in apt's
          # libfoo-dev packages on Ubuntu.
          if [ "${{ matrix.link }}" = "static" ]; then
            patterns=( '*.a' )
          else
            patterns=( '*.so' '*.so.*' )
          fi

          LIBDIRS=( /usr/lib/x86_64-linux-gnu /usr/lib )
          copy_libs() {
            local prefix="$1"
            for d in "${LIBDIRS[@]}"; do
              for pat in "${patterns[@]}"; do
                # -P preserves symlinks (libfoo.so → libfoo.so.1 → libfoo.so.1.2)
                find "$d" -maxdepth 1 -name "${prefix}${pat}" -print0 2>/dev/null \
                  | xargs -0 -r cp -P -t "$DIST/lib/" 2>/dev/null || true
              done
            done
          }
          copy_libs 'libboost_'
          copy_libs 'libhdf5'
          copy_libs 'libfftw3'
          copy_libs 'libgsl'
          copy_libs 'libgslcblas'
          copy_libs 'liblog4cplus'

          # Headers
          for src in /usr/include/boost /usr/include/gsl /usr/include/log4cplus; do
            [ -d "$src" ] && cp -R "$src" "$DIST/include/"
          done
          # HDF5 headers live under /usr/include/hdf5/serial on Ubuntu.
          if [ -d /usr/include/hdf5/serial ]; then
            mkdir -p "$DIST/include/hdf5"
            cp -R /usr/include/hdf5/serial/. "$DIST/include/hdf5/"
          fi
          for f in /usr/include/fftw3.h /usr/include/fftw3.f /usr/include/fftw3l.h /usr/include/fftw3q.h; do
            [ -f "$f" ] && cp "$f" "$DIST/include/"
          done

          # For the shared flavour, rewrite RUNPATH on libcvc.so AND
          # every bundled dep .so to $ORIGIN so the loader resolves
          # transitive dependencies within the same lib/ directory
          # regardless of where the archive is extracted. DT_RUNPATH
          # (which patchelf sets) does NOT propagate across dlopen()
          # boundaries the way DT_RPATH would, so we have to stamp
          # $ORIGIN on each bundled .so individually.
          if [ "${{ matrix.link }}" = "shared" ]; then
            sudo apt-get install -y --no-install-recommends patchelf
            for so in "$DIST"/lib/*.so*; do
              [ -e "$so" ] || continue
              [ -L "$so" ] && continue
              # Strip any pre-existing absolute RPATH first (some apt
              # packages embed /build/foo/.libs paths), then set ours.
              patchelf --remove-rpath "$so" 2>/dev/null || true
              patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
            done
          fi

          # ── Bundle VTK (no Qt) ──────────────────────────────────
          # Intentionally not bundled: libcvc's CMake config does not
          # require VTK at consumer time. Each downstream project
          # (F2Dock, MolSurf, volrover) brings its own VTK if needed.

          tar czf "$STEM.tar.gz" "$STEM"
          # Archive already lives in $GITHUB_WORKSPACE ($PWD); no copy needed.
          du -sh "$DIST" "$STEM.tar.gz" || true

      # Explicit libcvc- prefix instead of bare *.tar.gz globs. The
      # Jimver/cuda-toolkit action drops cuda_keyring.deb into
      # $GITHUB_WORKSPACE while installing the toolkit, and a permissive
      # glob sweeps stray files into the release. See v3.1.1 release
      # where cuda_keyring.deb had to be manually removed.
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}
          path: |
            libcvc-*.tar.gz
          if-no-files-found: error

  # ──────────────────────────── macOS ────────────────────────────
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libcvc-debug-shared
            kind: libcvc
            build_type: Debug
            link: shared
          - name: libcvc-release-shared
            kind: libcvc
            build_type: Release
            link: shared
          - name: libcvc-debug-static
            kind: libcvc
            build_type: Debug
            link: static
          - name: libcvc-release-static
            kind: libcvc
            build_type: Release
            link: static
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          if [ -n "${{ inputs.rolling_tag }}" ]; then
            VERSION="${VERSION}-${{ inputs.rolling_tag }}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          ARCH=$(uname -m)
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ matrix.link }}" = "static" ]; then
            LINKSFX="-static"
          else
            LINKSFX=""
          fi
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH"        >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"
          echo "linksfx=$LINKSFX"  >> "$GITHUB_OUTPUT"

      - name: Install dependencies (libcvc)
        if: matrix.kind == 'libcvc'
        run: |
          # All C/C++ third-party libs come from cvcpkg via
          # fetch-libcvc-deps below. Only build tooling here;
          # dylibbundler is installed later inside the stage step.
          brew install cmake ninja zstd

      # ── Pull deps (incl. libiimod) from cvcpkg ──
      # cvcpkg is the sole third-party provider on macOS.
      - name: Fetch libcvc-deps
        id: libcvc-deps
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          build_type: ${{ matrix.build_type }}
          link: shared

      - name: Configure
        run: |
          # cvcpkg is the sole third-party prefix on macOS. Do NOT set
          # -DCMAKE_PREFIX_PATH on the command line (its list is
          # semicolon-separated); use the env var so CMake reads it as
          # a native colon-separated PATH.
          deps_path="${{ steps.libcvc-deps.outputs.path }}"
          if [ -z "$deps_path" ]; then
            deps_path="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          export CMAKE_PREFIX_PATH="$deps_path"
          if [ "${{ matrix.link }}" = "static" ]; then
            shared_libs=OFF
            # cvcpkg publishes both shared (.dylib) and static (.a)
            # flavors; the static requirement filter is applied via
            # link=static in fetch-libcvc-deps, so no extra find_package
            # hints are needed here.
            static_deps=""
          else
            shared_libs=ON
            static_deps=""
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_SHARED_LIBS=$shared_libs \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            $static_deps \
            -DCVC_BUILD_TESTS=OFF \
            -DCVC_USING_XMLRPC=ON \
            -DCVC_ENABLE_CUDA=OFF \
            -DDISABLE_CGAL=OFF \
            -DCVC_ENABLE_MESHER=ON \
            -DCVC_ENABLE_SDF=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Stage libcvc + bundle deps
        if: matrix.kind == 'libcvc'
        run: |
          set -euo pipefail
          STEM="libcvc-${{ steps.meta.outputs.version }}-macos-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}${{ steps.meta.outputs.linksfx }}"
          DIST="$PWD/$STEM"
          rm -rf "$DIST"
          cmake --install build --prefix "$DIST" --component libcvc
          mkdir -p "$DIST/lib" "$DIST/include"

          # Third-party prefix populated by cvcpkg.
          DEPS="${{ steps.libcvc-deps.outputs.path }}"
          if [ -z "$DEPS" ]; then
            DEPS="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi

          # Headers are always needed for downstream `find_package`
          # consumers; copy them from the cvcpkg prefix.
          if [ -d "$DEPS/include" ]; then
            cp -R "$DEPS/include/." "$DIST/include/" 2>/dev/null || true
          fi

          if [ "${{ matrix.link }}" = "shared" ]; then
            # dylibbundler walks libcvc.dylib's transitive deps, copies
            # any missing dylibs alongside, and rewrites all install_names
            # to @rpath/<dylib> with rpath @loader_path. Far more reliable
            # than hand-rolled install_name_tool plumbing across the deep
            # Boost/HDF5 dependency graph.
            brew install dylibbundler
            # Search list: cvcpkg lib dir first (authoritative source of
            # every third-party dylib), then macOS system dirs as a
            # last-resort fallback. Without this, dylibbundler hits
            # unresolved transitive deps and drops into an interactive
            # "Try again" prompt; with no TTY in CI, that prompt loops
            # forever. -s adds search paths, and we close stdin so any
            # remaining unresolved dep aborts cleanly.
            BUNDLER_SEARCH=( -s "$DEPS/lib" )
            [ -d /opt/homebrew/lib ] && BUNDLER_SEARCH+=( -s /opt/homebrew/lib )
            [ -d /usr/local/lib ]    && BUNDLER_SEARCH+=( -s /usr/local/lib )
            for dy in "$DIST"/lib/libcvc*.dylib; do
              [ -e "$dy" ] || continue
              [ -L "$dy" ] && continue
              dylibbundler -b -x "$dy" -d "$DIST/lib" -p '@loader_path/' -of -cd "${BUNDLER_SEARCH[@]}" </dev/null || true
            done
          else
            # Static flavour: copy .a archives from the cvcpkg prefix.
            # No install_name fixup needed — static linkage embeds
            # object code directly.
            if [ -d "$DEPS/lib" ]; then
              find "$DEPS/lib" -maxdepth 1 -name '*.a' -print0 2>/dev/null \
                | xargs -0 -I {} cp -RP {} "$DIST/lib/" 2>/dev/null || true
            fi
          fi

          # ── Bundle VTK (no Qt) ──────────────────────────────────
          # Intentionally not bundled — see Linux section for rationale.

          ditto -c -k --sequesterRsrc --keepParent "$DIST" "$STEM.zip"
          # Archive already lives in $GITHUB_WORKSPACE ($PWD); no copy needed.
          du -sh "$DIST" "$STEM.zip" || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}
          path: |
            libcvc-*.zip
          if-no-files-found: error

  # ──────────────────────────── Windows ────────────────────────────
  windows:
    # windows-2022, not windows-latest -- matching ci.yml, which pins it and
    # passes. The label rolled to Visual Studio 18 overnight on 2026-08-19 and
    # CL.exe started crashing while compiling src/cvc/core/state_exec:
    #     error MSB6006: "CL.exe" exited with code -1073741819
    # which is 0xC0000005, an access violation -- the compiler itself, not the
    # code. Same commit built clean on VS 2022 hours earlier in ci.yml, so the
    # variable is the toolset. Nightly went 9-jobs red on the back of it.
    #
    # A release matrix should pin its toolchain anyway: unpinned, the artifacts
    # this workflow publishes change compiler whenever GitHub rolls the image.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libcvc-debug-shared
            kind: libcvc
            build_type: Debug
            link: shared
          - name: libcvc-release-shared
            kind: libcvc
            build_type: Release
            link: shared
          - name: libcvc-debug-static
            kind: libcvc
            build_type: Debug
            link: static
          - name: libcvc-release-static
            kind: libcvc
            build_type: Release
            link: static
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          if [ -n "${{ inputs.rolling_tag }}" ]; then
            VERSION="${VERSION}-${{ inputs.rolling_tag }}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ matrix.link }}" = "static" ]; then
            LINKSFX="-static"
          else
            LINKSFX=""
          fi
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "arch=x86_64"       >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"
          echo "linksfx=$LINKSFX"  >> "$GITHUB_OUTPUT"

      # ── Pull all third-party deps from cvcpkg ──
      # cvcpkg is the sole source of truth for third-party components.
      # On miss (network blip, catalog outage) CMake configure fails
      # with an explicit "Could not find X" error — there is no vcpkg
      # or source-build fallback.
      #
      # NOTE: the Windows cvcpkg prefix is shared-only. Static matrix
      # entries also consume the shared prefix: libcvc itself stays
      # static (BUILD_SHARED_LIBS=OFF) but third-party deps link as
      # DLLs. The Configure step below then switches the MSVC runtime
      # to /MD so libcvc objects can safely cross API boundaries with
      # the shared-CRT-built deps.
      - name: Fetch libcvc-deps (Windows)
        id: libcvc-deps-windows
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          build_type: ${{ matrix.build_type }}
          link: shared

      # CUDA toolkit so the shipped Windows artifacts can offload to
      # NVIDIA GPUs at runtime when an NVIDIA driver is present. cudart
      # is linked statically (CMAKE_CUDA_RUNTIME_LIBRARY=Static below)
      # so users only need the NVIDIA driver, not a CUDA install.
      - name: Install CUDA toolkit (Windows)
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.5.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Configure
        shell: pwsh
        run: |
          $xmlrpc = 'ON'
          $depsPath = '${{ steps.libcvc-deps-windows.outputs.path }}'
          if (-not $depsPath) {
            $depsPath = if ($env:LIBCVC_DEPS_PREFIX) { $env:LIBCVC_DEPS_PREFIX } else { 'D:\libcvc-deps' }
            if (-not (Test-Path $depsPath)) { $depsPath = '' }
          }
          # The Windows cvcpkg prefix is shared-only. Static matrix
          # entries still consume the shared prefix: libcvc stays
          # static (BUILD_SHARED_LIBS=OFF) but its third-party deps
          # link as DLLs. Force /MD (DLL CRT) so libcvc objects can
          # cross API boundaries with the /MD-built deps DLLs without
          # heap mismatches.
          if ('${{ matrix.link }}' -eq 'static') {
            $shared = 'OFF'
          } else {
            $shared = 'ON'
          }
          $msvcrt = 'MultiThreaded$<$<CONFIG:Debug>:Debug>DLL'
          # cvcpkg is the sole third-party prefix. No vcpkg toolchain
          # file, no aqt Qt6, no VTK source cache.
          $qtPrefix = if ($depsPath) { $depsPath } else { '' }
          cmake -B build `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_CONFIGURATION_TYPES=${{ matrix.build_type }} `
            -DCMAKE_PREFIX_PATH="$qtPrefix" `
            -DBUILD_SHARED_LIBS=$shared `
            -DCMAKE_MSVC_RUNTIME_LIBRARY="$msvcrt" `
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON `
            -DCVC_BUILD_TESTS=OFF `
            -DCVC_USING_XMLRPC=$xmlrpc `
            -DCVC_ENABLE_CUDA=ON `
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static `
            -DDISABLE_CGAL=OFF `
            -DCVC_ENABLE_MESHER=ON `
            -DCVC_ENABLE_SDF=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Stage libcvc + bundle deps
        if: matrix.kind == 'libcvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stem = "libcvc-${{ steps.meta.outputs.version }}-windows-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}${{ steps.meta.outputs.linksfx }}"
          $dist = Join-Path $env:GITHUB_WORKSPACE $stem
          if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
          cmake --install build --prefix $dist --config ${{ matrix.build_type }} --component libcvc

          $isDebug = '${{ matrix.build_type }}' -eq 'Debug'

          # ── libcvc's own PDB ─────────────────────────────────────
          # CMake's install(TARGETS) doesn't ship .pdb files by default
          # on MSVC. For Debug we always want them; copy from the build
          # tree manually so symbolicated stack traces work for
          # downstream consumers that link a libcvc Debug build.
          if ($isDebug) {
            New-Item -ItemType Directory -Force -Path "$dist/bin","$dist/lib" | Out-Null
            Get-ChildItem -Path build -Recurse -Include *.pdb -File `
              | Where-Object { $_.Name -like 'cvc*.pdb' -or $_.Name -like 'xmlrpc*.pdb' } `
              | ForEach-Object {
                  # DLL pdbs live next to the .dll (so → bin); static
                  # compile-time pdbs (vc*.pdb-ish) sit next to the
                  # .lib (so → lib). Drop them into both for simplicity;
                  # consumers don't care which dir they're in.
                  Copy-Item $_.FullName -Destination "$dist/bin/" -Force -ErrorAction SilentlyContinue
                  Copy-Item $_.FullName -Destination "$dist/lib/" -Force -ErrorAction SilentlyContinue
                }
          }

          # ── third-party deps: from cvcpkg (libcvc-deps prefix) ──
          # The cvcpkg prefix is laid out flat under $depsPath with
          # include/, lib/, bin/ at the root (shared build, no debug/
          # subtree). Debug bundles include .pdb files alongside the
          # DLLs and .lib import libs.
          $depsPath = '${{ steps.libcvc-deps-windows.outputs.path }}'
          if (-not $depsPath) {
            $depsPath = if ($env:LIBCVC_DEPS_PREFIX) { $env:LIBCVC_DEPS_PREFIX } else { 'D:\libcvc-deps' }
            if (-not (Test-Path $depsPath)) {
              throw "cvcpkg prefix not found (checked steps.libcvc-deps-windows.outputs.path and $depsPath)"
            }
          }
          $libSrc = Join-Path $depsPath 'lib'
          $binSrc = Join-Path $depsPath 'bin'
          $incSrc = Join-Path $depsPath 'include'
          $havePdbs = $isDebug

          New-Item -ItemType Directory -Force -Path "$dist/lib","$dist/include" | Out-Null
          if (Test-Path $incSrc) {
            Copy-Item -Recurse -Force "$incSrc/*" "$dist/include/"
          }
          if (Test-Path $libSrc) {
            $patterns = if ($havePdbs) { @('*.lib','*.pdb') } else { @('*.lib') }
            foreach ($p in $patterns) {
              Get-ChildItem -Path $libSrc -Filter $p -File `
                | Copy-Item -Destination "$dist/lib/" -Force
            }
          }
          # Third-party DLLs always ship because the Windows cvcpkg
          # prefix is shared-only, even for static matrix entries
          # (libcvc itself is still .lib; consumers load the shipped
          # DLLs at runtime).
          $shipBin = $true
          if ($shipBin) {
            New-Item -ItemType Directory -Force -Path "$dist/bin" | Out-Null
            if (Test-Path $binSrc) {
              $patterns = if ($havePdbs) { @('*.dll','*.pdb') } else { @('*.dll') }
              foreach ($p in $patterns) {
                Get-ChildItem -Path $binSrc -Filter $p -File `
                  | Copy-Item -Destination "$dist/bin/" -Force
              }
            }
          }

          # ── Bundle VTK (no Qt) ──────────────────────────────────
          # Intentionally not bundled — see Linux section for rationale.

          Compress-Archive -Path "$dist/*" -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "$stem.zip") -Force
          "$stem staged at $dist" | Write-Host
          Get-ChildItem "$env:GITHUB_WORKSPACE/$stem.zip" | Format-List Name,Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.name }}
          path: |
            libcvc-*.zip
          if-no-files-found: error

  # ──────────────────────────── Release ────────────────────────────
  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Recreate rolling tag (nightly mode)
        if: ${{ inputs.rolling_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLING_TAG: ${{ inputs.rolling_tag }}
        run: |
          set -euo pipefail
          # Best-effort cleanup of any previous rolling release so the
          # asset list is exactly what this run produced.
          gh release delete "$ROLLING_TAG" --yes --cleanup-tag 2>/dev/null || true
          git tag -f "$ROLLING_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$ROLLING_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.rolling_tag != '' && inputs.rolling_tag || github.ref_name }}
          name: ${{ inputs.rolling_tag != '' && format('Nightly ({0})', github.sha) || '' }}
          prerelease: ${{ inputs.prerelease }}
          # Preserve the curated release body (set manually before tagging
          # or via `gh release edit`). With generate_release_notes: false
          # and no `body`/`body_path` input, softprops does not touch the
          # body field when updating an existing release — only assets are
          # uploaded. Re-running the workflow on the same tag (e.g. after
          # an artifact-only fix) will not clobber hand-written release
          # notes.
          generate_release_notes: false
          # Explicit prefixes so stray files from third-party actions
          # (e.g. cuda_keyring.deb from Jimver/cuda-toolkit) can never
          # ride along into a release attachment list.
          files: |
            artifacts/libcvc-*.tar.gz
            artifacts/libcvc-*.zip
