name: CI/CD

on:
  # perf/** too: the state_exec lock phases are reviewed as drafts stacked on perf/locks-*
  # branches, and they need the full set of jobs, the sanitizer jobs included.
  pull_request:
    branches: [ main, master, develop, 'perf/**' ]
  push:
    # ci/full/**: a branch pushed there gets master's push run, heavy suites included, which
    # pull_request runs skip. For proving a change to those suites, or to how they run, before
    # it merges.
    branches: [ main, master, 'ci/full/**' ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Line-coverage gate (percent), enforced by the "Enforce coverage gate"
# step in package-linux / libcvc-debug. The number is computed over the
# supported in-repo surface only: src/ + inc/, minus test code, the
# vendored XmlRpc++ tree (src/xmlrpc) and the vendored contour-spectrum
# tree (docs/roadmap/COVERAGE_IMPROVEMENT_PLAN.md §4, Option A).
env:
  COVERAGE_MIN: '80'

# Concurrency: split into two pools.
#  * Cheap jobs (format-check, test) cancel in-progress on new pushes for
#    fast feedback.
#  * Heavy package jobs use job-level concurrency that does NOT cancel
#    in-progress, so a long VTK build always finishes and seeds
#    its cache. Without this, a push during a 22-min VTK build cancels
#    the run before the post-job cache save can fire, which traps the
#    workflow in a permanent cold-cache state.
#
# (Defined per-job below.)
#
# Workflow level, pushes only (master, tags, ci/full/**): one run per ref at
# a time, and a newer push replaces that ref's run still waiting to start.
# cancel-in-progress stays false, so a running run finishes and its package
# jobs seed their caches. Merges land faster than a 20-job run clears the
# account's shared runners, so without this every intermediate master
# commit's run queued behind the last (2026-10-30: seven full runs at once,
# with every other repo's jobs waiting behind them). Pull requests get a group
# of their own per run (github.run_id), so they behave as before: their cheap
# jobs cancel per job, their heavy jobs finish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('run-{0}', github.run_id) || format('push-{0}', github.ref) }}
  cancel-in-progress: false

# ───────────────────────────────────────────────────────────────────
# Per-PR / per-commit artifact set
#
# For every push and pull_request we produce the same artifact set
# released by release.yml so reviewers can QA a branch end-to-end
# before merging. CI artifacts include the short commit SHA in their
# filenames; tag-driven release artifacts (release.yml) deliberately
# omit it.
#
# Each artifact is uploaded individually with its full filename
# (extension included) as the artifact name, so the GitHub UI shows
# the format up front. (The download itself is always wrapped in a
# zip by GitHub Actions; that is a platform limitation and applies to
# every artifact regardless of inner format.)
#
# libcvc developer SDK (per OS, both Debug + Release):
#   - Linux:   libcvc-<ver>-<sha>-linux-<arch>-<config>.tar.gz
#   - macOS:   libcvc-<ver>-<sha>-macos-<arch>-<config>.zip
#   - Windows: libcvc-<ver>-<sha>-windows-<arch>-<config>.zip
#
# (The volrover3 end-user app moved to the volrover repository —
# https://github.com/transfix/volrover — along with its packaging.)
# ───────────────────────────────────────────────────────────────────

jobs:
  # ──────────────────── Recipe version drift ───────────────────
  #
  # CMakeLists.txt is the source of truth for the libcvc version, but
  # `cvcpkg pack` stamps bundles from each recipe's `upstream_version`
  # (the publish workflow passes no --version-override). When those
  # disagree the catalog ships a bundle labelled with the OLD version
  # carrying the NEW code — which is exactly what happened between
  # 3.2.4 and 3.3.0: the source moved and all 15 recipes stayed put.
  # Nothing errored, so it went unnoticed until release time.
  recipe-version:
    name: recipes match CMakeLists version
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-${{ github.ref }}-recipe-version
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Compare upstream_version against the project version
        shell: bash
        run: |
          set -euo pipefail
          want=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          if [ -z "$want" ]; then
            echo "::error::could not read VERSION from CMakeLists.txt"
            exit 1
          fi
          echo "CMakeLists.txt version: $want"
          bad=0
          for r in cvcpkg/recipes/*/recipe.yaml; do
            got=$(grep -oE '^  upstream_version: "[^"]+"' "$r" | head -1 | cut -d'"' -f2 || true)
            [ -n "$got" ] || continue
            if [ "$got" != "$want" ]; then
              echo "::error file=$r::upstream_version $got != CMakeLists $want"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "::error::Recipe versions have drifted from CMakeLists.txt."
            echo "::error::Bump upstream_version in every cvcpkg/recipes/*/recipe.yaml"
            echo "::error::and reset cvc_revision to 1 (it counts revisions OF a version)."
            exit 1
          fi
          echo "all recipes agree at $want"

  # ─────────────────────── Format check ────────────────────────
  #
  # Enforces .clang-format on lines changed by this PR/push.
  # A whole-tree format pass landed on master, so this job is now
  # strict: any unformatted change fails the build. Run
  # `git clang-format <merge-base>` locally before pushing, or
  # `clang-format -i <file>` on touched files.
  format-check:
    name: clang-format (changed lines)
    runs-on: ubuntu-24.04
    # Cheap job: cancel previous in-progress runs on new pushes for fast feedback.
    concurrency:
      group: ci-${{ github.ref }}-format-check
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # clang-format 18 (the major the tree is formatted with) and the Python
      # that runs git-clang-format, both from cvcpkg: nothing from apt.
      # python311 names its interpreter python3.11, so the check below calls
      # it explicitly rather than through git-clang-format's
      # #!/usr/bin/env python3, which would find the runner's.
      - name: Install clang-format (cvcpkg)
        run: |
          set -euo pipefail
          curl -fsSL https://cvcpkg.org/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          fmt="$RUNNER_TEMP/clang-format"
          cvcpkg install clang-format python311 --prefix "$fmt" \
            --config release --link shared --no-fallback-to-source
          "$fmt/bin/clang-format" --version
          echo "CVC_FMT=$fmt" >> "$GITHUB_ENV"

      - name: Determine merge base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # For push events, diff against the previous commit.
            base="${{ github.event.before }}"
            # Fallback for the very first push to a new branch.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD~1"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Run git-clang-format on changed lines
        run: |
          set -euo pipefail
          base="${{ steps.base.outputs.base }}"
          out=$("$CVC_FMT/bin/python3.11" "$CVC_FMT/bin/git-clang-format" \
                  --binary "$CVC_FMT/bin/clang-format" --diff "$base" -- \
                  '*.c' '*.cc' '*.cpp' '*.cxx' '*.m' '*.mm' \
                  '*.h' '*.hh' '*.hpp' '*.hxx' || true)
          if [ -z "$out" ] \
             || [ "$out" = "no modified files to format" ] \
             || [ "$out" = "clang-format did not modify any files" ]; then
            echo "Formatting OK on changed lines."
            exit 0
          fi
          echo "::error::clang-format would reformat changed lines. To apply:"
          echo "  git clang-format $base"
          echo
          echo "$out"
          exit 1

  # ─────────────── cvcGL browser-side JS (state shim, glsync, serve.py) ───────────────
  #
  # webgl_state_shadow.js (the --pre-js cvcgl_wasm_app links into every cvcGL wasm app), the
  # glsync census and serve.py's flags are plain JS / Python, tested under node against mock
  # WebGL contexts -- no browser and no wasm build. Only when those files changed: the node
  # comes from the cvcpkg emsdk bundle (hermetic, no apt), which is a big download.
  cvcgl-wasm-js:
    name: cvcGL wasm JS tests
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-${{ github.ref }}-cvcgl-wasm-js
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the browser-side files change?
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          run=true
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$base" HEAD -- src/cvcGL/wasm \
                   src/cvcGL/test/webgl_state_shadow_test.js \
                   .github/workflows/ci.yml | grep -q .; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "browser-side files changed: $run"

      - name: Provision node from the cvcpkg emsdk bundle
        if: steps.paths.outputs.run == 'true'
        run: |
          curl -fsSL https://cvcpkg.org/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          cvcpkg install emsdk --platform linux --prefix "$RUNNER_TEMP/emsdk" \
            --config release --link shared --no-fallback-to-source
          echo "CVC_EMSDK_DIR=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"

      - name: Run the JS tests
        if: steps.paths.outputs.run == 'true'
        run: src/cvcGL/wasm/run-js-tests.sh

  # ─────────────── cvc::physics: a native trace replayed in wasm (P7) ───────────────
  #
  # physics_replay_test replays src/cvc/tests/data/physics_replay_trace.json, recorded natively,
  # and requires the state_hash after every step: the recipe jobs run it natively (ctest), and
  # this one builds a minimal wasm-mt libcvc (no cvcGL, no codecs) on the catalog's Jolt and runs
  # it under the emsdk's node. Only when physics, what it builds on, or this file changed: the
  # emsdk is a big download.
  physics-wasm:
    name: physics replay (wasm-mt, node)
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-${{ github.ref }}-physics-wasm
      cancel-in-progress: true
    defaults:
      run:
        shell: bash # -eo pipefail: a failed install is not hidden behind `| tail`
    env:
      WASM_DEPS: ${{ github.workspace }}/wasm-deps
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did physics change?
        id: paths
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          run=true
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$base" HEAD -- src/cvc/physics inc/cvc/physics \
                   src/cvc/tests/physics_replay.cpp src/cvc/tests/data/physics_replay_trace.json \
                   src/cvc/geometry/height_field.cpp inc/cvc/geometry/height_field.h \
                   src/cvc/volume inc/cvc/volume CMakeLists.txt src/cvc/CMakeLists.txt CMake \
                   cvcpkg/recipes/libcvc .github/workflows/ci.yml | grep -q .; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "physics changed: $run"

      - name: Install cvcpkg, cmake/ninja and the Emscripten SDK from the catalog
        if: steps.paths.outputs.run == 'true'
        run: |
          curl -fsSL https://cvcpkg.org/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cvcpkg install cmake ninja --prefix "$RUNNER_TEMP/tools" --config release --link shared
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          cvcpkg install emsdk --platform linux --prefix "$RUNNER_TEMP/emsdk" \
            --config release --link shared --no-fallback-to-source
          test -f "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          echo "CVC_EMSDK_DIR=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"

      - name: Install the wasm-mt deps (boost, pegtl, Jolt, the compression libraries)
        if: steps.paths.outputs.run == 'true'
        run: |
          mkdir -p "$WASM_DEPS"
          for p in zlib bzip2 xz zstd boost pegtl joltphysics; do
            echo "=== $p ==="
            cvcpkg install "$p" --prefix "$WASM_DEPS" \
              --platform wasm-mt --arch wasm32 --config release --link static \
              --no-fallback-to-source 2>&1 | tail -3
          done

      - name: Build libcvc (wasm-mt, physics only) and physics_replay_test
        if: steps.paths.outputs.run == 'true'
        run: |
          # shellcheck disable=SC1091
          source "$CVC_EMSDK_DIR/emsdk_env.sh"
          emcmake cmake -G Ninja -S . -B build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH="$WASM_DEPS" -DCMAKE_PREFIX_PATH="$WASM_DEPS" \
            -DCVC_ENABLE_CUDA=OFF -DCVC_BUILD_TESTS=OFF -DCVC_BUILD_PHYSICS_REPLAY=ON \
            -DCVC_BUILD_CLI=OFF -DCVC_ENABLE_OPENMP=OFF -DDISABLE_CGAL=ON -DCVC_USING_HDF5=OFF \
            -DCVC_USING_IMOD_MRC=OFF -DCVC_ENABLE_IMAGEMAGICK=OFF -DCVC_ENABLE_FFTW=OFF \
            -DCVC_FFT_PROVIDER=none -DCVC_ENABLE_ASSIMP=OFF -DCVC_ENABLE_MESHER=OFF \
            -DCVC_ENABLE_SDF=OFF -DCVC_ENABLE_LIBIGL=OFF -DCVC_BUILD_LSYS_TOOLS=OFF \
            -DCVC_BUILD_CVCGL=OFF -DCVC_BUILD_EXAMPLES=OFF -DCVC_WASM_PTHREADS=ON \
            | tee configure.log
          grep -q "cvc::physics Jolt backend ENABLED" configure.log \
            || { echo "::error::the wasm-mt configure did not find Jolt"; exit 1; }
          cmake --build build-wasm --target physics_replay_test -j"$(nproc)"

      - name: Replay the native trace under node
        if: steps.paths.outputs.run == 'true'
        run: |
          node=$(ls "$CVC_EMSDK_DIR"/node/*/bin/node | head -1)
          "$node" --version
          # 77 (no cross-platform-deterministic Jolt) fails here too: the job exists to compare.
          "$node" build-wasm/bin/physics_replay_test.js src/cvc/tests/data/physics_replay_trace.json

  # ari in the browser (roadmap §16.4): the FTXUI terminal backend built for single-threaded wasm,
  # the target the gh-pages gallery serves (no COOP/COEP there). Builds the `ari` web target
  # (ari.js/ari.wasm + the xterm.js page, terminal_tour.ari baked in), then runs the same module
  # headless under node: `ari snapshot` must render the tour, which proves the wasm build has the
  # .ari loader (yaml-cpp) and the real backend (ftxui), not the stubs. The page is uploaded as an
  # artifact to try by hand (serve the directory over http and open ari.html). Only when Ariadne,
  # the runner or this file changed.
  ari-wasm:
    name: ari terminal backend (wasm, node)
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-${{ github.ref }}-ari-wasm
      cancel-in-progress: true
    defaults:
      run:
        shell: bash # -eo pipefail: a failed install is not hidden behind `| tail`
    env:
      WASM_DEPS: ${{ github.workspace }}/wasm-deps
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did Ariadne change?
        id: paths
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          run=true
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$base" HEAD -- src/cvc/ariadne inc/cvc/ariadne src/cvc/tools \
                   src/cvc/net inc/cvc/net \
                   src/ari examples/ariadne/terminal CMakeLists.txt src/cvc/CMakeLists.txt CMake \
                   src/cvc/image inc/cvc/image src/cvc/tests/image_magick_roundtrip.cpp \
                   src/cvc/state inc/cvc/state src/cvc/tests/state_exec_wasm_smoke.cpp \
                   cvcpkg/recipes/libcvc \
                   .github/workflows/ci.yml | grep -q .; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "ariadne changed: $run"

      - name: Install cvcpkg, cmake/ninja and the Emscripten SDK from the catalog
        if: steps.paths.outputs.run == 'true'
        run: |
          curl -fsSL https://cvcpkg.org/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cvcpkg install cmake ninja --prefix "$RUNNER_TEMP/tools" --config release --link shared
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          cvcpkg install emsdk --platform linux --prefix "$RUNNER_TEMP/emsdk" \
            --config release --link shared --no-fallback-to-source
          test -f "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          echo "CVC_EMSDK_DIR=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"

      - name: Install the wasm deps (boost, pegtl, yaml-cpp, ftxui, ImageMagick and its codecs)
        if: steps.paths.outputs.run == 'true'
        run: |
          mkdir -p "$WASM_DEPS"
          # imagemagick + the codec libraries its static MagickCore links: `ari --image` loads
          # pictures through cvc::image, so this link is where a missing codec closure shows.
          for p in zlib bzip2 xz zstd boost pegtl yaml-cpp ftxui \
                   imagemagick tiff libjpeg-turbo libpng libwebp lerc libxml2; do
            echo "=== $p ==="
            cvcpkg install "$p" --prefix "$WASM_DEPS" \
              --platform wasm --arch wasm32 --config release --link static \
              --no-fallback-to-source 2>&1 | tail -3
          done

      - name: Build the ari web target (wasm, single-threaded)
        if: steps.paths.outputs.run == 'true'
        run: |
          # shellcheck disable=SC1091
          source "$CVC_EMSDK_DIR/emsdk_env.sh"
          emcmake cmake -G Ninja -S . -B build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH="$WASM_DEPS" -DCMAKE_PREFIX_PATH="$WASM_DEPS" \
            -DCVC_ENABLE_CUDA=OFF -DCVC_BUILD_TESTS=OFF -DCVC_BUILD_CLI=OFF \
            -DCVC_ENABLE_OPENMP=OFF -DDISABLE_CGAL=ON -DCVC_USING_HDF5=OFF \
            -DCVC_USING_IMOD_MRC=OFF -DCVC_ENABLE_IMAGEMAGICK=ON -DCVC_ENABLE_FFTW=OFF \
            -DCVC_FFT_PROVIDER=none -DCVC_ENABLE_ASSIMP=OFF -DCVC_ENABLE_MESHER=OFF \
            -DCVC_BUILD_CVCGL=OFF -DCVC_BUILD_EXAMPLES=OFF -DCVC_WASM_PTHREADS=OFF \
            -DCVC_BUILD_IMAGE_MAGICK_ROUNDTRIP=ON -DCVC_BUILD_STATE_EXEC_WASM_SMOKE=ON \
            -DCVC_ARI_WASM_TEST_DOCS=ON \
            | tee configure.log
          # CMAKE_PREFIX_PATH lets pkg-config see MagickCore.pc, so the stock FindImageMagick
          # tier makes the targets, the one whose static codec closure the ari link needs
          # src/cvc/CMakeLists.txt to add. HDRI=1 is what the Q16HDRI library was built with.
          grep -q "ImageMagick found: .*(Q16, HDRI=1)" configure.log \
            || { echo "::error::the wasm configure did not find ImageMagick (Q16 HDRI)"; exit 1; }
          grep -q "Ariadne: .ari YAML loader ENABLED" configure.log \
            || { echo "::error::the wasm configure did not find yaml-cpp (the .ari loader is a stub)"; exit 1; }
          grep -q "Ariadne: FTXUI terminal backend ENABLED" configure.log \
            || { echo "::error::the wasm configure did not find ftxui (the terminal backend is a stub)"; exit 1; }
          cmake --build build-wasm --target ari image_magick_roundtrip_test state_exec_wasm_smoke \
            -j"$(nproc)"
          ls -la build-wasm/bin/ari.html build-wasm/bin/ari.js build-wasm/bin/ari.wasm

      - name: Render the baked tour under node
        if: steps.paths.outputs.run == 'true'
        run: |
          node=$(ls "$CVC_EMSDK_DIR"/node/*/bin/node | head -1)
          "$node" build-wasm/bin/ari.js snapshot --width 100 --height 24 /terminal_tour.ari \
            | tee snapshot.txt
          for want in "Controls" "Status" "Layout" "agents: 64" "Belief: < shared >"; do
            grep -qF "$want" snapshot.txt \
              || { echo "::error::the wasm ari snapshot is missing '$want'"; exit 1; }
          done

      - name: Make requests from the wasm ari under node
        # The page's network path: the fetch backend (node's fetch behind an XMLHttpRequest shim)
        # under the single-threaded build's inline verbs. tests/net_probe.ari signs in (two tokens
        # from one reply), refreshes with a form credential and fetches with the refreshed token
        # against tests/net_probe_server.py, and is refused another origin. No token may reach the
        # output.
        if: steps.paths.outputs.run == 'true'
        run: |
          node=$(ls "$CVC_EMSDK_DIR"/node/*/bin/node | head -1)
          python3 src/ari/tests/net_probe_server.py > probe-port.txt &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 50); do [ -s probe-port.txt ] && break; sleep 0.1; done
          base="http://127.0.0.1:$(cat probe-port.txt)"
          timeout 120 "$node" --require ./src/ari/tests/xhr-shim.cjs build-wasm/bin/ari.js \
            snapshot --net-allow "$base" --width 140 --height 14 /tests/net_probe.ari \
            --base "$base" 2>&1 | tee probe.txt
          for want in "device: true" "refresh: true" "me: 200" \
                      "https://evil.example is not an origin this host allows" '[redacted]'; do
            grep -qF "$want" probe.txt \
              || { echo "::error::the wasm ari's network check is missing '$want'"; exit 1; }
          done
          if grep -qE 'cvc(ses|ref)_' probe.txt; then
            echo "::error::a token reached the wasm ari's output"; exit 1
          fi

      - name: Frames go on while a request is out (L4)
        # The single-threaded build's requests are started, not sent in place: the browser's
        # fetch answers from the event loop while the frame loop goes on. tests/l4_frames.ari
        # counts the frames that ran while tests/net_probe_server.py's /v1/slow took its second;
        # a request that blocked the frame loop would leave that near 0.
        if: steps.paths.outputs.run == 'true'
        run: |
          node=$(ls "$CVC_EMSDK_DIR"/node/*/bin/node | head -1)
          python3 src/ari/tests/net_probe_server.py > probe-port.txt &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 50); do [ -s probe-port.txt ] && break; sleep 0.1; done
          base="http://127.0.0.1:$(cat probe-port.txt)"
          timeout 120 "$node" --require ./src/ari/tests/xhr-shim.cjs build-wasm/bin/ari.js \
            snapshot --net-allow "$base" --width 100 --height 9 /tests/l4_frames.ari \
            --base "$base" 2>&1 | tee l4.txt
          grep -qF "status: 200" l4.txt \
            || { echo "::error::the slow request did not come back"; exit 1; }
          frames=$(sed -n 's/.*frames while out: \([0-9][0-9]*\).*/\1/p' l4.txt | head -1)
          if [ -z "$frames" ] || [ "$frames" -lt 20 ]; then
            echo "::error::only '${frames}' frames ran while the request was out (L4)"; exit 1
          fi
          echo "frames while the request was out: $frames"

      - name: Frames go on while a WebSocket connects and waits (L4)
        # ws-open and ws-recv are started in the single-threaded build too, answered by the
        # browser WebSocket's callbacks (node 22 has one). tests/l4_ws.ari counts the frames that
        # ran while tests/ws_probe_server.py took a second to answer the handshake and another to
        # send its message; a connect or a wait that blocked the frame loop would leave them near 0.
        if: steps.paths.outputs.run == 'true'
        run: |
          node=$(ls "$CVC_EMSDK_DIR"/node/*/bin/node | head -1)
          python3 src/ari/tests/ws_probe_server.py > ws-port.txt &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 50); do [ -s ws-port.txt ] && break; sleep 0.1; done
          port=$(cat ws-port.txt)
          timeout 120 "$node" build-wasm/bin/ari.js snapshot --net-allow "http://127.0.0.1:$port" \
            --width 100 --height 10 /tests/l4_ws.ari --url "ws://127.0.0.1:$port/" 2>&1 \
            | tee l4ws.txt
          grep -qF "message: slow hello" l4ws.txt \
            || { echo "::error::the WebSocket message did not come back"; exit 1; }
          for what in connecting waiting; do
            n=$(sed -n "s/.*frames while $what: \([0-9][0-9]*\).*/\1/p" l4ws.txt | head -1)
            if [ -z "$n" ] || [ "$n" -lt 20 ]; then
              echo "::error::only '${n}' frames ran while the WebSocket was $what (L4)"; exit 1
            fi
            echo "frames while the WebSocket was $what: $n"
          done

      - name: Round-trip images through ImageMagick under node
        # The link above only proves the codec libraries resolve. This proves Magick works at run
        # time: its coders are registered (an empty registry once failed every read and write
        # while everything still linked) and TIFF / WEBP, which only Magick handles, round-trip.
        # 77 would mean a build without ImageMagick, which the configure check rules out.
        if: steps.paths.outputs.run == 'true'
        run: |
          node=$(ls "$CVC_EMSDK_DIR"/node/*/bin/node | head -1)
          "$node" build-wasm/bin/image_magick_roundtrip_test.js

      - name: with-lock without threads under node
        # The state_exec locks on a build with no pthreads (CVC_WASM_PTHREADS=OFF): a section, a
        # waiter granted once its holder lets go, an empty lock-query, on both schedulers.
        if: steps.paths.outputs.run == 'true'
        run: |
          node=$(ls "$CVC_EMSDK_DIR"/node/*/bin/node | head -1)
          set +e
          "$node" build-wasm/bin/state_exec_wasm_smoke.js | tee smoke.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] || ! grep -qx "STATE_EXEC_WASM_OK" smoke.txt; then
            echo "::error::state_exec_wasm_smoke failed (exit $status)"
            exit 1
          fi

      - name: Upload the ari web page
        if: steps.paths.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ari-web
          path: |
            build-wasm/bin/ari.html
            build-wasm/bin/ari.js
            build-wasm/bin/ari.wasm
            build-wasm/bin/ari-web.js
            build-wasm/bin/ari-web.css
            build-wasm/bin/xterm/

  # arigl-web, the stock browser host (cvcpkg/recipes/arigl-web): arigl, and ari's terminal page,
  # built to single-threaded wasm with no documents of their own, by the recipe's own script (which
  # prints the .wasm/.js sizes, raw, gzip and brotli). Then a headless Chrome loads both pages the
  # way a site serves them, from an ordinary path with no COOP/COEP and under a strict
  # Content-Security-Policy (any violation fails): a document set from the page's origin must load
  # and run (on ari's terminal, its text must show), and a cross-origin or missing src must show
  # the error (src/arigl/web/test/arigl_web_smoke.mjs). xterm.js for ari's page comes from the
  # prefix's xterm-js packages when installed, else the pinned npm download. Only when the pages,
  # their document loader, the recipe or this file changed: it builds libcvc and cvcGL for wasm.
  arigl-web:
    name: arigl-web shell + ari page (wasm, headless Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    concurrency:
      group: ci-${{ github.ref }}-arigl-web
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    env:
      WASM_DEPS: ${{ github.workspace }}/wasm-deps
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the shell change?
        id: paths
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          run=true
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$base" HEAD -- src/arigl src/ari \
                   inc/cvc/ariadne/doc_fetch.h src/cvc/ariadne/doc_fetch.cpp \
                   inc/cvc/ariadne/web_document.h src/cvc/ariadne/web_document.cpp \
                   src/cvc/tests/data/ariadne_docset src/cvcGL/wasm cvcpkg/recipes/arigl-web \
                   .github/workflows/ci.yml | grep -q .; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "arigl-web changed: $run"

      - name: Install cvcpkg, cmake/ninja and the Emscripten SDK from the catalog
        if: steps.paths.outputs.run == 'true'
        run: |
          curl -fsSL https://cvcpkg.org/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cvcpkg install cmake ninja --prefix "$RUNNER_TEMP/tools" --config release --link shared
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          cvcpkg install emsdk --platform linux --prefix "$RUNNER_TEMP/emsdk" \
            --config release --link shared --no-fallback-to-source
          test -f "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          echo "CVC_EMSDK_DIR=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"

      - name: Install the recipe's wasm deps, and xterm.js for ari's pages
        if: steps.paths.outputs.run == 'true'
        run: |
          cvcpkg install-deps cvcpkg/recipes/arigl-web --prefix "$WASM_DEPS" \
            --platform wasm --arch wasm32 --config release --link static --no-fallback-to-source
          # Noarch, so not resolvable from the recipe's (static) wasm deps: the recipe says why.
          cvcpkg install xterm-js xterm-js-addon-fit xterm-js-addon-webgl --prefix "$WASM_DEPS" \
            --platform any --config release --link shared --no-fallback-to-source

      - name: Build arigl-web (wasm, single-threaded) with the recipe's script
        if: steps.paths.outputs.run == 'true'
        run: |
          CVC_SOURCE_DIR="$GITHUB_WORKSPACE" CVC_BUILD_DIR="$GITHUB_WORKSPACE/build-arigl-web" \
          CVC_INSTALL_DIR="$GITHUB_WORKSPACE/stage-arigl-web" CVC_DEPS_PREFIX="$WASM_DEPS" \
          CVC_PLATFORM=wasm bash cvcpkg/recipes/arigl-web/build-wasm.sh
          ls -la stage-arigl-web/share/arigl-web
          grep -q "ari: xterm.js for the browser page from $WASM_DEPS/share/xterm.js" \
            build-arigl-web/configure.log \
            || { echo "::error::ari's page did not take xterm.js from the prefix's xterm-js packages"; exit 1; }

      - name: Load a document set in headless Chrome
        if: steps.paths.outputs.run == 'true'
        run: |
          node=$(ls "$CVC_EMSDK_DIR"/node/*/bin/node | head -1)
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          "$chrome" --version
          "$node" src/arigl/web/test/arigl_web_smoke.mjs --web stage-arigl-web/share/arigl-web \
            --docset src/cvc/tests/data/ariadne_docset --chrome "$chrome"

      - name: Upload the arigl-web shell
        if: steps.paths.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: arigl-web
          path: stage-arigl-web/share/arigl-web

  # ──────────────────────────── Linux packaging ────────────────────────────
  #
  # Mirrors release.yml's linux job exactly, but injects -<sha> into
  # the artifact filename stem and uploads each output file as its own
  # GitHub artifact so the format/extension is visible in the UI.
  package-linux:
    runs-on: ubuntu-latest
    # Non-blocking for experimental matrix entries (the static-grpc probe below),
    # mirroring package-macos/package-windows: a new static-link grpc probe must
    # not fail the required Linux check while it is being proven out.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libcvc-debug
            kind: libcvc
            build_type: Debug
          - name: libcvc-release
            kind: libcvc
            build_type: Release
          - name: libcvc-debug-grpc
            kind: libcvc
            build_type: Debug
            enable_grpc: true
          # Release gRPC: the config publish-cvcpkg.yml ships on Linux (CVC_ENABLE_GRPC=ON). The
          # debug-grpc lane proves the surface compiles+tests with asserts; this proves it in the
          # OPTIMIZED build we actually ship, so a Release-only grpc break is caught before publish.
          - name: libcvc-release-grpc
            kind: libcvc
            build_type: Release
            enable_grpc: true
          # Static-link gRPC lane: same as release-grpc but installs the static
          # grpc closure (cvcpkg --link static) and links it into libcvc, catching
          # a static-only grpc break. BLOCKING (promoted from probe): green on every run.
          - name: libcvc-release-grpc-static
            kind: libcvc
            build_type: Release
            enable_grpc: true
            grpc_link: static
    name: package-linux / ${{ matrix.name }}
    # Heavy job (VTK from-source build): do NOT cancel in-progress runs.
    # Cancellation strands the cache and forces every subsequent run
    # back through a 22-min cold rebuild. Once a run completes, the
    # cache is warm and future runs are fast.
    concurrency:
      group: ci-${{ github.ref }}-package-linux-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          SHA=$(git rev-parse --short=8 HEAD)
          ARCH=$(uname -m)
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"          >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH"        >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"

      # Everything this job builds with comes from cvcpkg, as in release.yml:
      # the third-party libraries (next step), cmake/ninja/pkg-config, the
      # CUDA toolkit, gRPC, VTK, the software GL stack and lcov. Nothing comes
      # from apt; the compiler is the runner image's GCC.

      # ── Pull dep bundle from libcvc-deps (via cvcpkg) ──
      # The bundle provides the `libiimod` CMake package (no longer
      # vendored in this tree) plus Boost/HDF5/GSL/ImageMagick/CGAL/
      # log4cplus prebuilt. There is no fallback build path — if
      # cvcpkg cannot fetch the components, CMake configure will fail
      # with an explicit "Could not find X", which is the right signal.
      - name: Fetch libcvc-deps
        id: libcvc-deps
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          build_type: Release
          link: shared

      - name: Install build tools (cvcpkg)
        uses: ./.github/actions/cvcpkg-build-tools

      # lcov for the coverage lanes: cvcpkg's lcov 2.0 (the release Ubuntu
      # 24.04's apt package was, so capture and --ignore-errors behave the
      # same), with the cvcpkg perl it runs on. Its own prefix, and not on
      # PATH: that prefix's bin/ holds a perl, which the build has no business
      # finding. Configure hands the paths to the `coverage` target and the
      # report step calls them directly.
      - name: Install lcov (cvcpkg)
        if: matrix.kind == 'libcvc' && matrix.build_type == 'Debug'
        run: |
          set -euo pipefail
          lcov_prefix="$RUNNER_TEMP/lcov"
          cvcpkg install lcov --prefix "$lcov_prefix" --config release --link shared
          "$lcov_prefix/bin/lcov" --version
          echo "LCOV_PREFIX=$lcov_prefix" >> "$GITHUB_ENV"

      # CUDA toolkit so the shipped artifacts can offload to NVIDIA GPUs
      # at runtime when an NVIDIA driver is present. cudart is linked
      # statically (CMAKE_CUDA_RUNTIME_LIBRARY=Static below) so users
      # only need the NVIDIA driver, not a CUDA install. cvcpkg's
      # cuda-toolkit recipe, in a prefix of its own; the action exports
      # CUDACXX, which Configure's Ninja build picks up.
      - name: Install CUDA toolkit (cvcpkg)
        uses: ./.github/actions/cvcpkg-cuda-toolkit

      # ── gRPC, hermetically via cvcpkg (NOT apt) ──
      # The distributed-state gRPC transport (CVC_ENABLE_GRPC) needs grpc +
      # protobuf + grpc_cpp_plugin + protoc. Pull them from the published cvcpkg
      # bundle (a ~10 MB shared/release download whose closure includes
      # protobuf/abseil/openssl) into a dedicated prefix that the configure step
      # appends to CMAKE_PREFIX_PATH, so find_package(gRPC CONFIG)/
      # find_package(Protobuf CONFIG) and the grpc_cpp_plugin/protoc executables
      # resolve there. cvcpkg is on PATH because fetch-libcvc-deps pip-installed
      # it. This replaces the former `apt-get install libgrpc++-dev …`, which
      # violated the hermetic toolchain rule. Only the enable_grpc lane runs it.
      - name: Provision gRPC via cvcpkg
        if: ${{ matrix.enable_grpc == true }}
        shell: bash
        run: |
          set -euo pipefail
          # A DEDICATED prefix (not the libcvc-deps bundle prefix): grpc's
          # closure includes zlib/openssl/protobuf, which could collide with
          # the libcvc-deps bundle's own copies if co-installed. Keeping it
          # separate and adding it to CMAKE_PREFIX_PATH (below) is conflict-free
          # — CMake searches both.
          grpc_prefix="$RUNNER_TEMP/grpc-prefix"
          cvcpkg install grpc protobuf --prefix "$grpc_prefix" --config release --link ${{ matrix.grpc_link || 'shared' }}
          echo "GRPC_PREFIX=$grpc_prefix" >> "$GITHUB_ENV"

      # ── VTK, for cvcGL ──
      # cvcGL's tests are the only coverage the scene graph gets, and until this
      # step existed they never ran anywhere: CVC_BUILD_CVCGL defaults OFF, no
      # workflow set it, and src/CMakeLists.txt never adds the subdirectory — so
      # none of the cvcgl_* add_test() calls was ever configured.
      #
      # VTK is NOT in the libcvc dependency closure the step above installs
      # (libcvc itself does not need it; cvcGL does), so it has to be added
      # explicitly or find_package(VTK REQUIRED) in src/cvcGL/CMakeLists.txt
      # hard-fails. cvcpkg is on PATH here because the action pip-installs it.
      #
      # xorgproto is separate on purpose: cvcGL's find_package(VTK) re-runs
      # VTK's FindX11, which needs X11/X.h, but xorgproto is only a *build* dep
      # of the libx11/libxext recipes — so installing vtk pulls those libs at
      # runtime without their protocol headers and X11_X11_INCLUDE_PATH goes
      # unfound. Everything else (libx11/libxext/libxt/libglvnd/glu) rides along
      # hermetically with the vtk bundle; there is nothing to apt-get.
      - name: Install VTK for cvcGL
        if: matrix.kind == 'libcvc'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ steps.libcvc-deps.outputs.path }}" ]; then
            prefix="${{ steps.libcvc-deps.outputs.path }}"
          else
            prefix="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          cvcpkg install vtk xorgproto --prefix "$prefix" --config release --link shared
          # The Ariadne optional deps (cvc::ariadne in libcvc core): yaml-cpp (.ari
          # loader), nlohmann-json + json-schema-validator (.ari Layer-2 schema
          # validation, §15), ftxui (the terminal backend, §16.4), tvision (+ ncurses:
          # the native-desktop terminal backend, §16.5). The libcvc recipe declares
          # them for linux, macos and windows, so fetch-libcvc-deps installs them on
          # every package-* lane; this line only re-asserts them for the Linux lanes.
          # With them present the loader/backends compile their REAL paths (not the
          # stubs), so CI exercises Layer-2 + both terminal backends.
          cvcpkg install yaml-cpp nlohmann-json json-schema-validator ftxui tvision \
            --prefix "$prefix" --config release --link shared
          # imgui: cvcGL's ImGuiOverlay and the Ariadne ImGui backend. Without it both
          # compile to inert stubs and cvcgl_ari_golden (the backend's golden images,
          # docs/ARIADNE.md section 12) has nothing to render.
          # sdl3: cvcGL's onscreen window (SdlWindow.h: SDL owns the window and its GL
          # context, here on Xvfb) and the SdlInput / capture seam, as the shipped cvcgl
          # recipe has them. Without it cvcGL falls back to VTK's window and
          # cvcgl_sdl_attach skips.
          cvcpkg install imgui sdl3 --prefix "$prefix" --config release --link shared

      - name: Configure
        run: |
          # libcvc needs libiimod from the libcvc-deps bundle. Fall
          # back to the default cvcpkg-install prefix when the step
          # gracefully returned empty (e.g. a single-bundle download
          # failed but earlier bundles unpacked into $HOME/libcvc-deps).
          if [ -n "${{ steps.libcvc-deps.outputs.path }}" ]; then
            extra_prefix="${{ steps.libcvc-deps.outputs.path }}"
          else
            extra_prefix="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          # The gRPC lane provisions grpc into its own prefix (see "Provision
          # gRPC via cvcpkg"); add it so find_package(gRPC/Protobuf) resolves.
          if [ -n "${GRPC_PREFIX:-}" ]; then
            extra_prefix="$extra_prefix;$GRPC_PREFIX"
          fi
          # Enable tests so the same artifacts we ship get exercised
          # by ctest.
          tests=ON
          coverage=OFF
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            coverage=ON
          fi
          # Build cvcGL (and run its cvcgl_* tests) in EVERY libcvc job, the
          # coverage lanes included: src/cvcGL/*.cpp is part of the coverage
          # denominator. Measured 2026-10-16 (Debug, CUDA-off): cvcGL's own line
          # coverage is ~74%, so folding its ~13k instrumented lines into the
          # gate drops the blended number ~2 points and it stays above
          # COVERAGE_MIN. (cvcGL used to be kept OFF on the coverage lanes to
          # avoid the denominator hit; that was overcautious.) The lcov filter
          # extracts src/* and the local `coverage` target does the same, so both
          # already include cvcGL once it is built — no lockstep edit needed.
          cvcgl=ON
          grpc=OFF
          if [ "${{ matrix.enable_grpc }}" = "true" ]; then
            grpc=ON
          fi
          # The coverage lanes' lcov is not on PATH (see "Install lcov"); hand
          # it to the `coverage` target directly.
          cov_tools=()
          if [ "$coverage" = "ON" ]; then
            cov_tools=(-DLCOV_PATH="$LCOV_PREFIX/bin/lcov"
                       -DGENHTML_PATH="$LCOV_PREFIX/bin/genhtml")
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="$extra_prefix" \
            -DCVC_BUILD_TESTS=$tests \
            -DCVC_BUILD_CVCGL=$cvcgl \
            -DCVC_ENABLE_COVERAGE=$coverage \
            "${cov_tools[@]}" \
            -DCVC_ENABLE_CUDA=ON \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static \
            -DDISABLE_CGAL=OFF \
            -DCVC_ENABLE_MESHER=ON \
            -DCVC_ENABLE_SDF=ON \
            -DCVC_ENABLE_WS=$grpc \
            -DCVC_ENABLE_GRPC=$grpc \
            | tee configure.log

      # The terminal backends are optional at configure time: without ftxui / tvision the
      # backends compile to stubs and the AriadneFtxui / AriadneTvision tests SKIP instead of
      # failing, which is how the macOS and Windows lanes ran them until the libcvc recipe declared
      # ftxui there. Make a missing backend a failure.
      # Likewise SDL3: without it cvcGL's onscreen window is VTK's and cvcgl_sdl_attach skips.
      - name: Assert the Ariadne terminal backends and cvcGL's SDL3 are configured
        shell: bash
        run: |
          for want in "Ariadne: FTXUI terminal backend ENABLED" "Ariadne: tvision terminal backend ENABLED"; do
            grep -qF "$want" configure.log \
              || { echo "::error::the configure did not print '$want': the Ariadne terminal tests would only skip"; exit 1; }
          done
          grep -qF "cvcGL: SDL3 input/peripheral seam ENABLED" configure.log \
            || { echo "::error::the configure found no SDL3: cvcGL's SDL window would go untested"; exit 1; }

      - name: Build
        run: cmake --build build --parallel

      # ── a software GL driver, so the two RENDERING cvcGL tests can run ──
      # 11 of the 13 cvcgl_* tests only inspect scene/state and need no GL at
      # all. cvcgl_renderer and cvcgl_shadow_volume actually call render() and
      # frameRGB(), and on a bare runner they SEGFAULT: the vtk bundle ships
      # libglvnd, so GL *dispatch* resolves and the offscreen window constructs
      # happily, but there is no *driver* behind it and the first real draw
      # walks off a null vendor table. (cvcgl_shadow_volume's own header comment
      # assumed a headless render would be a harmless no-op. It is not.)
      #
      # Mesa's llvmpipe is the driver; Xvfb is there because VTK probes GLX
      # before EGL, so a display saves it from falling through a failing path
      # first. Verified locally: both tests pass under LIBGL_ALWAYS_SOFTWARE=1
      # with llvmpipe.
      #
      # Both are cvcpkg bundles (`mesa`, `xvfb`), installed into the deps
      # prefix next to the vtk bundle's libglvnd: libGLX.so.0 finds
      # libGLX_mesa.so.0 through its $ORIGIN RUNPATH, and Xvfb finds
      # lib/dri/swrast_dri.so, xkbcomp and the XKB data relative to itself.
      # They are installed after the build, so neither the GL stack nor the
      # llvm20 runtime mesa brings along can reach libcvc's configure or link.
      #
      # Skipping the two instead would leave cvcGL's rendering permanently
      # untested in CI, which is a smaller version of the problem this whole
      # change exists to fix.
      - name: Software OpenGL for the cvcGL render tests
        if: matrix.kind == 'libcvc'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ steps.libcvc-deps.outputs.path }}" ]; then
            prefix="${{ steps.libcvc-deps.outputs.path }}"
          else
            prefix="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          cvcpkg install xvfb mesa --prefix "$prefix" --config release --link shared
          log="$RUNNER_TEMP/xvfb.log"
          "$prefix/bin/Xvfb" :99 -screen 0 1280x1024x24 >"$log" 2>&1 &
          for _ in $(seq 1 50); do
            [ -e /tmp/.X11-unix/X99 ] && break
            sleep 0.2
          done
          if [ ! -e /tmp/.X11-unix/X99 ]; then
            echo "::error::cvcpkg's Xvfb did not come up on :99"
            cat "$log"
            exit 1
          fi
          grep -i glx "$log" || true
          # CVC_REQUIRE_RENDER: this job CAN rasterise, so a render test that
          # finds it cannot (cvcgl_lod_node) fails instead of skipping.
          {
            echo "DISPLAY=:99"
            echo "LIBGL_ALWAYS_SOFTWARE=1"
            echo "GALLIUM_DRIVER=llvmpipe"
            echo "CVC_REQUIRE_RENDER=1"
          } >> "$GITHUB_ENV"

      # Run the test suite against the exact artifacts we are about to
      # package. Stress / convergence / benchmark / perf-hierarchy tests
      # can take many minutes and are only meaningful on trunk; exclude
      # them on PRs.
      - name: Run tests
        if: matrix.kind == 'libcvc'
        shell: bash
        run: |
          set -euo pipefail
          # A registered test is not a running test. The cvcgl_* targets sat in
          # src/cvcGL/CMakeLists.txt behind add_test() for a long time while
          # never being configured at all, and nothing said so — the suite just
          # silently did not contain them. Assert they are present rather than
          # trusting that a flag took effect, so the same failure cannot recur
          # quietly. cvcGL now builds on every libcvc lane (coverage included),
          # so this runs everywhere.
          n_cvcgl=$(ctest --test-dir build -N 2>/dev/null | grep -c 'Test *#[0-9]*: cvcgl_' || true)
          echo "cvcgl_* tests registered with ctest: $n_cvcgl"
          if [ "$n_cvcgl" -eq 0 ]; then
            echo "::error::cvcGL was built but no cvcgl_* test reached CTestTestfile.cmake."
            exit 1
          fi
          # Same idea for libigl: CVC_ENABLE_LIBIGL flips itself OFF when eigen /
          # libigl are missing from the deps prefix, and then mesh_ops/fem build as
          # throwing stubs and their tests are never configured -- a green run that
          # tested nothing. Assert they registered.
          n_igl=$(ctest --test-dir build -N 2>/dev/null | grep -cE 'Test *#[0-9]*: (MeshOps|Fem)\.' || true)
          echo "mesh_ops/fem (libigl) tests registered with ctest: $n_igl"
          if [ "$n_igl" -eq 0 ]; then
            echo "::error::CVC_ENABLE_LIBIGL resolved OFF: eigen/libigl are missing from the deps prefix."
            exit 1
          fi
          # Heavy suites:
          #   Stress|Convergence|Benchmark            : long-running suites
          #   Performance                              : perf benchmarks (>200s in Debug)
          #   BunnySDF_IsoRoundtrip|QualityImproveAllMethods : heavy Debug-only
          #   Integration                              : CLI integration tests (several minutes)
          STRESS_REGEX='(Stress|Convergence|Benchmark|Performance|BunnySDF_IsoRoundtrip|QualityImproveAllMethods|Integration)'
          # Skipped on PRs -- and now on DEBUG pushes too.
          #
          # A Debug push runs the full set with CVC_DISTRIBUTED_STATE_BENCH=1
          # and --parallel (one ctest job per core). Master died there twice,
          # in the same place both times:
          #     Test #503: AlgorithmTest.FindHexsContainingPointPerformanceLargeMesh
          #                ... Passed 274.78 sec        <- the ">200s in Debug" case above
          #     Start 1134: StateLinkBenchmark.TransparentLinkIndexLargeTree
          #     ##[error]Process completed with exit code 143
          #     ##[error]The runner has received a shutdown signal.
          # That is not a test failure and not a cancellation -- it is the
          # hosted runner being killed. These suites allocate large trees and
          # meshes, a Debug build inflates all of it, --parallel runs several
          # at once, and ubuntu-latest has 16 GB. The agent dies with the box,
          # so ctest never gets to report anything, and the error names the
          # runner rather than the cause.
          #
          # Release pushes still run everything. A benchmark timed in a Debug
          # build was never a meaningful number -- the reason to run these on
          # push is the Release timings.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ matrix.build_type }}" != "Debug" ]; then
            # Everything EXCEPT the heavy suites, in parallel.
            ctest --test-dir build \
                  --build-config ${{ matrix.build_type }} \
                  --output-on-failure --parallel \
                  --repeat until-pass:3 --timeout 3600 \
                  -E "${STRESS_REGEX}"
            # Heavy suites, SERIALLY (--parallel 1).
            #
            # Excluding these from Debug pushes was not enough: Release
            # died the same way, at test ~1510/2257, with
            #     ##[error]Process completed with exit code 143
            #     ##[error]The runner has received a shutdown signal.
            # Config was never the variable -- CONCURRENCY is. These
            # suites allocate large trees and meshes, plain --parallel
            # starts one per core, and several at once exceed the 16 GB
            # hosted runner. They pass individually, which is why the run
            # gets ~1500 tests deep before dying and why the failure
            # looks like a cancellation.
            #
            # Serial keeps the coverage instead of dropping it; only one
            # heavy allocation is live at a time.
            CVC_DISTRIBUTED_STATE_BENCH=1 \
            ctest --test-dir build \
                  --build-config ${{ matrix.build_type }} \
                  --output-on-failure --parallel 1 \
                  --repeat until-pass:3 --timeout 3600 \
                  -R "${STRESS_REGEX}"
          else
            ctest --test-dir build \
                  --build-config ${{ matrix.build_type }} \
                  --output-on-failure --parallel \
                  --repeat until-pass:3 --timeout 300 \
                  -E "${STRESS_REGEX}"
          fi

      # cvcgl_ari_golden prints each document's renderer and how far its frame
      # is from the golden (docs/ARIADNE.md section 12). --output-on-failure
      # hides that on a pass, so print it from LastTest.log on every run: it is
      # how a platform's drift shows before it fails. On a failure the test
      # wrote <name>.actual.png + <name>.diff.png; keep them, so a mismatch can
      # be looked at (or become a platform golden) without that machine.
      - name: Ariadne golden-image numbers
        if: always() && matrix.kind == 'libcvc'
        shell: bash
        run: |
          log=build/Testing/Temporary/LastTest.log
          [ -f "$log" ] || { echo "no $log"; exit 0; }
          awk '/^"cvcgl_ari_golden" start time:/ { run = 1; print "-- attempt " ++n }
               run && /^(== |  [0-9]+ frames at |  \[(PASS|FAIL)\] [a-z_]+: matches|  skipped:|Test (Passed|Failed))/
               /^"cvcgl_ari_golden" end time:/ { run = 0 }' "$log"

      - name: Upload Ariadne golden-image diffs
        if: failure() && matrix.kind == 'libcvc'
        uses: actions/upload-artifact@v4
        with:
          name: ari-golden-${{ runner.os }}-${{ matrix.name }}
          path: build/src/cvcGL/ari_golden/
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate coverage report
        if: matrix.kind == 'libcvc' && matrix.build_type == 'Debug'
        run: |
          # geninfo (invoked by --capture) can emit a spurious negative
          # execution count for an inlined STL symbol — a gcov quirk, e.g.
          # char_traits.h under gcc 13 — and treats it as a hard error; gcov
          # version skew across the self-hosted fleet can likewise fail here.
          # Ignore both tooling faults (alongside the pre-existing mismatch) so
          # a capture-time gcov artifact can't red-flag a PR. These only affect
          # capture; the line-coverage gate is enforced separately below
          # ("Enforce coverage gate") and is unaffected.
          lcov="$LCOV_PREFIX/bin/lcov"
          "$lcov" --directory build --capture --output-file build/coverage.info \
            --ignore-errors negative,gcov,mismatch
          # Allowlist, not blocklist: --extract to workspace src/ + inc/.
          # The old --remove of '/usr/*' still counted Boost/CGAL/HDF5
          # headers from the libcvc-deps prefix ($HOME/libcvc-deps),
          # which are inlined into instrumented TUs and diluted the
          # numbers with third-party header coverage.
          "$lcov" --extract build/coverage.info \
            "$GITHUB_WORKSPACE/src/*" "$GITHUB_WORKSPACE/inc/*" \
            --output-file build/coverage_filtered.info \
            --ignore-errors unused
          # Drop test code itself plus vendored trees we don't ship as a
          # supported API surface: XmlRpc++ (src/xmlrpc), the
          # UT-Austin contour-spectrum code
          # (docs/roadmap/COVERAGE_IMPROVEMENT_PLAN.md §4, Option A),
          # and the stb single-file headers (src/cvc/image/third_party).
          "$lcov" --remove build/coverage_filtered.info \
            '*/test/*' '*/tests/*' '*_test.cpp' \
            "$GITHUB_WORKSPACE/src/xmlrpc/*" \
            '*/geometry/cvc-mesher/contour/*' \
            '*/cvc/image/third_party/*' \
            "$GITHUB_WORKSPACE/src/cvc/tools/*" \
            --output-file build/coverage_filtered.info \
            --ignore-errors unused
          "$LCOV_PREFIX/bin/genhtml" build/coverage_filtered.info \
            --output-directory build/coverage_html \
            --title "libcvc Code Coverage" \
            --legend --demangle-cpp --ignore-errors source

      - name: Upload coverage report
        if: matrix.kind == 'libcvc' && matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          # Scoped by matrix entry: libcvc-debug and libcvc-debug-grpc
          # both produce a report, and identically-named artifacts are
          # indistinguishable in the run UI.
          name: coverage-report-${{ matrix.name }}
          path: build/coverage_html/
          retention-days: 30

      - name: Upload coverage to Codecov
        if: matrix.kind == 'libcvc' && matrix.build_type == 'Debug'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Pack libcvc tarball
        if: matrix.kind == 'libcvc'
        working-directory: build
        run: |
          STEM="libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}"
          cpack -G TGZ -D CPACK_COMPONENTS_ALL=libcvc \
                       -D CPACK_PACKAGE_FILE_NAME="$STEM"
          mv "$STEM-libcvc.tar.gz" "$STEM.tar.gz"
          cp "$STEM.tar.gz" "$GITHUB_WORKSPACE/"
          echo "STEM=$STEM" >> "$GITHUB_ENV"

      # One artifact per file so each shows its real extension on GitHub.
      - name: Upload Linux libcvc tarball
        if: matrix.kind == 'libcvc'
        uses: actions/upload-artifact@v4
        with:
          name: libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.tar.gz
          path: libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      # Last step on purpose: a failed gate still leaves the coverage
      # HTML artifact and the packaged tarball uploaded above for
      # debugging. Only the plain Debug entry gates — the grpc entry
      # compiles a different surface (grpc-only TUs) and would report a
      # second, conflicting number for the same commit.
      - name: Enforce coverage gate
        if: matrix.kind == 'libcvc' && matrix.build_type == 'Debug' && matrix.enable_grpc != true
        run: |
          set -euo pipefail
          summary=$("$LCOV_PREFIX/bin/lcov" --summary build/coverage_filtered.info)
          echo "$summary"
          pct=$(echo "$summary" | awk '/lines/ { sub(/%.*/, "", $2); print $2; exit }')
          if [ -z "$pct" ]; then
            echo "::error::Could not parse line coverage from lcov summary"
            exit 1
          fi
          echo "Line coverage: ${pct}% (gate: >= ${COVERAGE_MIN}%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v p="$pct" -v min="$COVERAGE_MIN" 'BEGIN { exit !(p+0 < min+0) }'; then
            echo "::error::Line coverage ${pct}% is below the required ${COVERAGE_MIN}%"
            exit 1
          fi
          echo "Line coverage ${pct}% meets the ${COVERAGE_MIN}% gate."

  # ──────────────────────────── macOS packaging ────────────────────────────
  # ── pycvc and pycvc_gl, built and tested on every PR ──
  # The libcvc recipe builds with CVC_BUILD_PYCVC=OFF (the C++ SDK carries no
  # Python, numpy or SWIG), and the pycvc-cp3XX recipes are built only by
  # publish-cvcpkg.yml at release time, with no test step. So until this job,
  # the bindings were compiled by no PR and the test_pycvc_*.py scripts that
  # bindings/pycvc/CMakeLists.txt registers with ctest ran nowhere in CI: a
  # binding that no longer compiled, or a Python value that drifted from C++,
  # first showed at release (or never). One interpreter column (cp312), Release.
  # Everything comes from cvcpkg: the libcvc deps closure (Jolt included), and
  # python312 + numpy-cp312 + swig, the pycvc-cp312 recipe's own build deps.
  #
  # It builds cvcGL and the pycvc_gl module too, and runs the pycvc_gl tests on
  # Mesa's llvmpipe under Xvfb. Before that, no CI job built pycvc_gl at all:
  # those tests ran only in local Windows builds. The module is built without the
  # VTK-Python bridge (CVC_PYCVCGL_VTK_BRIDGE=OFF), so pycvc_vtk skips its
  # vtkmodules round trip.
  pycvc-linux:
    runs-on: ubuntu-latest
    name: pycvc-linux / cp312
    concurrency:
      group: ci-${{ github.ref }}-pycvc-linux
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Fetch libcvc-deps
        id: libcvc-deps
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          build_type: Release
          link: shared

      - name: Install build tools (cvcpkg)
        uses: ./.github/actions/cvcpkg-build-tools

      # Its own prefix: the interpreter bundle carries its own copies of zlib,
      # openssl and friends, which must not shadow the deps bundle's.
      - name: Install Python, numpy and SWIG (cvcpkg)
        shell: bash
        run: |
          set -euo pipefail
          py_prefix="$RUNNER_TEMP/py312"
          cvcpkg install python312 numpy-cp312 swig --prefix "$py_prefix" --config release --link shared
          "$py_prefix/bin/python3.12" -c "import numpy, sys; print(sys.version, 'numpy', numpy.__version__)"
          "$py_prefix/bin/swig" -version | head -3
          echo "PY_PREFIX=$py_prefix" >> "$GITHUB_ENV"

      # cvcGL needs VTK, and xorgproto for the FindX11 that its find_package(VTK)
      # re-runs; imgui makes ImGuiOverlay real rather than an inert stub. See the
      # VTK step in package-linux.
      - name: Install VTK and imgui for cvcGL (cvcpkg)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ steps.libcvc-deps.outputs.path }}" ]; then
            deps="${{ steps.libcvc-deps.outputs.path }}"
          else
            deps="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          cvcpkg install vtk xorgproto imgui --prefix "$deps" --config release --link shared

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ steps.libcvc-deps.outputs.path }}" ]; then
            deps="${{ steps.libcvc-deps.outputs.path }}"
          else
            deps="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          echo "DEPS_PREFIX=$deps" >> "$GITHUB_ENV"
          # The pycvc tests capture LD_LIBRARY_PATH when they are configured, and
          # the prefix interpreter needs its own lib/ (it is not run through an
          # activate script), so set it before cmake runs.
          export LD_LIBRARY_PATH="$deps/lib:$PY_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$deps;$PY_PREFIX" \
            -DCVC_BUILD_TESTS=ON \
            -DCVC_BUILD_CVCGL=ON \
            -DCVC_ENABLE_CUDA=OFF \
            -DCVC_BUILD_PYCVC=ON \
            -DCVC_BUILD_PYCVC_GL=ON \
            -DCVC_PYCVCGL_VTK_BRIDGE=OFF \
            -DPython3_EXECUTABLE="$PY_PREFIX/bin/python3.12" \
            -DSWIG_EXECUTABLE="$PY_PREFIX/bin/swig"

      # The modules, the pycvc_gl package layout its tests import from, and the
      # C++ reference test_pycvc_physics.py compares against (physics_parity_test,
      # which ctest hands it in CVC_PHYSICS_PARITY_EXE).
      - name: Build
        run: cmake --build build --parallel --target pycvc pycvc_gl pycvc_gl_pkg physics_parity_test

      # ── a software GL for the pycvc_gl tests ──
      # cvcpkg's mesa (llvmpipe) and xvfb, as in package-linux: libGLX.so.0 from
      # the vtk bundle's libglvnd finds libGLX_mesa.so.0, and Xvfb finds its swrast
      # driver and XKB data relative to itself. Installed after the build, so
      # mesa's llvm20 runtime cannot reach the configure or link.
      #
      # GLX under Xvfb, not EGL with no X server: VTK would render through EGL,
      # but ImGui's GL loader resolves through GLX and cannot reach an EGL context
      # (src/cvcGL/ImGuiOverlay.cpp), so ImGuiOverlay, AriRuntime and the HUD
      # would go untested.
      #
      # Without LD_LIBRARY_PATH: mesa's closure rewrites libraries the deps prefix
      # already has (zlib), and cvcpkg's own Python must not have them loaded from
      # there while it does. With them loaded, the install died of SIGBUS halfway
      # through libz.so.1 and left it truncated.
      #
      # The pycvc_gl tests skip their render parts without a GL context, and a
      # broken GL here would turn the job into a quiet run of skips.
      # CVC_REQUIRE_RENDER=1 makes each of them fail instead.
      - name: Software OpenGL for the pycvc_gl tests (cvcpkg)
        shell: bash
        run: |
          set -euo pipefail
          env -u LD_LIBRARY_PATH cvcpkg install xvfb mesa --prefix "$DEPS_PREFIX" --config release --link shared
          log="$RUNNER_TEMP/xvfb.log"
          "$DEPS_PREFIX/bin/Xvfb" :99 -screen 0 1280x1024x24 >"$log" 2>&1 &
          for _ in $(seq 1 50); do
            [ -e /tmp/.X11-unix/X99 ] && break
            sleep 0.2
          done
          if [ ! -e /tmp/.X11-unix/X99 ]; then
            echo "::error::cvcpkg's Xvfb did not come up on :99"
            cat "$log"
            exit 1
          fi
          {
            echo "DISPLAY=:99"
            echo "LIBGL_ALWAYS_SOFTWARE=1"
            echo "GALLIUM_DRIVER=llvmpipe"
            echo "CVC_REQUIRE_RENDER=1"
          } >> "$GITHUB_ENV"

      - name: Run the pycvc tests
        shell: bash
        run: |
          set -euo pipefail
          n=$(ctest --test-dir build -N -R '^pycvc_' | grep -c 'Test *#[0-9]*: pycvc_' || true)
          n_gl=$(ctest --test-dir build -N -R '^pycvc_gl_' | grep -c 'Test *#[0-9]*: pycvc_gl_' || true)
          echo "pycvc tests registered with ctest: $n ($n_gl pycvc_gl_*)"
          if [ "$n" -eq 0 ] || [ "$n_gl" -eq 0 ]; then
            echo "::error::pycvc and pycvc_gl were built, but their tests did not all reach CTestTestfile.cmake."
            exit 1
          fi
          # A crash dumps the Python stack (a segfaulting test prints nothing else:
          # its buffered stdout dies with it).
          PYTHONFAULTHANDLER=1 ctest --test-dir build -R '^pycvc_' --output-on-failure --timeout 1200

      # --output-on-failure hides a passing test's output, and with it whatever it
      # skipped. Print every skip line from LastTest.log, so what is left skipping
      # (a build option this job leaves off, such as the VTK-Python bridge) shows.
      - name: What the pycvc tests skipped
        if: always()
        shell: bash
        run: |
          log=build/Testing/Temporary/LastTest.log
          [ -f "$log" ] || { echo "no $log"; exit 0; }
          awk '/^[0-9]+\/[0-9]+ Testing: / { t = $3 }
               /^[0-9]+\/[0-9]+ Test: / { t = $3 }
               tolower($0) ~ /^ *(\[skip\]|skip[: ])/ { print t ": " $0; n++ }
               END { if (!n) print "no skips" }' "$log"

  # ── Sanitizers: TSan, and ASan with UBSan, over the threaded state_exec suites ──
  # No lane ran a race detector or an address checker, and the state_exec lock work
  # (docs/STATE_EXEC_LOCKS.md) adds code that runs on several threads. Its tests need one, and
  # there is no local Linux box to run them on. So these two jobs build libcvc itself with gcc's
  # -fsanitize=thread, or -fsanitize=address,undefined. The cvcpkg deps stay uninstrumented.
  #
  # Each job builds only the targets it runs. It runs the C++ suites that already use threads,
  # whole, one process per executable. It also runs pycvc's exec scripts, with the sanitizer
  # runtime preloaded into the uninstrumented interpreter. That way any race or leak already in
  # the tree is fixed or suppressed before lock code lands. Suppressions go in
  # .github/sanitizers/*.supp, each with a comment naming what it hides. Each lock phase appends
  # its suites to the two lists below.
  sanitizers:
    name: sanitizers / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tsan
            flags: -fsanitize=thread
          # No vptr check: it references the typeinfo of every polymorphic class it checks.
          # Jolt is built without RTTI, as are the two libcvc files that subclass its classes
          # (src/cvc/CMakeLists.txt), so that typeinfo exists nowhere and libcvc.so fails to
          # link ("undefined reference to `typeinfo for JPH::GroupFilter'").
          - name: asan-ubsan
            flags: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-sanitize=vptr
    concurrency:
      group: ci-${{ github.ref }}-sanitizers-${{ matrix.name }}
      cancel-in-progress: true
    env:
      # C++ test executables (build/bin/<name>).
      SAN_CXX_TESTS: >-
        state_exec_scheduler_test state_exec_async_test state_exec_integration_test
        state_exec_coordinator_test ariadne_runtime_test thread_pool_test async_lane_test
        state_exec_locks_test state_exec_locks_model_test
      # pycvc test scripts (bindings/pycvc/<name>).
      SAN_PY_TESTS: >-
        test_pycvc_exec.py test_pycvc_exec_async.py test_pycvc_exec_coro.py
        test_pycvc_state_exec.py test_pycvc_state_exec_async.py test_pycvc_state_exec_data.py
        test_pycvc_state_exec_eval.py test_pycvc_state_exec_exceptions.py
        test_pycvc_state_exec_sched.py test_pycvc_state_exec_locks.py
      # The lock tests read this and run their smaller sanitizer sizes.
      CVC_LOCKS_SANITIZER: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch libcvc-deps
        id: libcvc-deps
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          build_type: Release
          link: shared

      - name: Install build tools (cvcpkg)
        uses: ./.github/actions/cvcpkg-build-tools

      # Its own prefix, as in pycvc-linux: the interpreter bundle's zlib, openssl and friends must
      # not shadow the deps bundle's.
      - name: Install Python, numpy and SWIG (cvcpkg)
        shell: bash
        run: |
          set -euo pipefail
          py_prefix="$RUNNER_TEMP/py312"
          cvcpkg install python312 numpy-cp312 swig --prefix "$py_prefix" --config release --link shared
          "$py_prefix/bin/python3.12" -c "import numpy, sys; print(sys.version, 'numpy', numpy.__version__)"
          echo "PY_PREFIX=$py_prefix" >> "$GITHUB_ENV"

      # ubuntu-24.04's kernel randomizes mmap with 32 bits, more than gcc 13's sanitizer runtimes
      # can map around ("FATAL: ThreadSanitizer: unexpected memory mapping").
      - name: Narrow mmap randomization for the sanitizer runtimes
        run: sudo sysctl vm.mmap_rnd_bits=28

      # RelWithDebInfo, for line numbers in the reports. CUDA, OpenMP and cvcGL are off: nothing
      # under test uses them, and libgomp's uninstrumented barriers would only add TSan noise.
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ steps.libcvc-deps.outputs.path }}" ]; then
            deps="${{ steps.libcvc-deps.outputs.path }}"
          else
            deps="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          export LD_LIBRARY_PATH="$deps/lib:$PY_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          flags="${{ matrix.flags }} -fno-omit-frame-pointer"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$deps;$PY_PREFIX" \
            -DCMAKE_C_FLAGS="$flags" \
            -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_EXE_LINKER_FLAGS="$flags" \
            -DCMAKE_SHARED_LINKER_FLAGS="$flags" \
            -DCMAKE_MODULE_LINKER_FLAGS="$flags" \
            -DCVC_BUILD_TESTS=ON \
            -DCVC_BUILD_CVCGL=OFF \
            -DCVC_ENABLE_CUDA=OFF \
            -DCVC_ENABLE_OPENMP=OFF \
            -DCVC_BUILD_PYCVC=ON \
            -DCVC_BUILD_PYCVC_GL=OFF \
            -DPython3_EXECUTABLE="$PY_PREFIX/bin/python3.12" \
            -DSWIG_EXECUTABLE="$PY_PREFIX/bin/swig"

      - name: Build
        run: cmake --build build --parallel --target $SAN_CXX_TESTS pycvc

      - name: Run the suites under ${{ matrix.name }}
        shell: bash
        run: bash .github/sanitizers/run.sh "${{ matrix.name }}"

      - name: Upload the sanitizer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizers-${{ matrix.name }}-logs
          path: san-logs/
          if-no-files-found: ignore

  package-macos:
    runs-on: macos-latest
    # Non-blocking for experimental matrix entries (the gRPC probe below): a macOS grpc build
    # failure reports red but does not block the PR's required checks while we find out if it works.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libcvc-debug
            kind: libcvc
            build_type: Debug
          - name: libcvc-release
            kind: libcvc
            build_type: Release
          # gRPC probe: does libcvc build+link with CVC_ENABLE_GRPC on macOS?
          # Uses the shared grpc published for macos. Kept experimental (non-blocking)
          # unlike Linux/Windows: the hosted macOS runners are too scarce to make a
          # grpc lane blocking (whole macOS job set has queued hours), and these have
          # not yet run green since the dylib fix. Promote once that is confirmed.
          - name: libcvc-release-grpc
            kind: libcvc
            build_type: Release
            enable_grpc: true
            experimental: true
          # Static-link gRPC probe: installs the static grpc closure (cvcpkg
          # --link static, now published for macos) and links it into libcvc.
          # Experimental for the same macOS-runner reason as the shared lane above.
          - name: libcvc-release-grpc-static
            kind: libcvc
            build_type: Release
            enable_grpc: true
            grpc_link: static
            experimental: true
    name: package-macos / ${{ matrix.name }}
    # Heavy job: do not cancel in-progress runs (mirrors package-linux).
    concurrency:
      group: ci-${{ github.ref }}-package-macos-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          SHA=$(git rev-parse --short=8 HEAD)
          ARCH=$(uname -m)
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"          >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH"        >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"

      # ── Pull dep prefix via cvcpkg ──
      # Provides the libiimod CMake package and all third-party C/C++
      # deps for libcvc (zstd included). Nothing comes from Homebrew.
      - name: Fetch libcvc-deps
        id: libcvc-deps-macos
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          build_type: Release
          link: shared

      # cmake, ninja and pkg-config from cvcpkg, as in release.yml. The
      # compiler is the runner's Xcode clang.
      - name: Install build tools (cvcpkg)
        uses: ./.github/actions/cvcpkg-build-tools

      # VTK for cvcGL — see the long note in package-linux. No xorgproto here:
      # there is no X11 on macOS, so VTK's FindX11 is not in the picture.
      - name: Install VTK for cvcGL
        if: matrix.kind == 'libcvc'
        shell: bash
        run: |
          set -euo pipefail
          prefix="${{ steps.libcvc-deps-macos.outputs.path }}"
          if [ -z "$prefix" ]; then
            prefix="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          cvcpkg install vtk --prefix "$prefix" --config release --link shared
          # imgui (cvcGL's ImGui overlay + the Ariadne ImGui backend) and yaml-cpp (the
          # .ari loader): without them cvcgl_ari_golden has nothing to render
          # (docs/ARIADNE.md section 12). sdl3: cvcGL's onscreen window (Cocoa through
          # SDL). See the Linux job's VTK step.
          cvcpkg install imgui yaml-cpp sdl3 --prefix "$prefix" --config release --link shared

      # gRPC probe: provision grpc+protobuf (shared) for the enable_grpc matrix entry, as on Linux.
      - name: Provision gRPC via cvcpkg
        if: matrix.enable_grpc == true
        shell: bash
        run: |
          set -euo pipefail
          grpc_prefix="$RUNNER_TEMP/grpc-prefix"
          cvcpkg install grpc protobuf --prefix "$grpc_prefix" --config release --link ${{ matrix.grpc_link || 'shared' }}
          echo "GRPC_PREFIX=$grpc_prefix" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          # cvcpkg is the sole third-party prefix on macOS.
          deps_path="${{ steps.libcvc-deps-macos.outputs.path }}"
          if [ -z "$deps_path" ]; then
            deps_path="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          # Append the grpc prefix (set by Provision gRPC on the enable_grpc entry) so
          # find_package(gRPC/Protobuf) + grpc_cpp_plugin/protoc resolve; empty on other entries.
          export CMAKE_PREFIX_PATH="$deps_path${GRPC_PREFIX:+:$GRPC_PREFIX}"
          # No coverage gate on macOS, so cvcGL is on for both build types.
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCVC_BUILD_TESTS=ON \
            -DCVC_BUILD_CVCGL=ON \
            -DCVC_ENABLE_CUDA=OFF \
            -DDISABLE_CGAL=OFF \
            -DCVC_ENABLE_MESHER=ON \
            -DCVC_ENABLE_SDF=ON \
            -DCVC_ENABLE_GRPC=${{ matrix.enable_grpc == true && 'ON' || 'OFF' }} \
            | tee configure.log

      # The terminal backends are optional at configure time: without ftxui / tvision the
      # backends compile to stubs and the AriadneFtxui / AriadneTvision tests SKIP instead of
      # failing, which is how the macOS and Windows lanes ran them until the libcvc recipe declared
      # ftxui there. Make a missing backend a failure.
      # Likewise SDL3: without it cvcGL's onscreen window is VTK's and cvcgl_sdl_attach skips.
      - name: Assert the Ariadne terminal backends and cvcGL's SDL3 are configured
        shell: bash
        run: |
          for want in "Ariadne: FTXUI terminal backend ENABLED" "Ariadne: tvision terminal backend ENABLED"; do
            grep -qF "$want" configure.log \
              || { echo "::error::the configure did not print '$want': the Ariadne terminal tests would only skip"; exit 1; }
          done
          grep -qF "cvcGL: SDL3 input/peripheral seam ENABLED" configure.log \
            || { echo "::error::the configure found no SDL3: cvcGL's SDL window would go untested"; exit 1; }

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        if: matrix.kind == 'libcvc'
        shell: bash
        run: |
          set -euo pipefail
          # The grpc probe links grpc's SHARED libs from a separate prefix
          # ($GRPC_PREFIX). Make them loadable at test time: gtest_discover_tests
          # runs each test executable to enumerate its tests (both for `ctest -N`
          # and the run), and without libgrpc++.dylib etc. on the dyld path the
          # launch fails -- which showed up as "cvcgl_* tests registered: 0" and
          # then GoogleTestAddTests "Error running test executable" (ctest exit 8).
          # Harmless on the static lane (its $GRPC_PREFIX/lib holds .a, not dylibs).
          if [ -n "${GRPC_PREFIX:-}" ]; then
            export DYLD_FALLBACK_LIBRARY_PATH="$GRPC_PREFIX/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
          fi
          # cvcGL is on for both build types here (no coverage gate on macOS).
          # Assert its tests actually registered — see the linux step.
          n_cvcgl=$(ctest --test-dir build -N 2>/dev/null | grep -c 'Test *#[0-9]*: cvcgl_' || true)
          echo "cvcgl_* tests registered with ctest: $n_cvcgl"
          # The grpc lane (experimental) is a "does libcvc build with CVC_ENABLE_GRPC"
          # probe. On macOS the grpc config perturbs cvcgl ctest registration (the Linux
          # grpc lane is unaffected and still enforces this), so skip the cvcgl guard on
          # that probe -- cvcGL testing is enforced by the non-grpc release lane.
          if [ "$n_cvcgl" -eq 0 ] && [ "${{ matrix.enable_grpc }}" != "true" ]; then
            echo "::error::cvcGL was built but no cvcgl_* test reached CTestTestfile.cmake."
            exit 1
          fi
          # libigl must have resolved ON -- see the linux step.
          n_igl=$(ctest --test-dir build -N 2>/dev/null | grep -cE 'Test *#[0-9]*: (MeshOps|Fem)\.' || true)
          echo "mesh_ops/fem (libigl) tests registered with ctest: $n_igl"
          if [ "$n_igl" -eq 0 ]; then
            echo "::error::CVC_ENABLE_LIBIGL resolved OFF: eigen/libigl are missing from the deps prefix."
            exit 1
          fi
          # See linux ctest step for rationale, including why Debug pushes skip
          # the heavy set (they killed the hosted runner outright).
          STRESS_REGEX='(Stress|Convergence|Benchmark|Performance|BunnySDF_IsoRoundtrip|QualityImproveAllMethods|Integration)'
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ matrix.build_type }}" != "Debug" ]; then
            # Everything EXCEPT the heavy suites, in parallel.
            ctest --test-dir build \
                  --build-config ${{ matrix.build_type }} \
                  --output-on-failure --parallel \
                  --repeat until-pass:3 --timeout 3600 \
                  -E "${STRESS_REGEX}"
            # Heavy suites, SERIALLY (--parallel 1).
            #
            # Excluding these from Debug pushes was not enough: Release
            # died the same way, at test ~1510/2257, with
            #     ##[error]Process completed with exit code 143
            #     ##[error]The runner has received a shutdown signal.
            # Config was never the variable -- CONCURRENCY is. These
            # suites allocate large trees and meshes, plain --parallel
            # starts one per core, and several at once exceed the 16 GB
            # hosted runner. They pass individually, which is why the run
            # gets ~1500 tests deep before dying and why the failure
            # looks like a cancellation.
            #
            # Serial keeps the coverage instead of dropping it; only one
            # heavy allocation is live at a time.
            CVC_DISTRIBUTED_STATE_BENCH=1 \
            ctest --test-dir build \
                  --build-config ${{ matrix.build_type }} \
                  --output-on-failure --parallel 1 \
                  --repeat until-pass:3 --timeout 3600 \
                  -R "${STRESS_REGEX}"
          else
            ctest --test-dir build \
                  --build-config ${{ matrix.build_type }} \
                  --output-on-failure --parallel \
                  --repeat until-pass:3 --timeout 300 \
                  -E "${STRESS_REGEX}"
          fi

      # --output-on-failure keeps a passing test's output out of this log, so
      # a flake that passes on retry leaves no numbers behind, and a tolerance
      # that always passes is never measured. LastTest.log keeps every
      # attempt's output: print cvcgl_shadow_casters' on-screen section (GL
      # renderer, background-pixel counts, luma, differing bytes) from each
      # attempt, pass or fail. A Release push runs a second ctest after the
      # first, which replaces LastTest.log, so there it finds nothing.
      - name: cvcgl_shadow_casters on-screen numbers
        if: always() && matrix.kind == 'libcvc'
        shell: bash
        run: |
          log=build/Testing/Temporary/LastTest.log
          [ -f "$log" ] || { echo "no $log"; exit 0; }
          awk '/^"cvcgl_shadow_casters" start time:/ { run = 1; print "-- attempt " ++n }
               run && /^D\. on screen/ { d = 1 }
               run && /^(F\. |<end of output>)/ { d = 0 }
               d
               run && /^Test (Passed|Failed)/ { print "   " $0 }
               /^"cvcgl_shadow_casters" end time:/ { run = 0; d = 0 }' "$log"

      # cvcgl_ari_golden prints each document's renderer and how far its frame
      # is from the golden (docs/ARIADNE.md section 12). --output-on-failure
      # hides that on a pass, so print it from LastTest.log on every run: it is
      # how a platform's drift shows before it fails. On a failure the test
      # wrote <name>.actual.png + <name>.diff.png; keep them, so a mismatch can
      # be looked at (or become a platform golden) without that machine.
      - name: Ariadne golden-image numbers
        if: always() && matrix.kind == 'libcvc'
        shell: bash
        run: |
          log=build/Testing/Temporary/LastTest.log
          [ -f "$log" ] || { echo "no $log"; exit 0; }
          awk '/^"cvcgl_ari_golden" start time:/ { run = 1; print "-- attempt " ++n }
               run && /^(== |  [0-9]+ frames at |  \[(PASS|FAIL)\] [a-z_]+: matches|  skipped:|Test (Passed|Failed))/
               /^"cvcgl_ari_golden" end time:/ { run = 0 }' "$log"

      - name: Upload Ariadne golden-image diffs
        if: failure() && matrix.kind == 'libcvc'
        uses: actions/upload-artifact@v4
        with:
          name: ari-golden-${{ runner.os }}-${{ matrix.name }}
          path: build/src/cvcGL/ari_golden/
          if-no-files-found: ignore
          retention-days: 14

      - name: Pack libcvc zip
        if: matrix.kind == 'libcvc'
        working-directory: build
        run: |
          STEM="libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-macos-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}"
          cpack -G ZIP -D CPACK_COMPONENTS_ALL=libcvc \
                       -D CPACK_PACKAGE_FILE_NAME="$STEM"
          mv "$STEM-libcvc.zip" "$STEM.zip"
          cp "$STEM.zip" "$GITHUB_WORKSPACE/"

      - name: Upload macOS libcvc zip
        if: matrix.kind == 'libcvc'
        uses: actions/upload-artifact@v4
        with:
          name: libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-macos-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.zip
          path: libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-macos-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.zip
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────── Windows packaging ────────────────────────────
  package-windows:
    # windows-2022 (VS2022 v143) pinned deliberately: windows-latest now ships
    # VS2026 (v180), whose CL.exe ICEs (0xC0000005) building libcvc's C++20
    # state_exec/distributed-state TUs (cvc.vcxproj) — the "image flip" failure.
    # This mirrors the pin already applied to publish-cvcpkg.yml (which noted the
    # same root cause here); ci.yml was missed. Revisit when v180 stabilizes.
    runs-on: windows-2022
    # Non-blocking for experimental matrix entries (the gRPC probe below): a Windows grpc build
    # failure reports red but does not block the PR's required checks while we find out if it works.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Release only. There are no windows-debug dep bundles on the catalog,
          # so fetch-libcvc-deps(build_type: Debug) finds nothing, falls back to
          # an empty prefix, and configure fails at find_package(libiimod).
          # Even with deps, a Debug libcvc (/MDd) linked against the Release,
          # shared deps (/MD) is a CRT mismatch that yields a broken artifact —
          # the same reason publish-cvcpkg.yml excludes the windows-debug target.
          # Restore the Debug row once windows-debug dep bundles exist (remote-
          # builder fleet). Linux/macOS have no such issue: Debug libcvc links
          # the Release, ABI-stable shared deps fine, so they keep both rows.
          - name: libcvc-release
            kind: libcvc
            build_type: Release
          # gRPC lane: does libcvc build+link with CVC_ENABLE_GRPC on Windows (MSVC)?
          # Uses the shared grpc published for windows. BLOCKING (promoted from probe):
          # green since the MSVC-skew bundle rebuild + the mkdtemp test fix.
          - name: libcvc-release-grpc
            kind: libcvc
            build_type: Release
            enable_grpc: true
          # Static-link gRPC lane: installs the static grpc closure (cvcpkg
          # --link static, now published for windows) and links it into libcvc.
          # BLOCKING (promoted from probe): green on every run.
          - name: libcvc-release-grpc-static
            kind: libcvc
            build_type: Release
            enable_grpc: true
            grpc_link: static
    name: package-windows / ${{ matrix.name }}
    # Do NOT cancel in-progress runs; see package-linux for rationale.
    concurrency:
      group: ci-${{ github.ref }}-package-windows-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          SHA=$(git rev-parse --short=8 HEAD)
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"          >> "$GITHUB_OUTPUT"
          echo "arch=x86_64"       >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"

      # ── Pull all third-party deps (incl. Qt6 + VTK) from cvcpkg ──
      # cvcpkg is the sole source of truth for third-party components
      # on Windows: Boost, HDF5, FFTW, GSL, ImageMagick, log4cplus,
      # CGAL, Qt6, VTK, etc. If cvcpkg cannot fetch the components,
      # CMake configure will fail with an explicit "Could not find X"
      # error, which is the correct signal — there is no vcpkg or
      # source-build fallback.
      - name: Fetch libcvc-deps (Windows)
        id: libcvc-deps-windows
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          build_type: ${{ matrix.build_type }}
          link: shared

      # cmake, ninja and pkg-config from cvcpkg, as in release.yml, instead
      # of the runner image's cmake. The compiler is the image's VS 2022.
      - name: Install build tools (cvcpkg)
        uses: ./.github/actions/cvcpkg-build-tools

      # CUDA toolkit so the shipped Windows artifacts can offload to
      # NVIDIA GPUs at runtime when an NVIDIA driver is present. cudart
      # is linked statically (CMAKE_CUDA_RUNTIME_LIBRARY=Static below)
      # so users only need the NVIDIA driver, not a CUDA install.
      # Configure points the VS generator at it with -T cuda=.
      - name: Install CUDA toolkit (cvcpkg)
        id: cuda
        uses: ./.github/actions/cvcpkg-cuda-toolkit

      # VTK for cvcGL — see the long note in package-linux. No xorgproto: no X11
      # on Windows, so VTK's FindX11 never runs.
      - name: Install VTK for cvcGL (Windows)
        if: matrix.kind == 'libcvc'
        shell: pwsh
        run: |
          $prefix = '${{ steps.libcvc-deps-windows.outputs.path }}'
          if (-not $prefix) {
            $prefix = if ($env:LIBCVC_DEPS_PREFIX) { $env:LIBCVC_DEPS_PREFIX } else { 'D:\libcvc-deps' }
          }
          cvcpkg install vtk --prefix "$prefix" --config release --link shared
          if ($LASTEXITCODE -ne 0) { throw "cvcpkg install vtk failed ($LASTEXITCODE)" }
          # imgui (cvcGL's ImGui overlay + the Ariadne ImGui backend) and yaml-cpp (the
          # .ari loader): without them cvcgl_ari_golden has nothing to render
          # (docs/ARIADNE.md section 12). sdl3: cvcGL's onscreen window (see the Linux job).
          cvcpkg install imgui yaml-cpp sdl3 --prefix "$prefix" --config release --link shared
          if ($LASTEXITCODE -ne 0) { throw "cvcpkg install imgui yaml-cpp sdl3 failed ($LASTEXITCODE)" }

      # gRPC probe: provision grpc+protobuf (shared) for the enable_grpc matrix entry, as on Linux.
      - name: Provision gRPC via cvcpkg (Windows)
        if: matrix.enable_grpc == true
        shell: pwsh
        run: |
          $grpcPrefix = "$env:RUNNER_TEMP\grpc-prefix"
          cvcpkg install grpc protobuf --prefix "$grpcPrefix" --config release --link ${{ matrix.grpc_link || 'shared' }}
          if ($LASTEXITCODE -ne 0) { throw "cvcpkg install grpc failed ($LASTEXITCODE)" }
          "GRPC_PREFIX=$grpcPrefix" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: |
          $depsPath = '${{ steps.libcvc-deps-windows.outputs.path }}'
          if (-not $depsPath) {
            # cvcpkg-install fell back; try the default prefix in case
            # some bundles unpacked before the failure.
            $depsPath = if ($env:LIBCVC_DEPS_PREFIX) { $env:LIBCVC_DEPS_PREFIX } else { 'D:\libcvc-deps' }
            if (-not (Test-Path $depsPath)) { $depsPath = '' }
          }
          # cvcpkg is the sole third-party prefix. No vcpkg toolchain
          # file, no aqt Qt6, no VTK source cache.
          $qtPrefix = if ($depsPath) { $depsPath } else { '' }
          # Fold in the grpc prefix (set by Provision gRPC on the enable_grpc entry); Windows uses
          # ';' as the CMAKE_PREFIX_PATH separator.
          $prefixPath = if ($env:GRPC_PREFIX) { "$qtPrefix;$env:GRPC_PREFIX" } else { $qtPrefix }
          # No coverage gate on Windows, so cvcGL is on.
          # -T cuda=<toolkit>: the VS generator takes the CUDA MSBuild
          # integration from the cvcpkg toolkit's extras\ instead of from
          # a Visual Studio install of it.
          $cuda = '${{ steps.cuda.outputs.root }}' -replace '/', '\'
          cmake -B build -T "cuda=$cuda" `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_CONFIGURATION_TYPES=${{ matrix.build_type }} `
            -DCMAKE_PREFIX_PATH="$prefixPath" `
            -DCVC_BUILD_TESTS=ON `
            -DCVC_BUILD_CVCGL=ON `
            -DCVC_ENABLE_CUDA=ON `
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static `
            -DDISABLE_CGAL=OFF `
            -DCVC_ENABLE_MESHER=ON `
            -DCVC_ENABLE_SDF=ON `
            -DCVC_ENABLE_GRPC=${{ matrix.enable_grpc == true && 'ON' || 'OFF' }} `
            | Tee-Object -FilePath configure.log

      # The terminal backends are optional at configure time: without ftxui / tvision the
      # backends compile to stubs and the AriadneFtxui / AriadneTvision tests SKIP instead of
      # failing, which is how the macOS and Windows lanes ran them until the libcvc recipe declared
      # ftxui there. Make a missing backend a failure.
      # Likewise SDL3: without it cvcGL's onscreen window is VTK's and cvcgl_sdl_attach skips.
      - name: Assert the Ariadne terminal backends and cvcGL's SDL3 are configured
        shell: bash
        run: |
          for want in "Ariadne: FTXUI terminal backend ENABLED" "Ariadne: tvision terminal backend ENABLED"; do
            grep -qF "$want" configure.log \
              || { echo "::error::the configure did not print '$want': the Ariadne terminal tests would only skip"; exit 1; }
          done
          grep -qF "cvcGL: SDL3 input/peripheral seam ENABLED" configure.log \
            || { echo "::error::the configure found no SDL3: cvcGL's SDL window would go untested"; exit 1; }

      - name: Build
        shell: pwsh
        # gtest_discover_tests runs each test executable at build
        # time (POST_BUILD discovery mode, the GoogleTest module
        # default) to enumerate test names. On Windows the DLLs
        # consumed by those exes (libcvc-deps' Boost/HDF5/FFTW/Qt6/
        # VTK, plus our own cvc.dll) live in $depsPath\bin (release)
        # or $depsPath\debug\bin (debug) and build\bin\<Config>,
        # neither of which is on PATH during `cmake --build`. Without
        # these directories on PATH the discovery launch exits with
        # STATUS_DLL_NOT_FOUND (0xc0000135), and CMake aborts the
        # build with
        #   CMake Error at .../GoogleTestAddTests.cmake:132 (message):
        #     Error running test executable. Path: '.../state_test.exe'
        #     Result: Exit code 0xc0000135
        #
        # CRITICAL: cvcpkg ships Debug DLLs at debug/bin/ with the
        # SAME filename as their Release counterparts at bin/ (e.g.
        # both directories contain hdf5.dll, boost_thread-vc143-mt*).
        # Putting bin/ on PATH first under a Debug build causes the
        # consumer to load Release DLLs against a Debug import lib,
        # producing CRT/iterator-debug-level mismatches that surface
        # as SEH access violations (0xc0000005) and "unknown C++
        # exception" failures inside HDF5/Boost APIs.
        #
        # cvcpkg, however, ships some debug-suffixed DLLs only at
        # top-level bin/. Put debug/bin FIRST so same-named-port DLLs
        # load their debug variant, and bin/ second so debug-suffixed
        # DLLs still resolve.
        run: |
          $depsPath = '${{ steps.libcvc-deps-windows.outputs.path }}'
          $isDebug = '${{ matrix.build_type }}' -eq 'Debug'
          $buildBin = Join-Path $PWD "build\bin\${{ matrix.build_type }}"
          $extra = @()
          if ($depsPath) {
            if ($isDebug) {
              $depDbgBin = Join-Path $depsPath 'debug\bin'
              if (Test-Path $depDbgBin) { $extra += $depDbgBin }
              $extra += (Join-Path $depsPath 'bin')
            } else {
              $extra += (Join-Path $depsPath 'bin')
            }
          }
          if ($env:QT_ROOT_DIR) { $extra += (Join-Path $env:QT_ROOT_DIR 'bin') }
          $extra += $buildBin
          $env:PATH = ($extra -join ';') + ';' + $env:PATH
          cmake --build build --config ${{ matrix.build_type }} --parallel

      # ── a software GL driver, so the two RENDERING cvcGL tests can run ──
      # A Windows runner has no GPU and offers only the GDI generic OpenGL 1.1
      # path, which VTK rejects, so cvcgl_renderer and cvcgl_shadow_volume — the
      # only two cvcgl_* tests that issue a real draw — segfaulted here. Same
      # root cause Mesa's llvmpipe fixed in package-linux; macOS never had it.
      #
      # THIRD-PARTY BINARY, so it is pinned and verified. mesa-dist-win is the
      # de-facto Windows Mesa build (it is what Mesa's own docs point at; there
      # is no upstream Windows binary). Pinned to one release tag rather than
      # "latest", and the archive's SHA-256 is checked before anything is
      # unpacked — if the asset is ever replaced, this fails loudly instead of
      # silently running different code. The MSVC build is the right one: libcvc
      # here is MSVC too.
      #
      # BOTH DLLs are required. opengl32.dll is a ~140 KB loader stub; the
      # actual gallium implementation (llvmpipe included) is the ~61 MB
      # libgallium_wgl.dll beside it, and shipping only the stub gets you a DLL
      # that loads and then cannot do anything. This mirrors what upstream's own
      # perappdeploy.cmd copies for a desktop-GL app.
      #
      # They go in the test executables' OWN directory because Windows searches
      # that first, so this overrides the system opengl32 for these processes
      # only and nothing else on the runner is affected.
      - name: Software OpenGL for the cvcGL render tests (Windows)
        if: matrix.kind == 'libcvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Invoke-WebRequest renders a progress bar per chunk, which costs far
          # more than the transfer on a 67 MB file. Silencing it is the
          # difference between seconds and minutes.
          $ProgressPreference = 'SilentlyContinue'
          $tag = '26.1.7'
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$tag/mesa3d-$tag-release-msvc.7z"
          $want = 'c6e90c3117233b66f7816df05026a5fb0f88eaf7829bd07a1724b981487ec0bb'
          $arc = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest -Uri $url -OutFile $arc
          $got = (Get-FileHash -Algorithm SHA256 -Path $arc).Hash.ToLower()
          if ($got -ne $want) {
            Write-Host "::error::mesa3d $tag checksum mismatch. expected $want got $got"
            exit 1
          }
          $dest = Join-Path $PWD "build\bin\${{ matrix.build_type }}"
          if (-not (Test-Path $dest)) {
            Write-Host "::error::expected test output dir not found: $dest"
            exit 1
          }
          # -y overwrite, e flattens the x64/ prefix so both land in $dest.
          7z e -y "-o$dest" $arc 'x64/opengl32.dll' 'x64/libgallium_wgl.dll'
          foreach ($f in @('opengl32.dll', 'libgallium_wgl.dll')) {
            $p = Join-Path $dest $f
            if (-not (Test-Path $p)) {
              Write-Host "::error::mesa $f did not land in $dest"
              exit 1
            }
            Write-Host ("staged {0} ({1:N0} bytes)" -f $f, (Get-Item $p).Length)
          }
          "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run tests
        if: matrix.kind == 'libcvc'
        shell: pwsh
        env:
          DEPS_PATH: ${{ steps.libcvc-deps-windows.outputs.path }}
        run: |
          # ctest invokes the test executables, which need the same
          # DLL search path on PATH as build-time discovery (see the
          # Build step note above). Mirror the Debug/Release split
          # so Debug tests load Debug DLLs (CRT-compatible) and
          # Release tests load Release DLLs, with bin/ retained on
          # the Debug path so Qt6's debug-suffixed DLLs resolve.
          $isDebug = '${{ matrix.build_type }}' -eq 'Debug'
          $buildBin = Join-Path $PWD "build\bin\${{ matrix.build_type }}"
          $extra = @()
          if ($env:DEPS_PATH) {
            if ($isDebug) {
              $depDbgBin = Join-Path $env:DEPS_PATH 'debug\bin'
              if (Test-Path $depDbgBin) { $extra += $depDbgBin }
              $extra += (Join-Path $env:DEPS_PATH 'bin')
            } else {
              $extra += (Join-Path $env:DEPS_PATH 'bin')
            }
          }
          if ($env:QT_ROOT_DIR) { $extra += (Join-Path $env:QT_ROOT_DIR 'bin') }
          $extra += $buildBin
          $env:PATH = ($extra -join ';') + ';' + $env:PATH
          # No MAGICK_* variables here. ImageMagick from cvcpkg is extracted, not
          # installed, and libcvc points it at its coders and config itself
          # (set_magick_paths_win in src/cvc/image/magick_io.cpp), so the suite runs
          # as a local build does. Setting them here would hide a broken lookup from
          # every test but magick_bootstrap_test.
          # Assert the cvcgl_* tests actually registered — see the linux step.
          $nCvcgl = (ctest --test-dir build -N 2>$null | Select-String -Pattern 'Test\s+#\d+: cvcgl_').Count
          Write-Host "cvcgl_* tests registered with ctest: $nCvcgl (all run; Mesa llvmpipe staged above)"
          # Skip the cvcgl guard on the experimental grpc probe (see the macOS note):
          # the grpc config perturbs cvcgl ctest registration on Windows as well; the
          # non-grpc release lane still enforces it.
          if ($nCvcgl -eq 0 -and '${{ matrix.enable_grpc }}' -ne 'true') {
            Write-Host "::error::cvcGL was built but no cvcgl_* test reached CTestTestfile.cmake."
            exit 1
          }
          # libigl must have resolved ON -- see the linux step.
          $nIgl = (ctest --test-dir build -N 2>$null | Select-String -Pattern 'Test\s+#\d+: (MeshOps|Fem)\.').Count
          Write-Host "mesh_ops/fem (libigl) tests registered with ctest: $nIgl"
          if ($nIgl -eq 0) {
            Write-Host "::error::CVC_ENABLE_LIBIGL resolved OFF: eigen/libigl are missing from the deps prefix."
            exit 1
          }
          # See linux ctest step for rationale.
          $stressRegex = '(Stress|Convergence|Benchmark|Performance|BunnySDF_IsoRoundtrip|QualityImproveAllMethods|Integration)'
          if ('${{ github.event_name }}' -eq 'push') {
            # The rest in parallel, then the heavy suites SERIALLY, as on Linux and macOS. Run
            # all at once, the Jolt convergence suites and the large-tree benchmarks held the
            # 4-vCPU runner for hours (some to the 3600 s timeout, three times), and the tests
            # beside them starved. Master 83b60200 failed 21-25 of the 48 StateTransportGrpc
            # tests per gRPC lane (connect_to_peer missing its 2 s deadline), RoomRelay and
            # StreamBridge loopbacks, and cvcgl_lod_cache's threaded teardown (906 ms against
            # one 120 ms build). PR runs, which skip the heavy suites, pass all of them. Both
            # passes run even if the first fails, so one push reports both.
            ctest --test-dir build --build-config ${{ matrix.build_type }} `
                  --output-on-failure --parallel --repeat until-pass:3 --timeout 3600 `
                  -E "$stressRegex"
            $rest = $LASTEXITCODE
            $env:CVC_DISTRIBUTED_STATE_BENCH = '1'
            ctest --test-dir build --build-config ${{ matrix.build_type }} `
                  --output-on-failure --parallel 1 --repeat until-pass:3 --timeout 3600 `
                  -R "$stressRegex"
            $heavy = $LASTEXITCODE
            if ($rest -ne 0 -or $heavy -ne 0) { exit 1 }
          } else {
            ctest --test-dir build --build-config ${{ matrix.build_type }} `
                  --output-on-failure --parallel --repeat until-pass:3 --timeout 300 `
                  -E "$stressRegex"
          }

      # The same as the Linux and macOS steps: cvcgl_ari_golden's per-document
      # numbers from LastTest.log on every run, and its actual/diff PNGs on a
      # failure (docs/ARIADNE.md section 12).
      - name: Ariadne golden-image numbers
        if: always() && matrix.kind == 'libcvc'
        shell: pwsh
        run: |
          $log = 'build/Testing/Temporary/LastTest.log'
          if (-not (Test-Path $log)) { Write-Host "no $log"; exit 0 }
          $run = $false
          foreach ($line in Get-Content $log) {
            if ($line -match '^"cvcgl_ari_golden" start time:') { $run = $true; Write-Host '-- attempt' }
            elseif ($line -match '^"cvcgl_ari_golden" end time:') { $run = $false }
            elseif ($run -and $line -match '^(== |  [0-9]+ frames at |  \[(PASS|FAIL)\] [a-z_]+: matches|  skipped:|Test (Passed|Failed))') { Write-Host $line }
          }

      - name: Upload Ariadne golden-image diffs
        if: failure() && matrix.kind == 'libcvc'
        uses: actions/upload-artifact@v4
        with:
          name: ari-golden-${{ runner.os }}-${{ matrix.name }}
          path: build/src/cvcGL/ari_golden/
          if-no-files-found: ignore
          retention-days: 14

      - name: Pack libcvc zip
        if: matrix.kind == 'libcvc'
        shell: pwsh
        working-directory: build
        run: |
          $stem = "libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-windows-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}"
          cpack -G ZIP -C ${{ matrix.build_type }} -D CPACK_COMPONENTS_ALL=libcvc -D CPACK_PACKAGE_FILE_NAME="$stem"
          Move-Item "$stem-libcvc.zip" "$stem.zip"
          Copy-Item "$stem.zip" "$env:GITHUB_WORKSPACE/"

      - name: Upload Windows libcvc zip
        if: matrix.kind == 'libcvc'
        uses: actions/upload-artifact@v4
        with:
          name: libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-windows-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.zip
          path: libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-windows-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.zip
          if-no-files-found: error
          retention-days: 30
