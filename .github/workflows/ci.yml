name: CI/CD

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Concurrency: split into two pools.
#  * Cheap jobs (format-check, test) cancel in-progress on new pushes for
#    fast feedback.
#  * Heavy package jobs use job-level concurrency that does NOT cancel
#    in-progress, so a long VTK build always finishes and seeds
#    its cache. Without this, a push during a 22-min VTK build cancels
#    the run before the post-job cache save can fire, which traps the
#    workflow in a permanent cold-cache state.
#
# (Defined per-job below.)

# ───────────────────────────────────────────────────────────────────
# Per-PR / per-commit artifact set
#
# For every push and pull_request we produce the same artifact set
# released by release.yml so reviewers can QA a branch end-to-end
# before merging. CI artifacts include the short commit SHA in their
# filenames; tag-driven release artifacts (release.yml) deliberately
# omit it.
#
# Each artifact is uploaded individually with its full filename
# (extension included) as the artifact name, so the GitHub UI shows
# the format up front. (The download itself is always wrapped in a
# zip by GitHub Actions; that is a platform limitation and applies to
# every artifact regardless of inner format.)
#
# libcvc developer SDK (per OS, both Debug + Release):
#   - Linux:   libcvc-<ver>-<sha>-linux-<arch>-<config>.tar.gz
#   - macOS:   libcvc-<ver>-<sha>-macos-<arch>-<config>.zip
#   - Windows: libcvc-<ver>-<sha>-windows-<arch>-<config>.zip
#
# volrover3 end-user app (per OS, both Debug + Release):
#   - Linux:   volrover3-<ver>-<sha>-linux-<arch>-<config>.tar.gz
#              volrover3-<ver>-<sha>-linux-<arch>-<config>.deb
#              VolumeRover3-<ver>-<sha>-<arch>-<config>.AppImage
#   - macOS:   VolumeRover3-<ver>-<sha>-macos-<arch>-<config>.dmg
#              VolumeRover3-<ver>-<sha>-macos-<arch>-<config>.zip
#   - Windows: VolumeRover3-<ver>-<sha>-windows-<arch>-<config>.zip
#              VolumeRover3-<ver>-<sha>-windows-<arch>-<config>-setup.exe
# ───────────────────────────────────────────────────────────────────

jobs:
  # ─────────────────────── Format check ────────────────────────
  #
  # Enforces .clang-format on lines changed by this PR/push.
  # A whole-tree format pass landed on master, so this job is now
  # strict: any unformatted change fails the build. Run
  # `git clang-format <merge-base>` locally before pushing, or
  # `clang-format -i <file>` on touched files.
  format-check:
    name: clang-format (changed lines)
    runs-on: ubuntu-24.04
    # Cheap job: cancel previous in-progress runs on new pushes for fast feedback.
    concurrency:
      group: ci-${{ github.ref }}-format-check
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Determine merge base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # For push events, diff against the previous commit.
            base="${{ github.event.before }}"
            # Fallback for the very first push to a new branch.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD~1"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Run git-clang-format on changed lines
        run: |
          set -euo pipefail
          base="${{ steps.base.outputs.base }}"
          out=$(git clang-format --diff "$base" -- \
                  '*.c' '*.cc' '*.cpp' '*.cxx' \
                  '*.h' '*.hh' '*.hpp' '*.hxx' || true)
          if [ -z "$out" ] \
             || [ "$out" = "no modified files to format" ] \
             || [ "$out" = "clang-format did not modify any files" ]; then
            echo "Formatting OK on changed lines."
            exit 0
          fi
          echo "::error::clang-format would reformat changed lines. To apply:"
          echo "  git clang-format $base"
          echo
          echo "$out"
          exit 1

  # ──────────────────────────── Linux packaging ────────────────────────────
  #
  # Mirrors release.yml's linux job exactly, but injects -<sha> into
  # the artifact filename stem and uploads each output file as its own
  # GitHub artifact so the format/extension is visible in the UI.
  package-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libcvc-debug
            kind: libcvc
            build_type: Debug
          - name: libcvc-release
            kind: libcvc
            build_type: Release
          - name: libcvc-debug-grpc
            kind: libcvc
            build_type: Debug
            enable_grpc: true
          - name: volrover3-debug
            kind: volrover3
            build_type: Debug
          - name: volrover3-release
            kind: volrover3
            build_type: Release
    name: package-linux / ${{ matrix.name }}
    # Heavy job (VTK from-source build): do NOT cancel in-progress runs.
    # Cancellation strands the cache and forces every subsequent run
    # back through a 22-min cold rebuild. Once a run completes, the
    # cache is warm and future runs are fast.
    concurrency:
      group: ci-${{ github.ref }}-package-linux-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          SHA=$(git rev-parse --short=8 HEAD)
          ARCH=$(uname -m)
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"          >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH"        >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"

      - name: Install dependencies (libcvc)
        if: matrix.kind == 'libcvc'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libboost-all-dev libhdf5-dev libfftw3-dev libgsl-dev \
            libmagick++-dev libcgal-dev liblog4cplus-dev
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            sudo apt-get install -y --no-install-recommends lcov
          fi
          if [ "${{ matrix.enable_grpc }}" = "true" ]; then
            sudo apt-get install -y --no-install-recommends \
              libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc
          fi

      # CUDA toolkit so the shipped artifacts can offload to NVIDIA GPUs
      # at runtime when an NVIDIA driver is present. cudart is linked
      # statically (CMAKE_CUDA_RUNTIME_LIBRARY=Static below) so users
      # only need the NVIDIA driver, not a CUDA install. CMake's
      # check_language(CUDA) auto-disables CUDA gracefully if this step
      # ever fails.
      - name: Install CUDA toolkit (Linux)
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.5.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cudart-dev"]'

      - name: Install dependencies (volrover3)
        if: matrix.kind == 'volrover3'
        run: |
          sudo apt-get update
          # Qt6 + VTK + Boost/HDF5/FFTW/GSL/ImageMagick/CGAL/log4cplus all
          # come from cvcpkg via fetch-libcvc-deps below. We only install
          # the system runtime deps that Qt/VTK dlopen at runtime
          # (OpenGL, X11, GLEW), plus AppImage-tooling deps (libfuse2,
          # file, desktop-file-utils).
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libxt-dev mesa-common-dev libglew-dev \
            libxrender-dev libxcursor-dev libxinerama-dev libxi-dev \
            libfuse2 file desktop-file-utils

      # ── Pull dep bundle from libcvc-deps (via cvcpkg) ──
      # For volrover3 builds this provides Qt6 + VTK + all third-party
      # C/C++ deps in one shot; there is no fallback build path — if
      # cvcpkg cannot fetch the components, CMake configure will fail
      # with "Could not find Qt6/VTK", which is the right signal.
      # For libcvc-kind builds the bundle also provides the `libiimod`
      # CMake package (no longer vendored in this tree).
      - name: Fetch libcvc-deps
        id: libcvc-deps
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          build_type: Release
          link: shared

      - name: Configure
        run: |
          extra_prefix=""
          if [ "${{ matrix.kind }}" = "volrover3" ]; then
            # Qt6 + VTK + all third-party deps come from cvcpkg via
            # fetch-libcvc-deps. No source-build fallback.
            extra_prefix="${{ steps.libcvc-deps.outputs.path }}"
            if [ -z "$extra_prefix" ]; then
              extra_prefix="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
            fi
          elif [ "${{ matrix.kind }}" = "libcvc" ]; then
            # libcvc-kind needs libiimod from the libcvc-deps bundle.
            # Fall back to the default cvcpkg-install prefix when the
            # step gracefully returned empty (e.g. a single-bundle
            # download failed but earlier bundles unpacked into
            # $HOME/libcvc-deps).
            if [ -n "${{ steps.libcvc-deps.outputs.path }}" ]; then
              extra_prefix="${{ steps.libcvc-deps.outputs.path }}"
            else
              extra_prefix="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
            fi
          fi
          # libcvc-kind builds enable tests so the same artifacts we
          # ship get exercised by ctest. volrover3 builds keep tests
          # off (its install component has no test targets).
          tests=OFF
          coverage=OFF
          if [ "${{ matrix.kind }}" = "libcvc" ]; then
            tests=ON
            if [ "${{ matrix.build_type }}" = "Debug" ]; then
              coverage=ON
            fi
          fi
          grpc=OFF
          if [ "${{ matrix.enable_grpc }}" = "true" ]; then
            grpc=ON
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="$extra_prefix" \
            -DCVC_BUILD_TESTS=$tests \
            -DCVC_ENABLE_COVERAGE=$coverage \
            -DCVC_ENABLE_CUDA=ON \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static \
            -DDISABLE_CGAL=OFF \
            -DCVC_BUILD_VOLROVER3=${{ matrix.kind == 'volrover3' && 'ON' || 'OFF' }} \
            -DCVC_ENABLE_MESHER=ON \
            -DCVC_ENABLE_SDF=ON \
            -DCVC_ENABLE_GRPC=$grpc

      - name: Build
        run: cmake --build build --parallel

      # Run the test suite against the exact artifacts we are about to
      # package. Stress / convergence / benchmark / perf-hierarchy tests
      # can take many minutes and are only meaningful on trunk; exclude
      # them on PRs.
      - name: Run tests
        if: matrix.kind == 'libcvc'
        shell: bash
        run: |
          set -euo pipefail
          # Tests excluded on PRs (still run on push-to-master with --timeout 3600):
          #   Stress|Convergence|Benchmark            : long-running suites
          #   Performance                              : perf benchmarks (>200s in Debug)
          #   BunnySDF_IsoRoundtrip|QualityImproveAllMethods : heavy Debug-only
          #   Integration                              : CLI integration tests (several minutes)
          STRESS_REGEX='(Stress|Convergence|Benchmark|Performance|BunnySDF_IsoRoundtrip|QualityImproveAllMethods|Integration)'
          if [ "${{ github.event_name }}" = "push" ]; then
            CVC_DISTRIBUTED_STATE_BENCH=1 \
            ctest --test-dir build \
                  --build-config ${{ matrix.build_type }} \
                  --output-on-failure --parallel \
                  --repeat until-pass:3 --timeout 3600
          else
            ctest --test-dir build \
                  --build-config ${{ matrix.build_type }} \
                  --output-on-failure --parallel \
                  --repeat until-pass:3 --timeout 300 \
                  -E "${STRESS_REGEX}"
          fi

      - name: Generate coverage report
        if: matrix.kind == 'libcvc' && matrix.build_type == 'Debug'
        run: |
          lcov --directory build --capture --output-file build/coverage.info --ignore-errors mismatch
          lcov --remove build/coverage.info \
            '/usr/*' '*/test/*' '*/tests/*' '*/_deps/*' '*/googletest/*' \
            --output-file build/coverage_filtered.info \
            --ignore-errors unused
          genhtml build/coverage_filtered.info \
            --output-directory build/coverage_html \
            --title "libcvc Code Coverage" \
            --legend --demangle-cpp --ignore-errors source

      - name: Upload coverage report
        if: matrix.kind == 'libcvc' && matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage_html/
          retention-days: 30

      - name: Upload coverage to Codecov
        if: matrix.kind == 'libcvc' && matrix.build_type == 'Debug'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Pack libcvc tarball
        if: matrix.kind == 'libcvc'
        working-directory: build
        run: |
          STEM="libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}"
          cpack -G TGZ -D CPACK_COMPONENTS_ALL=libcvc \
                       -D CPACK_PACKAGE_FILE_NAME="$STEM"
          mv "$STEM-libcvc.tar.gz" "$STEM.tar.gz"
          cp "$STEM.tar.gz" "$GITHUB_WORKSPACE/"
          echo "STEM=$STEM" >> "$GITHUB_ENV"

      - name: Build AppImage
        if: matrix.kind == 'volrover3'
        run: |
          set -euo pipefail
          STEM="VolumeRover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}"
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr --component libcvc
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr --component volrover3
          curl -L -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          cp AppDir/usr/share/applications/volrover3.desktop AppDir/
          cp AppDir/usr/share/icons/hicolor/256x256/apps/volrover_logo.png AppDir/volrover_logo.png
          export QML_SOURCES_PATHS=""
          export OUTPUT="${STEM}.AppImage"
          # linuxdeploy walks the volrover3 ELF NEEDED entries and
          # resolves them by name; libcvc.so.3 lives under
          # AppDir/usr/lib/x86_64-linux-gnu/ (Debian's GNUInstallDirs
          # default) which is not on the default search path. Qt6 + VTK
          # come from the libcvc-deps prefix populated by cvcpkg.
          deps_root="${{ steps.libcvc-deps.outputs.path }}"
          if [ -z "$deps_root" ]; then
            deps_root="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          vtk_lib_path="$deps_root/lib"
          export LD_LIBRARY_PATH="$PWD/AppDir/usr/lib:$PWD/AppDir/usr/lib/x86_64-linux-gnu:$vtk_lib_path:${LD_LIBRARY_PATH:-}"
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
                        --desktop-file AppDir/volrover3.desktop \
                        --icon-file    AppDir/volrover_logo.png || \
          ./linuxdeploy --appdir AppDir --output appimage \
                        --desktop-file AppDir/volrover3.desktop \
                        --icon-file    AppDir/volrover_logo.png
          # Rename the produced AppImage to the canonical STEM only if
          # appimagetool didn't already write it under that name.
          # (linuxdeploy honors OUTPUT=$STEM.AppImage, so usually it
          # is already correct; older versions wrote a generic name.)
          for f in *.AppImage; do
            case "$f" in
              linuxdeploy*) ;;
              "${STEM}.AppImage") ;;
              *) mv "$f" "${STEM}.AppImage" ;;
            esac
          done

      - name: Pack volrover3 tarball + .deb
        if: matrix.kind == 'volrover3'
        run: |
          set -euo pipefail
          STEM="volrover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}"
          # AppDir was populated by linuxdeploy in the previous step and
          # contains libcvc.so, Qt6, VTK, and all transitive deps. Pack
          # that tree (not the bare cpack volrover3 component, which is
          # ~700 KB and useless without the bundled runtime).
          tar czf "$STEM.tar.gz" --transform 's|^AppDir|volrover3|' AppDir

          pkg=pkg-deb
          rm -rf "$pkg"
          mkdir -p "$pkg/opt/volrover3" "$pkg/usr/local/bin" \
                   "$pkg/usr/share/applications" "$pkg/DEBIAN"
          cp -a AppDir/. "$pkg/opt/volrover3/"
          ln -sf /opt/volrover3/AppRun "$pkg/usr/local/bin/volrover3"
          if [ -f AppDir/volrover3.desktop ]; then
            cp AppDir/volrover3.desktop "$pkg/usr/share/applications/"
          fi
          arch_deb=$(dpkg --print-architecture)
          inst_kb=$(du -sk "$pkg/opt" "$pkg/usr" | awk '{s+=$1} END {print s}')
          cat > "$pkg/DEBIAN/control" <<CONTROL
          Package: volrover3
          Version: ${{ steps.meta.outputs.version }}
          Section: science
          Priority: optional
          Architecture: $arch_deb
          Installed-Size: $inst_kb
          Maintainer: CVC <noreply@github.com>
          Description: VolumeRover3 - volumetric visualization application
           Self-contained build with bundled Qt6, VTK, and libcvc.
          CONTROL
          # dpkg expects column-1 fields; strip the heredoc indent.
          sed -i 's/^          //' "$pkg/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$pkg" "$STEM.deb"

      # One artifact per file so each shows its real extension on GitHub.
      - name: Upload Linux libcvc tarball
        if: matrix.kind == 'libcvc'
        uses: actions/upload-artifact@v4
        with:
          name: libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.tar.gz
          path: libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux volrover3 tarball
        if: matrix.kind == 'volrover3'
        uses: actions/upload-artifact@v4
        with:
          name: volrover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.tar.gz
          path: volrover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux volrover3 .deb
        if: matrix.kind == 'volrover3'
        uses: actions/upload-artifact@v4
        with:
          name: volrover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.deb
          path: volrover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux volrover3 AppImage
        if: matrix.kind == 'volrover3'
        uses: actions/upload-artifact@v4
        with:
          name: VolumeRover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.AppImage
          path: VolumeRover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.AppImage
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────── macOS packaging ────────────────────────────
  package-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libcvc-debug
            kind: libcvc
            build_type: Debug
          - name: libcvc-release
            kind: libcvc
            build_type: Release
          - name: volrover3-debug
            kind: volrover3
            build_type: Debug
          - name: volrover3-release
            kind: volrover3
            build_type: Release
    name: package-macos / ${{ matrix.name }}
    # Heavy job: do not cancel in-progress runs (mirrors package-linux).
    concurrency:
      group: ci-${{ github.ref }}-package-macos-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          SHA=$(git rev-parse --short=8 HEAD)
          ARCH=$(uname -m)
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"          >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH"        >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"

      - name: Install dependencies (libcvc)
        if: matrix.kind == 'libcvc'
        run: |
          # All C/C++ third-party libs (Boost/HDF5/FFTW/GSL/ImageMagick/
          # CGAL/log4cplus/libiimod) come from cvcpkg via
          # fetch-libcvc-deps below. Only build tooling here.
          brew install cmake ninja zstd

      - name: Install dependencies (volrover3)
        if: matrix.kind == 'volrover3'
        run: |
          # Qt6 + VTK + all third-party C/C++ deps come from cvcpkg via
          # fetch-libcvc-deps below. Only build tooling here.
          brew install cmake ninja zstd

      # ── Pull dep prefix via cvcpkg ──
      # Provides Qt6 + VTK + all third-party C/C++ deps for volrover3
      # and the libiimod CMake package for libcvc.
      - name: Fetch libcvc-deps
        id: libcvc-deps-macos
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          build_type: Release
          link: shared

      - name: Configure
        run: |
          tests=OFF
          [ "${{ matrix.kind }}" = "libcvc" ] && tests=ON
          # cvcpkg is the sole third-party prefix on macOS.
          deps_path="${{ steps.libcvc-deps-macos.outputs.path }}"
          if [ -z "$deps_path" ]; then
            deps_path="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          export CMAKE_PREFIX_PATH="$deps_path"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCVC_BUILD_TESTS=$tests \
            -DCVC_ENABLE_CUDA=OFF \
            -DDISABLE_CGAL=OFF \
            -DCVC_BUILD_VOLROVER3=${{ matrix.kind == 'volrover3' && 'ON' || 'OFF' }} \
            -DCVC_ENABLE_MESHER=ON \
            -DCVC_ENABLE_SDF=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        if: matrix.kind == 'libcvc'
        shell: bash
        run: |
          set -euo pipefail
          # See linux ctest step for rationale.
          STRESS_REGEX='(Stress|Convergence|Benchmark|Performance|BunnySDF_IsoRoundtrip|QualityImproveAllMethods|Integration)'
          if [ "${{ github.event_name }}" = "push" ]; then
            CVC_DISTRIBUTED_STATE_BENCH=1 \
            ctest --test-dir build --build-config ${{ matrix.build_type }} \
                  --output-on-failure --parallel --repeat until-pass:3 --timeout 3600
          else
            ctest --test-dir build --build-config ${{ matrix.build_type }} \
                  --output-on-failure --parallel --repeat until-pass:3 --timeout 300 \
                  -E "${STRESS_REGEX}"
          fi

      - name: Pack libcvc zip
        if: matrix.kind == 'libcvc'
        working-directory: build
        run: |
          STEM="libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-macos-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}"
          cpack -G ZIP -D CPACK_COMPONENTS_ALL=libcvc \
                       -D CPACK_PACKAGE_FILE_NAME="$STEM"
          mv "$STEM-libcvc.zip" "$STEM.zip"
          cp "$STEM.zip" "$GITHUB_WORKSPACE/"

      - name: Pack volrover3 .dmg + .zip
        if: matrix.kind == 'volrover3'
        working-directory: build
        run: |
          set -euo pipefail
          STEM="VolumeRover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-macos-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}"
          # CPack DragNDrop runs the install rules (which invoke
          # macdeployqt) and produces a deployed VolumeRover3.app under
          # _CPack_Packages/Darwin/DragNDrop/<STEM>/ALL_IN_ONE/, then
          # wraps it into the .dmg.
          cpack -G DragNDrop -D CPACK_COMPONENTS_ALL=volrover3 \
                             -D CPACK_PACKAGE_FILE_NAME="$STEM"
          # Zip the already-deployed .app instead of running cpack -G ZIP
          # a second time. Re-running cpack triggers a fresh install +
          # macdeployqt pass that hits a component-dependency edge case
          # in CPack (volrover3 → libcvc) and aborts during compression.
          # `ditto -c -k --keepParent` is the canonical macOS-native zip
          # for app bundles (preserves resource forks, symlinks, perms,
          # extended attrs, codesign metadata).
          APP_DIR="_CPack_Packages/Darwin/DragNDrop/$STEM/ALL_IN_ONE"
          ditto -c -k --keepParent "$APP_DIR/VolumeRover3.app" "$STEM.zip"
          cp "$STEM.dmg" "$STEM.zip" "$GITHUB_WORKSPACE/"

      - name: Upload macOS libcvc zip
        if: matrix.kind == 'libcvc'
        uses: actions/upload-artifact@v4
        with:
          name: libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-macos-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.zip
          path: libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-macos-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS volrover3 dmg
        if: matrix.kind == 'volrover3'
        uses: actions/upload-artifact@v4
        with:
          name: VolumeRover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-macos-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.dmg
          path: VolumeRover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-macos-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS volrover3 zip
        if: matrix.kind == 'volrover3'
        uses: actions/upload-artifact@v4
        with:
          name: VolumeRover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-macos-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.zip
          path: VolumeRover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-macos-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.zip
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────── Windows packaging ────────────────────────────
  package-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libcvc-debug
            kind: libcvc
            build_type: Debug
          - name: libcvc-release
            kind: libcvc
            build_type: Release
          - name: volrover3-debug
            kind: volrover3
            build_type: Debug
          - name: volrover3-release
            kind: volrover3
            build_type: Release
    name: package-windows / ${{ matrix.name }}
    # Do NOT cancel in-progress runs; see package-linux for rationale.
    concurrency:
      group: ci-${{ github.ref }}-package-windows-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          SHA=$(git rev-parse --short=8 HEAD)
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"          >> "$GITHUB_OUTPUT"
          echo "arch=x86_64"       >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"

      # ── Pull all third-party deps (incl. Qt6 + VTK) from cvcpkg ──
      # cvcpkg is the sole source of truth for third-party components
      # on Windows: Boost, HDF5, FFTW, GSL, ImageMagick, log4cplus,
      # CGAL, Qt6, VTK, etc. If cvcpkg cannot fetch the components,
      # CMake configure will fail with an explicit "Could not find X"
      # error, which is the correct signal — there is no vcpkg or
      # source-build fallback.
      - name: Fetch libcvc-deps (Windows)
        id: libcvc-deps-windows
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          build_type: ${{ matrix.build_type }}
          link: shared

      # CUDA toolkit so the shipped Windows artifacts can offload to
      # NVIDIA GPUs at runtime when an NVIDIA driver is present. cudart
      # is linked statically (CMAKE_CUDA_RUNTIME_LIBRARY=Static below)
      # so users only need the NVIDIA driver, not a CUDA install.
      - name: Install CUDA toolkit (Windows)
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.5.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Configure
        shell: pwsh
        run: |
          $vol = if ('${{ matrix.kind }}' -eq 'volrover3') { 'ON' } else { 'OFF' }
          $tests = if ('${{ matrix.kind }}' -eq 'libcvc') { 'ON' } else { 'OFF' }
          $depsPath = '${{ steps.libcvc-deps-windows.outputs.path }}'
          if (-not $depsPath) {
            # cvcpkg-install fell back; try the default prefix in case
            # some bundles unpacked before the failure.
            $depsPath = if ($env:LIBCVC_DEPS_PREFIX) { $env:LIBCVC_DEPS_PREFIX } else { 'D:\libcvc-deps' }
            if (-not (Test-Path $depsPath)) { $depsPath = '' }
          }
          # cvcpkg is the sole third-party prefix. No vcpkg toolchain
          # file, no aqt Qt6, no VTK source cache.
          $qtPrefix = if ($depsPath) { $depsPath } else { '' }
          cmake -B build `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_CONFIGURATION_TYPES=${{ matrix.build_type }} `
            -DCMAKE_PREFIX_PATH="$qtPrefix" `
            -DCVC_BUILD_TESTS=$tests `
            -DCVC_ENABLE_CUDA=ON `
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static `
            -DDISABLE_CGAL=OFF `
            -DCVC_BUILD_VOLROVER3=$vol `
            -DCVC_ENABLE_MESHER=ON `
            -DCVC_ENABLE_SDF=ON

      - name: Build
        shell: pwsh
        # gtest_discover_tests runs each test executable at build
        # time (POST_BUILD discovery mode, the GoogleTest module
        # default) to enumerate test names. On Windows the DLLs
        # consumed by those exes (libcvc-deps' Boost/HDF5/FFTW/Qt6/
        # VTK, plus our own cvc.dll) live in $depsPath\bin (release)
        # or $depsPath\debug\bin (debug) and build\bin\<Config>,
        # neither of which is on PATH during `cmake --build`. Without
        # these directories on PATH the discovery launch exits with
        # STATUS_DLL_NOT_FOUND (0xc0000135), and CMake aborts the
        # build with
        #   CMake Error at .../GoogleTestAddTests.cmake:132 (message):
        #     Error running test executable. Path: '.../state_test.exe'
        #     Result: Exit code 0xc0000135
        #
        # CRITICAL: cvcpkg ships Debug DLLs at debug/bin/ with the
        # SAME filename as their Release counterparts at bin/ (e.g.
        # both directories contain hdf5.dll, boost_thread-vc143-mt*).
        # Putting bin/ on PATH first under a Debug build causes the
        # consumer to load Release DLLs against a Debug import lib,
        # producing CRT/iterator-debug-level mismatches that surface
        # as SEH access violations (0xc0000005) and "unknown C++
        # exception" failures inside HDF5/Boost APIs.
        #
        # cvcpkg, however, ships Qt6 only at top-level bin/
        # (Qt6Core.dll AND Qt6Cored.dll co-located there because Qt
        # uses a 'd' suffix for Debug). So a Debug build still needs
        # bin/ on PATH to resolve Qt6Cored.dll, otherwise Qt-based
        # tests (GraphicsNodeTest, VolumeNodeTest, etc.) exit with
        # STATUS_DLL_NOT_FOUND (0xc0000135). Put debug/bin FIRST so
        # same-named-port DLLs load their debug variant, and bin/
        # second so Qt6's debug-suffixed DLLs still resolve.
        run: |
          $depsPath = '${{ steps.libcvc-deps-windows.outputs.path }}'
          $isDebug = '${{ matrix.build_type }}' -eq 'Debug'
          $buildBin = Join-Path $PWD "build\bin\${{ matrix.build_type }}"
          $extra = @()
          if ($depsPath) {
            if ($isDebug) {
              $depDbgBin = Join-Path $depsPath 'debug\bin'
              if (Test-Path $depDbgBin) { $extra += $depDbgBin }
              $extra += (Join-Path $depsPath 'bin')
            } else {
              $extra += (Join-Path $depsPath 'bin')
            }
          }
          if ($env:QT_ROOT_DIR) { $extra += (Join-Path $env:QT_ROOT_DIR 'bin') }
          $extra += $buildBin
          $env:PATH = ($extra -join ';') + ';' + $env:PATH
          cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run tests
        if: matrix.kind == 'libcvc'
        shell: pwsh
        env:
          DEPS_PATH: ${{ steps.libcvc-deps-windows.outputs.path }}
        run: |
          # ctest invokes the test executables, which need the same
          # DLL search path on PATH as build-time discovery (see the
          # Build step note above). Mirror the Debug/Release split
          # so Debug tests load Debug DLLs (CRT-compatible) and
          # Release tests load Release DLLs, with bin/ retained on
          # the Debug path so Qt6's debug-suffixed DLLs resolve.
          $isDebug = '${{ matrix.build_type }}' -eq 'Debug'
          $buildBin = Join-Path $PWD "build\bin\${{ matrix.build_type }}"
          $extra = @()
          if ($env:DEPS_PATH) {
            if ($isDebug) {
              $depDbgBin = Join-Path $env:DEPS_PATH 'debug\bin'
              if (Test-Path $depDbgBin) { $extra += $depDbgBin }
              $extra += (Join-Path $env:DEPS_PATH 'bin')
            } else {
              $extra += (Join-Path $env:DEPS_PATH 'bin')
            }
          }
          if ($env:QT_ROOT_DIR) { $extra += (Join-Path $env:QT_ROOT_DIR 'bin') }
          $extra += $buildBin
          $env:PATH = ($extra -join ';') + ';' + $env:PATH
          # See linux ctest step for rationale.
          $stressRegex = '(Stress|Convergence|Benchmark|Performance|BunnySDF_IsoRoundtrip|QualityImproveAllMethods|Integration)'
          if ('${{ github.event_name }}' -eq 'push') {
            $env:CVC_DISTRIBUTED_STATE_BENCH = '1'
            ctest --test-dir build --build-config ${{ matrix.build_type }} `
                  --output-on-failure --parallel --repeat until-pass:3 --timeout 3600
          } else {
            ctest --test-dir build --build-config ${{ matrix.build_type }} `
                  --output-on-failure --parallel --repeat until-pass:3 --timeout 300 `
                  -E "$stressRegex"
          }

      - name: Install NSIS
        if: matrix.kind == 'volrover3'
        run: choco install nsis -y

      - name: Pack libcvc zip
        if: matrix.kind == 'libcvc'
        shell: pwsh
        working-directory: build
        run: |
          $stem = "libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-windows-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}"
          cpack -G ZIP -C ${{ matrix.build_type }} -D CPACK_COMPONENTS_ALL=libcvc -D CPACK_PACKAGE_FILE_NAME="$stem"
          Move-Item "$stem-libcvc.zip" "$stem.zip"
          Copy-Item "$stem.zip" "$env:GITHUB_WORKSPACE/"

      - name: Pack volrover3 zip + NSIS
        if: matrix.kind == 'volrover3'
        shell: pwsh
        working-directory: build
        run: |
          $stem = "VolumeRover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-windows-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}"
          $nsisPath = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\NSIS' -ErrorAction SilentlyContinue).'(default)'
          if (-not $nsisPath) {
            $nsisPath = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\NSIS' -ErrorAction SilentlyContinue).'(default)'
          }
          if ($nsisPath) { $env:PATH = "$nsisPath;$env:PATH" }

          # Override CPACK_COMPONENT_VOLROVER3_DEPENDS so cpack does not
          # try to package the libcvc component (which has no install
          # tree in this volrover3-only build).
          cpack -G ZIP  -C ${{ matrix.build_type }} -D CPACK_COMPONENTS_ALL=volrover3 -D CPACK_COMPONENT_VOLROVER3_DEPENDS= -D CPACK_PACKAGE_FILE_NAME="$stem"
          Move-Item "$stem-volrover3.zip" "$stem.zip"
          cpack -G NSIS -C ${{ matrix.build_type }} -D CPACK_COMPONENTS_ALL=volrover3 -D CPACK_COMPONENT_VOLROVER3_DEPENDS= -D CPACK_PACKAGE_FILE_NAME="$stem-setup"

          Copy-Item "$stem.zip"        "$env:GITHUB_WORKSPACE/"
          Copy-Item "$stem-setup.exe"  "$env:GITHUB_WORKSPACE/"

      # Setup MSVC dev shell so dumpbin.exe is on PATH for the
      # dependency verification step below.
      - name: Activate MSVC dev shell (for dumpbin)
        if: matrix.kind == 'volrover3'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Verify that the staged volrover3.exe and every DLL it transitively
      # depends on are present alongside the binary. Fails CI on any
      # missing non-system DLL (cudart64_*.dll, fftw3.dll, libomp140*.dll,
      # zlib1.dll, etc.) so we never ship a Windows artifact that crashes
      # at launch with a "DLL not found" error.
      - name: Verify Windows DLL dependencies (volrover3)
        if: matrix.kind == 'volrover3'
        shell: pwsh
        run: |
          $stem = "VolumeRover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-windows-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}"
          $extract = "$env:GITHUB_WORKSPACE\verify-bin"
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path "$env:GITHUB_WORKSPACE\$stem.zip" -DestinationPath $extract
          # CPack ZIP layout: <stem>/bin/volrover3.exe (CMAKE_INSTALL_BINDIR=bin)
          $bin = Get-ChildItem -Path $extract -Recurse -Filter volrover3.exe -File | Select-Object -First 1
          if (-not $bin) { throw "volrover3.exe not found in extracted zip" }
          & "$env:GITHUB_WORKSPACE\.github\scripts\verify-windows-deps.ps1" `
              -BinDir $bin.Directory.FullName `
              -Binaries volrover3.exe

      - name: Upload Windows libcvc zip
        if: matrix.kind == 'libcvc'
        uses: actions/upload-artifact@v4
        with:
          name: libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-windows-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.zip
          path: libcvc-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-windows-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows volrover3 zip
        if: matrix.kind == 'volrover3'
        uses: actions/upload-artifact@v4
        with:
          name: VolumeRover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-windows-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.zip
          path: VolumeRover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-windows-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows volrover3 NSIS installer
        if: matrix.kind == 'volrover3'
        uses: actions/upload-artifact@v4
        with:
          name: VolumeRover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-windows-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}-setup.exe
          path: VolumeRover3-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-windows-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.btlc }}-setup.exe
          if-no-files-found: error
          retention-days: 30
