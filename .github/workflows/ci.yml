name: CI/CD

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            build_type: Debug
            coverage: true
          - os: ubuntu-latest
            build_type: Release
            coverage: false
          # macOS
          - os: macos-latest
            build_type: Debug
            coverage: false
          - os: macos-latest
            build_type: Release
            coverage: false
          # Windows
          - os: windows-latest
            build_type: Debug
            coverage: false
          - os: windows-latest
            build_type: Release
            coverage: false

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Compute artifact metadata ──
      - name: Set artifact name
        shell: bash
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          SHA=$(git rev-parse --short=8 HEAD)
          ARCH=$(uname -m)
          case "$RUNNER_OS" in
            Linux)   OSTAG=linux   ;;
            macOS)   OSTAG=macos   ;;
            Windows) OSTAG=windows ;;
          esac
          BUILD_TYPE_LC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          STEM="libcvc-${VERSION}-${SHA}-${OSTAG}-${ARCH}-${BUILD_TYPE_LC}"
          echo "ARTIFACT_STEM=$STEM" >> "$GITHUB_ENV"

      # ── Linux dependencies ──
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libboost-all-dev \
            libhdf5-dev \
            libfftw3-dev \
            libgsl-dev \
            libmagick++-dev
          # Coverage tools
          if [ "${{ matrix.coverage }}" = "true" ]; then
            sudo apt-get install -y --no-install-recommends lcov
          fi

      # ── macOS dependencies ──
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install \
            cmake \
            ninja \
            boost \
            hdf5 \
            fftw \
            gsl \
            imagemagick
          echo "BOOST_ROOT=$(brew --prefix boost)" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$(brew --prefix boost)" >> $GITHUB_ENV

      # ── Windows dependencies (vcpkg) ──
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install boost-thread boost-date-time boost-regex boost-filesystem boost-system boost-chrono boost-program-options boost-signals2 boost-format boost-property-tree boost-algorithm boost-asio boost-any boost-array boost-dynamic-bitset boost-exception boost-foreach boost-function boost-lambda boost-lexical-cast boost-multi-array boost-optional boost-smart-ptr boost-tuple boost-utility hdf5 fftw3 gsl --triplet x64-windows

      # ── Configure ──
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake_args=(
            -B build
            -G Ninja
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
            -DCVC_BUILD_TESTS=ON
            -DCVC_ENABLE_CUDA=OFF
            -DDISABLE_CGAL=ON
            -DCVC_BUILD_VOLROVER3=OFF
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          )
          if [ "${{ matrix.coverage }}" = "true" ]; then
            cmake_args+=(-DCVC_ENABLE_COVERAGE=ON)
          fi
          cmake "${cmake_args[@]}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_CXX_STANDARD=17 `
            -DCVC_BUILD_TESTS=ON `
            -DCVC_ENABLE_CUDA=OFF `
            -DCVC_ENABLE_IMAGEMAGICK=OFF `
            -DDISABLE_CGAL=ON `
            -DCVC_BUILD_VOLROVER3=OFF `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      # ── Build ──
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # ── Test ──
      #
      # Stress / performance / convergence tests can take ~45 minutes and
      # are only meaningful to run on trunk. Run the full suite on push
      # events to main/master (merge-to-trunk) but exclude heavyweight
      # tests on pull-request events to keep PR feedback fast.
      #
      # ctest -E accepts a POSIX regex matched against the full test name;
      # the test names here come from gtest (TestSuite.TestCase).
      # --repeat until-pass:3 absorbs timing-sensitive flakes on macOS
      # CI runners (where short sleep_for() waits occasionally miss
      # boundaries under load).
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          EXCLUDE_REGEX='(Stress|Convergence|Benchmark|PerformanceHierarchy)'
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "push event (${{ github.ref }}): running full test suite including stress tests"
            ctest --test-dir build \
                  --build-config ${{ matrix.build_type }} \
                  --output-on-failure \
                  --parallel \
                  --repeat until-pass:3 \
                  --timeout 1800
          else
            echo "pull_request event: excluding stress/benchmark tests (regex: ${EXCLUDE_REGEX})"
            ctest --test-dir build \
                  --build-config ${{ matrix.build_type }} \
                  --output-on-failure \
                  --parallel \
                  --repeat until-pass:3 \
                  --timeout 300 \
                  -E "${EXCLUDE_REGEX}"
          fi

      # ── Coverage (Linux Debug only) ──
      - name: Generate coverage report
        if: matrix.coverage
        run: |
          lcov --directory build --capture --output-file build/coverage.info --ignore-errors mismatch
          lcov --remove build/coverage.info \
            '/usr/*' \
            '*/test/*' \
            '*/tests/*' \
            '*/_deps/*' \
            '*/googletest/*' \
            --output-file build/coverage_filtered.info \
            --ignore-errors unused
          genhtml build/coverage_filtered.info \
            --output-directory build/coverage_html \
            --title "libcvc Code Coverage" \
            --legend \
            --demangle-cpp \
            --ignore-errors source

      - name: Upload coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage_html/
          retention-days: 30

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # ── Install ──
      - name: Install
        run: cmake --install build --config ${{ matrix.build_type }}

      # ── Collect PDB files (Windows Debug) ──
      - name: Collect PDB files
        if: runner.os == 'Windows' && matrix.build_type == 'Debug'
        shell: pwsh
        run: |
          $pdbDir = "${{ github.workspace }}/install/pdb"
          New-Item -ItemType Directory -Force -Path $pdbDir | Out-Null
          Get-ChildItem -Path build -Recurse -Include *.pdb |
            Where-Object { $_.FullName -notlike '*CMakeFiles*' -and $_.FullName -notlike '*_deps*' } |
            ForEach-Object { Copy-Item $_.FullName -Destination $pdbDir -Force }

      # ── Package install tree ──
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ env.ARTIFACT_STEM }}.tar.gz" -C install .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd install && zip -r "${{ github.workspace }}/${{ env.ARTIFACT_STEM }}.zip" . && cd ..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path install\* -DestinationPath "${{ env.ARTIFACT_STEM }}.zip"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_STEM }}
          path: |
            *.tar.gz
            *.zip
          retention-days: 30
