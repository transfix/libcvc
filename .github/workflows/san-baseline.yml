name: sanitizer baseline (scratch, never merged)

# Threaded Stage 0, S0.13's second commit: one run of ci.yml's sanitizers job with the 16
# state_exec binaries no sanitizer has run yet, to see what they report and how long they take
# before they join SAN_CXX_TESTS. Lives only on ci/sanbase/** branches.
on:
  push:
    branches: [ 'ci/sanbase/**' ]

jobs:
  sanitizers:
    name: sanitizers / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          # required: one per line, `<run>: <text>`, where <run> is a name in SAN_CXX_TESTS or
          # SAN_PY_TESTS and <text> a line its log must contain (run.sh): gtest's "OK ]" line of a
          # case, or the pycvc script's "ok:" line. <run> may also be a scenario in SAN_BENCH, whose
          # line for a point is its params ("t=8 prog=fib runs=1"). Stage 0's lines, the same in
          # both legs, follow the locks phases'; "(" after a name keeps it from matching a longer
          # one.
          - name: tsan
            flags: -fsanitize=thread
            required: |
              state_exec_locks_test: OK ] LocksThreads.LT02_CrossThreadGrantWakes
              state_exec_locks_test: OK ] Schedulers/LocksThreads.LT03_HolderKilledAndSchedulerDestroyed/
              state_exec_locks_test: OK ] Schedulers/LocksThreads.LT03b_PostRacesDestruction/
              state_exec_locks_test: OK ] LocksThreads.LT04_FuzzedProtocolPoints
              state_exec_locks_test: OK ] LocksThreads.LT10_EightSchedulersRandom
              state_exec_locks_test: OK ] Schedulers/LocksThreads.LD06_CrossHomeCycleDeterministic/
              state_exec_locks_test: OK ] Schedulers/LocksThreads.PI07_LateRelevelRereads/
              state_exec_locks_test: OK ] Schedulers/LocksThreads.PI10_RoundRobinChildLendsNothing/
              state_exec_locks_test: OK ] Schedulers/LocksThreads.LX05_TimeoutAndKillRaceAnotherHomesGrant/
              state_exec_locks_test: OK ] Schedulers/LocksThreads.LX07_DestroyedWithAWakeInItsPort/
              state_exec_locks_test: OK ] Schedulers/LocksThreads.LX10_GrantThenWaiterKilledBeforeWake/
              state_exec_locks_test: OK ] Schedulers/LocksThreads.LX11_StalePostedWake/
              state_exec_locks_model_test: OK ] LocksModel.Homes
              state_exec_locks_model_test: OK ] LocksModel.TwoHomes
              test_pycvc_state_exec_locks.py: ok: test_lt01_two_execs_hot_key
              test_pycvc_state_exec_locks.py: ok: test_lt03_exec_destroyed
              test_pycvc_state_exec_locks.py: ok: test_lt07_progress_keeps_waiter_alive
              test_pycvc_state_exec_locks.py: ok: test_lt08_idle_limit
              test_pycvc_state_exec_locks.py: ok: test_lt10_eight_execs_smoke
              test_pycvc_state_exec_locks.py: ok: test_ld05_cycle_across_execs
              state_exec_exceptions_test: OK ] BuiltinClasses.HZ01_BuiltinClassDictsAreReadOnly
              state_exec_exceptions_test: OK ] BuiltinClasses.HZ01c_RaisingAClassDictIsUnchanged
              state_exec_exceptions_test: OK ] BuiltinClasses.HZ02_DerivedClassesStayMutable
              test_pycvc_state_exec_exceptions.py: ok: test_hz01_builtin_classes_read_only
              state_exec_intrinsics_test: OK ] StateTreeIntrinsicsTest.HZ03_StateDataSetStoresACopy
              state_exec_hazards_test: OK ] Hazards.HZ03_StateDataSetStoresACopy
              test_pycvc_state_exec_data.py: ok: test_hz03_state_data_set_copies
              state_exec_hazards_test: OK ] Hazards.HZ03b_StateDataSetChargesTheWriter
              state_exec_intrinsics_test: OK ] StateTreeIntrinsicsTest.HZ04_StateDataSetRefusesNestedCallables
              state_exec_data_steps_test: OK ] DataJob.IsolatingCopyRefusesAtAnyDepth
              state_exec_data_steps_test: OK ] DataJob.IsolatingCopyRefusesInALaterSlice
              state_exec_data_steps_test: OK ] DataJob.IsolatingCopySharesDataObjectsAndBuiltinClasses
              state_exec_data_steps_test: OK ] DataJob.IsolatingCopyKeepsSharingAndCycles
              state_exec_data_steps_test: OK ] DataJob.ShareModeStillSharesClosures
              test_pycvc_state_exec_data.py: ok: test_hz04_state_data_set_refuses_nested_callables
              state_exec_intrinsics_test: OK ] StateTreeIntrinsicsTest.HZ05_StateDeleteRemovesOnlyItsNode (
              state_exec_intrinsics_test: OK ] StateTreeIntrinsicsTest.HZ05_StateDeleteRemovesOnlyItsNodeChrooted
              state_lifetime_stress_test: OK ] StateLifetime.RemoveChildUnlinksOnlyThatChild
              state_lifetime_stress_test: OK ] StateLifetime.RemoveChildDefersDestructionWhilePinned
              state_lifetime_stress_test: OK ] StateLifetime.RemoveChildEmitsChildChangedNotExpiring
              state_exec_hazards_test: OK ] Hazards.HZ06_DeleteRecreateWhileReading
              state_exec_hazards_test: OK ] Hazards.HZ06b_SetTreeSurvivesAncestorDelete
              state_exec_scheduler_test: OK ] HazardsWatchRoot/0.HZ07_AChrootedWatchKeepsTheHostsSettings
              state_exec_scheduler_test: OK ] HazardsWatchRoot/1.HZ07_AChrootedWatchKeepsTheHostsSettings
              state_exec_scheduler_test: OK ] HazardsWatchRoot/0.HZ07b_EachDocumentsWatchFiresForItsOwnTree
              state_exec_scheduler_test: OK ] HazardsWatchRoot/1.HZ07b_EachDocumentsWatchFiresForItsOwnTree
              state_exec_scheduler_test: OK ] HazardsWatchRoot/0.HZ07c_AnUnchrootedWatchSetsTheRootAndPollsAreGatedPerRoot
              state_exec_scheduler_test: OK ] HazardsWatchRoot/1.HZ07c_AnUnchrootedWatchSetsTheRootAndPollsAreGatedPerRoot
              test_pycvc_state_exec_locks.py: ok: test_hz08_fork_in_exec_run
              ariadne_runtime_test: OK ] AriadneHazards.HZ08_ForkedChildKeepsOwnerAndTeardownReapsIt
              state_exec_coordinator_test: OK ] Priority.HZ09_BusThreadControlAppliesBetweenSteps
              mt.multi_exec: t=8 prog=fib runs=1
              mt.multi_exec: t=8 prog=exceptions runs=1
              mt.multi_exec: t=8 prog=tree runs=1
              test_pycvc_state_exec_exceptions.py: ok: test_hz11_two_execs_exceptions_and_data
              state_exec_hazards_test: OK ] Hazards.HZ12_PrintWritesWholeLines
              state_exec_hazards_test: OK ] Hazards.FromJsonAgainstDeletingWhatItWrites
              state_exec_hazards_test: OK ] Hazards.ContextRootPinsReleaseTheChrootFirst
              state_exec_hazards_test: OK ] Hazards.SetTreeJobPinsReleaseTheTargetFirst
              state_exec_hazards_test: OK ] Hazards.FromJsonJobPinsReleaseTheTargetFirst
              state_exec_hazards_test: OK ] Hazards.SettingsWalksSurviveADeleteOfStateExec
              state_exec_async_test: OK ] AsyncPostControl.KillPauseResumeSignalFromAnyThread
              state_exec_async_test: OK ] SyncPostControl.KillPauseResumeSignalFromAnyThread
              state_exec_hazards_test: OK ] Hazards.ContextAssignmentReleasesTheChrootFirst
              test_pycvc_state.py: ok: test_hz06_accessors_against_deletes
              test_pycvc_state.py: ok: test_observer_dropped_mid_callback_is_never_called
              test_pycvc_state_exec_exceptions.py: ok: test_a_builtin_exception_through_python_keeps_its_class
              state_exec_hazards_test: OK ] Hazards.ASchedulerStoppedFromAnotherThreadMayGoWhenItsRunReturns
              state_exec_async_test: OK ] AsyncPostControl.HasPendingControlWhileABatchApplies
              state_exec_async_test: OK ] SyncPostControl.HasPendingControlWhileABatchApplies
              state_exec_async_calls_test: OK ] AsyncCalls.ACancelledCallRaisesForAnAwaitAllParkedBeforeTheKill
              state_exec_async_calls_test: OK ] AsyncCalls.HZ13_AFutureAwaitedTwiceIsChargedOnce
              state_exec_async_calls_test: OK ] AsyncCalls.HZ13_AnOutcomeTakenBeforeTheDrainIsNotChargedAgain
              state_exec_async_calls_test: OK ] AsyncCalls.HZ13_ACancelledCallWakesEveryWaiter
              ariadne_runtime_test: OK ] AriadneHazards.HZ13_InitLaneAwaitsAnAppHostFuture
              state_exec_scheduler_test: OK ] SchedulerStop.HZ14_StopFromAnotherThreadEndsRun
              state_exec_async_test: OK ] AsyncSchedulerStop.HZ14_StopFromAnotherThreadEndsSyncRun
              test_pycvc_state_exec_sched.py: ok: test_hz14_stop_from_another_thread
          # No vptr check: it references the typeinfo of every polymorphic class it checks.
          # Jolt is built without RTTI, as are the two libcvc files that subclass its classes
          # (src/cvc/CMakeLists.txt), so that typeinfo exists nowhere and libcvc.so fails to
          # link ("undefined reference to `typeinfo for JPH::GroupFilter'").
          - name: asan-ubsan
            flags: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-sanitize=vptr
            required: |
              state_exec_locks_test: OK ] LocksThreads.LT02_CrossThreadGrantWakes
              state_exec_locks_test: OK ] Schedulers/LocksThreads.LT03b_PostRacesDestruction/sync
              state_exec_locks_test: OK ] Schedulers/LocksThreads.LT03b_PostRacesDestruction/async
              state_exec_locks_test: OK ] Schedulers/LocksThreads.LX07_DestroyedWithAWakeInItsPort/
              state_exec_locks_test: OK ] LocksThreads.LT10_EightSchedulersRandom
              state_exec_locks_model_test: OK ] LocksModel.Homes
              state_exec_locks_model_test: OK ] LocksModel.TwoHomes
              state_exec_exceptions_test: OK ] BuiltinClasses.HZ01_BuiltinClassDictsAreReadOnly
              state_exec_exceptions_test: OK ] BuiltinClasses.HZ01c_RaisingAClassDictIsUnchanged
              state_exec_exceptions_test: OK ] BuiltinClasses.HZ02_DerivedClassesStayMutable
              test_pycvc_state_exec_exceptions.py: ok: test_hz01_builtin_classes_read_only
              state_exec_intrinsics_test: OK ] StateTreeIntrinsicsTest.HZ03_StateDataSetStoresACopy
              state_exec_hazards_test: OK ] Hazards.HZ03_StateDataSetStoresACopy
              test_pycvc_state_exec_data.py: ok: test_hz03_state_data_set_copies
              state_exec_hazards_test: OK ] Hazards.HZ03b_StateDataSetChargesTheWriter
              state_exec_intrinsics_test: OK ] StateTreeIntrinsicsTest.HZ04_StateDataSetRefusesNestedCallables
              state_exec_data_steps_test: OK ] DataJob.IsolatingCopyRefusesAtAnyDepth
              state_exec_data_steps_test: OK ] DataJob.IsolatingCopyRefusesInALaterSlice
              state_exec_data_steps_test: OK ] DataJob.IsolatingCopySharesDataObjectsAndBuiltinClasses
              state_exec_data_steps_test: OK ] DataJob.IsolatingCopyKeepsSharingAndCycles
              state_exec_data_steps_test: OK ] DataJob.ShareModeStillSharesClosures
              test_pycvc_state_exec_data.py: ok: test_hz04_state_data_set_refuses_nested_callables
              state_exec_intrinsics_test: OK ] StateTreeIntrinsicsTest.HZ05_StateDeleteRemovesOnlyItsNode (
              state_exec_intrinsics_test: OK ] StateTreeIntrinsicsTest.HZ05_StateDeleteRemovesOnlyItsNodeChrooted
              state_lifetime_stress_test: OK ] StateLifetime.RemoveChildUnlinksOnlyThatChild
              state_lifetime_stress_test: OK ] StateLifetime.RemoveChildDefersDestructionWhilePinned
              state_lifetime_stress_test: OK ] StateLifetime.RemoveChildEmitsChildChangedNotExpiring
              state_exec_hazards_test: OK ] Hazards.HZ06_DeleteRecreateWhileReading
              state_exec_hazards_test: OK ] Hazards.HZ06b_SetTreeSurvivesAncestorDelete
              state_exec_scheduler_test: OK ] HazardsWatchRoot/0.HZ07_AChrootedWatchKeepsTheHostsSettings
              state_exec_scheduler_test: OK ] HazardsWatchRoot/1.HZ07_AChrootedWatchKeepsTheHostsSettings
              state_exec_scheduler_test: OK ] HazardsWatchRoot/0.HZ07b_EachDocumentsWatchFiresForItsOwnTree
              state_exec_scheduler_test: OK ] HazardsWatchRoot/1.HZ07b_EachDocumentsWatchFiresForItsOwnTree
              state_exec_scheduler_test: OK ] HazardsWatchRoot/0.HZ07c_AnUnchrootedWatchSetsTheRootAndPollsAreGatedPerRoot
              state_exec_scheduler_test: OK ] HazardsWatchRoot/1.HZ07c_AnUnchrootedWatchSetsTheRootAndPollsAreGatedPerRoot
              test_pycvc_state_exec_locks.py: ok: test_hz08_fork_in_exec_run
              ariadne_runtime_test: OK ] AriadneHazards.HZ08_ForkedChildKeepsOwnerAndTeardownReapsIt
              state_exec_coordinator_test: OK ] Priority.HZ09_BusThreadControlAppliesBetweenSteps
              mt.multi_exec: t=8 prog=fib runs=1
              mt.multi_exec: t=8 prog=exceptions runs=1
              mt.multi_exec: t=8 prog=tree runs=1
              test_pycvc_state_exec_exceptions.py: ok: test_hz11_two_execs_exceptions_and_data
              state_exec_hazards_test: OK ] Hazards.HZ12_PrintWritesWholeLines
              state_exec_hazards_test: OK ] Hazards.FromJsonAgainstDeletingWhatItWrites
              state_exec_hazards_test: OK ] Hazards.ContextRootPinsReleaseTheChrootFirst
              state_exec_hazards_test: OK ] Hazards.SetTreeJobPinsReleaseTheTargetFirst
              state_exec_hazards_test: OK ] Hazards.FromJsonJobPinsReleaseTheTargetFirst
              state_exec_hazards_test: OK ] Hazards.SettingsWalksSurviveADeleteOfStateExec
              state_exec_async_test: OK ] AsyncPostControl.KillPauseResumeSignalFromAnyThread
              state_exec_async_test: OK ] SyncPostControl.KillPauseResumeSignalFromAnyThread
              state_exec_hazards_test: OK ] Hazards.ContextAssignmentReleasesTheChrootFirst
              test_pycvc_state.py: ok: test_hz06_accessors_against_deletes
              test_pycvc_state.py: ok: test_observer_dropped_mid_callback_is_never_called
              test_pycvc_state_exec_exceptions.py: ok: test_a_builtin_exception_through_python_keeps_its_class
              state_exec_hazards_test: OK ] Hazards.ASchedulerStoppedFromAnotherThreadMayGoWhenItsRunReturns
              state_exec_async_test: OK ] AsyncPostControl.HasPendingControlWhileABatchApplies
              state_exec_async_test: OK ] SyncPostControl.HasPendingControlWhileABatchApplies
              state_exec_async_calls_test: OK ] AsyncCalls.ACancelledCallRaisesForAnAwaitAllParkedBeforeTheKill
              state_exec_async_calls_test: OK ] AsyncCalls.HZ13_AFutureAwaitedTwiceIsChargedOnce
              state_exec_async_calls_test: OK ] AsyncCalls.HZ13_AnOutcomeTakenBeforeTheDrainIsNotChargedAgain
              state_exec_async_calls_test: OK ] AsyncCalls.HZ13_ACancelledCallWakesEveryWaiter
              ariadne_runtime_test: OK ] AriadneHazards.HZ13_InitLaneAwaitsAnAppHostFuture
              state_exec_scheduler_test: OK ] SchedulerStop.HZ14_StopFromAnotherThreadEndsRun
              state_exec_async_test: OK ] AsyncSchedulerStop.HZ14_StopFromAnotherThreadEndsSyncRun
              test_pycvc_state_exec_sched.py: ok: test_hz14_stop_from_another_thread
    concurrency:
      group: ci-${{ github.ref }}-sanitizers-${{ matrix.name }}
      cancel-in-progress: true
    env:
      # C++ test executables (build/bin/<name>).
      SAN_CXX_TESTS: >-
        state_exec_scheduler_test state_exec_async_test state_exec_integration_test
        state_exec_coordinator_test ariadne_runtime_test thread_pool_test async_lane_test
        state_exec_locks_test state_exec_locks_model_test state_exec_priority_test
        state_exec_hazards_test state_lifetime_stress_test state_exec_intrinsics_test
        state_exec_exceptions_test state_exec_async_calls_test state_exec_data_steps_test
        state_exec_types_test state_exec_parser_test state_exec_builtins_test
        state_exec_evaluator_test state_exec_stackless_evaluator_test state_exec_codec_test
        state_exec_unicode_test state_exec_stdlib_test state_exec_heap_test
        state_exec_grammar_test state_exec_corpus_test state_exec_pegtl_test
        state_exec_gaps_test state_exec_advanced_integration_test state_exec_deep_data_test
        state_exec_bench_test
      # pycvc test scripts (bindings/pycvc/<name>).
      SAN_PY_TESTS: >-
        test_pycvc_exec.py test_pycvc_exec_async.py test_pycvc_exec_coro.py
        test_pycvc_state_exec.py test_pycvc_state_exec_async.py test_pycvc_state_exec_data.py
        test_pycvc_state_exec_eval.py test_pycvc_state_exec_exceptions.py
        test_pycvc_state_exec_sched.py test_pycvc_state_exec_locks.py test_pycvc_state.py
      # state_exec_bench runs (build/bin/state_exec_bench), one a line: a scenario and its --size
      # options; run.sh adds --reps 1 --warmup 0 --timeout 900 and the JSON file.
      SAN_BENCH: |
        mt.multi_exec --size t=8 --size runs=1
      # The lock tests read this and run their smaller sanitizer sizes.
      CVC_LOCKS_SANITIZER: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch libcvc-deps
        id: libcvc-deps
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          build_type: Release
          link: shared

      - name: Install build tools (cvcpkg)
        uses: ./.github/actions/cvcpkg-build-tools

      # Its own prefix, as in pycvc-linux: the interpreter bundle's zlib, openssl and friends must
      # not shadow the deps bundle's.
      - name: Install Python, numpy and SWIG (cvcpkg)
        shell: bash
        run: |
          set -euo pipefail
          py_prefix="$RUNNER_TEMP/py312"
          cvcpkg install python312 numpy-cp312 swig --prefix "$py_prefix" --config release --link shared
          "$py_prefix/bin/python3.12" -c "import numpy, sys; print(sys.version, 'numpy', numpy.__version__)"
          echo "PY_PREFIX=$py_prefix" >> "$GITHUB_ENV"

      # ubuntu-24.04's kernel randomizes mmap with 32 bits, more than gcc 13's sanitizer runtimes
      # can map around ("FATAL: ThreadSanitizer: unexpected memory mapping").
      - name: Narrow mmap randomization for the sanitizer runtimes
        run: sudo sysctl vm.mmap_rnd_bits=28

      # RelWithDebInfo, for line numbers in the reports. CUDA, OpenMP and cvcGL are off: nothing
      # under test uses them, and libgomp's uninstrumented barriers would only add TSan noise.
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ steps.libcvc-deps.outputs.path }}" ]; then
            deps="${{ steps.libcvc-deps.outputs.path }}"
          else
            deps="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          export LD_LIBRARY_PATH="$deps/lib:$PY_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          flags="${{ matrix.flags }} -fno-omit-frame-pointer"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$deps;$PY_PREFIX" \
            -DCMAKE_C_FLAGS="$flags" \
            -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_EXE_LINKER_FLAGS="$flags" \
            -DCMAKE_SHARED_LINKER_FLAGS="$flags" \
            -DCMAKE_MODULE_LINKER_FLAGS="$flags" \
            -DCVC_BUILD_TESTS=ON \
            -DCVC_BUILD_CVCGL=OFF \
            -DCVC_ENABLE_CUDA=OFF \
            -DCVC_ENABLE_OPENMP=OFF \
            -DCVC_BUILD_PYCVC=ON \
            -DCVC_BUILD_PYCVC_GL=OFF \
            -DPython3_EXECUTABLE="$PY_PREFIX/bin/python3.12" \
            -DSWIG_EXECUTABLE="$PY_PREFIX/bin/swig"

      - name: Build
        run: cmake --build build --parallel --target $SAN_CXX_TESTS state_exec_bench pycvc

      - name: Run the suites under ${{ matrix.name }}
        shell: bash
        env:
          SAN_REQUIRED: ${{ matrix.required }}
        run: bash .github/sanitizers/run.sh "${{ matrix.name }}"

      - name: Upload the sanitizer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizers-${{ matrix.name }}-logs
          path: san-logs/
          if-no-files-found: ignore
