# Publish the libcvc package family to cvcpkg.org
#
# Triggered by version tags (v*) and manual dispatch. Builds libcvc on
# Linux, macOS, and Windows, then packs each install into a tar.zst
# archive and publishes to the `cvc` organization on cvcpkg.org (created
# if it doesn't exist yet).
#
# Beyond the base libcvc SDK, the same build jobs also build, pack, and
# publish the rest of the family from their recipes in this repo
# (cvcpkg/recipes/{cvcgl,pycvc,pycvc-gl}):
#   * cvcgl     — the Qt-free VTK scene-graph library (needs VTK).
#   * pycvc     — the core SWIG numpy bindings (needs Python + numpy).
#   * pycvc-gl  — the scriptable-scene bindings (needs cvcgl + VTK + Python).
# Platform coverage (see the guards on each step below):
#   * Linux   — libcvc + cvcgl + pycvc + pycvc-gl (release config).
#   * Windows — libcvc + cvcgl always; pycvc/pycvc-gl only behind the
#               `windows_pycvc` dispatch input (still a TODO — unverified).
#   * macOS   — libcvc only: there is no macOS VTK bundle on the catalog
#               yet, so cvcgl/pycvc-gl cannot build and pycvc is skipped
#               to keep the family consistent per-platform.
# The family packages are built in the RELEASE matrix jobs only (they pack
# with `--config release` against the release Python/numpy/VTK bundles).
#
# Requires two repository secrets:
#   CVCPKG_TOKEN       — publisher token for the cvc org. IMPORTANT: in prod
#                        this token's owning user MUST be a member of the cvc
#                        org with owner/publisher role, or every `cvcpkg
#                        publish` here 403s. (Do not rotate/add secrets in the
#                        workflow — this is an org-membership requirement on
#                        the token itself.)
#   CVCPKG_SERVER_URL  — optional; defaults to https://cvcpkg.org
#
name: publish-cvcpkg

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack only; skip publish.'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      windows_pycvc:
        description: >-
          Also build/pack/publish pycvc + pycvc-gl on Windows (EXPERIMENTAL,
          unverified — Python/numpy/SWIG discovery on Windows is still a TODO).
          Off by default; cvcgl on Windows is unaffected and always runs.
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      publish_cuda:
        description: 'Also build+publish the libcvc-cuda GPU variant on linux AND windows (needs the self-hosted cuda runners; skipped otherwise).'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: publish-cvcpkg-${{ github.ref }}
  cancel-in-progress: false

env:
  CVCPKG_ORG: cvc
  CVCPKG_SERVER: ${{ secrets.CVCPKG_SERVER_URL || 'https://cvcpkg.org' }}

jobs:
  ensure-org:
    runs-on: ubuntu-latest
    env:
      CVCPKG_TOKEN: ${{ secrets.CVCPKG_TOKEN }}
    steps:
      - name: Ensure cvc org exists on cvcpkg.org
        if: env.CVCPKG_TOKEN != ''
        run: |
          set -euo pipefail
          server="${CVCPKG_SERVER%/}"
          slug="$CVCPKG_ORG"
          # POST /v1/orgs — 200 on create, 409 if it already exists.
          status=$(curl -sS -o /tmp/org.json -w '%{http_code}' \
            -X POST "$server/v1/orgs" \
            -H "Authorization: Bearer $CVCPKG_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{
              "slug": "cvc",
              "display_name": "Center for Computational Visualization",
              "description": "Official CVC-lab package publisher.",
              "homepage": "https://www.cs.utexas.edu/~bajaj/cvc/",
              "is_private": false
            }')
          if [ "$status" = "200" ] || [ "$status" = "201" ]; then
            echo "Created org $slug"
          elif [ "$status" = "409" ]; then
            echo "Org $slug already exists — OK"
          else
            echo "Org creation failed with HTTP $status:"
            cat /tmp/org.json
            exit 1
          fi

  # Compute ONE cvc_revision per family package before the build matrix, so
  # every platform/config of a package publishes the SAME +cvc.N (uniform, like
  # the old manual family bump). Each pack step below pins its number with
  # --cvc-revision. `next-revision` returns max(recipe_floor, highest_published
  # + 1) on the package's current upstream version, or the recipe floor if the
  # server is unreachable (harmless — such runs don't publish).
  compute-revisions:
    needs: ensure-org
    runs-on: ubuntu-latest
    env:
      CVCPKG_TOKEN: ${{ secrets.CVCPKG_TOKEN }}
    outputs:
      libcvc: ${{ steps.rev.outputs.libcvc }}
      cvcgl: ${{ steps.rev.outputs.cvcgl }}
      pycvc: ${{ steps.rev.outputs.pycvc }}
      pycvc_gl: ${{ steps.rev.outputs.pycvc_gl }}
      libcvc_cuda: ${{ steps.rev.outputs.libcvc_cuda }}
    steps:
      - uses: actions/checkout@v5
      - name: Install cvcpkg (from libcvc-deps master)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install 'git+https://github.com/transfix/libcvc-deps@master'
      - name: Compute next revision per package
        id: rev
        shell: bash
        run: |
          set -euo pipefail
          emit() {
            local pkg="$1" key="$2" rev
            rev="$(cvcpkg next-revision "cvcpkg/recipes/$pkg" \
              --server "$CVCPKG_SERVER" --org "$CVCPKG_ORG" --token "$CVCPKG_TOKEN")"
            echo "$pkg -> +cvc.$rev"
            echo "$key=$rev" >> "$GITHUB_OUTPUT"
          }
          emit libcvc      libcvc
          emit cvcgl       cvcgl
          emit pycvc       pycvc
          emit pycvc-gl    pycvc_gl
          emit libcvc-cuda libcvc_cuda

  build:
    needs: [ensure-org, compute-revisions]
    strategy:
      fail-fast: false
      matrix:
        # Two axes cross-product: every target × both configs = 10 jobs.
        # fail-fast off + per-job publish means each (arch, config) is
        # independent — a debug arch with no debug dep bundles source-builds
        # or fails on its own without blocking the release artifacts.
        config: [release, debug]
        target:
          # ubuntu-22.04 (glibc 2.35) pinned deliberately — same class of bug as
          # the windows-2022 pin below, but silent. ubuntu-latest is now 24.04
          # (glibc 2.39): glibc is backward- but not forward-compatible, so every
          # linux bundle published from it carries GLIBC_2.38 symbol references
          # and dies on the 22.04 fleet and on 22.04 users with
          #     version `GLIBC_2.38' not found
          # There is no compile error and no test failure — the artifact packs,
          # uploads and installs fine, then refuses to load. A catalog audit on
          # 2026-08-03 found this had already shipped libcvc, pycvc-gl, volrover3
          # and libcvc-cuda broken for every 22.04 consumer.
          # 2.35 is the cvcpkg fleet floor (libcvc-deps#432); cvcpkg pack now
          # verifies it and hard-fails, so leaving this on -latest would turn a
          # silent breakage into a red build — pin it so it is neither.
          - { os: ubuntu-22.04,     platform: linux,   arch: x86_64 }
          # Experimental: no linux-arm64 dep bundles on the catalog yet
          # (builder fleet is x86_64 + macOS); relies on cvcpkg source
          # fallback until the Phase-9 emulated-arch/arm64 builders land.
          # 22.04 here too, for the same floor reason.
          - { os: ubuntu-22.04-arm, platform: linux,   arch: arm64, experimental: true }
          - { os: macos-14,         platform: macos,   arch: arm64 }
          - { os: macos-13,         platform: macos,   arch: x86_64 }
          # windows-2022 (VS2022 v143) pinned deliberately: windows-latest now
          # ships VS2026 (v180), whose CL.exe ICEs (0xC0000005) on libcvc's
          # C++20 state_exec/distributed-state TUs (seen in dry-runs round 2-7;
          # same root cause as ci.yml's package-windows failures after the
          # image flip). Revisit when the v180 toolset stabilizes.
          - { os: windows-2022,     platform: windows, arch: x86_64 }
        exclude:
          # Windows debug is unsound to publish here: the catalog has no
          # windows-debug dep bundles, so a Debug libcvc would link against
          # Release MSVC deps — a debug/release CRT mismatch producing a
          # broken artifact. Restore once debug Windows dep bundles exist
          # (via the remote-builder fleet). Linux/macOS have no such issue:
          # a Debug libcvc links the Release (shared, ABI-stable) deps fine.
          - config: debug
            target: { os: windows-2022, platform: windows, arch: x86_64 }
    runs-on: ${{ matrix.target.os }}
    continue-on-error: ${{ matrix.target.experimental || false }}
    env:
      # CMake build-type (capitalized) derived from the cvcpkg config token.
      CMAKE_CFG: ${{ matrix.config == 'debug' && 'Debug' || 'Release' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install cvcpkg (from local workspace clone)
        shell: bash
        run: |
          set -euo pipefail
          # Pull from libcvc-deps master rather than PyPI so we always
          # pick up server/schema fixes without a release cadence.
          python -m pip install --upgrade pip
          pip install 'git+https://github.com/transfix/libcvc-deps@master'
          cvcpkg --version

      - name: Fetch libcvc-deps
        id: libcvc-deps
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          # Always fetch RELEASE deps — the catalog's debug coverage is
          # partial (e.g. no libiimod/hdf5 debug-linux bundles), and a Debug
          # libcvc links the Release, ABI-stable shared deps perfectly on
          # Linux/macOS (you debug libcvc's own code, not its dependencies).
          # This is why Windows debug is excluded above (CRT mismatch).
          build_type: Release
          link: shared

      - name: Configure (Linux/macOS)
        if: matrix.target.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          extra_prefix="${{ steps.libcvc-deps.outputs.path }}"
          if [ -z "$extra_prefix" ]; then
            extra_prefix="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$CMAKE_CFG" \
            -DCMAKE_PREFIX_PATH="$extra_prefix" \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" \
            -DCVC_BUILD_TESTS=OFF \
            -DCVC_ENABLE_CUDA=OFF \
            -DDISABLE_CGAL=OFF \
            -DCVC_BUILD_VOLROVER3=OFF \
            -DCVC_ENABLE_MESHER=ON \
            -DCVC_ENABLE_SDF=ON

      - name: Configure (Windows)
        if: matrix.target.platform == 'windows'
        shell: pwsh
        run: |
          $depsPath = '${{ steps.libcvc-deps.outputs.path }}'
          if (-not $depsPath) {
            $depsPath = if ($env:LIBCVC_DEPS_PREFIX) { $env:LIBCVC_DEPS_PREFIX } else { 'D:\libcvc-deps' }
          }
          # No vcpkg toolchain: cvcpkg is the sole third-party prefix, exactly
          # like libcvc's own ci.yml. Pulling in vcpkg.cmake here injected
          # conflicting MSVC flags/headers that crashed CL.exe (0xC0000005) on
          # the CGAL translation units — ci.yml builds Windows WITH CGAL and
          # uncapped parallelism precisely because it doesn't use vcpkg.
          cmake -B build `
            -DCMAKE_BUILD_TYPE="$env:CMAKE_CFG" `
            -DCMAKE_CONFIGURATION_TYPES="$env:CMAKE_CFG" `
            -DCMAKE_PREFIX_PATH="$depsPath" `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/stage" `
            -DCVC_BUILD_TESTS=OFF `
            -DCVC_ENABLE_CUDA=OFF `
            -DDISABLE_CGAL=OFF `
            -DCVC_BUILD_VOLROVER3=OFF `
            -DCVC_ENABLE_MESHER=ON `
            -DCVC_ENABLE_SDF=ON

      - name: Build & install
        id: build-libcvc
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel --config "$CMAKE_CFG"
          cmake --install build --config "$CMAKE_CFG" --component libcvc

      - name: Pack archive
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # --cvc-revision: the uniform revision computed once by the
          # compute-revisions job, so a republish of the same upstream version
          # never 409s. Replaces the manual "family revision bump".
          cvcpkg pack cvcpkg/recipes/libcvc \
            --from-prefix stage \
            --platform "${{ matrix.target.platform }}" \
            --config "${{ matrix.config }}" \
            --link shared \
            --local \
            --cvc-revision ${{ needs.compute-revisions.outputs.libcvc }} \
            --output-dir dist

      - name: Publish to cvcpkg.org
        if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
        shell: bash
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CVCPKG_TOKEN:-}" ]; then
            echo "CVCPKG_TOKEN secret is required to publish"
            exit 1
          fi
          cvcpkg publish \
            libcvc \
            --server "$CVCPKG_SERVER" \
            --org "$CVCPKG_ORG" \
            --platform "${{ matrix.target.platform }}" \
            --config "${{ matrix.config }}" \
            --link shared \
            --output-dir dist \
            --token "$CVCPKG_TOKEN"

      # ────────────────────────────────────────────────────────────────
      #  libcvc package FAMILY: cvcgl + pycvc + pycvc-gl
      #
      #  These build in the SAME job against the just-installed libcvc SDK
      #  (`stage`, the CMAKE_INSTALL_PREFIX above) + the fetched deps prefix,
      #  each into its own stage dir, then pack from their recipe and publish.
      #
      #  Independence: every step below is guarded with `!cancelled()` so a
      #  failure in one package does NOT skip the others (each still attempts,
      #  and a real failure stays visible as a red step — we deliberately do
      #  not `continue-on-error`, which would mask it). Ordering that matters:
      #  pycvc-gl links the installed cvcgl, so it runs after the cvcgl step.
      #
      #  Platform guards: family runs on Linux (all packages) and Windows
      #  (cvcgl always; pycvc/pycvc-gl behind the `windows_pycvc` input).
      #  macOS is intentionally libcvc-only (no macOS VTK bundle yet). Family
      #  is built only in RELEASE jobs (packs `--config release`).
      # ────────────────────────────────────────────────────────────────

      - name: Install family deps (Python 3.11 + numpy + VTK) [Linux]
        if: ${{ !cancelled() && steps.build-libcvc.outcome == 'success' && matrix.target.platform == 'linux' && matrix.config == 'release' }}
        shell: bash
        run: |
          set -euo pipefail
          PY="$GITHUB_WORKSPACE/py"
          # python311 + numpy (for pycvc/pycvc-gl), vtk (for cvcgl/pycvc-gl), and
          # vtk-python-cp311 — libvtkWrappingPythonCore + vtkPythonUtil.h for
          # pycvc-gl's Phase-5b vtkProp bridge (Python vtkActor -> C++ scene).
          # Without it pycvc-gl's configure dies at CMakeLists.txt:147.
          #
          # xorgproto: the X11 protocol headers (X11/X.h, extension *proto.h).
          # cvcgl's find_package(VTK) re-runs VTK's FindX11, which needs X11/X.h —
          # but xorgproto is only a *build* dep of the libx11/libxext/... recipes,
          # so `cvcpkg install vtk` (which pulls libx11 etc. as runtime deps) does
          # NOT drag in xorgproto, and X11_X11_INCLUDE_PATH goes unfound. Install
          # it explicitly. (Proper fix, follow-up: make xorgproto a runtime dep of
          # the X11 libs whose public headers #include it, so it's transitive.)
          cvcpkg install python311 numpy-cp311 vtk vtk-python-cp311 xorgproto \
            --prefix "$PY" --config release --link shared
          # The published numpy-cp311 wheel bundles openblas under
          # numpy.libs/, but that .so is NOT self-resolved by RPATH, so a bare
          # `import numpy` (which find_package(Python3 ... NumPy) performs)
          # fails. Put numpy.libs (and $PY/lib) on the loader path so the
          # interpreter can import numpy during configure, and compute the
          # include dir with the same environment.
          #   TODO: drop this guard once the numpy recipe fixes the wheel's
          #   RPATH and republishes (tracked in a separate libcvc-deps PR).
          export LD_LIBRARY_PATH="$PY/lib/python3.11/site-packages/numpy.libs:$PY/lib:${LD_LIBRARY_PATH:-}"
          NPY_INC="$("$PY/bin/python3.11" -c 'import numpy; print(numpy.get_include())')"
          {
            echo "PY=$PY"
            echo "NPY_INC=$NPY_INC"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          } >> "$GITHUB_ENV"

      # X11/OpenGL for the cvcgl/pycvc-gl VTK build now come HERMETICALLY from the
      # cvcpkg vtk bundle (>= 9.5.0+cvc.2), which carries libx11/libxext/libxt/
      # libglvnd/glu as runtime deps — so `cvcpkg install vtk` above already
      # staged them into $PY and there is nothing to apt-get. (The old
      # apt-get libx11-dev/libgl1-mesa-dev step was removed here.)

      - name: Build, pack & publish cvcgl [Linux]
        if: ${{ !cancelled() && steps.build-libcvc.outcome == 'success' && matrix.target.platform == 'linux' && matrix.config == 'release' }}
        shell: bash
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_TOKEN }}
          DO_PUBLISH: ${{ (github.event_name == 'push' || github.event.inputs.dry_run == 'false') && '1' || '0' }}
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/stage"
          DEPS="${{ steps.libcvc-deps.outputs.path }}"
          if [ -z "$DEPS" ]; then DEPS="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"; fi
          # cvcgl links the installed libcvc SDK ($STAGE) + VTK (from $PY).
          cmake -S src/cvcGL -B build-cvcgl -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/stage-cvcgl" \
            -DCMAKE_PREFIX_PATH="$STAGE;$PY;$DEPS"
          cmake --build build-cvcgl --parallel
          cmake --install build-cvcgl
          mkdir -p dist
          cvcpkg pack cvcpkg/recipes/cvcgl \
            --from-prefix stage-cvcgl \
            --platform "${{ matrix.target.platform }}" \
            --config release --link shared --local \
            --cvc-revision ${{ needs.compute-revisions.outputs.cvcgl }} \
            --output-dir dist
          if [ "$DO_PUBLISH" = "1" ]; then
            if [ -z "${CVCPKG_TOKEN:-}" ]; then
              echo "CVCPKG_TOKEN secret is required to publish"; exit 1
            fi
            cvcpkg publish cvcgl \
              --server "$CVCPKG_SERVER" --org "$CVCPKG_ORG" \
              --platform "${{ matrix.target.platform }}" \
              --config release --link shared --output-dir dist \
              --token "$CVCPKG_TOKEN"
          else
            echo "dry-run: skipping cvcgl publish"
          fi

      - name: Build, pack & publish pycvc [Linux]
        if: ${{ !cancelled() && steps.build-libcvc.outcome == 'success' && matrix.target.platform == 'linux' && matrix.config == 'release' }}
        shell: bash
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_TOKEN }}
          DO_PUBLISH: ${{ (github.event_name == 'push' || github.event.inputs.dry_run == 'false') && '1' || '0' }}
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/stage"
          DEPS="${{ steps.libcvc-deps.outputs.path }}"
          if [ -z "$DEPS" ]; then DEPS="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"; fi
          # Core numpy bindings only (no VTK). Python3_EXECUTABLE / NumPy include
          # come from the family-deps step ($PY, $NPY_INC on $LD_LIBRARY_PATH).
          cmake -S bindings/pycvc -B build-pycvc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCVC_BUILD_PYCVC_CORE=ON \
            -DCVC_BUILD_PYCVC_GL=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/stage-pycvc" \
            -DPython3_EXECUTABLE="$PY/bin/python3.11" \
            -DPython3_NumPy_INCLUDE_DIR="$NPY_INC" \
            -DCMAKE_PREFIX_PATH="$STAGE;$PY;$DEPS"
          cmake --build build-pycvc --parallel
          cmake --install build-pycvc
          mkdir -p dist
          cvcpkg pack cvcpkg/recipes/pycvc \
            --from-prefix stage-pycvc \
            --platform "${{ matrix.target.platform }}" \
            --config release --link shared --local \
            --cvc-revision ${{ needs.compute-revisions.outputs.pycvc }} \
            --output-dir dist
          if [ "$DO_PUBLISH" = "1" ]; then
            if [ -z "${CVCPKG_TOKEN:-}" ]; then
              echo "CVCPKG_TOKEN secret is required to publish"; exit 1
            fi
            cvcpkg publish pycvc \
              --server "$CVCPKG_SERVER" --org "$CVCPKG_ORG" \
              --platform "${{ matrix.target.platform }}" \
              --config release --link shared --output-dir dist \
              --token "$CVCPKG_TOKEN"
          else
            echo "dry-run: skipping pycvc publish"
          fi

      - name: Build, pack & publish pycvc-gl [Linux]
        if: ${{ !cancelled() && steps.build-libcvc.outcome == 'success' && matrix.target.platform == 'linux' && matrix.config == 'release' }}
        shell: bash
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_TOKEN }}
          DO_PUBLISH: ${{ (github.event_name == 'push' || github.event.inputs.dry_run == 'false') && '1' || '0' }}
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/stage"
          DEPS="${{ steps.libcvc-deps.outputs.path }}"
          if [ -z "$DEPS" ]; then DEPS="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"; fi
          # Scene module only; links the installed cvcgl (stage-cvcgl) + VTK.
          cmake -S bindings/pycvc -B build-pycvcgl -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCVC_BUILD_PYCVC_CORE=OFF \
            -DCVC_BUILD_PYCVC_GL=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/stage-pycvcgl" \
            -DPython3_EXECUTABLE="$PY/bin/python3.11" \
            -DPython3_NumPy_INCLUDE_DIR="$NPY_INC" \
            -DCMAKE_PREFIX_PATH="$STAGE;$PY;$DEPS;$GITHUB_WORKSPACE/stage-cvcgl"
          cmake --build build-pycvcgl --parallel
          cmake --install build-pycvcgl
          mkdir -p dist
          cvcpkg pack cvcpkg/recipes/pycvc-gl \
            --from-prefix stage-pycvcgl \
            --platform "${{ matrix.target.platform }}" \
            --config release --link shared --local \
            --cvc-revision ${{ needs.compute-revisions.outputs.pycvc_gl }} \
            --output-dir dist
          if [ "$DO_PUBLISH" = "1" ]; then
            if [ -z "${CVCPKG_TOKEN:-}" ]; then
              echo "CVCPKG_TOKEN secret is required to publish"; exit 1
            fi
            cvcpkg publish pycvc-gl \
              --server "$CVCPKG_SERVER" --org "$CVCPKG_ORG" \
              --platform "${{ matrix.target.platform }}" \
              --config release --link shared --output-dir dist \
              --token "$CVCPKG_TOKEN"
          else
            echo "dry-run: skipping pycvc-gl publish"
          fi

      - name: Build, pack & publish cvcgl [Windows]
        # cvcgl needs no Python, so it runs on Windows unconditionally (release).
        # Mirrors the libcvc Windows path: default VS2022 generator (no vcpkg
        # toolchain), multi-config `--config Release`.
        if: ${{ !cancelled() && steps.build-libcvc.outcome == 'success' && matrix.target.platform == 'windows' && matrix.config == 'release' }}
        shell: pwsh
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $depsPath = '${{ steps.libcvc-deps.outputs.path }}'
          if (-not $depsPath) {
            $depsPath = if ($env:LIBCVC_DEPS_PREFIX) { $env:LIBCVC_DEPS_PREFIX } else { 'D:\libcvc-deps' }
          }
          $stage = "$env:GITHUB_WORKSPACE/stage"
          $py    = "$env:GITHUB_WORKSPACE/py"
          # Only VTK is needed for cvcgl (no Python/numpy on this path).
          cvcpkg install vtk --prefix "$py" --config release --link shared
          cmake -B build-cvcgl -S src/cvcGL `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/stage-cvcgl" `
            -DCMAKE_PREFIX_PATH="$stage;$py;$depsPath"
          cmake --build build-cvcgl --config Release
          cmake --install build-cvcgl --config Release
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          cvcpkg pack cvcpkg/recipes/cvcgl `
            --from-prefix stage-cvcgl `
            --platform windows --config release --link shared --local `
            --cvc-revision ${{ needs.compute-revisions.outputs.cvcgl }} `
            --output-dir dist
          $doPublish = ($env:GITHUB_EVENT_NAME -eq 'push') -or ('${{ github.event.inputs.dry_run }}' -eq 'false')
          if ($doPublish) {
            if (-not $env:CVCPKG_TOKEN) { throw 'CVCPKG_TOKEN secret is required to publish' }
            cvcpkg publish cvcgl `
              --server "$env:CVCPKG_SERVER" --org "$env:CVCPKG_ORG" `
              --platform windows --config release --link shared --output-dir dist `
              --token "$env:CVCPKG_TOKEN"
          } else {
            Write-Host 'dry-run: skipping cvcgl publish'
          }

      - name: Build, pack & publish pycvc + pycvc-gl [Windows, EXPERIMENTAL]
        # TODO: Windows Python 3.11 + numpy + SWIG discovery for the bindings is
        # not yet verified (the numpy.libs loader-path workaround is Linux-only;
        # the Windows equivalent — PATH + _pycvc*.pyd — is untested). Gated OFF
        # behind the `windows_pycvc` dispatch input so tag pushes never run it;
        # flip the input to 'true' via workflow_dispatch to trial it. Until this
        # is proven, Windows publishes libcvc + cvcgl only.
        if: ${{ !cancelled() && steps.build-libcvc.outcome == 'success' && matrix.target.platform == 'windows' && matrix.config == 'release' && github.event.inputs.windows_pycvc == 'true' }}
        shell: pwsh
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $depsPath = '${{ steps.libcvc-deps.outputs.path }}'
          if (-not $depsPath) {
            $depsPath = if ($env:LIBCVC_DEPS_PREFIX) { $env:LIBCVC_DEPS_PREFIX } else { 'D:\libcvc-deps' }
          }
          $stage = "$env:GITHUB_WORKSPACE/stage"
          $py    = "$env:GITHUB_WORKSPACE/py"
          cvcpkg install python311 numpy-cp311 vtk --prefix "$py" --config release --link shared
          # Locate the interpreter + numpy include (paths differ from Linux).
          $python = if (Test-Path "$py/python.exe") { "$py/python.exe" } else { "$py/bin/python.exe" }
          # numpy's bundled DLLs live in numpy.libs; put them (and $py) on PATH
          # so `import numpy` works during configure (Windows analogue of the
          # Linux LD_LIBRARY_PATH numpy.libs guard).
          $env:PATH = "$py;$py/Library/bin;$py/lib/site-packages/numpy.libs;$env:PATH"
          $npyInc = (& $python -c 'import numpy; print(numpy.get_include())')
          # ── pycvc (core) ──
          cmake -B build-pycvc -S bindings/pycvc `
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CONFIGURATION_TYPES=Release `
            -DCVC_BUILD_PYCVC_CORE=ON -DCVC_BUILD_PYCVC_GL=OFF `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/stage-pycvc" `
            -DPython3_EXECUTABLE="$python" -DPython3_NumPy_INCLUDE_DIR="$npyInc" `
            -DCMAKE_PREFIX_PATH="$stage;$py;$depsPath"
          cmake --build build-pycvc --config Release
          cmake --install build-pycvc --config Release
          # ── pycvc-gl (scene; links installed cvcgl) ──
          cmake -B build-pycvcgl -S bindings/pycvc `
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CONFIGURATION_TYPES=Release `
            -DCVC_BUILD_PYCVC_CORE=OFF -DCVC_BUILD_PYCVC_GL=ON `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/stage-pycvcgl" `
            -DPython3_EXECUTABLE="$python" -DPython3_NumPy_INCLUDE_DIR="$npyInc" `
            -DCMAKE_PREFIX_PATH="$stage;$py;$depsPath;$env:GITHUB_WORKSPACE/stage-cvcgl"
          cmake --build build-pycvcgl --config Release
          cmake --install build-pycvcgl --config Release
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          cvcpkg pack cvcpkg/recipes/pycvc    --from-prefix stage-pycvc   --platform windows --config release --link shared --local --cvc-revision ${{ needs.compute-revisions.outputs.pycvc }} --output-dir dist
          cvcpkg pack cvcpkg/recipes/pycvc-gl --from-prefix stage-pycvcgl --platform windows --config release --link shared --local --cvc-revision ${{ needs.compute-revisions.outputs.pycvc_gl }} --output-dir dist
          $doPublish = ($env:GITHUB_EVENT_NAME -eq 'push') -or ('${{ github.event.inputs.dry_run }}' -eq 'false')
          if ($doPublish) {
            if (-not $env:CVCPKG_TOKEN) { throw 'CVCPKG_TOKEN secret is required to publish' }
            cvcpkg publish pycvc    --server "$env:CVCPKG_SERVER" --org "$env:CVCPKG_ORG" --platform windows --config release --link shared --output-dir dist --token "$env:CVCPKG_TOKEN"
            cvcpkg publish pycvc-gl --server "$env:CVCPKG_SERVER" --org "$env:CVCPKG_ORG" --platform windows --config release --link shared --output-dir dist --token "$env:CVCPKG_TOKEN"
          } else {
            Write-Host 'dry-run: skipping pycvc/pycvc-gl publish'
          }

  # ── Linux libcvc-cuda (GPU variant) ──────────────────────────────────────
  # The GitHub-hosted images have no nvcc or NVIDIA GPU, so the CUDA build
  # cannot run on ubuntu-latest. This job is therefore (a) opt-in: it only runs
  # on a manual dispatch with publish_cuda=true, and (b) targeted at a
  # self-hosted runner advertising the `cuda` label
  # (prettyhatemachine-libcvc-cuda; see vm-provisioning docs/CI.md). With
  # publish_cuda=false the `if` evaluates false and the job is skipped — no
  # runner is requested, so the rest of the workflow is unaffected.
  #
  # It builds the SAME sources as the CPU `build` job with CVC_ENABLE_CUDA=ON,
  # then packs/publishes the `libcvc-cuda` recipe
  # (provides: [libcvc], requires_capabilities: [cuda]). CMAKE_CUDA_ARCHITECTURES
  # defaults to 50;60;70;75;80 (top-level CMakeLists) — a broadly-usable
  # multi-arch fatbin; do NOT narrow it to the builder's own GPU.
  #
  # GLIBC FLOOR — this is why the job runs in a container (see below). The
  # 2026-08-03 catalog audit found libcvc-cuda 3.2.4+cvc.1 shipped requiring
  # GLIBC_2.38, unusable on the 22.04 fleet; cvcpkg pack now verifies the floor
  # (libcvc-deps#432), so a host build fails at pack time rather than shipping a
  # broken bundle.
  build-cuda:
    needs: [ensure-org, compute-revisions]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_cuda == 'true' }}
    runs-on: [self-hosted, linux, cuda]
    # Build inside a 22.04 CUDA image, NOT on the runner host.
    #
    # The only cuda-capable linux runner (prettyhatemachine) is Ubuntu 24.04 =
    # glibc 2.39, and the cvcpkg fleet floor is 2.35. Building on the host
    # produces GLIBC_2.38 references, which `cvcpkg pack` now hard-rejects
    # (libcvc-deps#432) — so this job would fail at pack time rather than ship a
    # bundle that cannot load on the 22.04 fleet or on 22.04 users.
    #
    # This is the manylinux answer: pin the BUILD environment's glibc rather
    # than the host's. 12.9.x-devel-ubuntu22.04 matches the CUDA major already
    # on the fleet (prettyhatemachine 12.0, sandipaws 12.9) and keeps sm_50 in
    # CMAKE_CUDA_ARCHITECTURES alive — newer CUDA majors drop the oldest arches.
    #
    # --gpus is deliberately NOT requested: nvcc cross-compiles a multi-arch
    # fatbin and no test executes on the GPU here, so the job needs the toolkit,
    # not the device. Requiring a device would also make the job fail on any
    # future cuda runner whose driver/container-toolkit pairing is off.
    container:
      image: nvidia/cuda:12.9.1-devel-ubuntu22.04
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        # Release only for now; add `debug` here once a debug-linux CUDA path is
        # exercised (Debug libcvc links the Release, ABI-stable shared deps).
        config: [release]
    env:
      CMAKE_CFG: ${{ matrix.config == 'debug' && 'Debug' || 'Release' }}
    steps:
      # nvidia/cuda:*-devel is a bare toolkit image: it has nvcc and gcc, but no
      # cmake, ninja, python, or git. The pre-container version of this job
      # inherited all of those from the runner host, so none of it was installed
      # here. fetch-libcvc-deps documents the same expectation — it excludes
      # host_tools from the installed closure because "CI provides cmake/ninja".
      #
      # This runs BEFORE actions/checkout so that checkout uses real git rather
      # than silently falling back to its REST-tarball path (which yields a
      # non-repo tree).
      - name: Install build toolchain (container)
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          # python-is-python3: the steps below invoke `python`, which Ubuntu
          # does not provide by default — only `python3`. Keeping the alias lets
          # those steps stay byte-identical to the CPU `build` job's.
          apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates \
            python3 python3-pip python3-venv python-is-python3
          # cmake/ninja from PyPI rather than apt: 22.04 ships cmake 3.22, and
          # the *only* reason this job is in this image is to pin glibc — there
          # is no reason to inherit a stale cmake with it.
          #
          # cmake<4 is deliberate. Unpinned, PyPI serves 4.x, which would make
          # this the ONLY lane on CMake 4 — every other job here uses the
          # GitHub images' 3.31.x. CMake 4 dropped compatibility with
          # cmake_minimum_required(VERSION <3.5), which is a hard error, and
          # plenty of the third-party Find/Config modules libcvc consumes
          # (CGAL's among them) still declare those floors. Debugging that on
          # the one lane nobody can reproduce locally is not a trade worth
          # making for a newer cmake we have no use for.
          pip install --no-cache-dir 'cmake<4' ninja

      - uses: actions/checkout@v5

      - name: Install cvcpkg (from local workspace clone)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install 'git+https://github.com/transfix/libcvc-deps@master'
          cvcpkg --version

      - name: Fetch libcvc-deps
        id: libcvc-deps
        uses: ./.github/actions/fetch-libcvc-deps
        with:
          build_type: Release
          link: shared

      - name: Configure (CUDA / Linux)
        shell: bash
        run: |
          set -euo pipefail
          extra_prefix="${{ steps.libcvc-deps.outputs.path }}"
          if [ -z "$extra_prefix" ]; then
            extra_prefix="${LIBCVC_DEPS_PREFIX:-$HOME/libcvc-deps}"
          fi
          # CVC_ENABLE_CUDA=ON is the ONLY delta from the CPU `build` job's
          # Configure (Linux/macOS) step — keep the rest in sync with it.
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$CMAKE_CFG" \
            -DCMAKE_PREFIX_PATH="$extra_prefix" \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" \
            -DCVC_BUILD_TESTS=OFF \
            -DCVC_ENABLE_CUDA=ON \
            -DDISABLE_CGAL=OFF \
            -DCVC_BUILD_VOLROVER3=OFF \
            -DCVC_ENABLE_MESHER=ON \
            -DCVC_ENABLE_SDF=ON

      - name: Assert CUDA is actually enabled
        shell: bash
        run: |
          set -euo pipefail
          # -DCVC_ENABLE_CUDA=ON is a REQUEST, not a guarantee: the top-level
          # CMakeLists runs check_language(CUDA) and, when nvcc is missing,
          # prints a STATUS line and does `set(CVC_ENABLE_CUDA OFF)` — a plain
          # variable, so the CACHE still reads CVC_ENABLE_CUDA:BOOL=ON. Grepping
          # the cache for CVC_ENABLE_CUDA would therefore "pass" on a toolkit-less
          # runner and we would publish a CPU-only build under the libcvc-cuda
          # name, which advertises requires_capabilities: [cuda] — worse than a
          # red job, because the resolver hands it to GPU users as the good
          # variant. CMAKE_CUDA_COMPILER is the honest signal; it is only set
          # when check_language actually found nvcc.
          cuda_cc="$(sed -n 's/^CMAKE_CUDA_COMPILER:[^=]*=//p' build/CMakeCache.txt | head -1)"
          case "${cuda_cc:-}" in
            ''|*NOTFOUND*)
              echo "::error::CUDA did NOT enable (CMAKE_CUDA_COMPILER='${cuda_cc:-<unset>}'). Refusing to pack a CPU-only bundle as libcvc-cuda."
              exit 1
              ;;
          esac
          echo "CUDA compiler: $cuda_cc"
          "$cuda_cc" --version

          # And assert the fatbin is actually multi-arch. The first dry run
          # packed a bundle whose device code was a single sm_52 target,
          # because enable_language(CUDA) pre-defines CMAKE_CUDA_ARCHITECTURES
          # and the project's list was applied too late to matter (fixed in
          # CMakeLists.txt). cubins only work forward within one major compute
          # capability and nothing emits PTX here, so a single-arch bundle
          # fails to launch on the fleet's own sm_86 cards. Cheap to check,
          # invisible until someone unpacks the tarball otherwise.
          arches="$(sed -n 's/^CMAKE_CUDA_ARCHITECTURES:[^=]*=//p' build/CMakeCache.txt | head -1)"
          echo "CUDA architectures: $arches"
          case "$arches" in
            *\;*) ;;
            *)
              echo "::error::CMAKE_CUDA_ARCHITECTURES='$arches' is a single architecture. Refusing to pack a libcvc-cuda that cannot launch off that exact GPU generation."
              exit 1
              ;;
          esac

      - name: Build & install
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel --config "$CMAKE_CFG"
          cmake --install build --config "$CMAKE_CFG" --component libcvc

      - name: Pack archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cvcpkg pack cvcpkg/recipes/libcvc-cuda \
            --from-prefix stage \
            --platform linux \
            --config "${{ matrix.config }}" \
            --link shared \
            --local \
            --cvc-revision ${{ needs.compute-revisions.outputs.libcvc_cuda }} \
            --output-dir dist

      - name: Publish to cvcpkg.org
        if: github.event.inputs.dry_run == 'false'
        shell: bash
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CVCPKG_TOKEN:-}" ]; then
            echo "CVCPKG_TOKEN secret is required to publish"
            exit 1
          fi
          cvcpkg publish \
            libcvc-cuda \
            --server "$CVCPKG_SERVER" \
            --org "$CVCPKG_ORG" \
            --platform linux \
            --config "${{ matrix.config }}" \
            --link shared \
            --output-dir dist \
            --token "$CVCPKG_TOKEN"

      # The container runs as root (--user root, needed for apt) but the
      # workspace is a bind-mount of the runner's _work dir on the host, and the
      # runner service there is an unprivileged user. Everything this job writes
      # — including .git — therefore lands root-owned, and the NEXT job to use
      # this runner fails trying to clean or re-checkout it. The symptom is an
      # unrelated job going red on a machine nobody touched, so restore
      # ownership here rather than leaving that landmine.
      # if: always() — a failed build leaves exactly the same root-owned tree.
      - name: Restore workspace ownership to the runner user
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # The parent dir is created by the runner process itself (outside the
          # container), so it still carries the host user's uid:gid.
          owner="$(stat -c '%u:%g' "$(dirname "$GITHUB_WORKSPACE")")"
          echo "Restoring $GITHUB_WORKSPACE to $owner"
          chown -R "$owner" "$GITHUB_WORKSPACE"

  # ── Windows libcvc-cuda (GPU variant) ────────────────────────────────────
  # Same deal as build-cuda above — opt-in behind publish_cuda, self-hosted
  # (sandipaws-libcvc-cuda: Windows 11, CUDA 12.9, VS Build Tools 2022 17.14),
  # packs the same `libcvc-cuda` recipe at the same compute-revisions number,
  # only `--platform windows`.
  #
  # Two ways this differs from its Linux twin:
  #
  #   * No container, and no glibc concern. The Windows equivalent of the glibc
  #     floor is the MSVC runtime, and the CPU `build` job already pins that by
  #     pinning the toolset (VS2022 v143); this job inherits the same toolset
  #     from the one VS on the runner.
  #   * Every step is `pwsh`, not `bash`. The CPU Windows steps use `shell: bash`
  #     because the GitHub-hosted images ship Git Bash; a self-hosted box only
  #     has it if someone installed Git for Windows, so depending on it here
  #     would be depending on an accident. pwsh 7 is present on sandipaws (the
  #     cvcpkg builder agent uses it).
  build-cuda-windows:
    needs: [ensure-org, compute-revisions]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_cuda == 'true' }}
    runs-on: [self-hosted, windows, cuda]
    strategy:
      fail-fast: false
      matrix:
        # Release only — deliberately, and for a different reason than the
        # Linux job's: the `build` matrix excludes Windows debug entirely
        # because the catalog has no windows-debug dep bundles, so a Debug
        # libcvc would link Release MSVC deps (CRT mismatch). Same applies here.
        config: [release]
    env:
      CMAKE_CFG: ${{ matrix.config == 'debug' && 'Debug' || 'Release' }}
    steps:
      - uses: actions/checkout@v5

      # ── Bootstrap ────────────────────────────────────────────────────────
      # This job takes exactly TWO things from the machine: MSVC and the CUDA
      # toolkit. Both are things a package manager cannot reasonably ship.
      # Everything else — cmake, the dependency closure — comes from the cvcpkg
      # catalog, and Python is bootstrapped if absent. Nothing here requires
      # anyone to have logged into the runner and installed something by hand.
      #
      # Getting here took three dry runs, each finding a different way this box
      # differs from a GitHub-hosted image:
      #
      #   1. `python` is C:\msys64\mingw64\bin\python.exe, which has no pip,
      #      and `cmake` is C:\Strawberry\c\bin\cmake.exe — Strawberry Perl's,
      #      built for gcc. Neither belongs near an MSVC + nvcc build.
      #   2. actions/setup-python cannot fix that: its Windows installer edits
      #      HKLM and this runner lacks the rights —
      #      "Remove registry entries for Python 3.12(x64)...
      #       ##[error]Remove-Item : Requested registry access is not allowed."
      #   3. Searching for an existing interpreter found only the MSYS2 one.
      #      The runner service is LocalSystem, so $env:LOCALAPPDATA is the
      #      SYSTEM profile: per-user installs, and the user PATH they extend,
      #      are structurally invisible here. No amount of probing fixes that.
      #
      # Hence: look for a usable interpreter, and if there is none, unpack
      # python.org's embeddable zip — no installer, no registry, no admin.
      # Python is ONLY needed because cvcpkg is a Python application; it is a
      # bootstrap, not part of the build toolchain.
      #
      # The search still runs first (a real interpreter beats a bootstrapped
      # one) and reports every candidate it rejected, because each iteration on
      # a roaming machine costs a dispatch.
      - name: Locate a usable Python
        id: findpy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cands = New-Object System.Collections.Generic.List[string]
          # The py launcher knows about every registered install.
          try {
            (& py -0p 2>$null) | ForEach-Object {
              if ($_ -match '([A-Za-z]:\\[^\r\n]*python\.exe)') { $cands.Add($Matches[1]) }
            }
          } catch { }

          # Ask the cvcpkg builder service where ITS interpreter lives. The
          # builder is a Python application and already runs on this machine,
          # so if anything here has a working CPython, that does.
          try {
            Get-CimInstance Win32_Service -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match 'cvcpkg' -or $_.PathName -match 'cvcpkg' } |
              ForEach-Object {
                if ($_.PathName -match '([A-Za-z]:\\[^"'']*python(?:w)?\.exe)') { $cands.Add($Matches[1]) }
              }
          } catch { }

          # NOTE on LOCALAPPDATA: this runner service is LocalSystem, so that
          # variable points at the SYSTEM profile, not a human's. The first
          # attempt at this step therefore found nothing but MSYS2's python
          # even though the box has others — a per-user Python install, and the
          # user-PATH entry that comes with it, are both invisible here. Hence
          # the explicit sweep of every user profile below.
          $roots = @(
            "$env:LOCALAPPDATA\Programs\Python",
            'C:\Program Files', 'C:\Program Files (x86)', 'C:\',
            'C:\ProgramData'
          )
          Get-ChildItem 'C:\Users' -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $roots += "$($_.FullName)\AppData\Local\Programs\Python"
          }
          foreach ($root in $roots) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Filter 'Python*' -Directory -ErrorAction SilentlyContinue |
                ForEach-Object {
                  $p = Join-Path $_.FullName 'python.exe'
                  if (Test-Path $p) { $cands.Add($p) }
                }
              # conda/mamba distributions keep python.exe at the root.
              Get-ChildItem -Path $root -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match '^(mini|ana)(forge|conda)\d*$' } |
                ForEach-Object {
                  $p = Join-Path $_.FullName 'python.exe'
                  if (Test-Path $p) { $cands.Add($p) }
                }
            }
          }
          $onPath = Get-Command python -ErrorAction SilentlyContinue
          if ($onPath) { $cands.Add($onPath.Source) }

          $rejected = @()
          $chosen = $null
          foreach ($p in ($cands | Select-Object -Unique)) {
            if ($p -match 'msys64|Strawberry|MinGW|mingw') { $rejected += "$p  (gcc-world toolchain)"; continue }
            & $p -m pip --version *> $null
            if ($LASTEXITCODE -ne 0) { $rejected += "$p  (no pip)"; continue }
            $chosen = $p; break
          }
          if (-not $chosen) {
            # NOT an error — the next step bootstraps a portable interpreter.
            # Nothing about this build should require someone to have logged
            # into the machine and installed Python by hand.
            Write-Host 'No pre-existing usable CPython; will bootstrap a portable one.'
            Write-Host 'Candidates considered:'
            if ($rejected) { $rejected | ForEach-Object { Write-Host "  - $_" } }
            else { Write-Host '  (none found at all)' }
            'found=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          'found=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using python: $chosen"
          $dir = Split-Path $chosen
          # Prepend so this interpreter, its pip, and anything pip installs
          # (cmake.exe, cvcpkg.exe) all shadow the MSYS2/Strawberry copies.
          $dir             | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$dir\Scripts"   | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PYEXE=$chosen"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bootstrap a portable Python (only if the box has none)
        if: steps.findpy.outputs.found != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # python.org's EMBEDDABLE distribution: a plain zip. No installer, no
          # registry writes, no admin rights, nothing left on the machine —
          # which is exactly why it works where actions/setup-python does not.
          #
          # This is a bootstrap, not the build toolchain. It exists only to run
          # cvcpkg, which then supplies cmake from the catalog. Everything the
          # build itself touches comes from cvcpkg or the CUDA toolkit.
          $ver  = '3.12.10'
          $root = Join-Path $env:RUNNER_TEMP 'py-embed'
          $zip  = Join-Path $env:RUNNER_TEMP 'py-embed.zip'
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force

          # The embeddable build ships with site imports disabled via a ._pth
          # file; pip cannot work until `import site` is uncommented.
          Get-ChildItem $root -Filter 'python*._pth' | ForEach-Object {
            (Get-Content $_.FullName) -replace '^#\s*import site', 'import site' |
              Set-Content $_.FullName
          }
          # ensurepip is not bundled in the embeddable distribution either.
          $getpip = Join-Path $root 'get-pip.py'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getpip
          $py = Join-Path $root 'python.exe'
          & $py $getpip --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { throw "get-pip failed ($LASTEXITCODE)" }
          & $py -m pip --version
          if ($LASTEXITCODE -ne 0) { throw "bootstrapped python still has no pip ($LASTEXITCODE)" }

          Write-Host "Bootstrapped python: $py"
          $root             | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$root\Scripts"   | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PYEXE=$py"       | Out-File -FilePath $env:GITHUB_ENV  -Append -Encoding utf8

      # A self-hosted Windows box has whatever was installed on it by hand,
      # which drifts. Fail here with a readable message rather than 40 minutes
      # later inside CMake's compiler detection.
      # Scope: only the things this job legitimately expects FROM THE MACHINE —
      # MSVC and the CUDA toolkit — plus the bootstrap interpreter. cmake is
      # NOT checked here: it does not exist yet, because it comes from the
      # cvcpkg catalog two steps down, and that step verifies it itself.
      - name: Preflight (what must come from the machine)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Presence is NOT enough — an earlier dry run failed with a python
          # that existed and a cmake that existed, both the wrong ones. Assert
          # capability, not that a name resolves.
          if (-not $env:PYEXE) { throw 'PYEXE unset — the Python provisioning steps did not run' }
          Write-Host "python -> $env:PYEXE"
          & $env:PYEXE -m pip --version
          if ($LASTEXITCODE -ne 0) { throw "the selected python ($env:PYEXE) has no pip" }

          $nvcc = Get-Command nvcc -ErrorAction SilentlyContinue
          if (-not $nvcc) { throw 'nvcc is not on PATH — the CUDA toolkit must be installed on this runner' }
          Write-Host "nvcc -> $($nvcc.Source)"
          # CUDA_PATH is set by the NVIDIA installer and is what the Configure
          # step hands to CMake as the CUDA toolset (see there for why).
          if (-not $env:CUDA_PATH) { throw 'CUDA_PATH is not set — is the CUDA toolkit installed?' }
          if (-not (Test-Path $env:CUDA_PATH)) { throw "CUDA_PATH points at a missing directory: $env:CUDA_PATH" }
          Write-Host "CUDA_PATH -> $env:CUDA_PATH"
          nvcc --version

      - name: Install cvcpkg (from local workspace clone)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PYEXE -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip self-upgrade failed ($LASTEXITCODE)" }
          & $env:PYEXE -m pip install 'git+https://github.com/transfix/libcvc-deps@master'
          if ($LASTEXITCODE -ne 0) { throw "cvcpkg install failed ($LASTEXITCODE)" }
          & $env:PYEXE -m cvcpkg --version

      - name: Install cmake from the cvcpkg catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # cmake 3.31.7+cvc.1 is published for windows/x86_64, so take it from
          # the catalog rather than pip or the machine. That keeps this lane on
          # the same cmake the rest of the fleet builds with, and displaces
          # Strawberry Perl's gcc-oriented copy that PATH would otherwise hand
          # us. (ninja is not needed — this job uses the VS generator.)
          $tools = Join-Path $env:GITHUB_WORKSPACE 'tools'
          & $env:PYEXE -m cvcpkg install cmake --prefix "$tools" --platform windows --config release --link shared
          if ($LASTEXITCODE -ne 0) { throw "cvcpkg install cmake failed ($LASTEXITCODE)" }
          $bin = Join-Path $tools 'bin'
          if (-not (Test-Path (Join-Path $bin 'cmake.exe'))) {
            Write-Host "::error::cvcpkg installed cmake but no cmake.exe under $bin"
            Get-ChildItem $tools -Recurse -Filter 'cmake.exe' | ForEach-Object { Write-Host "  found: $($_.FullName)" }
            exit 1
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install libcvc deps
        id: libcvc-deps
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Deliberately NOT the ./.github/actions/fetch-libcvc-deps composite.
          # That action is built for GitHub-hosted images: it runs
          # actions/setup-python (which cannot install on this runner) and its
          # steps are `shell: bash`. Calling install-deps directly is what the
          # composite does anyway, minus two dependencies this machine cannot
          # satisfy.
          #
          # Release deps for a Release build — Windows debug is excluded from
          # publishing precisely because no windows-debug dep bundles exist.
          $deps = Join-Path $env:GITHUB_WORKSPACE 'deps'
          & $env:PYEXE -m cvcpkg install-deps cvcpkg/recipes/libcvc `
            --prefix "$deps" --platform windows --arch x86_64 --config release --link shared
          if ($LASTEXITCODE -ne 0) { throw "cvcpkg install-deps failed ($LASTEXITCODE)" }
          "path=$deps" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Configure (CUDA / Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $depsPath = '${{ steps.libcvc-deps.outputs.path }}'
          if (-not $depsPath) {
            $depsPath = if ($env:LIBCVC_DEPS_PREFIX) { $env:LIBCVC_DEPS_PREFIX } else { 'D:\libcvc-deps' }
          }
          # CVC_ENABLE_CUDA=ON and the -T toolset are the ONLY deltas from the
          # CPU build job's Configure (Windows) step — keep the rest in sync.
          #
          # -T cuda=<path>: with a Visual Studio generator, CMake compiles .cu
          # through MSBuild, which needs CUDA's .props/.targets. Those normally
          # land in VS only if the CUDA installer found a full Visual Studio to
          # integrate with — it frequently does NOT with Build Tools-only boxes
          # like this one, and the failure is an opaque "No CUDA toolset found."
          # Pointing -T at the toolkit directory makes CMake read the
          # BuildCustomizations out of the toolkit itself, so the build does not
          # depend on whether that integration was ever copied into VS.
          # -G is pinned here where the CPU job leaves it implicit. The CPU job
          # can afford that because it pins `windows-2022` and so inherits
          # exactly one VS; a self-hosted box has whatever accumulates on it,
          # and the `build` matrix already documents that VS2026's v180 CL ICEs
          # on libcvc's C++20 TUs. Naming v143 keeps this job on the toolset the
          # rest of the Windows artifacts are built with, and guarantees a
          # generator that accepts -T at all.
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -T "cuda=$env:CUDA_PATH" `
            -DCMAKE_BUILD_TYPE="$env:CMAKE_CFG" `
            -DCMAKE_CONFIGURATION_TYPES="$env:CMAKE_CFG" `
            -DCMAKE_PREFIX_PATH="$depsPath" `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/stage" `
            -DCVC_BUILD_TESTS=OFF `
            -DCVC_ENABLE_CUDA=ON `
            -DDISABLE_CGAL=OFF `
            -DCVC_BUILD_VOLROVER3=OFF `
            -DCVC_ENABLE_MESHER=ON `
            -DCVC_ENABLE_SDF=ON

      - name: Assert CUDA is actually enabled
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # See the Linux twin of this step for the full rationale: libcvc's
          # CMakeLists silently downgrades CVC_ENABLE_CUDA to OFF when nvcc is
          # not found, without clearing the cache entry, so CMAKE_CUDA_COMPILER
          # is the only trustworthy signal that this is really a GPU build.
          $line = Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_CUDA_COMPILER:' |
                  Select-Object -First 1
          $cc = if ($line) { ($line.Line -split '=', 2)[1] } else { '' }
          if (-not $cc -or $cc -match 'NOTFOUND') {
            Write-Host "::error::CUDA did NOT enable (CMAKE_CUDA_COMPILER='$cc'). Refusing to pack a CPU-only bundle as libcvc-cuda."
            exit 1
          }
          Write-Host "CUDA compiler: $cc"

          # Multi-arch assertion — see the Linux twin for the full rationale:
          # a single-architecture fatbin cannot launch off that one GPU
          # generation, and the first dry run produced exactly that.
          $al = Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_CUDA_ARCHITECTURES:' |
                Select-Object -First 1
          $arches = if ($al) { ($al.Line -split '=', 2)[1] } else { '' }
          Write-Host "CUDA architectures: $arches"
          if ($arches -notmatch ';') {
            Write-Host "::error::CMAKE_CUDA_ARCHITECTURES='$arches' is a single architecture. Refusing to pack a libcvc-cuda that cannot launch off that exact GPU generation."
            exit 1
          }

      - name: Build & install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # $ErrorActionPreference does NOT apply to native commands on every
          # pwsh 7.x, and the Actions pwsh wrapper only propagates the LAST
          # exit code — so without these explicit checks a failed `cmake --build`
          # would be masked by whatever ran after it.
          cmake --build build --parallel --config $env:CMAKE_CFG
          if ($LASTEXITCODE -ne 0) { throw "cmake --build failed ($LASTEXITCODE)" }
          cmake --install build --config $env:CMAKE_CFG --component libcvc
          if ($LASTEXITCODE -ne 0) { throw "cmake --install failed ($LASTEXITCODE)" }

      - name: Pack archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $env:PYEXE -m cvcpkg pack cvcpkg/recipes/libcvc-cuda `
            --from-prefix stage `
            --platform windows `
            --config "${{ matrix.config }}" `
            --link shared `
            --local `
            --cvc-revision ${{ needs.compute-revisions.outputs.libcvc_cuda }} `
            --output-dir dist

      - name: Publish to cvcpkg.org
        if: github.event.inputs.dry_run == 'false'
        shell: pwsh
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CVCPKG_TOKEN) { throw 'CVCPKG_TOKEN secret is required to publish' }
          & $env:PYEXE -m cvcpkg publish libcvc-cuda `
            --server "$env:CVCPKG_SERVER" `
            --org "$env:CVCPKG_ORG" `
            --platform windows `
            --config "${{ matrix.config }}" `
            --link shared `
            --output-dir dist `
            --token "$env:CVCPKG_TOKEN"
