name: deploy pages

# Rebuild the cvcGL wasm demo gallery from libcvc master and deploy it to GitHub
# Pages (https://transfix.github.io/libcvc/) as a Pages artifact. Mirrors the
# pattern in cy-pca/cyberpcangel-cvcgl's nightly.yml — same self-hosted Linux
# runner (catx-03) that already holds the emsdk + wasm-mt deps prefix at
# /opt/cvc-wasm/, just a different deploy target: actions/deploy-pages instead of
# ssh to catx-00.tx.wtf.
#
# The gallery is NOT committed to a gh-pages branch: each build was ~500MB of
# wasm, and committing it on every master push bloated every clone to ~900MB.
# Requires Settings -> Pages -> Source = "GitHub Actions".
#
# Auto-triggers on push to master (so a merged PR lands on pages within minutes)
# plus workflow_dispatch for a manual re-run and a nightly safety-net cron.

on:
  push:
    branches: [master]
  schedule:
    - cron: '30 8 * * *' # 08:30 UTC ≈ 03:30 America/Chicago (after cyberpcangel nightly)
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write # deploy the Pages artifact
  id-token: write # OIDC token actions/deploy-pages verifies the deploy with

jobs:
  build-and-deploy:
    # cy-pca label so this lands on catx-03 (the ONLY runner with the emsdk
    # + wasm-deps prefix at /opt/cvc-wasm). Without the label it hits the
    # generic fleet where emsdk_env.sh is missing.
    runs-on: [self-hosted, Linux, X64, cy-pca]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CVC_EMSDK_DIR: /opt/cvc-wasm/emsdk
      CVC_WASM_DEPS: /opt/cvc-wasm/deps-wasm-mt
      # scene-austin-south-small + vehicle-humvee land here; the wasm build's
      # CMake --preload-file bakes this dir into nav_city_swarm.data.
      CVC_WASM_BUNDLE: /opt/cvc-wasm/deps-wasm-mt/share/cvc-scenes/austin_south
      # grl-snam-weights lands here; --preload-file bakes the trained CoefMLP into
      # nav_city_swarm.data so the browser swarm drives with the published policy.
      CVC_WASM_NAV_WEIGHTS: /opt/cvc-wasm/deps-wasm-mt/share/grl-snam-weights/coef_sdf.cvcnav
      DEMOS: 'terrain_lab lsystem_forest lsystem_forest_ari lsystem_coast volren_bunny volren_bunny_ari volslice_bunny volslice_bunny_ari nav_city_swarm nav_city_drive nav_fog_ghost'
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Use the cvcpkg CMake on this runner
        # System cmake is 3.22; libcvc's Boost 1.86 config lookup needs 3.24+
        # (see nav-swarm-cinematic/PR #225 and the sister workflow's rationale).
        run: echo "/opt/cvc-wasm/cmake-cvcpkg/bin" >> "$GITHUB_PATH"

      - name: Install fresh wasm dep closure + scene bundles
        run: |
          export PATH="/opt/cvc-wasm/cmake-cvcpkg/bin:$HOME/.local/bin:$PATH"
          command -v cvcpkg >/dev/null || { echo "cvcpkg not found; skipping"; exit 0; }
          for p in zlib bzip2 xz zstd libpng libjpeg-turbo tiff freetype libwebp libxml2 lerc assimp imagemagick; do
            echo "=== $p ==="
            cvcpkg install "$p" \
              --prefix "$CVC_WASM_DEPS" \
              --platform wasm --arch x86_64 --config release --link static \
              --no-fallback-to-source 2>&1 | tail -3 || echo "  (skipped: $p)"
          done
          cvcpkg install scene-austin-south-small vehicle-humvee grl-snam-weights \
            --prefix "$CVC_WASM_DEPS" \
            --platform any --config release --link shared \
            --no-fallback-to-source || echo "  (scene/weights bundles absent — wasm demo falls back to synthetic + default_biased)"

      - name: Build the non-pthread demos
        # Non-pthread: matches the single-threaded wasm dep bundles + does not
        # need SharedArrayBuffer / COOP/COEP on the deploy target.
        run: ./src/cvcGL/examples/wasm/build-wasm-demo.sh

      - name: Assemble the gallery
        id: assemble
        run: |
          set -euo pipefail
          bin=build-wasm/bin
          # Inside the workspace (not mktemp) so the next checkout's clean wipes
          # it instead of leaking ~500MB into the runner's /tmp every run.
          gallery="$GITHUB_WORKSPACE/_site"
          rm -rf "$gallery" && mkdir -p "$gallery"
          # Landing page + per-demo hosts (already generated next to the binaries
          # by examples/wasm/build-pages.py, invoked from build-wasm-demo.sh).
          if [ -d "build-wasm/gallery" ]; then
            cp -R build-wasm/gallery/. "$gallery/"
          else
            # Fallback: hand-assemble from the built binaries + wasm/index.html
            # template. build-pages.py is the source of truth; this is a safety net.
            touch "$gallery/.nojekyll"
            for d in $DEMOS; do
              mkdir -p "$gallery/$d"
              cp "$bin/$d.js" "$bin/$d.wasm" "$gallery/$d/"
              # emscripten --preload-file emits <demo>.data next to js/wasm
              [ -f "$bin/$d.data" ] && cp "$bin/$d.data" "$gallery/$d/"
              [ -f "$bin/$d/index.html" ] && cp "$bin/$d/index.html" "$gallery/$d/"
            done
            [ -f "$bin/index.html" ] && cp "$bin/index.html" "$gallery/"
          fi
          # Ensure Jekyll processing is disabled (._filenames + emscripten paths).
          touch "$gallery/.nojekyll"
          echo "gallery=$gallery" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.assemble.outputs.gallery }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live
        run: |
          # Curl on this runner has a libcurl symbol mismatch (same as sister
          # workflow); use python's urllib. A newly-added demo's path can take
          # a few minutes to build+propagate on the pages CDN, so poll each URL
          # with backoff rather than checking once — otherwise a fresh demo 404s
          # while the already-cached ones pass.
          python3 - <<'PY'
          import os, sys, time, urllib.request
          demos = os.environ["DEMOS"].split()
          deadline = time.monotonic() + 360  # up to 6 min for propagation
          pending = list(demos)
          sizes = {}
          while pending and time.monotonic() < deadline:
              still = []
              for d in pending:
                  url = f"https://transfix.github.io/libcvc/{d}/{d}.wasm"
                  try:
                      req = urllib.request.Request(
                          url, method="HEAD",
                          headers={"Accept-Encoding": "identity"})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          sizes[d] = int(r.headers.get("Content-Length", -1))
                  except Exception:
                      still.append(d)
              pending = still
              if pending:
                  time.sleep(20)
          for d in demos:
              if d in sizes:
                  print(f"  {d}: {sizes[d]} bytes live")
              else:
                  print(f"  {d}: FAIL (not live after propagation window)")
          sys.exit(0 if not pending else 1)
          PY
