name: CI (recipe-first)

# ─────────────────────────────────────────────────────────────────────────
# Recipe-first build path.
#
# Builds libcvc from its in-tree cvcpkg recipe (cvcpkg/recipes/libcvc/),
# which declares the full third-party closure — so what CI runs is exactly
# what a developer runs locally:
#
#     cvcpkg install-deps cvcpkg/recipes/libcvc --prefix ./deps
#     cvcpkg build libcvc --recipes-dir cvcpkg/recipes --no-deps --prefix ./deps
#
# No apt/brew library installs, and no Homebrew at all: cvcpkg is the sole
# source of third-party deps and of the build tools (cmake, ninja,
# pkg-config), which go first on PATH ahead of the runner image's. The
# dependency bundles come prebuilt from the cvcpkg.org catalog (the
# closure — libxml2, the ImageMagick delegates, the libtiff codecs,
# hdf5, boost, cgal/gmp/mpfr, … — is published for linux, macOS and
# Windows). Every lane is a merge blocker: master's branch protection has
# required every CI check since 2026-11-12, so a lane that is not green
# blocks the merge.
#
# Notes on current reality (2026-08-11):
#   * The old draft blocker is resolved: libcvc + its whole dep closure are
#     published to cvcpkg.org. Third-party deps address by bare name from
#     the public catalog; nothing here needs org-qualified (cvc/<name>)
#     addressing because libcvc itself is built from the LOCAL recipe, not
#     installed from the catalog.
#   * Deps are always installed with --config release: the catalog's debug
#     coverage is partial, and a Debug libcvc links the Release, ABI-stable
#     shared deps fine on Linux/macOS (same policy as publish-cvcpkg.yml's
#     fetch-cvcpkg step). Windows Debug is excluded outright — Debug
#     libcvc against Release MSVC deps is a CRT mismatch.
#   * The smoke-test binary needs the prefix's lib dir on the loader path:
#     ELF RUNPATH is not transitive, and `cvcpkg build` installs libcvc.so
#     without an $ORIGIN RPATH (the relocation pass runs at pack time, not
#     build time). LD_LIBRARY_PATH / DYLD_FALLBACK_LIBRARY_PATH / PATH below is
#     load-bearing, not belt-and-braces.
#   * This workflow does NOT yet retire the apt-based jobs in ci.yml; it
#     runs alongside them. Retiring them (and cvc-requirements.yaml) is the
#     follow-up once the macos/windows lanes here have a green track record.
# ─────────────────────────────────────────────────────────────────────────

on:
  pull_request:
  workflow_dispatch:
    inputs:
      fallback_to_source:
        description: "Build any unpublished deps from source (slow)"
        type: boolean
        default: false

concurrency:
  group: ci-recipe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-recipe:
    name: recipe / ${{ matrix.os }} / ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is the verified, REQUIRED lane (both configs). It runs on the glibc floor,
          # ubuntu-22.04 (glibc 2.35), where publish-cvcpkg.yml builds the libcvc recipe it checks;
          # ubuntu-latest drifts (it became 26.04 with gcc 15.2).
          - { os: ubuntu-22.04, build_type: Release }
          - { os: ubuntu-22.04, build_type: Debug }
          # macOS is a REQUIRED lane (both configs) since 2026-11-12. It was informative
          # (continue-on-error) until master's branch protection began requiring every CI check;
          # without continue-on-error a failure fails the lane outright.
          - { os: macos-latest, build_type: Release }
          - { os: macos-latest, build_type: Debug }
          # Windows is a REQUIRED lane. It was previously experimental on the
          # theory that the catalog closure was too new -- it is not: the
          # closure installs cleanly (37 components). The lane failed because
          # the recipes hand-rolled `-G Ninja` with no compiler pin, so CMake
          # took the first c++ on PATH (C:\mingw64\bin\c++.exe) and built
          # with MinGW gcc against MSVC-built dep bundles. The recipes now
          # dot-source _common/env-windows.ps1, which forces cl.exe.
          #
          # windows-2022 (VS2022 v143) pinned deliberately, matching
          # ci.yml:425 and publish-cvcpkg.yml: windows-latest now ships
          # VS2026 (v180), whose CL.exe ICEs (0xC0000005) on libcvc's C++20
          # state_exec/distributed-state TUs.
          - { os: windows-2022, build_type: Release }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The cvcpkg CLI itself: the released, packaged cvcpkg, installed the way a
      # developer installs it (cvcpkg.org's install.sh / install.ps1, see
      # cy-pca/cvcpkg docs/pypi-install.md), not a pip install of a git repo.
      # The installer takes the registry's cvcpkg package for this platform and
      # checks its sha256. Where the registry has no package at the pinned
      # version (macOS, whose newest registry package is 2.5.1), it falls back to
      # the checksum-verified standalone binary attached to the cvcpkg-v<version>
      # GitHub release. The pin keeps every lane on the same cvcpkg; bump it to
      # take a new release.
      #
      # Not transfix/libcvc-deps@master, which this lane used to pip install:
      # that copy stopped tracking upstream in September, and its builder still
      # exports DYLD_LIBRARY_PATH=<prefix>/lib around every build step. dyld
      # searches DYLD_LIBRARY_PATH by leaf name ahead of a library's install
      # path, so the runner's Homebrew cmake bound its libiconv.2.dylib to the
      # prefix's GNU libiconv (which exports _libiconv, not _iconv) and aborted
      # before configure. cvcpkg 2.5.1+ puts the prefix on
      # DYLD_FALLBACK_LIBRARY_PATH instead (cy-pca/cvcpkg#221), which only fills
      # in what a binary cannot find at its install path or rpaths: system tools
      # keep the system libraries and the ctest step still finds the prefix's
      # dylibs.
      - name: Install cvcpkg (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CVCPKG_VERSION: "2.5.13"
          CVCPKG_INSTALL_DIR: ${{ runner.temp }}/cvcpkg-bin
        run: |
          set -euo pipefail
          curl -fsSL https://cvcpkg.org/install.sh | sh
          echo "$CVCPKG_INSTALL_DIR" >> "$GITHUB_PATH"
          "$CVCPKG_INSTALL_DIR/cvcpkg" --version

      - name: Install cvcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CVCPKG_VERSION: "2.5.13"
          CVCPKG_INSTALL_DIR: ${{ runner.temp }}\cvcpkg-bin
        run: |
          $ErrorActionPreference = 'Stop'
          irm https://cvcpkg.org/install.ps1 | iex
          # install.ps1 adds the dir to the USER Path, which later steps do not
          # read; GITHUB_PATH does.
          Add-Content -Path $env:GITHUB_PATH -Value $env:CVCPKG_INSTALL_DIR
          & (Join-Path $env:CVCPKG_INSTALL_DIR 'cvcpkg.exe') --version

      # cmake, ninja and pkg-config from cvcpkg, first on PATH for every later
      # step, so the recipe's build script never runs the runner image's
      # (Homebrew's on macOS). The action checks each resolves to cvcpkg's.
      - name: Install build tools (cvcpkg)
        uses: ./.github/actions/cvcpkg-build-tools

      # Put cl.exe/link.exe on PATH before cvcpkg runs a recipe's build.ps1.
      # The recipes import vcvars themselves (_common/env-windows.ps1's
      # Import-CvcMsvcEnv), so this is belt-and-braces that also keeps this
      # runner identical to the libcvc-deps builder fleet.
      - name: Set up the MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Install the recipe-declared dependency closure, prebuilt from the
      # cvcpkg.org catalog, into a CMake-ready prefix. Always release deps
      # (see header). Host tools (cmake/ninja) come from cvcpkg (above).
      - name: Install dependency closure from the catalog
        shell: bash
        run: |
          set -euo pipefail
          # --fallback-to-source builds a dep the catalog lacks (an install
          # flag in cvcpkg 2.5; `cvcpkg build --no-deps` has no deps to build).
          extra=""
          if [ "${{ inputs.fallback_to_source || 'false' }}" = "true" ]; then
            extra="--fallback-to-source"
          fi
          cvcpkg install-deps cvcpkg/recipes/libcvc \
            --prefix "${{ runner.temp }}/libcvc-prefix" \
            --config release --link shared \
            $extra

      # Build libcvc itself from the in-tree recipe against that prefix.
      #
      # CVC_BUILD_TESTS=ON so the recipe builds AND ctest-runs the suite before
      # it installs (recipes/libcvc/build.sh). The gate has existed for a while
      # and nothing switched it on here, which left a blind spot: a test target
      # that does not compile, or is never registered with CTest, is invisible
      # to every recipe job. Both mistakes reached this branch and only the
      # package/* jobs caught them, one round apart.
      #
      # Tests are never installed -- no test target has an install() rule and
      # package.files selects only lib/ and include/ -- so the published bundle
      # is byte-identical to what this job produced before.
      #
      # The long-running suites (stress, convergence, benchmarks) are left out, as the package
      # jobs leave them out (ci.yml's STRESS_REGEX): the Jolt convergence experiments alone take
      # most of a Debug job's 90 minutes.
      #
      # A failing test runs up to 3 times, as in the package jobs (ci.yml's --repeat
      # until-pass:3). Without it, one timing miss on a loaded hosted runner failed the lane:
      # macOS's recipe lanes went red on AsyncCalls.AS1, TfOverlayTasks and AppTest
      # ThreadPool flakes that the package-macos jobs absorbed on retry.
      - name: Build libcvc from its recipe
        shell: bash
        env:
          CVC_BUILD_TESTS: "ON"
          CVC_CTEST_EXCLUDE: "(Stress|Convergence|Benchmark|Performance|BunnySDF_IsoRoundtrip|QualityImproveAllMethods|Integration)"
          CVC_CTEST_REPEAT: "until-pass:3"
        run: |
          set -euo pipefail
          config=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          cvcpkg build libcvc \
            --recipes-dir cvcpkg/recipes \
            --no-deps \
            --prefix "${{ runner.temp }}/libcvc-prefix" \
            --config "$config"

      # Prove the installed SDK is consumable: find_package(cvc CONFIG) must
      # resolve and a trivial program must link cvc::cvc and round-trip a
      # .rawiv (exercising the #111 write path end to end).
      - name: Smoke-test the installed SDK
        shell: bash
        run: |
          set -euo pipefail
          prefix="${{ runner.temp }}/libcvc-prefix"
          work="${{ runner.temp }}/consumer"
          mkdir -p "$work"
          cat > "$work/main.cpp" <<'CPP'
          #include <cvc/core/app.h>
          #include <cvc/volume/volume.h>
          #include <cvc/volume/volume_file_io.h>
          int main() {
            cvc::app app;                      // registers volume handlers
            cvc::dimension dim(4, 4, 4);
            cvc::bounding_box box(0, 0, 0, 1, 1, 1);
            std::vector<float> buf(4 * 4 * 4, 1.0f);
            cvc::volume v(app, reinterpret_cast<const unsigned char *>(buf.data()), dim,
                          cvc::Float, box);
            v.write("smoke.rawiv");            // exercises the write path (#111)
            cvc::volume r(app);
            r.read("smoke.rawiv");
            return (r.XDim() == 4) ? 0 : 1;
          }
          CPP
          cat > "$work/CMakeLists.txt" <<'CMK'
          cmake_minimum_required(VERSION 3.16)
          project(cvc_smoke LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          find_package(cvc CONFIG REQUIRED)
          add_executable(smoke main.cpp)
          target_link_libraries(smoke PRIVATE cvc::cvc)
          CMK
          cmake -S "$work" -B "$work/build" \
            -DCMAKE_PREFIX_PATH="$prefix" \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}"
          cmake --build "$work/build" --config "${{ matrix.build_type }}"
          # Locate the binary (single-config puts it in build/, VS multi-config
          # in build/<Config>/).
          smoke="$work/build/smoke"
          [ -x "$smoke" ] || smoke="$work/build/${{ matrix.build_type }}/smoke.exe"
          # Loader path is load-bearing — see header. All three variables so
          # this one step serves every OS.
          export LD_LIBRARY_PATH="$prefix/lib"
          # macOS: the fallback path, not DYLD_LIBRARY_PATH, which would let the prefix's libraries
          # (its GNU libiconv) shadow the system's by name (see cvcpkg/recipes/libcvc/build.sh).
          export DYLD_FALLBACK_LIBRARY_PATH="$prefix/lib:/usr/local/lib:/usr/lib"
          export PATH="$prefix/bin:$prefix/lib:$PATH"
          ( cd "$work/build" && "$smoke" )
          echo "smoke test passed"
