name: publish-pycvc-gl-wasm

# Build (+ optionally publish) pycvc-gl-cp312 for wasm: the CPython-wasm host that
# embeds pycvc + pycvc_gl (BRIDGE=ON) + vtk-python cvc.6, so "drop in Python code"
# gets live pycvc_gl scene bindings AND functional vtkmodules objects in the
# browser. Runner-agnostic (ubuntu-latest), self-provisioning emsdk + cmake/ninja
# from the cvcpkg catalog, mirroring publish-cvcgl-wasm.yml. The wasm deps are
# INSTALLED into the build prefix first (cvcpkg build reads them as CVC_DEPS_PREFIX;
# without them configure fails at find_package(Boost)). A v* tag push publishes, like
# publish-cvcpkg.yml; a manual dispatch publishes only with dry_run=false. It compiles
# cvc + cvcGL from source, so it does not wait on publish-cvcgl-wasm's bundles.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + verify only (no publish) when true'
        type: boolean
        default: true

concurrency:
  group: publish-pycvc-gl-wasm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EMSDK_DIR: ${{ github.workspace }}/emsdk
      WASM_DEPS: ${{ github.workspace }}/wasm-deps
    steps:
      - uses: actions/checkout@v4

      - name: Install cvcpkg + cmake/ninja from the catalog
        run: |
          curl -fsSL https://cvcpkg.org/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cvcpkg install cmake ninja --prefix "${{ github.workspace }}/tools" \
            --config release --link shared
          echo "${{ github.workspace }}/tools/bin" >> "$GITHUB_PATH"

      - name: Provision the Emscripten SDK from the catalog
        run: |
          cvcpkg install emsdk --platform linux --prefix "$EMSDK_DIR" \
            --config release --link shared --no-fallback-to-source
          test -f "$EMSDK_DIR/emsdk_env.sh" \
            || { echo "::error::emsdk bundle missing emsdk_env.sh"; exit 1; }
          echo "CVC_EMSDK_DIR=$EMSDK_DIR" >> "$GITHUB_ENV"

      - name: Install the pycvc-gl wasm dep closure into the build prefix
        # cvc + cvcGL compile from source here, so their wasm build deps must be
        # present, PLUS pycvc-gl's own (python312 / numpy / vtk / vtk-python cvc.6).
        # cvcpkg build uses this prefix as CVC_DEPS_PREFIX (the hardened flow —
        # find_package(Boost) needs boost + its cmake config present).
        #
        # The deps the recipe declares for wasm are read from the recipe itself
        # (`cvcpkg install-deps`), so this step cannot drift from it again. They used to
        # be typed out here: #801 made imagemagick a wasm build dep and build-wasm.sh
        # fail without it, the list never gained it, and the v3.7.1 and v3.7.2 tag runs
        # died at configure ("found no ImageMagick in .../wasm-deps"). freetype, assimp
        # and imgui are linked by the closure but not declared, so they stay named here.
        #
        # pipefail: the default shell is `bash -e`, so `cvcpkg install ... | tail -3`
        # took its status from tail and a failed install passed.
        run: |
          set -o pipefail
          mkdir -p "$WASM_DEPS"
          echo "=== install-deps pycvc-gl-cp312 ==="
          cvcpkg install-deps cvcpkg/recipes/pycvc-gl-cp312 --prefix "$WASM_DEPS" \
            --platform wasm --arch wasm32 --config release --link static \
            --no-fallback-to-source \
            || { echo "::error::failed to install pycvc-gl-cp312's wasm deps"; exit 1; }
          for p in freetype assimp imgui; do
            echo "=== install $p ==="
            cvcpkg install "$p" --prefix "$WASM_DEPS" \
              --platform wasm --arch wasm32 --config release --link static \
              --no-fallback-to-source 2>&1 | tail -3 \
              || { echo "::error::failed to install wasm dep $p"; exit 1; }
          done

      - name: Build + pack pycvc-gl-cp312 (wasm) — compiles the closure + links the host
        # Drives the recipe's build-wasm.sh against the pre-installed deps. It
        # compiles cvc+cvcGL+pycvc+pycvc_gl, then link-host.sh embeds vtk-python
        # cvc.6 and runs the node smoke (prints PYCVC_VTK_BRIDGE_OK / PYCVC_WASM_OK).
        #
        # Pack ONLY what this build installed. $WASM_DEPS holds the whole dep closure, so
        # `pack --from-prefix "$WASM_DEPS"` shipped every dep with its manifest, and
        # `cvcpkg publish` -- which reads the first manifest.yaml in the archive -- took the
        # bundle for cvc/assimp==6.0.5+cvc.6. `cvcpkg build` installs into an isolated
        # $TMPDIR/cvcpkg-pycvc-gl-cp312-*/install, merges that into $WASM_DEPS and keeps it;
        # a dedicated TMPDIR makes it findable, and it is what gets packed. (Plain
        # `cvcpkg pack` would isolate too, but cvcpkg 2.4.0 tags its wasm bundle with the
        # HOST arch, x86_64; --from-prefix derives wasm32 from the platform.)
        run: |
          export TMPDIR="$RUNNER_TEMP/pycvc-gl-work"
          mkdir -p "$TMPDIR"
          cvcpkg build pycvc-gl-cp312 --platform wasm --host-platform linux \
            --recipes-dir cvcpkg/recipes --prefix "$WASM_DEPS"
          shopt -s nullglob
          inst=("$TMPDIR"/cvcpkg-pycvc-gl-cp312-*/install)
          [ ${#inst[@]} -eq 1 ] \
            || { echo "::error::expected one isolated pycvc-gl install dir, found ${#inst[@]}"; ls -la "$TMPDIR"; exit 1; }
          cvcpkg pack cvcpkg/recipes/pycvc-gl-cp312 --local --from-prefix "${inst[0]}" \
            --platform wasm --config release --link static --output-dir dist

      - name: Verify the bridge host + archives
        run: |
          echo "=== built artifacts ==="
          find "$WASM_DEPS" \( -name 'pycvc_host.wasm' -o -name '_pycvc.a' \
            -o -name '_pycvc_gl.a' \) -print | sed "s|$WASM_DEPS/||"
          find "$WASM_DEPS" -name '_pycvc_gl.a' | grep -q . \
            || { echo "::error::_pycvc_gl.a not produced"; exit 1; }
          echo "=== bundle ==="
          shopt -s nullglob
          archives=(dist/pycvc-gl-cp312-*.tar.gz)
          [ ${#archives[@]} -eq 1 ] \
            || { echo "::error::expected one pycvc-gl-cp312 archive, found ${#archives[@]}"; exit 1; }
          ls -la "${archives[0]}"
          case "${archives[0]}" in
            *-wasm-wasm32-release-static.tar.gz) ;;
            *) echo "::error::bundle is not tagged wasm/wasm32/release/static"; exit 1 ;;
          esac
          tar -tzf "${archives[0]}" | sed 's|^\./||' > "$RUNNER_TEMP/members.txt"
          # Exactly one cvcpkg manifest, and it is this bundle's: `cvcpkg publish` names an
          # archive after the first manifest.yaml in it, so a dep's would mislabel the bundle.
          mans=$(grep -E '^share/libcvc-deps/[^/]+/manifest\.yaml$' "$RUNNER_TEMP/members.txt" || true)
          echo "manifests: ${mans:-<none>}"
          [ "$mans" = "share/libcvc-deps/pycvc-gl-cp312/manifest.yaml" ] \
            || { echo "::error::bundle must carry only pycvc-gl-cp312's manifest"; exit 1; }
          grep -q '/_pycvc_gl\.a$' "$RUNNER_TEMP/members.txt" \
            || { echo "::error::bundle has no _pycvc_gl.a"; exit 1; }
          grep -q '^share/pycvc-gl-wasm/pycvc_host\.wasm$' "$RUNNER_TEMP/members.txt" \
            || echo "::warning::bundle has no pycvc_host.wasm (host link is non-fatal in build-wasm.sh)"

      - name: Upload pycvc_host.wasm
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pycvc-host-wasm
          path: |
            ${{ env.WASM_DEPS }}/share/pycvc-gl-wasm/pycvc_host.js
            ${{ env.WASM_DEPS }}/share/pycvc-gl-wasm/pycvc_host.wasm
          if-no-files-found: warn

      - name: Publish pycvc-gl-cp312 wasm
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        # Mirrors publish-cvcgl-wasm.yml. This step used to run a bare `cvcpkg publish "$a"`
        # with no server, org or token and swallow the failure with `|| echo ::warning`, so
        # it never published anything -- the catalog has no pycvc-gl-cp312 wasm build at
        # all; cvcpkg 2.4.0 even says why ("provide --server ... or --dest"). Now it fails
        # loudly, and skips only an exact name+version already on the catalog. The bundle
        # was packed (and its manifest checked) by the build + verify steps above.
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${CVCPKG_TOKEN:-}" ] || { echo "::error::CVCPKG_TOKEN required to publish"; exit 1; }
          for a in dist/pycvc-gl-cp312-*-wasm-*.tar.gz; do
            base=$(basename "$a" .tar.gz)
            name=$(echo "$base" | sed -E 's/-[0-9].*$//')
            ver=$(echo "$base" | sed -E "s/^${name}-//; s/-wasm-.*$//")
            if cvcpkg search "$name" --platform wasm 2>/dev/null \
                 | awk -v n="$name" -v v="$ver" '$1==n && $2==v{f=1} END{exit !f}'; then
              echo "=== skip $name $ver (already on catalog) ==="; continue
            fi
            echo "=== publish $a ==="
            cvcpkg publish "$a" --server https://cvcpkg.org --org cvc --token "$CVCPKG_TOKEN"
          done
